name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Pint, Larastan, Pest)
    runs-on: ubuntu-latest

    # Targets the production spec (PHP 8.4, MySQL 8 — AGENTS.md Technology
    # Stack) even though local dev currently runs PHP 8.3 / MariaDB via
    # XAMPP. CI is where that gap gets caught before it matters.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kangaruride_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: kangaruride_ci
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, ctype, json, tokenizer, xml
          coverage: pcov
          # Without this, pcov auto-detects its instrumentation scope by
          # looking for a conventional src/lib/app folder, finds `app`,
          # and silently never instruments `Modules` at all — every
          # Modules/* file then reports a false 0.0%, not "untested" but
          # "never measured". `.` covers the whole working-directory tree.
          ini-values: pcov.directory=.
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint — zero tolerance)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan level 8)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Migrate
        run: php artisan migrate --force

      - name: Migration reversibility
        run: |
          php artisan migrate:rollback --force
          php artisan migrate --force

      # AGENTS.md's coverage gate is 90% on Modules/Billing and
      # Modules/Dispatch specifically, 70% overall. Modules/Billing is still
      # empty scaffolding, so its gate lands with the module. Dispatch now
      # has real code and carries its 90% gate below.
      - name: Tests (Pest, 70% overall coverage floor)
        run: vendor/bin/pest --coverage --min=70

      - name: Coverage gate — Modules/Dispatch (90%)
        run: vendor/bin/pest --coverage --min=90 --path=Modules/Dispatch --testsuite=Feature,Concurrency

  frontend:
    name: Frontend (ESLint, tsc, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
