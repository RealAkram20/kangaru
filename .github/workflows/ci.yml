name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # AGENTS.md Process: "Conventional Commits enforced by commitlint".
  # Only meaningful on a pull request, where there is a base to diff
  # against; history before this gate landed is not retro-validated.
  commits:
    name: Commit messages (commitlint)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint needs the full range between base and head, which a
          # shallow clone does not contain.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installed into the repo root rather than run via `npx -p`: commitlint
      # resolves `extends` relative to the config file, so the shared config
      # has to be reachable from here, which `npx -p` does not arrange.
      # --no-save keeps it out of any manifest; there is no root package.json
      # and this gate does not warrant introducing one.
      - name: Install commitlint
        run: npm install --no-save --no-package-lock @commitlint/cli@19 @commitlint/config-conventional@19

      - name: Validate commit messages
        run: npx commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose

  backend:
    name: Backend (Pint, Larastan, Pest)
    runs-on: ubuntu-latest

    # Targets the production spec (PHP 8.4, MySQL 8 — AGENTS.md Technology
    # Stack) even though local dev currently runs PHP 8.3 / MariaDB via
    # XAMPP. CI is where that gap gets caught before it matters.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kangaruride_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: kangaruride_ci
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, ctype, json, tokenizer, xml
          coverage: pcov
          # Without this, pcov auto-detects its instrumentation scope by
          # looking for a conventional src/lib/app folder, finds `app`,
          # and silently never instruments `Modules` at all — every
          # Modules/* file then reports a false 0.0%, not "untested" but
          # "never measured". `.` covers the whole working-directory tree.
          ini-values: pcov.directory=.
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint — zero tolerance)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan level 8)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Migrate
        run: php artisan migrate --force

      - name: Migration reversibility
        run: |
          php artisan migrate:rollback --force
          php artisan migrate --force

      # AGENTS.md's coverage gate is 90% on Modules/Billing and
      # Modules/Dispatch specifically, 70% overall.
      - name: Tests (Pest, 70% overall coverage floor)
        run: vendor/bin/pest --coverage --min=70

      - name: Coverage gate — Modules/Dispatch (90%)
        run: vendor/bin/pest --coverage --min=90 --path=Modules/Dispatch --testsuite=Feature,Concurrency

      # Billing's gate runs over both suites for the same reason Dispatch's
      # does: its concurrency test (InvoiceNumberRaceTest) exercises the
      # document number counter, and measuring Feature alone would report
      # that path as uncovered.
      - name: Coverage gate — Modules/Billing (90%)
        run: vendor/bin/pest --coverage --min=90 --path=Modules/Billing --testsuite=Feature,Concurrency

  frontend:
    name: Frontend (ESLint, tsc, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
