name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the suite be run against any ref on demand, from the Actions tab
  # or `gh workflow run`. Without it CI only ever fires on `main` and on
  # pull requests into it, so a long-lived branch can accumulate work that
  # has never met MySQL 8, PHP 8.4 or the coverage gates — which is exactly
  # how the `--path` coverage bug noted below survived: the branch that
  # introduced it could not run the job it broke.
  workflow_dispatch:

jobs:
  # AGENTS.md Process: "Conventional Commits enforced by commitlint".
  # Only meaningful on a pull request, where there is a base to diff
  # against; history before this gate landed is not retro-validated.
  commits:
    name: Commit messages (commitlint)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint needs the full range between base and head, which a
          # shallow clone does not contain.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installed into the repo root rather than run via `npx -p`: commitlint
      # resolves `extends` relative to the config file, so the shared config
      # has to be reachable from here, which `npx -p` does not arrange.
      # --no-save keeps it out of any manifest; there is no root package.json
      # and this gate does not warrant introducing one.
      - name: Install commitlint
        run: npm install --no-save --no-package-lock @commitlint/cli@19 @commitlint/config-conventional@19

      - name: Validate commit messages
        run: npx commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose

  # AGENTS.md Security: "Secrets scanning (gitleaks) on every push. A
  # committed secret is rotated the same day."
  #
  # Runs the release binary rather than the marketplace action: the action
  # requires a paid licence key once a repository belongs to an organisation,
  # which would turn this gate off exactly when the project grows into
  # needing it most. Pinned, so a new gitleaks release cannot change what
  # passes without a commit here.
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest

    env:
      GITLEAKS_VERSION: 8.30.1

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the working tree — a secret
          # that was committed and later removed is still a leaked secret.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository history
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --exit-code 1

  backend:
    name: Backend (Pint, Larastan, Pest)
    runs-on: ubuntu-latest

    # Targets the production spec (PHP 8.4, MySQL 8.4 LTS — AGENTS.md
    # Technology Stack; the same image the deploy-stack job runs) even though
    # local dev currently runs PHP 8.3 / MariaDB via XAMPP. CI is where that
    # gap gets caught before it matters. 8.0 left support in April 2026; the
    # bump means every isolation test in the suite runs against the engine
    # production actually uses (W1-c).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kangaruride_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: kangaruride_ci
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, ctype, json, tokenizer, xml
          coverage: pcov
          # Without this, pcov auto-detects its instrumentation scope by
          # looking for a conventional src/lib/app folder, finds `app`,
          # and silently never instruments `Modules` at all — every
          # Modules/* file then reports a false 0.0%, not "untested" but
          # "never measured". `.` covers the whole working-directory tree.
          ini-values: pcov.directory=.
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint — zero tolerance)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan level 8)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Migrate
        run: php artisan migrate --force

      - name: Migration reversibility
        run: |
          php artisan migrate:rollback --force
          php artisan migrate --force

      # One run over every suite, writing a Clover report. Both suites
      # matter: the concurrency tests exercise the dispatch lock and the
      # document number counter, and measuring Feature alone would report
      # those paths as uncovered.
      - name: Tests (Pest, with coverage)
        run: vendor/bin/pest --coverage --coverage-clover=storage/coverage.xml

      # AGENTS.md's gates are 90% on Modules/Billing and Modules/Dispatch
      # specifically, 70% overall — asserted from the report above rather
      # than by re-running the suite once per threshold.
      #
      # This replaces three `pest --coverage --min=N --path=...` steps.
      # `--path` is not a coverage-scoping option: Pest rejects it with
      # "Option --path does not allow an argument" and exits non-zero, so
      # those gates failed regardless of the real coverage. Nobody noticed
      # because CI only runs on `main` and the branch that added them had
      # not been merged.
      - name: Coverage gates (70% overall, 90% on Billing and Dispatch)
        run: php bin/coverage-gate.php storage/coverage.xml

  frontend:
    name: Frontend (ESLint, tsc, Vitest, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tsc -b`, not `tsc --noEmit`. frontend/tsconfig.json is a solution
      # file — `"files": []` plus references to tsconfig.app/node — so
      # `--noEmit` type-checks the empty root project, exits 0, and reports
      # nothing however broken the code is. This step passed unconditionally
      # until it was changed; only the `npm run build` step below (which
      # already runs `tsc -b`) was catching type errors at all.
      - name: Type check
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      # AGENTS.md, Enforcement & Tooling: "Component tests (Vitest +
      # Testing Library) for shared components and critical flows (booking
      # form, dispatch board)." Until this step existed that line was a
      # suggestion — by the document's own definition, "a standard that is
      # not enforced by tooling".
      #
      # Deliberately before the build: a failing test should stop the job
      # at the cheapest point, and a green build over broken behaviour
      # tells nobody anything.
      #
      # No coverage gate. The backend has one because its gates were
      # written against a suite that already covered those modules; three
      # test files do not yet justify a number, and a threshold set to
      # whatever today happens to measure is a threshold that ratchets on
      # noise. Revisit once the shared components are covered.
      - name: Component tests (Vitest + Testing Library)
        run: npm run test

      - name: Build
        run: npm run build

  # W1-a — the production stack, stood up on the runner from the same
  # docker-compose.yml Coolify deploys, and proved rather than assumed:
  # both images build; all seven containers come up healthy with limits;
  # `schedule:list` shows the six commands; a queued job is completed by the
  # queue container through the dedicated Redis; a backup is taken and a
  # RESTORE IS PERFORMED and timed (master-plan.md §3: "an untested backup
  # is not a backup"). deploy/smoke.sh holds the assertions.
  #
  # This is not the Coolify server. It is the closest thing CI can be to it:
  # a Docker host running the identical file with placeholder secrets.
  deploy-stack:
    name: Deploy stack (compose up, smoke, backup + restore)
    runs-on: ubuntu-latest

    env:
      COMPOSE_FILE: docker-compose.yml:deploy/docker-compose.ci.yml

    steps:
      - uses: actions/checkout@v4

      # deploy/ci.env holds placeholders only; APP_KEY is minted here so no
      # key of any kind, even a throwaway, lives in the repository.
      - name: Prepare environment
        run: |
          cp deploy/ci.env .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env
          echo "SOURCE_COMMIT=${GITHUB_SHA::12}" >> .env
          docker compose config --quiet

      - name: Build images
        run: docker compose build --pull

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Smoke test
        run: bash deploy/smoke.sh

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=150

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # W1-d — the rollback, rehearsed. AGENTS.md Delivery requires the procedure
  # "written down and rehearsed before first client onboarding", and an
  # unrehearsed rollback is a wish. This performs one end to end on a Docker
  # host and times it:
  #
  #   1. build v1, bring the stack up, migrate
  #   2. add a migration and build v2 — a deploy that carries a schema change
  #   3. roll the schema back WHILE v2 IS STILL RUNNING, then put v1 back
  #   4. assert the table is gone, APP_BUILD is v1 again, and /up answers
  #
  # Step 3's order is the whole lesson and the reason this job exists: the
  # `down()` method lives in the NEW image. Swap the image back first and the
  # migration class is no longer there to roll back — you are left with a new
  # schema, old code, and no way down that does not involve hand-written SQL.
  #
  # This proves the PROCEDURE, on the same compose file. It proves nothing
  # about the owner's Coolify server; docs/runbook.md §1 says so plainly.
  rollback-rehearsal:
    name: Rollback rehearsal (schema down, image back, timed)
    runs-on: ubuntu-latest

    env:
      COMPOSE_FILE: docker-compose.yml:deploy/docker-compose.ci.yml
      APP_URL: http://localhost:18080

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp deploy/ci.env .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env
          echo "SOURCE_COMMIT=v1" >> .env

      - name: Deploy v1
        run: |
          docker compose build --pull
          docker compose up -d --wait --wait-timeout 300
          docker compose exec -T app printenv APP_BUILD

      - name: Write the migration that v2 carries
        run: |
          cat > backend/database/migrations/2099_01_01_000000_rehearsal_widgets.php <<'PHP'
          <?php

          use Illuminate\Database\Migrations\Migration;
          use Illuminate\Database\Schema\Blueprint;
          use Illuminate\Support\Facades\Schema;

          // Exists only inside the rollback rehearsal (CI). It stands in for a
          // real deploy's schema change: reversible, as AGENTS.md requires of
          // every migration, so the rehearsal exercises a genuine down().
          return new class extends Migration
          {
              public function up(): void
              {
                  Schema::create('rehearsal_widgets', function (Blueprint $table) {
                      $table->id();
                      $table->string('label');
                      $table->timestamps();
                  });
              }

              public function down(): void
              {
                  Schema::dropIfExists('rehearsal_widgets');
              }
          };
          PHP

      - name: Deploy v2 (carries the migration)
        run: |
          sed -i 's/^SOURCE_COMMIT=v1$/SOURCE_COMMIT=v2/' .env
          docker compose build app
          docker compose up -d --wait --wait-timeout 300 app queue scheduler
          test "$(docker compose exec -T app printenv APP_BUILD | tr -d '\r')" = v2
          docker compose exec -T app php artisan tinker --execute='echo Schema::hasTable("rehearsal_widgets") ? "present" : "absent";' | grep -q present

      - name: Status before rolling back
        run: bash deploy/rollback.sh --status

      - name: Roll back — schema down while v2 still runs, then v1 back
        run: |
          # Without pipefail a failing rollback.sh is swallowed by `| tee` and
          # the step passes — proved in run 32127105596, where the script
          # printed FAILED and CI carried on to fail two steps later on a
          # different assertion. The guard is only load-bearing if the step
          # it runs in actually fails.
          set -eo pipefail
          start=$(date +%s)

          # Schema first, and only because the down() lives in v2's image.
          # Reversing these two blocks is the mistake docs/runbook.md §5.3
          # warns about; it was rehearsed deliberately in runs 32126492421
          # and 32127105596, and this job caught it both times.
          bash deploy/rollback.sh --schema 1 --yes | tee /tmp/rollback.txt

          # Then the code. On Coolify this is "redeploy the previous commit";
          # on a plain Docker host it is the image tag going back.
          sed -i 's/^SOURCE_COMMIT=v2$/SOURCE_COMMIT=v1/' .env
          docker compose up -d --wait --wait-timeout 300 app queue scheduler

          end=$(date +%s)
          echo "TOTAL_ROLLBACK_SECONDS=$((end - start))" | tee -a /tmp/rollback.txt

      - name: Verify the rollback actually landed
        run: |
          bash deploy/rollback.sh --verify v1
          gone=$(docker compose exec -T app php artisan tinker --execute='echo Schema::hasTable("rehearsal_widgets") ? "present" : "absent";' | tr -d '\r')
          test "$gone" = absent || { echo "the table survived the rollback — that is not a rollback"; exit 1; }

          # The workers must be back, or the rollback traded an outage for a
          # silent one: dispatch stalls with nothing in the logs.
          test "$(docker compose exec -T scheduler sh -c "pgrep -f '[a]rtisan schedule:work' | wc -l" | tr -d '\r ')" = 1
          test "$(docker compose exec -T queue sh -c "pgrep -f '[a]rtisan queue:work' | wc -l" | tr -d '\r ')" = 1

          # And the pre-rollback backup exists, because the script takes one
          # before it touches the schema.
          test "$(docker compose exec -T backup sh -c 'ls -1 /backups/kangaruride-*.sql.gz | wc -l' | tr -d '\r ')" -ge 1

          echo "ROLLBACK REHEARSED —$(grep -o 'TOTAL_ROLLBACK_SECONDS=[0-9]*' /tmp/rollback.txt)"

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=150

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
