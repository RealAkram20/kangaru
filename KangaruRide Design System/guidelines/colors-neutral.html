<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font:var(--type-body-dense)}.g{display:flex;gap:8px}.sw{flex:1;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:88px;border:1px solid rgba(0,16,40,.06)}.sw b{font:var(--type-label);font-weight:600;display:block}.sw code{font-family:var(--font-mono);font-size:11px;opacity:.85;display:block;margin-top:2px}.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}</style>
</head><body><div class="g"><div class="sw" style="background:#FBFBFB;color:#1A2233"><b>White</b><code>#FBFBFB</code><code style="opacity:.6">--kr-white</code></div><div class="sw" style="background:#F2F4F7;color:#1A2233"><b>Gray 100</b><code>#F2F4F7</code><code style="opacity:.6">--kr-gray-100</code></div><div class="sw" style="background:#D6DAE1;color:#1A2233"><b>Border</b><code>#D6DAE1</code><code style="opacity:.6">--kr-gray-border</code></div><div class="sw" style="background:#979DA9;color:#001028"><b>Muted</b><code>#979DA9</code><code style="opacity:.6">--kr-gray-muted</code></div><div class="sw" style="background:#5B6472;color:#FBFBFB"><b>Gray text</b><code>#5B6472</code><code style="opacity:.6">--kr-gray-text</code></div></div></body></html>
