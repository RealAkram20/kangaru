<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font:var(--type-body-dense)}.g{display:flex;gap:8px}.sw{flex:1;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:88px;border:1px solid rgba(0,16,40,.06)}.sw b{font:var(--type-label);font-weight:600;display:block}.sw code{font-family:var(--font-mono);font-size:11px;opacity:.85;display:block;margin-top:2px}.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}</style>
</head><body><div class="g"><div class="sw" style="background:#015E35;color:#FBFBFB"><b>Success</b><code>#015E35</code><code style="opacity:.6">--kr-success</code></div><div class="sw" style="background:#B54708;color:#FBFBFB"><b>Warning</b><code>#B54708</code><code style="opacity:.6">--kr-warning</code></div><div class="sw" style="background:#B42318;color:#FBFBFB"><b>Error</b><code>#B42318</code><code style="opacity:.6">--kr-error</code></div><div class="sw" style="background:#175CD3;color:#FBFBFB"><b>Info</b><code>#175CD3</code><code style="opacity:.6">--kr-info</code></div><div class="sw" style="background:#5B6472;color:#FBFBFB"><b>Neutral</b><code>#5B6472</code><code style="opacity:.6">--kr-neutral</code></div></div>
<div class="g" style="margin-top:8px"><div class="sw" style="background:#E6F4EC;color:#015E35"><b>Success tint</b><code>#E6F4EC</code><code style="opacity:.6">--kr-success-tint</code></div><div class="sw" style="background:#FEF0C7;color:#B54708"><b>Warning tint</b><code>#FEF0C7</code><code style="opacity:.6">--kr-warning-tint</code></div><div class="sw" style="background:#FEE4E2;color:#B42318"><b>Error tint</b><code>#FEE4E2</code><code style="opacity:.6">--kr-error-tint</code></div><div class="sw" style="background:#EFF4FF;color:#175CD3"><b>Info tint</b><code>#EFF4FF</code><code style="opacity:.6">--kr-info-tint</code></div><div class="sw" style="background:#F2F4F7;color:#5B6472"><b>Neutral tint</b><code>#F2F4F7</code><code style="opacity:.6">--kr-neutral-tint</code></div></div></body></html>
