<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Borders carry structure; shadow only marks what floats" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font:var(--type-body-dense)}.g{display:flex;gap:8px}.sw{flex:1;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:88px;border:1px solid rgba(0,16,40,.06)}.sw b{font:var(--type-label);font-weight:600;display:block}.sw code{font-family:var(--font-mono);font-size:11px;opacity:.85;display:block;margin-top:2px}.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}</style>
</head><body><div style="display:flex;gap:14px">
<div style="text-align:center;flex:1"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-xs)"></div><div class="tok" style="margin-top:8px">xs — cards, KPI tiles</div></div><div style="text-align:center;flex:1"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)"></div><div class="tok" style="margin-top:8px">sm — hover</div></div><div style="text-align:center;flex:1"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-md)"></div><div class="tok" style="margin-top:8px">md — popovers, tooltips</div></div><div style="text-align:center;flex:1"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-lg)"></div><div class="tok" style="margin-top:8px">lg — drawers</div></div><div style="text-align:center;flex:1"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-modal)"></div><div class="tok" style="margin-top:8px">modal</div></div></div>
<p class="tok" style="margin-top:10px">All shadows are navy-tinted rgba(0,16,40,…) — never neutral black.</p></body></html>
