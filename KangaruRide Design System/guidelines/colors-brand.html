<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font:var(--type-body-dense)}.g{display:flex;gap:8px}.sw{flex:1;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:88px;border:1px solid rgba(0,16,40,.06)}.sw b{font:var(--type-label);font-weight:600;display:block}.sw code{font-family:var(--font-mono);font-size:11px;opacity:.85;display:block;margin-top:2px}.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}</style>
</head><body><div class="g"><div class="sw" style="background:#01903D;color:#FBFBFB"><b>Green</b><code>#01903D</code><code style="opacity:.6">--kr-green</code></div><div class="sw" style="background:#016B2E;color:#FBFBFB"><b>Green hover</b><code>#016B2E</code><code style="opacity:.6">--kr-green-hover</code></div><div class="sw" style="background:#015E35;color:#FBFBFB"><b>Green dark</b><code>#015E35</code><code style="opacity:.6">--kr-green-dark</code></div><div class="sw" style="background:#E6F4EC;color:#015E35"><b>Green tint</b><code>#E6F4EC</code><code style="opacity:.6">--kr-green-tint</code></div></div></body></html>
