<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font:var(--type-body-dense)}.g{display:flex;gap:8px}.sw{flex:1;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:88px;border:1px solid rgba(0,16,40,.06)}.sw b{font:var(--type-label);font-weight:600;display:block}.sw code{font-family:var(--font-mono);font-size:11px;opacity:.85;display:block;margin-top:2px}.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}</style>
</head><body><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
<div style="background:#fff;border:1px solid var(--border-default);border-radius:var(--radius-card);padding:14px"><img src="../assets/logo-horizontal.png" style="height:34px;display:block"></div>
<div style="background:#001028;border-radius:var(--radius-card);padding:14px"><img src="../assets/logo-horizontal-navy.png" style="height:34px;display:block"></div>

</div>
<p class="tok" style="margin-top:12px">Minimum 24px tall for lockups, 20px for the mark. Clear space equals the mark's height ÷ 4 on all sides. Never recolour, outline, rotate, or re-typeset the tagline. On photography, place the lockup on a solid navy or white plate — never directly on the image.</p></body></html>
