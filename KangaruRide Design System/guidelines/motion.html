<!-- @dsCard group="Brand" viewport="700x160" name="Motion" subtitle="Short, linear-feeling, no bounce or scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font:var(--type-body-dense)}.g{display:flex;gap:8px}.sw{flex:1;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:88px;border:1px solid rgba(0,16,40,.06)}.sw b{font:var(--type-label);font-weight:600;display:block}.sw code{font-family:var(--font-mono);font-size:11px;opacity:.85;display:block;margin-top:2px}.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}</style>
</head><body><style>@keyframes slide{0%,45%{transform:translateX(0)}55%,100%{transform:translateX(120px)}}</style>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="height:24px"><div style="width:24px;height:24px;border-radius:4px;background:var(--kr-green);animation:slide 2.4s var(--ease-standard) infinite alternate"></div></div>
<table class="tok" style="border-collapse:collapse"><tbody>
<tr><td style="padding:2px 12px 2px 0">--dur-fast 120ms</td><td>hover, focus, checkbox</td></tr>
<tr><td style="padding:2px 12px 2px 0">--dur-base 180ms</td><td>switches, tabs, drawer, dialog</td></tr>
<tr><td style="padding:2px 12px 2px 0">--dur-slow 260ms</td><td>sidebar collapse, panel expand</td></tr>
<tr><td style="padding:2px 12px 2px 0">--dur-map 600ms</td><td>map pan / fit-to-route</td></tr>
<tr><td style="padding:2px 12px 2px 0">--ease-standard</td><td>cubic-bezier(.2,0,.38,1) — the default for everything</td></tr>
</tbody></table></div></body></html>
