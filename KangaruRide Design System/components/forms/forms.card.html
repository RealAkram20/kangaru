<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.475.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--surface-page)}.row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}.lbl{font:var(--type-overline);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-secondary);width:100%;margin-bottom:2px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.KangaruRideDesignSystem_69b541;
const { FormField, Input, Select, Checkbox, RadioGroup, Switch, Button } = NS;
function Demo(){return (<div>
<div className="row"><span className="lbl">Text fields</span>
<FormField label="Pickup location" required hint="Search or drop a pin" style={{flex:"1 1 240px"}}><Input iconLeft="map-pin" placeholder="e.g. Mapeera House, Kampala" /></FormField>
<FormField label="Opening odometer" required style={{flex:"1 1 180px"}}><Input mono suffix="km" defaultValue="128940" /></FormField>
<FormField label="Cost centre" error="Required for corporate bookings" style={{flex:"1 1 180px"}}><Input invalid placeholder="CC-0000" /></FormField></div>
<div className="row"><span className="lbl">Select · sizes</span>
<FormField label="Vehicle category" style={{flex:"1 1 200px"}}><Select placeholder="All categories" options={["Saloon","SUV","Van","Truck"]} /></FormField>
<FormField label="Zone" style={{flex:"1 1 200px"}}><Select size="sm" defaultValue="town" options={[{value:"town",label:"Town"},{value:"upcountry",label:"Upcountry"}]} /></FormField>
<FormField label="Search" style={{flex:"1 1 200px"}}><Input size="sm" iconLeft="search" placeholder="Trips, plates, invoices" /></FormField></div>
<div className="row"><span className="lbl">Choice controls</span>
<div style={{display:"flex",flexDirection:"column",gap:10,flex:"1 1 240px"}}>
<Checkbox defaultChecked label="Return trip" description="Adds a second leg at the same rate" />
<Checkbox label="Multi-stop" /><Checkbox indeterminate label="Partial selection" /><Checkbox disabled label="Self drive (Phase 2)" /></div>
<RadioGroup name="btype" defaultValue="immediate" style={{flex:"1 1 240px"}} options={[{value:"immediate",label:"Immediate",description:"Dispatch now"},{value:"scheduled",label:"Scheduled",description:"Pick a date and time"}]} />
<div style={{display:"flex",flexDirection:"column",gap:12,flex:"1 1 200px"}}>
<Switch defaultChecked label="Flag odometer variance" /><Switch label="Auto-approve bookings" /><Switch size="sm" defaultChecked label="SMS notifications" /></div></div>
<div className="row" style={{marginBottom:0}}><Button variant="secondary">Cancel</Button><Button iconLeft="check">Confirm booking</Button></div>
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
