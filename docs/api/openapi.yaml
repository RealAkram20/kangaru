# KangaruRide API contract (ADR-0011).
#
# HAND-WRITTEN, and the source of truth: the code is checked against this
# document, never the reverse. A new endpoint's entry here is part of its
# PR (Definition of Done). Every JSON response the backend test suite
# produces is validated against this file, and a route census asserts every
# api/v1 route is documented — see backend/tests/Feature/Ci/.
#
# House rules, enforced by backend/tests/Feature/Ci/OpenApiSpecLintTest.php:
# - Every object schema declares `additionalProperties` — `false` unless it
#   is genuinely a map. Without it a response can grow undeclared fields
#   and still validate, which is the exact failure mode (role_label,
#   TripResource) this contract exists to prevent.
# - Failure responses reuse ErrorEnvelope; its `code` enumerates every
#   ErrorCode case. Clients branch on `code`, never on message text.
# - Binary responses (exports, odometer photos) are declared, not
#   validated.
#
# Dialect notes (proved against the installed validator, see ADR-0011):
# - Nullable is `type: [x, 'null']` (OpenAPI 3.1), not `nullable: true`.
# - `[]`-vs-`{}` unions (PHP serialises an empty map as `[]`) use `anyOf`,
#   not `oneOf` — an empty value matches both branches, and oneOf would
#   reject exactly-one on it.
# - 204 responses are declared explicitly with no content; undeclared
#   statuses fall through to `default`, which expects a JSON error body.
openapi: 3.1.0
info:
  title: KangaruRide API
  version: 1.0.0
  description: >
    Enterprise transport management platform API (v1). All responses use the
    envelope defined in AGENTS.md API Standards: successes carry
    `{success: true, message, data}` (plus `meta` where documented), and
    failures carry `{success: false, code, message, errors}` with a stable
    machine-readable `code`.

paths:
  # ------------------------------------------------------------------
  # Authentication and MFA (Modules/Administration, ADR-0008 / ADR-0010)
  # ------------------------------------------------------------------
  /api/v1/auth/login:
    post:
      summary: First step of login. Returns a token, or an MFA challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string }
                client:
                  type: string
                  enum: [console, driver]
                  description: >
                    Which app is asking (ADR-0022). Omitted means the staff
                    console, which is how every client that predates this
                    behaves. A `driver` token may reach only the Driver's
                    Application surface; anything else answers 403
                    TOKEN_SCOPE_EXCEEDED. Self-declared, and honest about it:
                    it does not restrict the *person* signing in — they may
                    always ask for a console token — it bounds what a token
                    sitting on a phone can be used for.
      responses:
        '200':
          $ref: '#/components/responses/AuthenticatedResponse'
        '202':
          description: >
            Password accepted, login not finished — the account requires a
            second factor (ADR-0008). No token is issued.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [challenge_id, method]
                    additionalProperties: false
                    properties:
                      challenge_id: { type: string }
                      method: { enum: [totp] }
        '429':
          $ref: '#/components/responses/Throttled'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa/verify:
    post:
      summary: Second step of login — spends a challenge against a TOTP or recovery code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              additionalProperties: false
              properties:
                challenge_id: { type: string }
                code: { type: string, maxLength: 64 }
                client:
                  type: string
                  enum: [console, driver]
                  description: >
                    Which app is asking (ADR-0022). Omitted means the staff
                    console, which is how every client that predates this
                    behaves. A `driver` token may reach only the Driver's
                    Application surface; anything else answers 403
                    TOKEN_SCOPE_EXCEEDED. Self-declared, and honest about it:
                    it does not restrict the *person* signing in — they may
                    always ask for a console token — it bounds what a token
                    sitting on a phone can be used for.
      responses:
        '200':
          $ref: '#/components/responses/AuthenticatedResponse'
        '429':
          $ref: '#/components/responses/Throttled'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/logout:
    post:
      summary: Revokes the current token.
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/me:
    get:
      summary: The authenticated account.
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/password:
    patch:
      summary: Changes your own password and revokes every token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              additionalProperties: false
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa/enrol:
    post:
      summary: Begins TOTP enrolment — a fresh secret and its QR code.
      responses:
        '200':
          description: Secret issued, unconfirmed until the confirm step.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [secret, otpauth_uri, qr_svg]
                    additionalProperties: false
                    properties:
                      secret: { type: string }
                      otpauth_uri: { type: string }
                      qr_svg: { type: string }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa/enrol/confirm:
    post:
      summary: Confirms enrolment against a first code; returns the recovery codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, maxLength: 16 }
      responses:
        '200':
          $ref: '#/components/responses/RecoveryCodesResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa/recovery-codes:
    post:
      summary: Regenerates recovery codes, invalidating the previous set.
      responses:
        '200':
          $ref: '#/components/responses/RecoveryCodesResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa:
    delete:
      summary: >
        Removes your own second factor (ADR-0010). Only for a role that does
        not require one — a privileged role gets 403. Proven with a current
        code, like every other MFA mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, maxLength: 16 }
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Staff administration and roles (Modules/Administration, ADR-0004)
  # ------------------------------------------------------------------
  /api/v1/users:
    get:
      summary: Accounts this actor may administer.
      parameters:
        - { name: status, in: query, schema: { enum: [active, suspended] } }
        - { name: role, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        '200':
          description: Accounts, plus the roles this actor may assign.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta:
                    type: object
                    required: [assignable_roles]
                    additionalProperties: false
                    properties:
                      assignable_roles:
                        type: array
                        items:
                          type: object
                          required: [value, label, description]
                          additionalProperties: false
                          properties:
                            value: { type: string }
                            label: { type: string }
                            description: { type: ['string', 'null'] }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Creates an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role, password]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                role: { type: string }
                password: { type: string, minLength: 12 }
                tenant_id: { type: integer, description: Super Admin only. }
      responses:
        '201':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/users/{user}:
    parameters:
      - { name: user, in: path, required: true, schema: { type: integer } }
    get:
      summary: One account.
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Updates an account. Suspension revokes its tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                role: { type: string }
                status: { enum: [active, suspended] }
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Platform settings (Modules/Administration, ADR-0014)
  # ------------------------------------------------------------------
  /api/v1/public/settings:
    get:
      summary: >
        The branding subset, unauthenticated (ADR-0014 §5). Only
        catalogue keys flagged public; asset paths arrive as absolute
        URLs. Throttled 30/min/IP.
      responses:
        '200':
          description: The public branding subset.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [settings]
                    additionalProperties: false
                    properties:
                      settings: { $ref: '#/components/schemas/PublicSettings' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings:
    get:
      summary: >
        Every settings group, resolved against catalogue defaults
        (ADR-0014). Requires settings.manage — the read shows
        operational levers, so it is gated like the write.
      responses:
        '200':
          $ref: '#/components/responses/SettingsResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings/{group}:
    patch:
      summary: >
        Saves one group. Only submitted keys are validated and written;
        unknown keys are refused rather than skipped. Every write is
        audited.
      parameters:
        - { name: group, in: path, required: true, schema: { enum: [branding, regional, ordering, booking, mail, sms, payments] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any subset of the group's keys.
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SettingsResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings/mail/test:
    post:
      summary: >
        Sends a test email through the stored SMTP settings (ADR-0014
        phase 3). Fails 422 until mail is enabled with a host and from
        address; a transport refusal answers 502 MAIL_DELIVERY_FAILED
        carrying the server's own words. Throttled 5/min.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                to:
                  type: ['string', 'null']
                  format: email
                  description: Defaults to the branding contact email.
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings/assets/{asset}:
    post:
      summary: >
        Logo or favicon upload (ADR-0014 §6). Multipart; the stored path
        is written through the same audited path as any other setting.
      parameters:
        - { name: asset, in: path, required: true, schema: { enum: [logo, favicon] } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: png/jpg/svg/webp up to 2MB for the logo; png/ico/svg up to 512KB for the favicon.
      responses:
        '200':
          $ref: '#/components/responses/SettingsResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/roles:
    get:
      summary: The role catalogue (ADR-0004).
      responses:
        '200':
          description: Roles, the permission catalogue, and what this actor may grant.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
                  meta:
                    type: object
                    required: [catalogue, grantable, can_manage]
                    additionalProperties: false
                    properties:
                      catalogue:
                        description: Permission catalogue grouped for display, keyed by group name.
                        type: object
                        additionalProperties:
                          type: array
                          items: { $ref: '#/components/schemas/ValueLabel' }
                      grantable:
                        type: array
                        items: { type: string }
                      can_manage: { type: boolean }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Creates a custom role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 120 }
                slug: { type: string, maxLength: 120, pattern: '^[a-z][a-z0-9_]*$' }
                description: { type: ['string', 'null'], maxLength: 255 }
                permissions:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '201':
          $ref: '#/components/responses/RoleResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/roles/{role}:
    parameters:
      - { name: role, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Updates a role's name, description or permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: ['string', 'null'], maxLength: 255 }
                permissions:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/RoleResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Deletes a role nobody holds. Refused with ROLE_IN_USE otherwise.
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/audit-logs:
    get:
      summary: The audit trail this reader may see (platform-wide or one tenant's).
      parameters:
        - { name: auditable_type, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { enum: [created, updated, deleted] } }
        - { name: user_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Audit entries, newest first, with the filter vocabulary.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  meta:
                    type: object
                    required: [cursor, filters, scope]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
                      filters:
                        type: object
                        required: [auditable_types, actions, actors]
                        additionalProperties: false
                        properties:
                          auditable_types:
                            type: array
                            items: { type: string }
                          actions:
                            type: array
                            items: { type: string }
                          actors:
                            type: array
                            items: { $ref: '#/components/schemas/ValueLabelInt' }
                      scope: { $ref: '#/components/schemas/Scope' }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Bookings and dispatch (Modules/Bookings, Modules/Dispatch)
  # ------------------------------------------------------------------
  /api/v1/bookings:
    get:
      summary: The booking queue — one client's, or every client's for platform staff.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/BookingStatus' } }
        - { name: dispatchable, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: tenant_id, in: query, schema: { type: integer }, description: Platform staff only. }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Bookings, soonest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Booking' }
                  meta: { $ref: '#/components/schemas/CrossClientListMeta' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Raises a booking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passenger_name, passenger_phone, origin, destination]
              additionalProperties: false
              properties:
                passenger_name: { type: string, maxLength: 255 }
                passenger_phone: { type: string, maxLength: 32 }
                passenger_count: { type: ['integer', 'null'], minimum: 1, maximum: 60 }
                origin: { type: string, maxLength: 255 }
                destination: { type: string, maxLength: 255 }
                scheduled_for:
                  type: ['string', 'null']
                  description: Omit or null for an immediate booking. Must be in the future.
                notes: { type: ['string', 'null'], maxLength: 1000 }
      responses:
        '201':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}:
    parameters:
      - { name: booking, in: path, required: true, schema: { type: integer } }
    get:
      summary: One booking, with its trip when dispatched.
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/approval:
    post:
      summary: Approves a pending booking.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/rejection:
    post:
      summary: Rejects a booking, with a reason.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      requestBody:
        $ref: '#/components/requestBodies/DecisionReason'
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/cancellation:
    post:
      summary: Cancels a booking, with a reason.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      requestBody:
        $ref: '#/components/requestBodies/DecisionReason'
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/candidate-vehicles:
    get:
      summary: >
        Every vehicle plus what this booking's contracts say about it
        (ADR-0009) — allocated vehicles rank first, exclusive ones
        elsewhere are marked undispatchable, and requires_override_reason
        tells a form to collect a reason before POSTing the assignment.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Candidate vehicles, allocated first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CandidateVehicle' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/candidate-drivers:
    get:
      summary: >
        Every active driver plus whether they can take this booking
        (ADR-0017) — available first, and the rest listed with a short note
        rather than dropped, because a dispatcher who knows the roster will
        ask where somebody went.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Candidate drivers, available first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CandidateDriver' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/recommendation:
    parameters:
      - { name: booking, in: path, required: true, schema: { type: integer } }
    get:
      summary: What the matcher would choose, ranked, with its reasons (ADR-0020).
      description: >
        Always available, flag or no flag — reading a suggestion can do no
        harm, and it is how an operator builds confidence in the matcher
        before it acts alone. Anything the assignment endpoint would refuse
        is dropped rather than ranked low. Empty when nothing is free.
      responses:
        '200':
          description: Suggestions, best first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DispatchSuggestion' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/auto-assignment:
    parameters:
      - { name: booking, in: path, required: true, schema: { type: integer } }
    post:
      summary: Commits the top suggestion (ADR-0020).
      description: >
        Behind the `dispatch.automatic_enabled` flag, off by default —
        AGENTS.md requires dispatch algorithm changes to ship behind one.
        Commits through the same locked path a human dispatcher uses, so the
        pessimistic locks, allocation rules and availability refusals all
        apply. 409 AUTOMATIC_DISPATCH_DISABLED when the flag is off,
        409 NO_DISPATCH_CANDIDATE when nothing is free.
      responses:
        '201':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/assignment:
    post:
      summary: >
        Assigns a vehicle and driver to a booking, producing its trip.
        Every failure is a 409 with a code the client branches on —
        VEHICLE_UNAVAILABLE, DRIVER_UNAVAILABLE or INVALID_BOOKING_TRANSITION.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, driver_id]
              additionalProperties: false
              properties:
                vehicle_id: { type: integer }
                driver_id: { type: integer }
                allocation_override_reason:
                  type: ['string', 'null']
                  maxLength: 500
                  description: >
                    Required (422) when the vehicle bypasses another client's
                    non-exclusive allocation — recorded on the trip and
                    audited (ADR-0009).
      responses:
        '201':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Walk-in order requests (Modules/Bookings, ADR-0012)
  # ------------------------------------------------------------------
  /api/v1/public/order-requests:
    post:
      summary: >
        The public landing page's request form — the platform's one
        unauthenticated write (ADR-0012). Throttled 3/min/IP. Returns only
        a human-readable reference; no id, no echo of the stored row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_type, contact_name, contact_phone]
              additionalProperties: false
              properties:
                service_type: { enum: [ride, delivery, self_drive] }
                contact_name: { type: string, maxLength: 120 }
                contact_phone:
                  type: string
                  minLength: 9
                  maxLength: 32
                  description: Loose on purpose — 07…, +2567… and 2567… all arrive; the dispatcher dials it either way.
                contact_email: { type: ['string', 'null'], format: email }
                pickup_location:
                  type: ['string', 'null']
                  maxLength: 255
                  description: Required for ride and delivery.
                dropoff_location:
                  type: ['string', 'null']
                  maxLength: 255
                  description: Required for ride and delivery.
                scheduled_for: { type: ['string', 'null'], description: Must be in the future. }
                notes: { type: ['string', 'null'], maxLength: 1000 }
                details:
                  description: Service-specific fields; see the per-service required rules in StorePublicOrderRequest.
                  type: ['object', 'null']
                  additionalProperties: false
                  properties:
                    passengers: { type: ['integer', 'null'], minimum: 1, maximum: 14 }
                    vehicle_class: { enum: [economy, standard, xl, boda, electric_boda, null] }
                    item_type: { enum: [documents, food, parcel, electronics, furniture, appliances, other, null] }
                    package_size: { enum: [small, medium, large, heavy, null] }
                    payer: { enum: [sender, receiver, null], description: Delivery only — which end settles the bill. }
                    payment_method: { enum: [cash, mobile_money, card, null], description: Delivery only. }
                    sender_name: { type: ['string', 'null'], maxLength: 120, description: Delivery only — absent when the account holder is the sender. }
                    sender_phone: { type: ['string', 'null'], maxLength: 32 }
                    recipient_name: { type: ['string', 'null'], maxLength: 120 }
                    recipient_phone: { type: ['string', 'null'], maxLength: 32 }
                    confirm_with_pin: { type: ['boolean', 'null'], description: Delivery only — handover confirmed with a four-digit code. }
                    vehicle_category: { enum: [sedan, suv, van, pickup, null] }
                    start_date: { type: ['string', 'null'], format: date, description: Required for self_drive. }
                    end_date: { type: ['string', 'null'], format: date, description: Required for self_drive. }
                    kyc_documents: { type: ['string', 'null'], maxLength: 255, description: 'Self drive only — comma-separated ids of the identity documents the renter has to hand (national_id, selfie, drivers_license, …). The files are not uploaded; the desk checks originals at collection.' }
                website:
                  type: string
                  description: Anti-spam field. Must be left empty.
      responses:
        '201':
          description: Received. A dispatcher calls back to confirm.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [reference]
                    additionalProperties: false
                    properties:
                      reference: { type: string }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Customer accounts (Modules/Customers, ADR-0013)
  #
  # The second principal's surface. Everything under /customer answers
  # to the `customer` guard, never `auth:sanctum` — a staff token here
  # is a 401, and a customer token anywhere else is a 401 (ADR-0013 §2).
  # ------------------------------------------------------------------
  /api/v1/customer/auth/register:
    post:
      summary: >
        Creates a customer account and returns its token (ADR-0013 §3).
        Unauthenticated write, throttled 5/min/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, phone, email, password]
              additionalProperties: false
              properties:
                first_name: { type: string, maxLength: 60 }
                last_name: { type: string, maxLength: 60 }
                gender:
                  type: string
                  nullable: true
                  enum: [female, male, other, prefer_not_to_say]
                  description: >
                    Optional (ADR-0015 §2). Held to support a same-gender
                    captain preference; Uganda's Data Protection and
                    Privacy Act, 2019 wants a stated purpose for it, which
                    is a reason to offer the question rather than compel it.
                phone:
                  type: string
                  minLength: 9
                  maxLength: 32
                  description: A contact field the dispatcher dials — never a verification channel (no SMS).
                email: { type: string, format: email, maxLength: 190 }
                password: { type: string, minLength: 8, maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/CustomerAuthenticatedResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/auth/login:
    post:
      summary: >
        Customer login (ADR-0013 §3). One 401 message for wrong password
        and unknown email alike; a Google-only account's absent password
        reads the same way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/CustomerAuthenticatedResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/auth/logout:
    post:
      summary: Revokes the current customer token.
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/auth/me:
    get:
      summary: The signed-in customer's own account.
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Customer' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/order-requests:
    get:
      summary: >
        The signed-in customer's own order requests, newest first
        (ADR-0013 §4) — the status checker ADR-0012 deferred, scoped by
        the token so no reference or id is enumerable.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The customer's order requests, page-paginated.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [order_requests]
                    additionalProperties: false
                    properties:
                      order_requests:
                        type: array
                        items: { $ref: '#/components/schemas/CustomerOrderRequest' }
                  meta:
                    type: object
                    required: [page, per_page, total]
                    additionalProperties: false
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/order-requests/{orderRequest}:
    get:
      summary: >
        One of the customer's own order requests. An id outside their own
        rows answers 404, not 403 — that a row exists is itself
        information.
      parameters:
        - { name: orderRequest, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The order request.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [order_request]
                    additionalProperties: false
                    properties:
                      order_request: { $ref: '#/components/schemas/CustomerOrderRequest' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/order-requests:
    get:
      summary: The dispatch desk's walk-in queue, oldest first (ADR-0012).
      parameters:
        - { name: status, in: query, schema: { enum: [new, contacted, converted, closed] } }
        - { name: service_type, in: query, schema: { enum: [ride, delivery, self_drive] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Order requests, page-paginated.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [order_requests]
                    additionalProperties: false
                    properties:
                      order_requests:
                        type: array
                        items: { $ref: '#/components/schemas/OrderRequest' }
                  meta:
                    type: object
                    required: [page, per_page, total]
                    additionalProperties: false
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/order-requests/{orderRequest}:
    parameters:
      - { name: orderRequest, in: path, required: true, schema: { type: integer } }
    get:
      summary: One order request.
      responses:
        '200':
          $ref: '#/components/responses/OrderRequestResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: >
        Moves a request through its queue lifecycle. Illegal moves are 409
        INVALID_ORDER_REQUEST_TRANSITION.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { enum: [new, contacted, converted, closed] }
                dispatcher_notes: { type: ['string', 'null'], maxLength: 2000 }
      responses:
        '200':
          $ref: '#/components/responses/OrderRequestResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Companies (Modules/Clients)
  # ------------------------------------------------------------------
  /api/v1/companies:
    get:
      summary: Corporate client companies this actor may see.
      responses:
        '200':
          description: Companies.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Company' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Creates a company under a tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, legal_name, billing_email, city, country]
              additionalProperties: false
              properties:
                tenant_id: { type: integer }
                legal_name: { type: string, maxLength: 255 }
                trading_name: { type: ['string', 'null'], maxLength: 255 }
                registration_number: { type: ['string', 'null'], maxLength: 255 }
                industry: { type: ['string', 'null'], maxLength: 255 }
                billing_email: { type: string, format: email }
                phone: { type: ['string', 'null'], maxLength: 50 }
                address_line1: { type: ['string', 'null'], maxLength: 255 }
                address_line2: { type: ['string', 'null'], maxLength: 255 }
                city: { type: string, maxLength: 255 }
                country: { type: string, maxLength: 255 }
                credit_limit_minor: { type: ['integer', 'null'], minimum: 0 }
      responses:
        '201':
          $ref: '#/components/responses/CompanyResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/companies/{company}:
    parameters:
      - { name: company, in: path, required: true, schema: { type: integer } }
    get:
      summary: One company.
      responses:
        '200':
          $ref: '#/components/responses/CompanyResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Updates a company.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                legal_name: { type: string, maxLength: 255 }
                trading_name: { type: ['string', 'null'], maxLength: 255 }
                registration_number: { type: ['string', 'null'], maxLength: 255 }
                industry: { type: ['string', 'null'], maxLength: 255 }
                billing_email: { type: string, format: email }
                phone: { type: ['string', 'null'], maxLength: 50 }
                address_line1: { type: ['string', 'null'], maxLength: 255 }
                address_line2: { type: ['string', 'null'], maxLength: 255 }
                city: { type: string, maxLength: 255 }
                country: { type: string, maxLength: 255 }
                credit_limit_minor: { type: integer, minimum: 0 }
                status: { enum: [active, suspended] }
      responses:
        '200':
          $ref: '#/components/responses/CompanyResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Deletes a company.
      responses:
        '204':
          description: Deleted. No content.
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Drivers (Modules/Drivers) — the platform's, not a tenant's (ADR-0005)
  # ------------------------------------------------------------------
  /api/v1/drivers:
    get:
      summary: The platform's drivers.
      responses:
        '200':
          description: Drivers.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Driver' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Registers a driver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, license_number, license_expiry]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                phone: { type: string, maxLength: 50 }
                email: { type: ['string', 'null'], format: email }
                license_number: { type: string, maxLength: 100 }
                license_expiry: { type: string, format: date }
                status: { enum: [active, suspended, inactive] }
      responses:
        '201':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/drivers/{driver}:
    parameters:
      - { name: driver, in: path, required: true, schema: { type: integer } }
    get:
      summary: One driver.
      responses:
        '200':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Updates a driver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                phone: { type: string, maxLength: 50 }
                email: { type: ['string', 'null'], format: email }
                license_number: { type: string, maxLength: 100 }
                license_expiry: { type: string, format: date }
                status: { enum: [active, suspended, inactive] }
      responses:
        '200':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Removes a driver.
      responses:
        '204':
          description: Deleted. No content.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/drivers/{driver}/account:
    parameters:
      - { name: driver, in: path, required: true, schema: { type: integer } }
    post:
      summary: Gives a driver the account they sign in with (ADR-0016).
      description: >
        Either mints a new account (email + password) or adopts an existing
        unlinked one (user_id); the two shapes are mutually exclusive. Needs
        drivers.manage AND staff.manage, and the role being granted is checked
        against the caller's own permissions (ADR-0004 escalation rule).
        409 DRIVER_ACCOUNT_CONFLICT if either the profile or the account is
        already linked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: New account
                  required: [email, password]
                  additionalProperties: false
                  properties:
                    email: { type: string, format: email, maxLength: 255 }
                    password: { type: string, minLength: 12 }
                    role: { type: string, description: 'Role slug. Defaults to driver.' }
                    name: { type: string, maxLength: 255, description: "Defaults to the driver profile's name." }
                - type: object
                  title: Existing account
                  required: [user_id]
                  additionalProperties: false
                  properties:
                    user_id: { type: integer }
      responses:
        '201':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Takes the driver's sign-in away and closes their sessions.
      description: >
        Idempotent — a driver with no account is already the requested state.
        Revokes every token the account holds; the account itself survives.
      responses:
        '200':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Availability (Modules/Fleet) — who and what is off the road (ADR-0017)
  # ------------------------------------------------------------------
  /api/v1/availability-blocks:
    get:
      summary: Periods drivers and vehicles are unavailable.
      description: >
        Filters are whitelisted; an unknown one answers 422 rather than being
        ignored. `from` and `to` must be given together — a window with one
        end is not a window.
      parameters:
        - { name: resource_type, in: query, schema: { enum: [driver, vehicle] } }
        - { name: resource_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { enum: [requested, approved, declined] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Blocks.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AvailabilityBlock' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Takes a driver or vehicle off the road for a period.
      description: >
        Needs drivers.manage for a driver and vehicles.manage for a vehicle —
        the permission follows the resource rather than being one of its own.
        `ends_at` null is open-ended. Recorded as `approved`; the Driver's
        Application records `requested` instead and waits for an answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, resource_id, kind, starts_at]
              additionalProperties: false
              properties:
                resource_type: { enum: [driver, vehicle] }
                resource_id: { type: integer }
                kind: { enum: [leave, sick, rest, training, maintenance, inspection, repair, other] }
                starts_at: { type: string, format: date-time }
                ends_at: { type: ['string', 'null'], format: date-time }
                reason: { type: ['string', 'null'], maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/AvailabilityBlockResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/availability-blocks/{availabilityBlock}:
    parameters:
      - { name: availabilityBlock, in: path, required: true, schema: { type: integer } }
    delete:
      summary: Ends the block, putting the resource back on the road.
      responses:
        '204':
          description: Removed. No content.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/availability-blocks/{availabilityBlock}/answer:
    parameters:
      - { name: availabilityBlock, in: path, required: true, schema: { type: integer } }
    post:
      summary: Approves or declines a request for time off (ADR-0017 section 6).
      description: >
        The far end of the Driver's Application. Only `approved` withholds the
        driver from dispatch. Answering twice is 409
        AVAILABILITY_ALREADY_ANSWERED; answering your own request is 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { enum: [approved, declined] }
                note: { type: ['string', 'null'], maxLength: 255 }
      responses:
        '200':
          $ref: '#/components/responses/AvailabilityBlockResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Customer register (Modules/Customers) — staff side, ADR-0018
  # ------------------------------------------------------------------
  /api/v1/customers:
    get:
      summary: The customer register — the platform's own retail account holders.
      description: >
        Needs customers.view (Dispatcher, Operations Manager, Super Admin).
        Deliberately closed to a corporate client's administrators: these are
        Shanitah's customers, not theirs. `q` searches name, email and phone,
        with punctuation stripped from both sides of the phone comparison.
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: status, in: query, schema: { enum: [active, suspended] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Customers, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerProfile' }
                  meta:
                    type: object
                    required: [cursor, tally]
                    additionalProperties: false
                    properties:
                      cursor:
                        type: object
                        required: [next]
                        additionalProperties: false
                        properties:
                          next: { type: ['string', 'null'] }
                      tally:
                        type: object
                        required: [total, active, suspended]
                        additionalProperties: false
                        properties:
                          total: { type: integer }
                          active: { type: integer }
                          suspended: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customers/{customer}:
    parameters:
      - { name: customer, in: path, required: true, schema: { type: integer } }
    get:
      summary: One customer, as staff see them.
      responses:
        '200':
          $ref: '#/components/responses/CustomerProfileResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customers/{customer}/activity:
    parameters:
      - { name: customer, in: path, required: true, schema: { type: integer } }
    get:
      summary: What this customer has asked for (most recent 50).
      responses:
        '200':
          description: Their order requests, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrderRequest' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customers/{customer}/suspension:
    parameters:
      - { name: customer, in: path, required: true, schema: { type: integer } }
    post:
      summary: Suspends the account and closes every session it holds.
      description: >
        Needs customers.manage. The reason is required — it is the sentence a
        support agent reads back to the customer. Suspension also refuses the
        next sign-in, with the ordinary wrong-credentials answer so the login
        form cannot be used to enumerate accounts in trouble.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 10, maxLength: 255 }
      responses:
        '200':
          $ref: '#/components/responses/CustomerProfileResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Restores the account. Tokens are not restored — they sign in again.
      responses:
        '200':
          $ref: '#/components/responses/CustomerProfileResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Live positions (Modules/Trips) — ADR-0019
  # ------------------------------------------------------------------
  /api/v1/live-positions:
    get:
      summary: Where the fleet is right now.
      description: >
        One entry per vehicle on a trip that has not finished. Visibility is
        resolved through the trips query — a client sees only their own, a
        driver only the trip they are on — so it can never diverge from the
        trips listing. `age_seconds` is measured from the device clock, not
        from storage time, so ingestion lag is visible rather than hidden.
      parameters:
        - name: tenant_id
          in: query
          description: Platform readers only; narrows to one client (ADR-0006).
          schema: { type: integer }
      responses:
        '200':
          description: Vehicles currently moving.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LivePosition' }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # A driver's own time off (Modules/Fleet) — ADR-0017 section 6
  # The Driver's Application asks here; the office answers at
  # /availability-blocks/{id}/answer.
  # ------------------------------------------------------------------
  /api/v1/me/availability-requests:
    get:
      summary: The signed-in driver's own requests for time off, and their answers.
      description: >
        403 NOT_A_DRIVER when the account is not linked to a driver profile —
        the feature exists, this account simply is not a driver.
      responses:
        '200':
          description: Their requests, most recent first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AvailabilityBlock' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Asks the office for time off.
      description: >
        Takes no `resource_id` and no `status`: the request is pinned to the
        caller's own driver profile in the `requested` state by the server, so
        a driver cannot ask on somebody else's behalf or grant themselves
        leave. **Asking does not withhold them from dispatch** — only an
        `approved` answer does. Throttled to 10 a minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, starts_at, reason]
              additionalProperties: false
              properties:
                kind:
                  description: Only reasons a person is away; a driver cannot book maintenance.
                  enum: [leave, sick, rest, training, other]
                starts_at: { type: string, format: date-time }
                ends_at:
                  description: Null is open-ended; the office pins the end when it answers.
                  type: ['string', 'null']
                  format: date-time
                reason: { type: string, minLength: 5, maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/AvailabilityBlockResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/availability-requests/{availabilityBlock}:
    parameters:
      - { name: availabilityBlock, in: path, required: true, schema: { type: integer } }
    delete:
      summary: Withdraws a request the office has not answered yet.
      description: >
        409 AVAILABILITY_ALREADY_ANSWERED once answered — deleting an approval
        would put the driver back on the roster with nobody knowing. Another
        driver's request answers 404, not 403.
      responses:
        '204':
          description: Withdrawn. No content.
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Zones (Modules/Fleet) — the geofencing engine, ADR-0021
  # ------------------------------------------------------------------
  /api/v1/zones:
    get:
      summary: The geofences this caller may see.
      description: >
        A client sees the platform's zones plus their own and never another
        client's; a platform reader sees all. Needs zones.view, seeded on
        every system role because dispatch, billing and ordering all resolve
        points against zones.
      responses:
        '200':
          description: Zones, narrowest priority first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Zone' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Draws a zone.
      description: >
        Needs zones.manage — a boundary decides what a client is charged, so
        drawing one is a commercial act. A `client` zone must name its
        tenant; every other kind must not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneInput' }
      responses:
        '201':
          $ref: '#/components/responses/ZoneResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/zones/resolve:
    get:
      summary: Which zones contain this point.
      description: >
        What a dispatcher asks when a price or a refusal needs explaining.
        `meta.within_service_area` answers "may we take this job at all" and
        is **true when no service area has been drawn** — coverage is opt-in.
        `meta.pricing_zone_id` answers "what does it cost", and is null when
        no priced zone covers the point.
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number } }
        - { name: longitude, in: query, required: true, schema: { type: number } }
      responses:
        '200':
          description: Containing zones, narrowest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Zone' }
                  meta:
                    type: object
                    required: [within_service_area, pricing_zone_id]
                    additionalProperties: false
                    properties:
                      within_service_area: { type: boolean }
                      pricing_zone_id: { type: ['integer', 'null'] }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/zones/{zone}:
    parameters:
      - { name: zone, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Redraws a zone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneInput' }
      responses:
        '200':
          $ref: '#/components/responses/ZoneResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Retires a zone. Soft-deleted, so invoices priced in it keep their reference.
      responses:
        '204':
          description: Retired. No content.
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Vehicles (Modules/Vehicles) — the platform's fleet (ADR-0005)
  # ------------------------------------------------------------------
  /api/v1/vehicles:
    get:
      summary: The platform's fleet.
      responses:
        '200':
          description: Vehicles.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Vehicle' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Registers a vehicle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_number, make, model, year, category, seating_capacity]
              additionalProperties: false
              properties:
                registration_number: { type: string, maxLength: 50 }
                make: { type: string, maxLength: 100 }
                model: { type: string, maxLength: 100 }
                year: { type: integer, minimum: 1980 }
                category: { $ref: '#/components/schemas/VehicleCategory' }
                seating_capacity: { type: integer, minimum: 1, maximum: 100 }
                color: { type: ['string', 'null'], maxLength: 50 }
                vin: { type: ['string', 'null'], maxLength: 50 }
                status: { enum: [active, maintenance, inactive] }
      responses:
        '201':
          $ref: '#/components/responses/VehicleResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/vehicles/{vehicle}:
    parameters:
      - { name: vehicle, in: path, required: true, schema: { type: integer } }
    get:
      summary: One vehicle.
      responses:
        '200':
          $ref: '#/components/responses/VehicleResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Updates a vehicle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                registration_number: { type: string, maxLength: 50 }
                make: { type: string, maxLength: 100 }
                model: { type: string, maxLength: 100 }
                year: { type: integer, minimum: 1980 }
                category: { $ref: '#/components/schemas/VehicleCategory' }
                seating_capacity: { type: integer, minimum: 1, maximum: 100 }
                color: { type: ['string', 'null'], maxLength: 50 }
                vin: { type: ['string', 'null'], maxLength: 50 }
                status: { enum: [active, maintenance, inactive] }
      responses:
        '200':
          $ref: '#/components/responses/VehicleResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Removes a vehicle.
      responses:
        '204':
          description: Deleted. No content.
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Vehicle allocations (Modules/Fleet, ADR-0009)
  # ------------------------------------------------------------------
  /api/v1/allocations:
    get:
      summary: >
        Vehicle allocation contracts — every client's for platform staff,
        their own for a client.
      responses:
        '200':
          description: Allocations, newest contract first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VehicleAllocation' }
                  meta:
                    type: object
                    required: [filters]
                    additionalProperties: false
                    properties:
                      filters: { $ref: '#/components/schemas/ClientsFilter' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: >
        Agrees an allocation. Overlap with an exclusive contract for the
        same vehicle is refused with 409 ALLOCATION_CONFLICT — the check is
        locked, not advisory (ADR-0009 decision 4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, vehicle_id, starts_on]
              additionalProperties: false
              properties:
                tenant_id: { type: integer }
                vehicle_id: { type: integer }
                starts_on: { type: string, format: date }
                ends_on:
                  type: ['string', 'null']
                  format: date
                  description: Null for an open-ended contract. The last day counts as in force.
                exclusive: { type: boolean }
                notes: { type: ['string', 'null'], maxLength: 1000 }
      responses:
        '201':
          $ref: '#/components/responses/VehicleAllocationResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/allocations/{allocation}:
    parameters:
      - { name: allocation, in: path, required: true, schema: { type: integer } }
    get:
      summary: One allocation.
      responses:
        '200':
          $ref: '#/components/responses/VehicleAllocationResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: >
        Ends a contract — a PATCH with the final day, never a DELETE: the
        row is a commercial record and stays visible with the day it
        stopped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ends_on]
              additionalProperties: false
              properties:
                ends_on: { type: string, format: date }
      responses:
        '200':
          $ref: '#/components/responses/VehicleAllocationResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Trips (Modules/Trips)
  # ------------------------------------------------------------------
  /api/v1/trips:
    get:
      summary: Trips — one client's, or every client's for platform staff.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TripStatus' } }
        - { name: vehicle_id, in: query, schema: { type: integer } }
        - { name: driver_id, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: tenant_id, in: query, schema: { type: integer }, description: Platform staff only. }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Trips, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Trip' }
                  meta: { $ref: '#/components/schemas/CrossClientListMeta' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Raises an ad-hoc trip without a booking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, driver_id, origin, destination]
              additionalProperties: false
              properties:
                vehicle_id: { type: integer }
                driver_id: { type: integer }
                origin: { type: string, maxLength: 255 }
                destination: { type: string, maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}:
    parameters:
      - { name: trip, in: path, required: true, schema: { type: integer } }
    get:
      summary: One trip.
      responses:
        '200':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/transitions:
    post:
      summary: >
        Requests a state-machine transition (AGENTS.md Trip State Machine).
        Illegal transitions are refused with 409 INVALID_TRIP_TRANSITION.
        Sent as JSON, or as multipart/form-data when a dashboard photo
        accompanies an odometer reading.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripTransitionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TripTransitionRequest'
      responses:
        '200':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/events:
    get:
      summary: The trip's timeline — append-only, oldest first.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Timeline events.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TripEvent' }
                  meta:
                    type: object
                    required: [cursor]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/locations:
    post:
      summary: Accepts a batch of GPS pings. Queued, not yet written (ADR-0003).
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pings]
              additionalProperties: false
              properties:
                pings:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [latitude, longitude, recorded_at]
                    additionalProperties: false
                    properties:
                      latitude: { type: number, minimum: -90, maximum: 90 }
                      longitude: { type: number, minimum: -180, maximum: 180 }
                      recorded_at: { type: string }
                      speed_kph: { type: ['number', 'null'], minimum: 0, maximum: 400 }
                      heading_degrees: { type: ['integer', 'null'], minimum: 0, maximum: 359 }
                      accuracy_metres: { type: ['number', 'null'], minimum: 0, maximum: 10000 }
      responses:
        '202':
          description: Accepted for asynchronous ingestion.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [accepted]
                    additionalProperties: false
                    properties:
                      accepted: { type: integer }
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: The recorded route, for replay.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: GPS points in recorded order.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TripLocation' }
                  meta:
                    type: object
                    required: [cursor, gps_distance_km]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
                      gps_distance_km: { type: number }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/odometer-photo/{moment}:
    get:
      summary: >
        The dashboard photo behind an odometer reading. Binary — declared,
        not validated (ADR-0011 decision 6).
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
        - { name: moment, in: path, required: true, schema: { enum: [start, end] } }
      responses:
        '200':
          description: The photo, streamed inline.
          content:
            image/*: {}
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Billing (Modules/Billing)
  # ------------------------------------------------------------------
  /api/v1/invoices:
    get:
      summary: Invoices, cursor-paginated.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: trip_id, in: query, schema: { type: integer } }
        - { name: invoice_number, in: query, schema: { type: string, maxLength: 50 } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Invoices.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
                  meta:
                    type: object
                    required: [cursor]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/invoices/{invoice}:
    get:
      summary: One invoice, with lines and credit notes.
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/invoice:
    post:
      summary: >
        Issues the invoice for a completed trip. Idempotent — a replay of
        the same key returns 200 with the original invoice; a fresh issue
        returns 201.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              additionalProperties: false
              properties:
                idempotency_key: { type: string, minLength: 8, maxLength: 128 }
                rate_card_id:
                  type: ['integer', 'null']
                  description: Omit to price with the tenant's default card.
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
        '201':
          $ref: '#/components/responses/InvoiceResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/invoices/{invoice}/credit-notes:
    parameters:
      - { name: invoice, in: path, required: true, schema: { type: integer } }
    get:
      summary: Credit notes issued against an invoice.
      responses:
        '200':
          description: Credit notes, with lines.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CreditNote' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: >
        Issues a credit note — the only way an issued invoice is ever
        corrected (AGENTS.md Money & Billing). Idempotent, like invoice
        generation: replay returns 200, fresh issue 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, reason, lines]
              additionalProperties: false
              properties:
                idempotency_key: { type: string, minLength: 8, maxLength: 128 }
                reason: { type: string, minLength: 3, maxLength: 1000 }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [description, amount_minor]
                    additionalProperties: false
                    properties:
                      description: { type: string, maxLength: 255 }
                      amount_minor: { type: integer, minimum: 1 }
                      invoice_line_id: { type: ['integer', 'null'] }
      responses:
        '200':
          $ref: '#/components/responses/CreditNoteResponse'
        '201':
          $ref: '#/components/responses/CreditNoteResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/rate-cards:
    get:
      summary: Rate cards, page-paginated (admin CRUD).
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Rate cards with versions and rates.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RateCard' }
                  meta:
                    type: object
                    required: [page, per_page, total]
                    additionalProperties: false
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Creates a rate card and its first version in one call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, version]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: ['string', 'null'], maxLength: 1000 }
                is_default: { type: ['boolean', 'null'] }
                version: { $ref: '#/components/schemas/RateCardVersionRequest' }
      responses:
        '201':
          $ref: '#/components/responses/RateCardResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/rate-cards/{rate_card}:
    get:
      summary: One rate card, with versions and rates.
      parameters:
        - { name: rate_card, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/RateCardResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/rate-cards/{rateCard}/versions:
    post:
      summary: >
        Supersedes the card's prices with a new immutable version. The one
        way prices ever change — there is no update and no delete.
      parameters:
        - { name: rateCard, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateCardVersionRequest'
      responses:
        '201':
          description: The new version.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/RateCardVersion' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/rate-cards/{rateCard}/default:
    put:
      summary: >
        Makes this the card that prices trips when none is named. PUT
        because it is idempotent.
      parameters:
        - { name: rateCard, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/RateCardResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Reports (Modules/Reports, ADR-0007)
  # ------------------------------------------------------------------
  /api/v1/reports/trips:
    get:
      summary: >
        The trip report — the Bank's six acceptance criteria, row per trip,
        cursor-paginated.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: vehicle_id, in: query, schema: { type: integer } }
        - { name: driver_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TripStatus' } }
        - { name: tenant_id, in: query, schema: { type: integer }, description: 'Platform staff only; omitted, the report spans all clients.' }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Report rows plus a whole-set summary.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TripReportRow' }
                  meta:
                    type: object
                    required: [cursor, summary, scope, covers, filters]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
                      summary:
                        type: object
                        required: [trips, trips_completed, distance_km, duration_minutes, records_incomplete, completeness_percent]
                        additionalProperties: false
                        properties:
                          trips: { type: integer }
                          trips_completed: { type: integer }
                          distance_km: { type: number }
                          duration_minutes: { type: integer }
                          records_incomplete: { type: integer }
                          completeness_percent: { type: ['number', 'null'] }
                      scope: { $ref: '#/components/schemas/Scope' }
                      covers: { type: string }
                      filters: { $ref: '#/components/schemas/ClientsFilter' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/drivers:
    get:
      summary: Driver activity aggregate — one row per driver (ADR-0007 rule 3).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          $ref: '#/components/responses/FleetReportResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/vehicles:
    get:
      summary: Vehicle activity aggregate — one row per vehicle (ADR-0007 rule 3).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          $ref: '#/components/responses/FleetReportResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/financial:
    get:
      summary: >
        The financial report, grouped by period. For platform staff
        tenant_id is required — there is no cross-client revenue total
        (ADR-0007 rule 2).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: group_by, in: query, schema: { enum: [day, week, month, year] } }
        - { name: tenant_id, in: query, schema: { type: integer }, description: 'Required for platform staff, refused for client users.' }
      responses:
        '200':
          description: Period rows plus totals.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ReportRows' }
                  meta:
                    type: object
                    required: [report, title, headers, period, summary, scope, covers, filters]
                    additionalProperties: false
                    properties:
                      report: { enum: [financial] }
                      title: { type: string }
                      headers:
                        type: array
                        items: { type: string }
                      period: { type: string }
                      summary:
                        type: object
                        required: [periods, invoices, invoiced_minor, credit_notes, credited_minor, outstanding_minor, currency, payments_recorded]
                        additionalProperties: false
                        properties:
                          periods: { type: integer }
                          invoices: { type: integer }
                          invoiced_minor: { type: integer }
                          credit_notes: { type: integer }
                          credited_minor: { type: integer }
                          outstanding_minor: { type: integer }
                          currency: { type: string }
                          payments_recorded: { type: boolean }
                      scope: { $ref: '#/components/schemas/Scope' }
                      covers: { type: string }
                      filters: { $ref: '#/components/schemas/ClientsFilter' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/exports:
    get:
      summary: Recent exports of reports this reader may see.
      responses:
        '200':
          description: Export records, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReportExport' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: >
        Queues an export. 202 — the record exists, the file does not yet;
        poll the show endpoint until is_terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              additionalProperties: false
              properties:
                format: { enum: [csv, xlsx, pdf] }
                report: { enum: [trips, drivers, vehicles, financial, null] }
                from: { type: ['string', 'null'], format: date }
                to: { type: ['string', 'null'], format: date }
                vehicle_id: { type: ['integer', 'null'] }
                driver_id: { type: ['integer', 'null'] }
                status: { $ref: '#/components/schemas/NullableTripStatus' }
                group_by: { enum: [day, week, month, year, null] }
                tenant_id: { type: ['integer', 'null'], description: Platform staff only; required for a financial export. }
      responses:
        '202':
          $ref: '#/components/responses/ReportExportResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/exports/{export}:
    get:
      summary: One export record — what the client polls.
      parameters:
        - { name: export, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/ReportExportResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/exports/{export}/download:
    get:
      summary: >
        The exported file. Binary — declared, not validated (ADR-0011
        decision 6). 409 EXPORT_NOT_READY while preparing, 410
        EXPORT_EXPIRED after the seven-day retention.
      parameters:
        - { name: export, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The file, as an attachment.
          content:
            text/csv: {}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
            application/pdf: {}
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Notifications (Modules/Notifications) — a user's own inbox
  # ------------------------------------------------------------------
  /api/v1/notifications:
    get:
      summary: Your notifications, newest first, with the unread count.
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Notifications plus the unread badge count.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta:
                    type: object
                    required: [unread]
                    additionalProperties: false
                    properties:
                      unread: { type: integer }
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Marks everything read in one call.
      responses:
        '200':
          description: How many were marked.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [marked]
                    additionalProperties: false
                    properties:
                      marked: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/notifications/{notification}:
    patch:
      summary: Marks one notification read.
      parameters:
        - { name: notification, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The notification, now read.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Notification' }
        '404':
          description: >
            Not found — scoped to your own inbox, so another user's id is
            indistinguishable from a missing one. NOTE the shape: this
            endpoint answers 404 in the success envelope with null data,
            not the error envelope. Documented as built.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { enum: [null] }
        default:
          $ref: '#/components/responses/Error'

components:
  parameters:
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from meta.cursor.next.
      schema: { type: string }

  requestBodies:
    DecisionReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            additionalProperties: false
            properties:
              reason: { type: string, maxLength: 1000 }

  responses:
    Error:
      description: >
        Any failure. `code` is stable and machine-readable — clients branch
        on it, never on message text (AGENTS.md API Standards).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    Throttled:
      description: >
        Rate limited (auth endpoints, 5/min/IP). Rendered by the framework,
        not the API envelope — documented in its production shape; the
        test-suite hook does not validate 429s because debug rendering
        differs.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            additionalProperties: true
            properties:
              message: { type: string }

    MessageOnly:
      description: Success with no data payload.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { enum: [null] }

    AuthenticatedResponse:
      description: Login complete — the account and its Sanctum token.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [user, token, must_enrol_mfa]
                additionalProperties: false
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  token: { type: string }
                  must_enrol_mfa: { type: boolean }

    SettingsResponse:
      description: Every settings group, secrets replaced by configured flags.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [settings]
                additionalProperties: false
                properties:
                  settings: { $ref: '#/components/schemas/Settings' }

    CustomerAuthenticatedResponse:
      description: >
        Customer sign-up or sign-in complete (ADR-0013 §3) — the account
        and its token. No MFA fields on purpose: MFA is tied to staff
        roles that move money, and a customer cannot.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [customer, token]
                additionalProperties: false
                properties:
                  customer: { $ref: '#/components/schemas/Customer' }
                  token: { type: string }

    RecoveryCodesResponse:
      description: >
        Recovery codes, legible this once only — they are stored hashed and
        can never be shown again.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [recovery_codes]
                additionalProperties: false
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }

    UserResponse:
      description: One account.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/User' }

    RoleResponse:
      description: One role.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/Role' }

    BookingResponse:
      description: One booking.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/Booking' }

    TripResponse:
      description: One trip.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/Trip' }

    CompanyResponse:
      description: One company.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/Company' }

    AvailabilityBlockResponse:
      description: One availability block.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/AvailabilityBlock' }

    ZoneResponse:
      description: One zone.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/Zone' }

    CustomerProfileResponse:
      description: One customer, as staff see them.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/CustomerProfile' }

    DriverResponse:
      description: One driver.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/Driver' }

    VehicleResponse:
      description: One vehicle.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/Vehicle' }

    InvoiceResponse:
      description: One invoice.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/Invoice' }

    CreditNoteResponse:
      description: One credit note.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/CreditNote' }

    RateCardResponse:
      description: One rate card, with versions and rates.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/RateCard' }

    OrderRequestResponse:
      description: One order request, in its keyed wrapper.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [order_request]
                additionalProperties: false
                properties:
                  order_request: { $ref: '#/components/schemas/OrderRequest' }

    VehicleAllocationResponse:
      description: One allocation contract.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/VehicleAllocation' }

    ReportExportResponse:
      description: One export record.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/ReportExport' }

    FleetReportResponse:
      description: Aggregate rows plus totals (driver/vehicle reports).
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data, meta]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/ReportRows' }
              meta:
                type: object
                required: [report, title, headers, period, summary, scope, covers, filters]
                additionalProperties: false
                properties:
                  report: { enum: [drivers, vehicles] }
                  title: { type: string }
                  headers:
                    type: array
                    items: { type: string }
                  period: { type: string }
                  summary:
                    type: object
                    required: [entities_active, trips, trips_completed, distance_km, duration_minutes, variance_flagged, average_distance_km]
                    additionalProperties: false
                    properties:
                      entities_active: { type: integer }
                      trips: { type: integer }
                      trips_completed: { type: integer }
                      distance_km: { type: number }
                      duration_minutes: { type: integer }
                      variance_flagged: { type: integer }
                      average_distance_km: { type: number }
                  scope: { $ref: '#/components/schemas/Scope' }
                  covers: { type: string }
                  filters: { $ref: '#/components/schemas/ClientsFilter' }

  schemas:
    # -------------------------- primitives ---------------------------
    Timestamp:
      description: ISO-8601 UTC timestamp as Laravel serialises Carbon.
      type: string

    NullableTimestamp:
      type: ['string', 'null']

    Scope:
      description: Whether this reader sees the whole platform or one tenant (ADR-0006/0007).
      enum: [platform, tenant]

    ValueLabel:
      type: object
      required: [value, label]
      additionalProperties: false
      properties:
        value: { type: string }
        label: { type: string }

    ValueLabelInt:
      type: object
      required: [value, label]
      additionalProperties: false
      properties:
        value: { type: integer }
        label: { type: string }

    Cursor:
      type: object
      required: [next]
      additionalProperties: false
      properties:
        next:
          type: ['string', 'null']
          description: Opaque cursor for the next page; null on the last page.

    ClientsFilter:
      type: object
      required: [clients]
      additionalProperties: false
      properties:
        clients:
          description: Clients a cross-client reader may narrow to. Empty for a client's own user.
          type: array
          items: { $ref: '#/components/schemas/ValueLabelInt' }

    CrossClientListMeta:
      description: The meta block /bookings and /trips share (ADR-0006).
      type: object
      required: [cursor, scope, filters]
      additionalProperties: false
      properties:
        cursor: { $ref: '#/components/schemas/Cursor' }
        scope: { $ref: '#/components/schemas/Scope' }
        filters: { $ref: '#/components/schemas/ClientsFilter' }

    ClientRef:
      description: Which client a row belongs to — platform readers only (ADR-0006).
      type: ['object', 'null']
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }

    ReportRows:
      description: >
        Report rows as positional arrays matching meta.headers — read
        across, like the exported spreadsheet.
      type: array
      items:
        type: array
        items:
          type: ['string', 'number', 'null']

    EmptyableStringListMap:
      description: >
        Validation errors — a map of field name to messages. PHP serialises
        the empty map as [], hence the anyOf.
      anyOf:
        - type: array
          maxItems: 0
        - type: object
          additionalProperties:
            type: array
            items: { type: string }

    FreeformMap:
      description: >
        A JSON column with no fixed shape (audit diffs, notification
        context, export filters). PHP serialises the empty map as [].
      anyOf:
        - type: array
        - type: object
          additionalProperties: true
        - enum: [null]

    # ---------------------------- enums ------------------------------
    ErrorCode:
      description: Every case of App\Enums\ErrorCode. Never removed, never repurposed.
      enum:
        - VALIDATION_FAILED
        - INVALID_CREDENTIALS
        - MFA_REQUIRED
        - MFA_ENROLMENT_REQUIRED
        - MFA_CHALLENGE_INVALID
        - MFA_CODE_INVALID
        - MFA_ALREADY_ENROLLED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - SERVER_ERROR
        - INVALID_TRIP_TRANSITION
        - INVALID_BOOKING_TRANSITION
        - VEHICLE_UNAVAILABLE
        - DRIVER_UNAVAILABLE
        - REPORT_TOO_LARGE
        - EXPORT_NOT_READY
        - EXPORT_EXPIRED
        - ALLOCATION_CONFLICT
        - VEHICLE_EXCLUSIVELY_ALLOCATED
        - INVALID_ORDER_REQUEST_TRANSITION
        - RATE_CARD_NOT_CONFIGURED
        - TRIP_NOT_INVOICEABLE
        - TRIP_ALREADY_INVOICED
        - IDEMPOTENCY_KEY_REUSED
        - CREDIT_NOTE_EXCEEDS_INVOICE
        - ROLE_IN_USE
        - ORDERING_PAUSED
        - MAIL_DELIVERY_FAILED
        - DRIVER_ACCOUNT_CONFLICT
        - AVAILABILITY_ALREADY_ANSWERED
        - AUTOMATIC_DISPATCH_DISABLED
        - NO_DISPATCH_CANDIDATE
        - NOT_A_DRIVER
        - TOKEN_SCOPE_EXCEEDED

    TripStatus:
      enum:
        - assigned
        - rejected
        - accepted
        - driver_en_route
        - driver_arrived
        - no_show
        - passenger_onboard
        - trip_started
        - waiting
        - trip_resumed
        - trip_completed
        - invoice_generated
        - disputed
        - closed
        - cancelled

    NullableTripStatus:
      enum:
        - assigned
        - rejected
        - accepted
        - driver_en_route
        - driver_arrived
        - no_show
        - passenger_onboard
        - trip_started
        - waiting
        - trip_resumed
        - trip_completed
        - invoice_generated
        - disputed
        - closed
        - cancelled
        - null

    BookingStatus:
      enum: [pending, approved, rejected, assigned, cancelled]

    VehicleCategory:
      enum: [sedan, suv, van, minibus, bus, pickup, truck]

    # -------------------------- envelopes ----------------------------
    ErrorEnvelope:
      type: object
      required: [success, code, message, errors]
      additionalProperties: false
      properties:
        success: { enum: [false] }
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        errors: { $ref: '#/components/schemas/EmptyableStringListMap' }

    # -------------------------- resources ----------------------------
    User:
      type: object
      required:
        - id
        - tenant_id
        - name
        - email
        - role
        - role_label
        - status
        - status_label
        - is_active
        - deactivated_at
        - created_at
        - mfa_enabled
        - must_enrol_mfa
        - mfa_recovery_codes_low
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: ['integer', 'null'] }
        name: { type: string }
        email: { type: string }
        role: { type: string, description: Role slug — the external reference. }
        role_label: { type: string }
        status: { enum: [active, suspended] }
        status_label: { type: string }
        is_active: { type: boolean }
        deactivated_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        mfa_enabled: { type: boolean }
        must_enrol_mfa: { type: boolean }
        mfa_recovery_codes_remaining:
          type: integer
          description: Present only when a factor is enrolled (ADR-0010).
        mfa_recovery_codes_low: { type: boolean }

    Role:
      type: object
      required: [slug, name, description, is_system, permissions, created_at]
      additionalProperties: false
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: ['string', 'null'] }
        is_system: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        users_count:
          type: integer
          description: Present on the listing only.
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    AuditLog:
      type: object
      required:
        - id
        - tenant_id
        - user_id
        - auditable_type
        - auditable_id
        - action
        - changes
        - ip_address
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: ['integer', 'null'] }
        user_id: { type: ['integer', 'null'] }
        user:
          anyOf:
            - { $ref: '#/components/schemas/User' }
            - { enum: [null] }
        auditable_type: { type: string }
        auditable_id: { type: ['integer', 'null'] }
        action: { enum: [created, updated, deleted] }
        changes: { $ref: '#/components/schemas/FreeformMap' }
        ip_address: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    Company:
      type: object
      required:
        - id
        - tenant_id
        - legal_name
        - trading_name
        - registration_number
        - industry
        - billing_email
        - phone
        - address_line1
        - address_line2
        - city
        - country
        - credit_limit_minor
        - status
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        legal_name: { type: string }
        trading_name: { type: ['string', 'null'] }
        registration_number: { type: ['string', 'null'] }
        industry: { type: ['string', 'null'] }
        billing_email: { type: string }
        phone: { type: ['string', 'null'] }
        address_line1: { type: ['string', 'null'] }
        address_line2: { type: ['string', 'null'] }
        city: { type: ['string', 'null'] }
        country: { type: ['string', 'null'] }
        credit_limit_minor: { type: ['integer', 'null'] }
        status: { enum: [active, suspended] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    AvailabilityBlock:
      type: object
      required:
        - id
        - resource_type
        - resource_id
        - kind
        - status
        - answered_at
        - answer_note
        - starts_at
        - ends_at
        - reason
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        resource_type: { enum: [driver, vehicle] }
        resource_id: { type: integer }
        kind: { enum: [leave, sick, rest, training, maintenance, inspection, repair, other] }
        status: { enum: [requested, approved, declined] }
        answered_at: { $ref: '#/components/schemas/NullableTimestamp' }
        answer_note: { type: ['string', 'null'] }
        starts_at: { $ref: '#/components/schemas/NullableTimestamp' }
        ends_at: { $ref: '#/components/schemas/NullableTimestamp' }
        reason: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    DispatchSuggestion:
      description: A (vehicle, driver) pair the matcher would choose (ADR-0020).
      type: object
      required: [vehicle, driver, score, pickup_distance_km, reasons]
      additionalProperties: false
      properties:
        vehicle: { $ref: '#/components/schemas/Vehicle' }
        driver: { $ref: '#/components/schemas/Driver' }
        score:
          description: Higher is better. Contracts dominate; distance decays with range.
          type: number
        pickup_distance_km:
          description: >
            Great-circle km from the vehicle's live position to the pickup.
            Null when the booking has no coordinates or the vehicle has not
            reported — absent rather than guessed.
          type: ['number', 'null']
        reasons:
          description: Plain sentences a dispatcher can audit the ranking against.
          type: array
          items: { type: string }

    ZoneBoundaryPoint:
      description: >
        Named keys, not GeoJSON's positional [lng, lat]. That ordering is the
        most common coordinate bug there is, and ADR-0020 records this
        codebase hitting a swap no range check could catch.
      type: object
      required: [lat, lng]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    ZoneInput:
      type: object
      required: [name, kind, boundary]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 255 }
        kind: { enum: [service_area, pricing, client, branch, depot] }
        tenant_id:
          description: Required for a client zone, forbidden for every other kind.
          type: ['integer', 'null']
        boundary:
          description: A closed ring. Three points is the fewest that enclose an area.
          type: array
          minItems: 3
          items: { $ref: '#/components/schemas/ZoneBoundaryPoint' }
        priority:
          description: Lower wins where zones overlap. Defaults from the kind.
          type: integer
        active: { type: boolean }
        notes: { type: ['string', 'null'], maxLength: 255 }

    Zone:
      type: object
      required: [id, tenant_id, name, kind, boundary, priority, active, notes, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: ['integer', 'null'] }
        name: { type: string }
        kind: { enum: [service_area, pricing, client, branch, depot] }
        boundary:
          type: array
          items: { $ref: '#/components/schemas/ZoneBoundaryPoint' }
        priority: { type: integer }
        active: { type: boolean }
        notes: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    LivePosition:
      description: One vehicle's current position (ADR-0019).
      type: object
      required:
        - vehicle_id
        - trip_id
        - driver_id
        - latitude
        - longitude
        - speed_kph
        - heading_degrees
        - recorded_at
        - age_seconds
        - stale
      additionalProperties: false
      properties:
        vehicle_id: { type: integer }
        trip_id: { type: integer }
        driver_id: { type: ['integer', 'null'] }
        latitude: { type: number }
        longitude: { type: number }
        speed_kph: { type: ['number', 'null'] }
        heading_degrees: { type: ['integer', 'null'] }
        recorded_at:
          description: The device's clock, not the server's.
          $ref: '#/components/schemas/NullableTimestamp'
        age_seconds:
          description: Seconds since the device recorded it — the freshness figure.
          type: integer
        stale:
          description: >
            Older than tracking.live_stale_after_seconds. A still marker is
            ambiguous until you know whether it is a parked vehicle or a
            dead phone.
          type: boolean

    CustomerProfile:
      description: >
        A customer as staff see them (ADR-0018) — distinct from the account
        the customer sees. Never carries a credential of any kind.
      type: object
      required:
        - id
        - first_name
        - last_name
        - name
        - gender
        - phone
        - email
        - status
        - has_password
        - has_google
        - suspended_at
        - suspension_reason
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        name: { type: string }
        gender: { type: ['string', 'null'] }
        phone: { type: string }
        email: { type: ['string', 'null'] }
        status: { enum: [active, suspended] }
        has_password:
          description: Whether they can sign in with a password, not what it is.
          type: boolean
        has_google: { type: boolean }
        suspended_at: { $ref: '#/components/schemas/NullableTimestamp' }
        suspension_reason: { type: ['string', 'null'] }
        orders_count: { type: integer }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    CandidateDriver:
      description: >
        A driver plus whether they can take this booking (ADR-0017). The
        driver fields are DriverResource's, restated for the same reason
        CandidateVehicle restates the vehicle's — additionalProperties:
        false rules out allOf composition, and the guarantee is worth the
        duplication.
      type: object
      required:
        - id
        - name
        - phone
        - email
        - license_number
        - license_expiry
        - status
        - account
        - created_at
        - updated_at
        - dispatchable
        - note
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: ['string', 'null'] }
        license_number: { type: string }
        license_expiry: { $ref: '#/components/schemas/NullableTimestamp' }
        status: { enum: [active, suspended, inactive] }
        account:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, email, role, status]
              additionalProperties: false
              properties:
                id: { type: integer }
                email: { type: string, format: email }
                role: { type: string }
                status: { enum: [active, suspended] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }
        dispatchable:
          description: False means the assignment endpoint will refuse them with 409.
          type: boolean
        note:
          description: >
            Short sentence, or null when there is nothing to say. Never names
            the kind of absence.
          type: ['string', 'null']

    Driver:
      type: object
      required:
        - id
        - name
        - phone
        - email
        - license_number
        - license_expiry
        - status
        - account
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: ['string', 'null'] }
        license_number: { type: string }
        license_expiry: { $ref: '#/components/schemas/NullableTimestamp' }
        status: { enum: [active, suspended, inactive] }
        account:
          description: >
            The account this driver signs in with, or null if they cannot sign
            in yet (ADR-0016). Always present so a client can tell "no account"
            apart from "not requested". Never carries password material.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, email, role, status]
              additionalProperties: false
              properties:
                id: { type: integer }
                email: { type: string, format: email }
                role: { type: string }
                status: { enum: [active, suspended] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    Vehicle:
      type: object
      required:
        - id
        - registration_number
        - make
        - model
        - year
        - category
        - seating_capacity
        - color
        - vin
        - status
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        registration_number: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        category: { $ref: '#/components/schemas/VehicleCategory' }
        seating_capacity: { type: integer }
        color: { type: ['string', 'null'] }
        vin: { type: ['string', 'null'] }
        status: { enum: [active, maintenance, inactive] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    Settings:
      description: >
        The full settings map (ADR-0014), every catalogue key resolved:
        stored value where one exists, default where none does. Secret
        keys (none in phase 1) appear as {configured: bool}, never as
        values.
      type: object
      required: [branding, regional, ordering, booking, mail, sms, payments]
      additionalProperties: false
      properties:
        branding: { $ref: '#/components/schemas/BrandingSettings' }
        regional:
          type: object
          required: [currency, timezone, date_format]
          additionalProperties: false
          properties:
            currency: { type: string }
            timezone: { type: string }
            date_format: { type: string }
        ordering:
          type: object
          required: [walk_in_enabled, rate_limit_per_minute]
          additionalProperties: false
          properties:
            walk_in_enabled: { type: boolean }
            rate_limit_per_minute: { type: integer }
        booking:
          type: object
          required: [approval_required, max_advance_days]
          additionalProperties: false
          properties:
            approval_required: { type: boolean }
            max_advance_days: { type: integer }
        mail:
          type: object
          required: [enabled, host, port, username, password, encryption, from_address, from_name]
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            host: { type: ['string', 'null'] }
            port: { type: integer }
            username: { type: ['string', 'null'] }
            password: { $ref: '#/components/schemas/SecretValue' }
            encryption: { enum: [tls, none] }
            from_address: { type: ['string', 'null'] }
            from_name: { type: ['string', 'null'] }
        sms:
          type: object
          required: [provider, sender_id, api_key, api_secret]
          additionalProperties: false
          properties:
            provider: { enum: ['', africastalking, twilio, null] }
            sender_id: { type: ['string', 'null'] }
            api_key: { $ref: '#/components/schemas/SecretValue' }
            api_secret: { $ref: '#/components/schemas/SecretValue' }
        payments:
          type: object
          required: [mtn_momo_api_user, mtn_momo_api_key, airtel_money_client_id, airtel_money_client_secret]
          additionalProperties: false
          properties:
            mtn_momo_api_user: { type: ['string', 'null'] }
            mtn_momo_api_key: { $ref: '#/components/schemas/SecretValue' }
            airtel_money_client_id: { type: ['string', 'null'] }
            airtel_money_client_secret: { $ref: '#/components/schemas/SecretValue' }

    SecretValue:
      description: >
        A write-only credential (ADR-0014 §3). The value never appears in
        any response — only whether one is stored. Write a new value via
        PATCH like any other key; there is no way to read one back.
      type: object
      required: [configured]
      additionalProperties: false
      properties:
        configured: { type: boolean }

    BrandingSettings:
      type: object
      required: [app_name, tagline, meta_description, contact_email, contact_phone, logo_path, favicon_path]
      additionalProperties: false
      properties:
        app_name: { type: string }
        tagline: { type: ['string', 'null'] }
        meta_description: { type: ['string', 'null'] }
        contact_email: { type: string }
        contact_phone: { type: ['string', 'null'] }
        logo_path: { type: ['string', 'null'] }
        favicon_path: { type: ['string', 'null'] }

    PublicSettings:
      description: >
        The unauthenticated branding subset: catalogue keys flagged
        public only, asset paths as absolute URLs.
      type: object
      required: [branding, regional, ordering]
      additionalProperties: false
      properties:
        branding: { $ref: '#/components/schemas/BrandingSettings' }
        regional:
          type: object
          required: [currency]
          additionalProperties: false
          properties:
            currency: { type: string }
        ordering:
          type: object
          required: [walk_in_enabled]
          additionalProperties: false
          properties:
            walk_in_enabled:
              type: boolean
              description: False while the owner has paused online intake — the order form explains instead of failing at submit.

    Customer:
      description: >
        A customer's own account, as shown to them (ADR-0013, ADR-0015).
        `name` is composed from first_name and last_name rather than
        stored, and is returned so clients need not re-implement the join.
        `gender` is null when never asked, which is a different answer
        from "prefer_not_to_say" (ADR-0015 §2).
      type: object
      required: [id, first_name, last_name, name, gender, phone, email, created_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        name: { type: string }
        gender:
          type: string
          nullable: true
          enum: [female, male, other, prefer_not_to_say]
        phone: { type: string }
        email: { type: string }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    CustomerOrderRequest:
      description: >
        An order request as its own customer sees it (ADR-0013 §4).
        Deliberately narrower than OrderRequest: no dispatcher_notes (the
        desk's working notes are the desk's), no handled_by (staff
        assignment is internal), no allowed_transitions (a customer moves
        nothing), and no contact echo.
      type: object
      required:
        - id
        - reference
        - service_type
        - status
        - pickup_location
        - dropoff_location
        - scheduled_for
        - details
        - notes
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        reference: { type: string }
        service_type: { enum: [ride, delivery, self_drive] }
        status: { enum: [new, contacted, converted, closed] }
        pickup_location: { type: ['string', 'null'] }
        dropoff_location: { type: ['string', 'null'] }
        scheduled_for: { $ref: '#/components/schemas/NullableTimestamp' }
        details: { $ref: '#/components/schemas/FreeformMap' }
        notes: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    OrderRequest:
      description: >
        A walk-in request from the public landing page (ADR-0012). The
        dispatcher-queue shape — the public endpoint returns only a
        reference, never this.
      type: object
      required:
        - id
        - reference
        - service_type
        - status
        - allowed_transitions
        - contact_name
        - contact_phone
        - contact_email
        - pickup_location
        - pickup_latitude
        - pickup_longitude
        - dropoff_location
        - dropoff_latitude
        - dropoff_longitude
        - scheduled_for
        - details
        - notes
        - dispatcher_notes
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        reference:
          type: string
          description: KR- plus six characters readable down a phone line.
        service_type: { enum: [ride, delivery, self_drive] }
        status: { enum: [new, contacted, converted, closed] }
        allowed_transitions:
          type: array
          items: { enum: [new, contacted, converted, closed] }
        contact_name: { type: string }
        contact_phone: { type: string }
        contact_email: { type: ['string', 'null'] }
        pickup_location: { type: ['string', 'null'] }
        pickup_latitude:
          description: Where the pickup is, when the caller's geocoder knew (ADR-0020).
          type: ['number', 'null']
        pickup_longitude: { type: ['number', 'null'] }
        dropoff_location: { type: ['string', 'null'] }
        dropoff_latitude: { type: ['number', 'null'] }
        dropoff_longitude: { type: ['number', 'null'] }
        scheduled_for: { $ref: '#/components/schemas/NullableTimestamp' }
        details: { $ref: '#/components/schemas/FreeformMap' }
        notes: { type: ['string', 'null'] }
        dispatcher_notes: { type: ['string', 'null'] }
        handled_by:
          anyOf:
            - { $ref: '#/components/schemas/ValueName' }
            - { enum: [null] }
        customer:
          description: >
            The linked account holder (ADR-0013 §5); null for an anonymous
            walk-in. Id and name only — the customer's contact details on
            this row are already the ones they typed into the form.
          anyOf:
            - { $ref: '#/components/schemas/ValueName' }
            - { enum: [null] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    ValueName:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }

    VehicleAllocation:
      description: A period for which a vehicle is contracted to a client (ADR-0005/0009).
      type: object
      required:
        - id
        - tenant_id
        - vehicle_id
        - starts_on
        - ends_on
        - exclusive
        - in_force
        - notes
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        client: { $ref: '#/components/schemas/ClientRef' }
        vehicle_id: { type: integer }
        vehicle:
          anyOf:
            - { $ref: '#/components/schemas/Vehicle' }
            - { enum: [null] }
        starts_on: { type: string, format: date }
        ends_on:
          type: ['string', 'null']
          description: Null for an open-ended contract. The last day counts as in force.
        exclusive:
          type: boolean
          description: >
            False — the default, and the Bank's case — ranks the vehicle
            first for this client's work while leaving it in the pool. True
            refuses every other client's dispatch with 409, no override.
        in_force: { type: boolean }
        notes: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    CandidateVehicle:
      description: >
        A vehicle plus what this booking's contracts say about it
        (ADR-0009). The vehicle fields are VehicleResource's, restated
        because additionalProperties: false rules out allOf composition —
        the census-style guarantee is worth the duplication.
      type: object
      required:
        - id
        - registration_number
        - make
        - model
        - year
        - category
        - seating_capacity
        - color
        - vin
        - status
        - created_at
        - updated_at
        - allocated
        - dispatchable
        - requires_override_reason
        - note
      additionalProperties: false
      properties:
        id: { type: integer }
        registration_number: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        category: { $ref: '#/components/schemas/VehicleCategory' }
        seating_capacity: { type: integer }
        color: { type: ['string', 'null'] }
        vin: { type: ['string', 'null'] }
        status: { enum: [active, maintenance, inactive] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }
        allocated:
          type: boolean
          description: Ranks first for this client on this date.
        dispatchable:
          type: boolean
          description: False means dispatch will refuse it with 409, whatever is sent.
        requires_override_reason:
          type: boolean
          description: True means assignment without a reason gets a 422 naming allocation_override_reason.
        note:
          type: ['string', 'null']
          description: Short human sentence. Never names the other client.

    Booking:
      type: object
      required:
        - id
        - tenant_id
        - requested_by_user_id
        - passenger_name
        - passenger_phone
        - passenger_count
        - origin
        - destination
        - scheduled_for
        - is_immediate
        - status
        - approved_by_user_id
        - approved_at
        - decision_reason
        - notes
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        client: { $ref: '#/components/schemas/ClientRef' }
        requested_by_user_id: { type: integer }
        requested_by:
          anyOf:
            - { $ref: '#/components/schemas/User' }
            - { enum: [null] }
        passenger_name: { type: string }
        passenger_phone: { type: string }
        passenger_count: { type: ['integer', 'null'] }
        origin: { type: string }
        destination: { type: string }
        scheduled_for: { $ref: '#/components/schemas/NullableTimestamp' }
        is_immediate: { type: boolean }
        status: { $ref: '#/components/schemas/BookingStatus' }
        approved_by_user_id: { type: ['integer', 'null'] }
        approved_by:
          anyOf:
            - { $ref: '#/components/schemas/User' }
            - { enum: [null] }
        approved_at: { $ref: '#/components/schemas/NullableTimestamp' }
        decision_reason: { type: ['string', 'null'] }
        notes: { type: ['string', 'null'] }
        trip:
          anyOf:
            - { $ref: '#/components/schemas/Trip' }
            - { enum: [null] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    Trip:
      type: object
      required:
        - id
        - tenant_id
        - booking_id
        - vehicle_id
        - driver_id
        - origin
        - destination
        - status
        - allowed_transitions
        - odometer_start
        - odometer_start_photo_path
        - odometer_end
        - odometer_end_photo_path
        - odometer_start_photo_url
        - odometer_end_photo_url
        - distance_km
        - gps_distance_km
        - distance_variance_flagged
        - cancellation_charge_applicable
        - started_at
        - completed_at
        - duration_minutes
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        client: { $ref: '#/components/schemas/ClientRef' }
        booking_id:
          type: ['integer', 'null']
          description: Null on an ad-hoc trip raised without a booking.
        vehicle_id: { type: ['integer', 'null'] }
        vehicle:
          anyOf:
            - { $ref: '#/components/schemas/Vehicle' }
            - { enum: [null] }
        driver_id: { type: ['integer', 'null'] }
        driver:
          anyOf:
            - { $ref: '#/components/schemas/Driver' }
            - { enum: [null] }
        origin: { type: string }
        destination: { type: string }
        status: { $ref: '#/components/schemas/TripStatus' }
        allowed_transitions:
          description: What is legal from this state — not what this user may do.
          type: array
          items: { $ref: '#/components/schemas/TripStatus' }
        odometer_start: { type: ['integer', 'null'] }
        odometer_start_photo_path: { type: ['string', 'null'] }
        odometer_end: { type: ['integer', 'null'] }
        odometer_end_photo_path: { type: ['string', 'null'] }
        odometer_start_photo_url: { type: ['string', 'null'] }
        odometer_end_photo_url: { type: ['string', 'null'] }
        distance_km:
          type: ['string', 'null']
          description: Decimal serialised as a string ("12.34") — a billing input, not a float.
        gps_distance_km: { type: ['string', 'null'] }
        distance_variance_flagged: { type: ['boolean', 'null'] }
        cancellation_charge_applicable: { type: ['boolean', 'null'] }
        started_at: { $ref: '#/components/schemas/NullableTimestamp' }
        completed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        duration_minutes: { type: ['integer', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    TripEvent:
      type: object
      required: [id, trip_id, from_status, to_status, user_id, notes, created_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        trip_id: { type: integer }
        from_status: { $ref: '#/components/schemas/NullableTripStatus' }
        to_status: { $ref: '#/components/schemas/TripStatus' }
        user_id: { type: ['integer', 'null'] }
        user:
          anyOf:
            - { $ref: '#/components/schemas/User' }
            - { enum: [null] }
        notes: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    TripLocation:
      type: object
      required: [latitude, longitude, speed_kph, heading_degrees, accuracy_metres, recorded_at]
      additionalProperties: false
      properties:
        latitude: { type: number }
        longitude: { type: number }
        speed_kph: { type: ['number', 'null'] }
        heading_degrees: { type: ['integer', 'null'] }
        accuracy_metres: { type: ['number', 'null'] }
        recorded_at: { $ref: '#/components/schemas/NullableTimestamp' }

    TripTransitionRequest:
      type: object
      required: [to]
      additionalProperties: false
      properties:
        to:
          description: Every status except invoice_generated, which only invoicing may apply.
          enum:
            - assigned
            - rejected
            - accepted
            - driver_en_route
            - driver_arrived
            - no_show
            - passenger_onboard
            - trip_started
            - waiting
            - trip_resumed
            - trip_completed
            - disputed
            - closed
            - cancelled
        notes:
          type: ['string', 'null']
          maxLength: 1000
          description: Required for cancelled, rejected, no_show and disputed.
        odometer_start:
          type: integer
          minimum: 0
          description: Required for trip_started.
        odometer_end:
          type: integer
          minimum: 0
          description: Required for trip_completed.
        odometer_photo:
          description: Dashboard photo (multipart only). Optional — the reading is an acceptance criterion, the photo is not.
        cancellation_charge_applicable: { type: ['boolean', 'null'] }
        vehicle_id:
          type: ['integer', 'null']
          description: Rejected → Assigned reassignment only.
        driver_id:
          type: ['integer', 'null']
          description: Rejected → Assigned reassignment only.

    Invoice:
      type: object
      required:
        - uuid
        - invoice_number
        - trip_id
        - rate_card_version_id
        - currency
        - total_minor
        - credited_minor
        - balance_minor
        - issued_at
        - issued_by_user_id
        - notes
      additionalProperties: false
      properties:
        uuid: { type: string }
        invoice_number: { type: string }
        trip_id: { type: integer }
        rate_card_version_id: { type: integer }
        currency: { type: string }
        total_minor: { type: integer }
        credited_minor: { type: integer }
        balance_minor: { type: integer }
        issued_at: { $ref: '#/components/schemas/NullableTimestamp' }
        issued_by_user_id: { type: ['integer', 'null'] }
        notes: { type: ['string', 'null'] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/InvoiceLine' }
        credit_notes:
          type: array
          items: { $ref: '#/components/schemas/CreditNote' }

    InvoiceLine:
      type: object
      required:
        - id
        - line_number
        - type
        - type_label
        - description
        - quantity
        - unit_amount_minor
        - amount_minor
        - currency
        - inputs
      additionalProperties: false
      properties:
        id: { type: integer }
        line_number: { type: integer }
        type:
          enum: [base_fare, distance, waiting, minimum_charge_adjustment, maximum_charge_adjustment]
        type_label: { type: string }
        description: { type: string }
        quantity:
          type: ['string', 'null']
          description: Decimal serialised as a string.
        unit_amount_minor: { type: integer }
        amount_minor: { type: integer }
        currency: { type: string }
        inputs:
          description: Every value that went into amount_minor — the reproducibility contract (AGENTS.md).
          type: object
          required:
            - rate_card_version_id
            - vehicle_category
            - zone
            - distance_km
            - waiting_minutes
            - multiplier_bp
            - rounding_mode
          additionalProperties: false
          properties:
            rate_card_version_id: { type: integer }
            vehicle_category: { type: ['string', 'null'] }
            zone:
              type: ['string', 'null']
              description: Always null until the geofencing engine exists.
            distance_km: { type: ['string', 'null'] }
            waiting_minutes: { type: ['integer', 'null'] }
            multiplier_bp: { type: ['integer', 'null'] }
            rounding_mode: { enum: [half_up, half_down, up, down] }

    CreditNote:
      type: object
      required:
        - uuid
        - credit_note_number
        - invoice_id
        - currency
        - total_minor
        - reason
        - issued_at
        - issued_by_user_id
      additionalProperties: false
      properties:
        uuid: { type: string }
        credit_note_number: { type: string }
        invoice_id: { type: integer }
        currency: { type: string }
        total_minor:
          type: integer
          description: Positive — the amount taken off the invoice.
        reason: { type: string }
        issued_at: { $ref: '#/components/schemas/NullableTimestamp' }
        issued_by_user_id: { type: ['integer', 'null'] }
        lines:
          type: array
          items:
            type: object
            required: [line_number, description, amount_minor, invoice_line_id]
            additionalProperties: false
            properties:
              line_number: { type: integer }
              description: { type: string }
              amount_minor: { type: integer }
              invoice_line_id:
                type: ['integer', 'null']
                description: Null on a goodwill or settlement credit correcting no single line.

    RateCard:
      type: object
      required: [id, name, description, status, is_default, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ['string', 'null'] }
        status: { enum: [active, archived] }
        is_default: { type: boolean }
        versions:
          type: array
          items: { $ref: '#/components/schemas/RateCardVersion' }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    RateCardVersion:
      type: object
      required:
        - id
        - version
        - effective_from
        - currency
        - rounding_mode
        - rounding_mode_label
        - free_waiting_minutes
        - night_starts_at
        - night_ends_at
        - night_multiplier_bp
        - is_locked
        - locked_at
        - notes
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        version: { type: integer }
        effective_from: { type: string, format: date }
        currency: { type: string }
        rounding_mode: { enum: [half_up, half_down, up, down] }
        rounding_mode_label: { type: string }
        free_waiting_minutes: { type: ['integer', 'null'] }
        night_starts_at: { type: ['string', 'null'] }
        night_ends_at: { type: ['string', 'null'] }
        night_multiplier_bp: { type: ['integer', 'null'] }
        is_locked:
          type: boolean
          description: A locked version has priced a real invoice and can never change.
        locked_at: { $ref: '#/components/schemas/NullableTimestamp' }
        notes: { type: ['string', 'null'] }
        rates:
          type: array
          items:
            type: object
            required:
              - vehicle_category
              - base_fare_minor
              - per_km_minor
              - per_waiting_minute_minor
              - minimum_charge_minor
              - maximum_charge_minor
            additionalProperties: false
            properties:
              vehicle_category: { $ref: '#/components/schemas/VehicleCategory' }
              base_fare_minor: { type: integer }
              per_km_minor: { type: integer }
              per_waiting_minute_minor: { type: integer }
              minimum_charge_minor: { type: integer }
              maximum_charge_minor:
                type: ['integer', 'null']
                description: Null means uncapped, never "capped at zero".
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    RateCardVersionRequest:
      type: object
      required: [effective_from, rates]
      additionalProperties: false
      properties:
        effective_from: { type: string, format: date }
        rounding_mode: { enum: [half_up, half_down, up, down, null] }
        free_waiting_minutes: { type: ['integer', 'null'], minimum: 0, maximum: 1440 }
        night_starts_at:
          type: ['string', 'null']
          description: H:i. Both night times or neither.
        night_ends_at: { type: ['string', 'null'] }
        night_multiplier_bp:
          type: ['integer', 'null']
          minimum: 10000
          maximum: 50000
          description: Basis points; 10000 = 1.0x. A "night rate" below 1.0x is a discount, and discounts are deferred.
        notes: { type: ['string', 'null'], maxLength: 1000 }
        rates:
          type: array
          minItems: 1
          items:
            type: object
            required: [vehicle_category]
            additionalProperties: false
            properties:
              vehicle_category: { $ref: '#/components/schemas/VehicleCategory' }
              base_fare_minor: { type: ['integer', 'null'], minimum: 0 }
              per_km_minor: { type: ['integer', 'null'], minimum: 0 }
              per_waiting_minute_minor: { type: ['integer', 'null'], minimum: 0 }
              minimum_charge_minor: { type: ['integer', 'null'], minimum: 0 }
              maximum_charge_minor: { type: ['integer', 'null'], minimum: 0 }

    Notification:
      type: object
      required: [id, type, type_label, subject, body, url, context, is_read, read_at, created_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        type: { enum: [booking.approved, booking.rejected, report.export.ready] }
        type_label: { type: string }
        subject: { type: string }
        body: { type: string }
        url:
          type: ['string', 'null']
          description: Relative, SPA-local route.
        context: { $ref: '#/components/schemas/FreeformMap' }
        is_read: { type: boolean }
        read_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    ReportExport:
      type: object
      required:
        - id
        - report
        - report_label
        - format
        - format_label
        - status
        - filters
        - row_count
        - row_noun
        - file_size
        - is_downloadable
        - is_terminal
        - error
        - expires_at
        - created_at
        - finished_at
      additionalProperties: false
      properties:
        id: { type: integer }
        report: { enum: [trips, drivers, vehicles, financial] }
        report_label: { type: string }
        format: { enum: [csv, xlsx, pdf] }
        format_label: { type: string }
        status: { enum: [queued, processing, completed, failed] }
        filters: { $ref: '#/components/schemas/FreeformMap' }
        row_count: { type: ['integer', 'null'] }
        row_noun: { type: string }
        file_size: { type: ['integer', 'null'] }
        is_downloadable: { type: boolean }
        is_terminal: { type: boolean }
        error: { type: ['string', 'null'] }
        requested_by:
          type: ['string', 'null']
          description: The requester's name. Present when the relation is loaded.
        expires_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        finished_at: { $ref: '#/components/schemas/NullableTimestamp' }

    TripReportRow:
      description: One row of the trip report — the Bank's six criteria plus identifiers.
      type: object
      required:
        - trip_id
        - booking_id
        - status
        - commenced_at
        - completed_at
        - vehicle_registration
        - vehicle_description
        - driver_name
        - origin
        - destination
        - odometer_start
        - odometer_end
        - distance_km
        - duration_minutes
        - is_complete
      additionalProperties: false
      properties:
        trip_id: { type: integer }
        booking_id: { type: ['integer', 'null'] }
        status: { $ref: '#/components/schemas/TripStatus' }
        commenced_at: { $ref: '#/components/schemas/NullableTimestamp' }
        completed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        vehicle_registration: { type: ['string', 'null'] }
        vehicle_description: { type: ['string', 'null'] }
        driver_name: { type: ['string', 'null'] }
        origin: { type: string }
        destination: { type: string }
        odometer_start: { type: ['integer', 'null'] }
        odometer_end: { type: ['integer', 'null'] }
        distance_km: { type: ['string', 'null'] }
        duration_minutes: { type: ['integer', 'null'] }
        is_complete: { type: boolean }
