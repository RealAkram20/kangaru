# KangaruRide API contract (ADR-0011).
#
# HAND-WRITTEN, and the source of truth: the code is checked against this
# document, never the reverse. A new endpoint's entry here is part of its
# PR (Definition of Done). Every JSON response the backend test suite
# produces is validated against this file, and a route census asserts every
# api/v1 route is documented — see backend/tests/Feature/Ci/.
#
# House rules, enforced by backend/tests/Feature/Ci/OpenApiSpecLintTest.php:
# - Every object schema declares `additionalProperties` — `false` unless it
#   is genuinely a map. Without it a response can grow undeclared fields
#   and still validate, which is the exact failure mode (role_label,
#   TripResource) this contract exists to prevent.
# - Failure responses reuse ErrorEnvelope; its `code` enumerates every
#   ErrorCode case. Clients branch on `code`, never on message text.
# - Binary responses (exports, odometer photos) are declared, not
#   validated.
#
# Dialect notes (proved against the installed validator, see ADR-0011):
# - Nullable is `type: [x, 'null']` (OpenAPI 3.1), not `nullable: true`.
# - `[]`-vs-`{}` unions (PHP serialises an empty map as `[]`) use `anyOf`,
#   not `oneOf` — an empty value matches both branches, and oneOf would
#   reject exactly-one on it.
# - 204 responses are declared explicitly with no content; undeclared
#   statuses fall through to `default`, which expects a JSON error body.
openapi: 3.1.0
info:
  title: KangaruRide API
  version: 1.0.0
  description: >
    Enterprise transport management platform API (v1). All responses use the
    envelope defined in AGENTS.md API Standards: successes carry
    `{success: true, message, data}` (plus `meta` where documented), and
    failures carry `{success: false, code, message, errors}` with a stable
    machine-readable `code`.

paths:
  # ------------------------------------------------------------------
  # Authentication and MFA (Modules/Administration, ADR-0008 / ADR-0010)
  # ------------------------------------------------------------------
  /api/v1/auth/login:
    post:
      summary: First step of login. Returns a token, or an MFA challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string }
                client:
                  type: string
                  enum: [console, driver]
                  description: >
                    Which app is asking (ADR-0022). Omitted means the staff
                    console, which is how every client that predates this
                    behaves. A `driver` token may reach only the Driver's
                    Application surface; anything else answers 403
                    TOKEN_SCOPE_EXCEEDED. Self-declared, and honest about it:
                    it does not restrict the *person* signing in — they may
                    always ask for a console token — it bounds what a token
                    sitting on a phone can be used for.
      responses:
        '200':
          $ref: '#/components/responses/AuthenticatedResponse'
        '202':
          description: >
            Password accepted, login not finished — the account requires a
            second factor (ADR-0008). No token is issued.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [challenge_id, method]
                    additionalProperties: false
                    properties:
                      challenge_id: { type: string }
                      method: { enum: [totp] }
        '429':
          $ref: '#/components/responses/Throttled'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa/verify:
    post:
      summary: Second step of login — spends a challenge against a TOTP or recovery code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              additionalProperties: false
              properties:
                challenge_id: { type: string }
                code: { type: string, maxLength: 64 }
                client:
                  type: string
                  enum: [console, driver]
                  description: >
                    Which app is asking (ADR-0022). Omitted means the staff
                    console, which is how every client that predates this
                    behaves. A `driver` token may reach only the Driver's
                    Application surface; anything else answers 403
                    TOKEN_SCOPE_EXCEEDED. Self-declared, and honest about it:
                    it does not restrict the *person* signing in — they may
                    always ask for a console token — it bounds what a token
                    sitting on a phone can be used for.
      responses:
        '200':
          $ref: '#/components/responses/AuthenticatedResponse'
        '429':
          $ref: '#/components/responses/Throttled'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/logout:
    post:
      summary: Revokes the current token.
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/me:
    get:
      summary: The authenticated account.
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/password:
    patch:
      summary: Changes your own password and revokes every token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              additionalProperties: false
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/password/forgot:
    post:
      summary: >
        Asks for an emailed reset code (ADR-0028 §2). Unauthenticated,
        throttled 3/min/IP — below even auth's rate, because each hit can
        send an email. Answers an identical 202 whether or not the address
        belongs to anybody; 409 AUTH_METHOD_DISABLED while the owner has
        the method off or SMTP unconfigured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 190 }
      responses:
        '202':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/password/reset:
    post:
      summary: >
        Exchanges the emailed code for a new password (ADR-0028 §2).
        Throttled 5/min/IP; the code is single-use, expires in 15 minutes,
        and five wrong guesses burn it. A wrong code and an unknown email
        fail with the same sentence. Success revokes every token the
        account holds — the caller signs in fresh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password, password_confirmation]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 190 }
                code: { type: string, minLength: 6, maxLength: 6 }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/social:
    post:
      summary: >
        "Continue with Google / Facebook" (ADR-0028 §3). Unauthenticated,
        throttled 5/min/IP. The server verifies the provider proof itself
        against the admin-stored credentials — audience included — and
        resolves who the identity is here.
      description: >
        200 signed_in with a driver-scoped token for a linked identity or a
        provider-verified email match on an account that can drive.
        202 sign_up with the verified name and email for a stranger — no
        principal is created; the app takes the two fields to the
        application form (ADR-0027). 409 MFA_REQUIRED for accounts with a
        second factor (social must not bypass it), 403 NOT_A_DRIVER for
        staff accounts, 409 AUTH_METHOD_DISABLED while the owner has the
        provider off, 401 SOCIAL_TOKEN_INVALID when the proof does not
        verify — which check failed goes to the log, never the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, token, client]
              additionalProperties: false
              properties:
                provider: { enum: [google, facebook] }
                token:
                  type: string
                  maxLength: 8192
                  description: Google ID token, or Facebook access token.
                client: { enum: [driver] }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [status, user, token]
                    additionalProperties: false
                    properties:
                      status: { enum: [signed_in] }
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string }
        '202':
          description: No account — apply. Nothing was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [status, name, email]
                    additionalProperties: false
                    properties:
                      status: { enum: [sign_up] }
                      name: { type: string }
                      email: { type: string, format: email }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa/enrol:
    post:
      summary: Begins TOTP enrolment — a fresh secret and its QR code.
      responses:
        '200':
          description: Secret issued, unconfirmed until the confirm step.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [secret, otpauth_uri, qr_svg]
                    additionalProperties: false
                    properties:
                      secret: { type: string }
                      otpauth_uri: { type: string }
                      qr_svg: { type: string }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa/enrol/confirm:
    post:
      summary: Confirms enrolment against a first code; returns the recovery codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, maxLength: 16 }
      responses:
        '200':
          $ref: '#/components/responses/RecoveryCodesResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa/recovery-codes:
    post:
      summary: Regenerates recovery codes, invalidating the previous set.
      responses:
        '200':
          $ref: '#/components/responses/RecoveryCodesResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa:
    delete:
      summary: >
        Removes your own second factor (ADR-0010). Only for a role that does
        not require one — a privileged role gets 403. Proven with a current
        code, like every other MFA mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, maxLength: 16 }
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Staff administration and roles (Modules/Administration, ADR-0004)
  # ------------------------------------------------------------------
  /api/v1/users:
    get:
      summary: Accounts this actor may administer.
      parameters:
        - { name: status, in: query, schema: { enum: [active, suspended] } }
        - { name: role, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        '200':
          description: Accounts, plus the roles this actor may assign.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta:
                    type: object
                    required: [assignable_roles]
                    additionalProperties: false
                    properties:
                      assignable_roles:
                        type: array
                        items:
                          type: object
                          required: [value, label, description]
                          additionalProperties: false
                          properties:
                            value: { type: string }
                            label: { type: string }
                            description: { type: ['string', 'null'] }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Creates an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role, password]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                role: { type: string }
                password: { type: string, minLength: 12 }
                tenant_id: { type: integer, description: Super Admin only. }
      responses:
        '201':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/users/{user}:
    parameters:
      - { name: user, in: path, required: true, schema: { type: integer } }
    get:
      summary: One account.
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Updates an account. Suspension revokes its tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                role: { type: string }
                status: { enum: [active, suspended] }
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Platform settings (Modules/Administration, ADR-0014)
  # ------------------------------------------------------------------
  /api/v1/public/settings:
    get:
      summary: >
        The branding subset, unauthenticated (ADR-0014 §5). Only
        catalogue keys flagged public; asset paths arrive as absolute
        URLs. Throttled 30/min/IP.
      responses:
        '200':
          description: The public branding subset.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [settings]
                    additionalProperties: false
                    properties:
                      settings: { $ref: '#/components/schemas/PublicSettings' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/public/legal:
    get:
      summary: >
        The Terms and Privacy notices, unauthenticated (ADR-0014, `legal`
        group). Read by the Driver App's sign-up form, which asks for
        consent to both before an account exists — so it cannot sit behind
        one. Kept off /public/settings because these are long and rarely
        wanted, and that endpoint is fetched on every page load.
        Editable by Super Admin through PATCH /settings/legal.
        Throttled 30/min/IP.
      responses:
        '200':
          description: Both documents, as plain text.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [terms, privacy]
                    additionalProperties: false
                    properties:
                      terms:
                        type: string
                        description: >
                          Plain text, newline-separated. Empty only if an
                          administrator has deliberately cleared it — the
                          catalogue ships a short-form notice as its default.
                      privacy: { type: string }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings:
    get:
      summary: >
        Every settings group, resolved against catalogue defaults
        (ADR-0014). Requires settings.manage — the read shows
        operational levers, so it is gated like the write.
      responses:
        '200':
          $ref: '#/components/responses/SettingsResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings/{group}:
    patch:
      summary: >
        Saves one group. Only submitted keys are validated and written;
        unknown keys are refused rather than skipped. Every write is
        audited.
      parameters:
        - { name: group, in: path, required: true, schema: { enum: [branding, regional, ordering, booking, mail, sms, payments] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any subset of the group's keys.
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SettingsResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings/mail/test:
    post:
      summary: >
        Sends a test email through the stored SMTP settings (ADR-0014
        phase 3). Fails 422 until mail is enabled with a host and from
        address; a transport refusal answers 502 MAIL_DELIVERY_FAILED
        carrying the server's own words. Throttled 5/min.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                to:
                  type: ['string', 'null']
                  format: email
                  description: Defaults to the branding contact email.
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings/assets/{asset}:
    post:
      summary: >
        Logo or favicon upload (ADR-0014 §6). Multipart; the stored path
        is written through the same audited path as any other setting.
      parameters:
        - { name: asset, in: path, required: true, schema: { enum: [logo, favicon] } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: png/jpg/svg/webp up to 2MB for the logo; png/ico/svg up to 512KB for the favicon.
      responses:
        '200':
          $ref: '#/components/responses/SettingsResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/roles:
    get:
      summary: The role catalogue (ADR-0004).
      responses:
        '200':
          description: Roles, the permission catalogue, and what this actor may grant.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
                  meta:
                    type: object
                    required: [catalogue, grantable, can_manage]
                    additionalProperties: false
                    properties:
                      catalogue:
                        description: Permission catalogue grouped for display, keyed by group name.
                        type: object
                        additionalProperties:
                          type: array
                          items: { $ref: '#/components/schemas/ValueLabel' }
                      grantable:
                        type: array
                        items: { type: string }
                      can_manage: { type: boolean }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Creates a custom role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 120 }
                slug: { type: string, maxLength: 120, pattern: '^[a-z][a-z0-9_]*$' }
                description: { type: ['string', 'null'], maxLength: 255 }
                permissions:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '201':
          $ref: '#/components/responses/RoleResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/roles/{role}:
    parameters:
      - { name: role, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Updates a role's name, description or permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: ['string', 'null'], maxLength: 255 }
                permissions:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/RoleResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Deletes a role nobody holds. Refused with ROLE_IN_USE otherwise.
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/audit-logs:
    get:
      summary: The audit trail this reader may see (platform-wide or one tenant's).
      parameters:
        - { name: auditable_type, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { enum: [created, updated, deleted] } }
        - { name: user_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Audit entries, newest first, with the filter vocabulary.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  meta:
                    type: object
                    required: [cursor, filters, scope]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
                      filters:
                        type: object
                        required: [auditable_types, actions, actors]
                        additionalProperties: false
                        properties:
                          auditable_types:
                            type: array
                            items: { type: string }
                          actions:
                            type: array
                            items: { type: string }
                          actors:
                            type: array
                            items: { $ref: '#/components/schemas/ValueLabelInt' }
                      scope: { $ref: '#/components/schemas/Scope' }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Bookings and dispatch (Modules/Bookings, Modules/Dispatch)
  # ------------------------------------------------------------------
  /api/v1/bookings:
    get:
      summary: The booking queue — one client's, or every client's for platform staff.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/BookingStatus' } }
        - { name: dispatchable, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: tenant_id, in: query, schema: { type: integer }, description: Platform staff only. }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Bookings, soonest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Booking' }
                  meta: { $ref: '#/components/schemas/CrossClientListMeta' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Raises a booking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passenger_name, passenger_phone, origin, destination]
              additionalProperties: false
              properties:
                passenger_name: { type: string, maxLength: 255 }
                passenger_phone: { type: string, maxLength: 32 }
                passenger_count: { type: ['integer', 'null'], minimum: 1, maximum: 60 }
                origin: { type: string, maxLength: 255 }
                destination: { type: string, maxLength: 255 }
                scheduled_for:
                  type: ['string', 'null']
                  description: Omit or null for an immediate booking. Must be in the future.
                notes: { type: ['string', 'null'], maxLength: 1000 }
      responses:
        '201':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}:
    parameters:
      - { name: booking, in: path, required: true, schema: { type: integer } }
    get:
      summary: One booking, with its trip when dispatched.
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/approval:
    post:
      summary: Approves a pending booking.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/rejection:
    post:
      summary: Rejects a booking, with a reason.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      requestBody:
        $ref: '#/components/requestBodies/DecisionReason'
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/cancellation:
    post:
      summary: Cancels a booking, with a reason.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      requestBody:
        $ref: '#/components/requestBodies/DecisionReason'
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/candidate-vehicles:
    get:
      summary: >
        Every vehicle plus what this booking's contracts say about it
        (ADR-0009) — allocated vehicles rank first, exclusive ones
        elsewhere are marked undispatchable, and requires_override_reason
        tells a form to collect a reason before POSTing the assignment.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Candidate vehicles, allocated first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CandidateVehicle' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/candidate-drivers:
    get:
      summary: >
        Every active driver plus whether they can take this booking
        (ADR-0017) — available first, and the rest listed with a short note
        rather than dropped, because a dispatcher who knows the roster will
        ask where somebody went.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Candidate drivers, available first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CandidateDriver' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/recommendation:
    parameters:
      - { name: booking, in: path, required: true, schema: { type: integer } }
    get:
      summary: What the matcher would choose, ranked, with its reasons (ADR-0020).
      description: >
        Always available, flag or no flag — reading a suggestion can do no
        harm, and it is how an operator builds confidence in the matcher
        before it acts alone. Anything the assignment endpoint would refuse
        is dropped rather than ranked low. Empty when nothing is free.
      responses:
        '200':
          description: Suggestions, best first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DispatchSuggestion' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/auto-assignment:
    parameters:
      - { name: booking, in: path, required: true, schema: { type: integer } }
    post:
      summary: Commits the top suggestion (ADR-0020).
      description: >
        Behind the `dispatch.automatic_enabled` flag, off by default —
        AGENTS.md requires dispatch algorithm changes to ship behind one.
        Commits through the same locked path a human dispatcher uses, so the
        pessimistic locks, allocation rules and availability refusals all
        apply. 409 AUTOMATIC_DISPATCH_DISABLED when the flag is off,
        409 NO_DISPATCH_CANDIDATE when nothing is free.
      responses:
        '201':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/assignment:
    post:
      summary: >
        Assigns a vehicle and driver to a booking, producing its trip.
        Every failure is a 409 with a code the client branches on —
        VEHICLE_UNAVAILABLE, DRIVER_UNAVAILABLE or INVALID_BOOKING_TRANSITION.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, driver_id]
              additionalProperties: false
              properties:
                vehicle_id: { type: integer }
                driver_id: { type: integer }
                allocation_override_reason:
                  type: ['string', 'null']
                  maxLength: 500
                  description: >
                    Required (422) when the vehicle bypasses another client's
                    non-exclusive allocation — recorded on the trip and
                    audited (ADR-0009).
      responses:
        '201':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Walk-in order requests (Modules/Bookings, ADR-0012)
  # ------------------------------------------------------------------
  /api/v1/public/order-requests:
    post:
      summary: >
        The public landing page's request form — the platform's one
        unauthenticated write (ADR-0012). Throttled 3/min/IP. Returns only
        a human-readable reference; no id, no echo of the stored row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_type, contact_name, contact_phone]
              additionalProperties: false
              properties:
                service_type: { enum: [ride, delivery, self_drive] }
                contact_name: { type: string, maxLength: 120 }
                contact_phone:
                  type: string
                  minLength: 9
                  maxLength: 32
                  description: Loose on purpose — 07…, +2567… and 2567… all arrive; the dispatcher dials it either way.
                contact_email: { type: ['string', 'null'], format: email }
                pickup_location:
                  type: ['string', 'null']
                  maxLength: 255
                  description: Required for ride and delivery.
                dropoff_location:
                  type: ['string', 'null']
                  maxLength: 255
                  description: Required for ride and delivery.
                scheduled_for: { type: ['string', 'null'], description: Must be in the future. }
                notes: { type: ['string', 'null'], maxLength: 1000 }
                details:
                  description: Service-specific fields; see the per-service required rules in StorePublicOrderRequest.
                  type: ['object', 'null']
                  additionalProperties: false
                  properties:
                    passengers: { type: ['integer', 'null'], minimum: 1, maximum: 14 }
                    vehicle_class: { enum: [economy, standard, xl, boda, electric_boda, null] }
                    item_type: { enum: [documents, food, parcel, electronics, furniture, appliances, other, null] }
                    package_size: { enum: [small, medium, large, heavy, null] }
                    payer: { enum: [sender, receiver, null], description: Delivery only — which end settles the bill. }
                    payment_method: { enum: [cash, mobile_money, card, null], description: Delivery only. }
                    sender_name: { type: ['string', 'null'], maxLength: 120, description: Delivery only — absent when the account holder is the sender. }
                    sender_phone: { type: ['string', 'null'], maxLength: 32 }
                    recipient_name: { type: ['string', 'null'], maxLength: 120 }
                    recipient_phone: { type: ['string', 'null'], maxLength: 32 }
                    confirm_with_pin: { type: ['boolean', 'null'], description: Delivery only — handover confirmed with a four-digit code. }
                    vehicle_category: { enum: [sedan, suv, van, pickup, null] }
                    start_date: { type: ['string', 'null'], format: date, description: Required for self_drive. }
                    end_date: { type: ['string', 'null'], format: date, description: Required for self_drive. }
                    kyc_documents: { type: ['string', 'null'], maxLength: 255, description: 'Self drive only — comma-separated ids of the identity documents the renter has to hand (national_id, selfie, drivers_license, …). The files are not uploaded; the desk checks originals at collection.' }
                website:
                  type: string
                  description: Anti-spam field. Must be left empty.
      responses:
        '201':
          description: Received. A dispatcher calls back to confirm.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [reference]
                    additionalProperties: false
                    properties:
                      reference: { type: string }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Customer accounts (Modules/Customers, ADR-0013)
  #
  # The second principal's surface. Everything under /customer answers
  # to the `customer` guard, never `auth:sanctum` — a staff token here
  # is a 401, and a customer token anywhere else is a 401 (ADR-0013 §2).
  # ------------------------------------------------------------------
  /api/v1/customer/auth/register:
    post:
      summary: >
        Creates a customer account and returns its token (ADR-0013 §3).
        Unauthenticated write, throttled 5/min/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, phone, email, password]
              additionalProperties: false
              properties:
                first_name: { type: string, maxLength: 60 }
                last_name: { type: string, maxLength: 60 }
                gender:
                  type: string
                  nullable: true
                  enum: [female, male, other, prefer_not_to_say]
                  description: >
                    Optional (ADR-0015 §2). Held to support a same-gender
                    captain preference; Uganda's Data Protection and
                    Privacy Act, 2019 wants a stated purpose for it, which
                    is a reason to offer the question rather than compel it.
                phone:
                  type: string
                  minLength: 9
                  maxLength: 32
                  description: A contact field the dispatcher dials — never a verification channel (no SMS).
                email: { type: string, format: email, maxLength: 190 }
                password: { type: string, minLength: 8, maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/CustomerAuthenticatedResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/auth/login:
    post:
      summary: >
        Customer login (ADR-0013 §3). One 401 message for wrong password
        and unknown email alike; a Google-only account's absent password
        reads the same way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/CustomerAuthenticatedResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/auth/logout:
    post:
      summary: Revokes the current customer token.
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/auth/me:
    get:
      summary: The signed-in customer's own account.
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Customer' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/order-requests:
    get:
      summary: >
        The signed-in customer's own order requests, newest first
        (ADR-0013 §4) — the status checker ADR-0012 deferred, scoped by
        the token so no reference or id is enumerable.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The customer's order requests, page-paginated.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [order_requests]
                    additionalProperties: false
                    properties:
                      order_requests:
                        type: array
                        items: { $ref: '#/components/schemas/CustomerOrderRequest' }
                  meta:
                    type: object
                    required: [page, per_page, total]
                    additionalProperties: false
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/order-requests/{orderRequest}:
    get:
      summary: >
        One of the customer's own order requests. An id outside their own
        rows answers 404, not 403 — that a row exists is itself
        information.
      parameters:
        - { name: orderRequest, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The order request.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [order_request]
                    additionalProperties: false
                    properties:
                      order_request: { $ref: '#/components/schemas/CustomerOrderRequest' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/trips/{trip}/rating:
    post:
      summary: >
        The customer's verdict on a finished ride (ADR-0030 §1). One to five
        stars, optional comment, written once and never editable.
      description: >
        Three conditions, all necessary: the trip's `customer_id` is the
        caller, the trip is `trip_completed`, and no rating exists for it
        yet. Rating before the end rates a journey that has not happened, and
        rating a cancelled trip punishes a driver for a decision that may
        have been the passenger's.


        **Immutable** (§2). An editable rating is a lever over a driver, and
        a mistaken one is corrected by an administrator with an audit trail
        rather than by the passenger. There is deliberately no staff route to
        write one: an office that can score its own drivers has a rating that
        measures the office.


        A trip belonging to another customer answers 404, not 403 — that a
        row exists is itself information.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              additionalProperties: false
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: ['string', 'null'], maxLength: 500 }
      responses:
        '201':
          description: The rating, as recorded.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [stars]
                    additionalProperties: false
                    properties:
                      stars: { type: integer, minimum: 1, maximum: 5 }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/order-requests:
    get:
      summary: The dispatch desk's walk-in queue, oldest first (ADR-0012).
      parameters:
        - { name: status, in: query, schema: { enum: [new, contacted, converted, closed] } }
        - { name: service_type, in: query, schema: { enum: [ride, delivery, self_drive] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Order requests, page-paginated.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [order_requests]
                    additionalProperties: false
                    properties:
                      order_requests:
                        type: array
                        items: { $ref: '#/components/schemas/OrderRequest' }
                  meta:
                    type: object
                    required: [page, per_page, total]
                    additionalProperties: false
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/order-requests/{orderRequest}:
    parameters:
      - { name: orderRequest, in: path, required: true, schema: { type: integer } }
    get:
      summary: One order request.
      responses:
        '200':
          $ref: '#/components/responses/OrderRequestResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: >
        Moves a request through its queue lifecycle. Illegal moves are 409
        INVALID_ORDER_REQUEST_TRANSITION.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { enum: [new, contacted, converted, closed] }
                dispatcher_notes: { type: ['string', 'null'], maxLength: 2000 }
      responses:
        '200':
          $ref: '#/components/responses/OrderRequestResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Companies (Modules/Clients)
  # ------------------------------------------------------------------
  /api/v1/companies:
    get:
      summary: Corporate client companies this actor may see.
      responses:
        '200':
          description: Companies.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Company' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Creates a company under a tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, legal_name, billing_email, city, country]
              additionalProperties: false
              properties:
                tenant_id: { type: integer }
                legal_name: { type: string, maxLength: 255 }
                trading_name: { type: ['string', 'null'], maxLength: 255 }
                registration_number: { type: ['string', 'null'], maxLength: 255 }
                industry: { type: ['string', 'null'], maxLength: 255 }
                billing_email: { type: string, format: email }
                phone: { type: ['string', 'null'], maxLength: 50 }
                address_line1: { type: ['string', 'null'], maxLength: 255 }
                address_line2: { type: ['string', 'null'], maxLength: 255 }
                city: { type: string, maxLength: 255 }
                country: { type: string, maxLength: 255 }
                credit_limit_minor: { type: ['integer', 'null'], minimum: 0 }
      responses:
        '201':
          $ref: '#/components/responses/CompanyResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/companies/{company}:
    parameters:
      - { name: company, in: path, required: true, schema: { type: integer } }
    get:
      summary: One company.
      responses:
        '200':
          $ref: '#/components/responses/CompanyResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Updates a company.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                legal_name: { type: string, maxLength: 255 }
                trading_name: { type: ['string', 'null'], maxLength: 255 }
                registration_number: { type: ['string', 'null'], maxLength: 255 }
                industry: { type: ['string', 'null'], maxLength: 255 }
                billing_email: { type: string, format: email }
                phone: { type: ['string', 'null'], maxLength: 50 }
                address_line1: { type: ['string', 'null'], maxLength: 255 }
                address_line2: { type: ['string', 'null'], maxLength: 255 }
                city: { type: string, maxLength: 255 }
                country: { type: string, maxLength: 255 }
                credit_limit_minor: { type: integer, minimum: 0 }
                status: { enum: [active, suspended] }
      responses:
        '200':
          $ref: '#/components/responses/CompanyResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Deletes a company.
      responses:
        '204':
          description: Deleted. No content.
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Drivers (Modules/Drivers) — the platform's, not a tenant's (ADR-0005)
  # ------------------------------------------------------------------
  /api/v1/drivers:
    get:
      summary: The platform's drivers.
      responses:
        '200':
          description: Drivers.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Driver' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Registers a driver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, license_number, license_expiry]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                phone: { type: string, maxLength: 50 }
                email: { type: ['string', 'null'], format: email }
                license_number: { type: string, maxLength: 100 }
                license_expiry: { type: string, format: date }
                status: { enum: [active, suspended, inactive] }
      responses:
        '201':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/drivers/{driver}:
    parameters:
      - { name: driver, in: path, required: true, schema: { type: integer } }
    get:
      summary: One driver.
      responses:
        '200':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Updates a driver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                phone: { type: string, maxLength: 50 }
                email: { type: ['string', 'null'], format: email }
                license_number: { type: string, maxLength: 100 }
                license_expiry: { type: string, format: date }
                status: { enum: [active, suspended, inactive] }
      responses:
        '200':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Removes a driver.
      responses:
        '204':
          description: Deleted. No content.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/drivers/{driver}/account:
    parameters:
      - { name: driver, in: path, required: true, schema: { type: integer } }
    post:
      summary: Gives a driver the account they sign in with (ADR-0016).
      description: >
        Either mints a new account (email + password) or adopts an existing
        unlinked one (user_id); the two shapes are mutually exclusive. Needs
        drivers.manage AND staff.manage, and the role being granted is checked
        against the caller's own permissions (ADR-0004 escalation rule).
        409 DRIVER_ACCOUNT_CONFLICT if either the profile or the account is
        already linked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: New account
                  required: [email, password]
                  additionalProperties: false
                  properties:
                    email: { type: string, format: email, maxLength: 255 }
                    password: { type: string, minLength: 12 }
                    role: { type: string, description: 'Role slug. Defaults to driver.' }
                    name: { type: string, maxLength: 255, description: "Defaults to the driver profile's name." }
                - type: object
                  title: Existing account
                  required: [user_id]
                  additionalProperties: false
                  properties:
                    user_id: { type: integer }
      responses:
        '201':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Takes the driver's sign-in away and closes their sessions.
      description: >
        Idempotent — a driver with no account is already the requested state.
        Revokes every token the account holds; the account itself survives.
      responses:
        '200':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Driver applications (Modules/Drivers, ADR-0027)
  # ------------------------------------------------------------------
  /api/v1/driver-applications:
    post:
      summary: >
        A rider applying to drive (ADR-0027 §5). Unauthenticated write,
        throttled 5/min/IP — the Driver App's sign-up form posts here.
      description: >
        Writes an application and nothing else: no account, no driver
        profile, no credential that can sign in. Deliberately answers
        identically whether or not the email is already known — a duplicate
        is refused at approval, in front of a human, not at submission in
        front of a script. 202 with no body on success; an id would be a
        handle for guessing at other people's applications, and there is no
        status checker to use it on (§6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, email, password, password_confirmation, terms_accepted]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                phone:
                  type: string
                  minLength: 9
                  maxLength: 32
                  description: >
                    The number the office calls with the outcome — the only
                    notification channel until ADR-0014 phase 3 lands SMTP.
                email: { type: string, format: email, maxLength: 190 }
                password:
                  type: string
                  minLength: 12
                  description: >
                    The applicant's own choice, hashed at submission and
                    carried to the account at approval — never re-typed,
                    never emailed, never known to the approver (§3).
                password_confirmation: { type: string }
                terms_accepted:
                  description: >
                    Consent to the two /public/legal notices. Must be
                    affirmatively true; the accepted-at time is stamped
                    server-side (DPPA 2019 wants consent recorded, and a
                    client-supplied timestamp records nothing).
                  enum: [true, 'true', 1, '1', 'yes', 'on']
      responses:
        '202':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: The applications queue, oldest first (ADR-0027). drivers.view.
      parameters:
        - { name: status, in: query, schema: { enum: [pending, approved, rejected] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Driver applications, page-paginated.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [driver_applications]
                    additionalProperties: false
                    properties:
                      driver_applications:
                        type: array
                        items: { $ref: '#/components/schemas/DriverApplication' }
                  meta:
                    type: object
                    required: [page, per_page, total]
                    additionalProperties: false
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/driver-applications/{driverApplication}:
    parameters:
      - { name: driverApplication, in: path, required: true, schema: { type: integer } }
    get:
      summary: One application (ADR-0027). drivers.view.
      responses:
        '200':
          $ref: '#/components/responses/DriverApplicationResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/driver-applications/{driverApplication}/approve:
    parameters:
      - { name: driverApplication, in: path, required: true, schema: { type: integer } }
    post:
      summary: >
        Approves an application (ADR-0027 §4): creates the driver, mints the
        account with the applicant's own password, links them — one
        transaction. Needs drivers.manage AND staff.manage, and the role
        granted is checked against the caller's own (ADR-0004).
      description: >
        The reviewer supplies what the applicant could not be trusted to:
        the licence they verified in person, and optionally the vehicle and
        role. 409 DRIVER_APPLICATION_CLOSED if somebody decided it already;
        409 DRIVER_ACCOUNT_CONFLICT if the email turned out to be an
        account after all — the duplicate §5 deliberately let through,
        surfacing in front of a human.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_number, license_expiry]
              additionalProperties: false
              properties:
                license_number: { type: string, maxLength: 64 }
                license_expiry: { type: string, format: date, description: Must be in the future. }
                vehicle_id: { type: [integer, 'null'] }
                role: { type: string, description: 'Role slug. Defaults to driver.' }
      responses:
        '201':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/driver-applications/{driverApplication}/reject:
    parameters:
      - { name: driverApplication, in: path, required: true, schema: { type: integer } }
    post:
      summary: >
        Rejects an application, with a reason for the office (ADR-0027 §4).
        Same permission as approving — turning applicants away is not a
        lesser act. 409 DRIVER_APPLICATION_CLOSED if already decided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 5
                  maxLength: 500
                  description: >
                    For the record, not the applicant — nothing sends it to
                    them (§6 gives them no way to read it).
      responses:
        '200':
          $ref: '#/components/responses/DriverApplicationResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Availability (Modules/Fleet) — who and what is off the road (ADR-0017)
  # ------------------------------------------------------------------
  /api/v1/availability-blocks:
    get:
      summary: Periods drivers and vehicles are unavailable.
      description: >
        Filters are whitelisted; an unknown one answers 422 rather than being
        ignored. `from` and `to` must be given together — a window with one
        end is not a window.
      parameters:
        - { name: resource_type, in: query, schema: { enum: [driver, vehicle] } }
        - { name: resource_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { enum: [requested, approved, declined] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Blocks.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AvailabilityBlock' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Takes a driver or vehicle off the road for a period.
      description: >
        Needs drivers.manage for a driver and vehicles.manage for a vehicle —
        the permission follows the resource rather than being one of its own.
        `ends_at` null is open-ended. Recorded as `approved`; the Driver's
        Application records `requested` instead and waits for an answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, resource_id, kind, starts_at]
              additionalProperties: false
              properties:
                resource_type: { enum: [driver, vehicle] }
                resource_id: { type: integer }
                kind: { enum: [leave, sick, rest, training, maintenance, inspection, repair, other] }
                starts_at: { type: string, format: date-time }
                ends_at: { type: ['string', 'null'], format: date-time }
                reason: { type: ['string', 'null'], maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/AvailabilityBlockResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/availability-blocks/{availabilityBlock}:
    parameters:
      - { name: availabilityBlock, in: path, required: true, schema: { type: integer } }
    delete:
      summary: Ends the block, putting the resource back on the road.
      responses:
        '204':
          description: Removed. No content.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/availability-blocks/{availabilityBlock}/answer:
    parameters:
      - { name: availabilityBlock, in: path, required: true, schema: { type: integer } }
    post:
      summary: Approves or declines a request for time off (ADR-0017 section 6).
      description: >
        The far end of the Driver's Application. Only `approved` withholds the
        driver from dispatch. Answering twice is 409
        AVAILABILITY_ALREADY_ANSWERED; answering your own request is 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { enum: [approved, declined] }
                note: { type: ['string', 'null'], maxLength: 255 }
      responses:
        '200':
          $ref: '#/components/responses/AvailabilityBlockResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Customer register (Modules/Customers) — staff side, ADR-0018
  # ------------------------------------------------------------------
  /api/v1/customers:
    get:
      summary: The customer register — the platform's own retail account holders.
      description: >
        Needs customers.view (Dispatcher, Operations Manager, Super Admin).
        Deliberately closed to a corporate client's administrators: these are
        Shanitah's customers, not theirs. `q` searches name, email and phone,
        with punctuation stripped from both sides of the phone comparison.
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: status, in: query, schema: { enum: [active, suspended] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Customers, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerProfile' }
                  meta:
                    type: object
                    required: [cursor, tally]
                    additionalProperties: false
                    properties:
                      cursor:
                        type: object
                        required: [next]
                        additionalProperties: false
                        properties:
                          next: { type: ['string', 'null'] }
                      tally:
                        type: object
                        required: [total, active, suspended]
                        additionalProperties: false
                        properties:
                          total: { type: integer }
                          active: { type: integer }
                          suspended: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customers/{customer}:
    parameters:
      - { name: customer, in: path, required: true, schema: { type: integer } }
    get:
      summary: One customer, as staff see them.
      responses:
        '200':
          $ref: '#/components/responses/CustomerProfileResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customers/{customer}/activity:
    parameters:
      - { name: customer, in: path, required: true, schema: { type: integer } }
    get:
      summary: What this customer has asked for (most recent 50).
      responses:
        '200':
          description: Their order requests, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrderRequest' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customers/{customer}/suspension:
    parameters:
      - { name: customer, in: path, required: true, schema: { type: integer } }
    post:
      summary: Suspends the account and closes every session it holds.
      description: >
        Needs customers.manage. The reason is required — it is the sentence a
        support agent reads back to the customer. Suspension also refuses the
        next sign-in, with the ordinary wrong-credentials answer so the login
        form cannot be used to enumerate accounts in trouble.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 10, maxLength: 255 }
      responses:
        '200':
          $ref: '#/components/responses/CustomerProfileResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Restores the account. Tokens are not restored — they sign in again.
      responses:
        '200':
          $ref: '#/components/responses/CustomerProfileResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Live positions (Modules/Trips) — ADR-0019
  # ------------------------------------------------------------------
  /api/v1/live-positions:
    get:
      summary: Where the fleet is right now.
      description: >
        One entry per vehicle on a trip that has not finished. Visibility is
        resolved through the trips query — a client sees only their own, a
        driver only the trip they are on — so it can never diverge from the
        trips listing. `age_seconds` is measured from the device clock, not
        from storage time, so ingestion lag is visible rather than hidden.
      parameters:
        - name: tenant_id
          in: query
          description: Platform readers only; narrows to one client (ADR-0006).
          schema: { type: integer }
      responses:
        '200':
          description: Vehicles currently moving.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LivePosition' }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # A driver's own time off (Modules/Fleet) — ADR-0017 section 6
  # The Driver's Application asks here; the office answers at
  # /availability-blocks/{id}/answer.
  # ------------------------------------------------------------------
  /api/v1/me/availability-requests:
    get:
      summary: The signed-in driver's own requests for time off, and their answers.
      description: >
        403 NOT_A_DRIVER when the account is not linked to a driver profile —
        the feature exists, this account simply is not a driver.
      responses:
        '200':
          description: Their requests, most recent first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AvailabilityBlock' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Asks the office for time off.
      description: >
        Takes no `resource_id` and no `status`: the request is pinned to the
        caller's own driver profile in the `requested` state by the server, so
        a driver cannot ask on somebody else's behalf or grant themselves
        leave. **Asking does not withhold them from dispatch** — only an
        `approved` answer does. Throttled to 10 a minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, starts_at, reason]
              additionalProperties: false
              properties:
                kind:
                  description: Only reasons a person is away; a driver cannot book maintenance.
                  enum: [leave, sick, rest, training, other]
                starts_at: { type: string, format: date-time }
                ends_at:
                  description: Null is open-ended; the office pins the end when it answers.
                  type: ['string', 'null']
                  format: date-time
                reason: { type: string, minLength: 5, maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/AvailabilityBlockResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/availability-requests/{availabilityBlock}:
    parameters:
      - { name: availabilityBlock, in: path, required: true, schema: { type: integer } }
    delete:
      summary: Withdraws a request the office has not answered yet.
      description: >
        409 AVAILABILITY_ALREADY_ANSWERED once answered — deleting an approval
        would put the driver back on the roster with nobody knowing. Another
        driver's request answers 404, not 403.
      responses:
        '204':
          description: Withdrawn. No content.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/rides/active:
    get:
      summary: The signed-in customer's current ride.
      description: >
        What replaces the simulated ride source in the public order flow
        (ADR-0024 §7). **Takes no identifier at all** — the customer asks for
        their own ride, so there is nothing in the request to tamper with.


        Keying this by the `KR-` reference was rejected: ADR-0012 gave the
        public order endpoint nothing enumerable to return precisely because
        a six-character code is guessable, and a lookup by it — even behind a
        token — would reintroduce that.


        200 with a null `data` when there is no ride in progress, not 404:
        "no ride" is a state the screen renders, and a 404 would make a
        genuinely broken request render as that same state.


        The captain's phone number appears only while the trip is live and
        disappears at a terminal status.
      responses:
        '200':
          description: The ride, or null.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    anyOf:
                      - { $ref: '#/components/schemas/CustomerRide' }
                      - { enum: [null] }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/rides/active/cancellation:
    post:
      summary: The passenger calls their current ride off.
      description: >
        ADR-0024 §7. No identifier, for the same reason the read above takes
        none: the ride is whichever one is active for this token.


        One button, two acts. Before a captain is assigned there is no trip —
        the order is closed and any offer still out is superseded, so a driver
        cannot accept a ride that has just been called off. After one is
        assigned the trip is cancelled through `TripStateMachine`, releasing
        the driver and vehicle back into the pool.


        **409 once the journey has started.** `TripStatus` has no edge from
        `trip_started` to `cancelled`: a journey under way ends by being
        finished, and the opening odometer is evidence that cannot be
        un-booked. A passenger who needs out mid-journey speaks to their
        Captain.


        Whether anybody is charged is deliberately not decided here.
        ADR-0024 defers walk-in cancellation charges by name, so
        `cancellation_charge_applicable` is left null — the column's own way
        of saying undecided.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  description: >
                    The customer's own words. Free text rather than an enum:
                    the screen's closed list ends in "Something else", which
                    exists precisely to carry a sentence.
                  type: ['string', 'null']
                  maxLength: 500
      responses:
        '200':
          description: The ride was cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { enum: [null] }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Device registration (Modules/Notifications) — ADR-0025 §4
  # ------------------------------------------------------------------
  /api/v1/me/devices:
    post:
      summary: Registers this app install for push notifications.
      description: >
        Idempotent by the token's unique index, so the app may call it on
        every sign-in and every OS token rotation without accumulating rows.


        The token is **globally** unique, not unique per user: a shared depot
        handset signed in as one driver and then another must not be
        reachable as both, or the first driver's job offers — pickup address
        included — land on whoever is holding it now. The newer registration
        takes the row.


        Takes no `user_id`; the account is the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token:
                  description: >
                    Opaque, and deliberately not pattern-matched. ADR-0025 §2
                    keeps FCM and APNs available behind the same channel, and
                    those tokens look nothing like Expo's.
                  type: string
                  maxLength: 255
                provider: { enum: [expo] }
                platform: { type: ['string', 'null'], maxLength: 20 }
                app_version: { type: ['string', 'null'], maxLength: 40 }
      responses:
        '204':
          description: Registered. No content.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/devices/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    delete:
      summary: Unregisters this app install.
      description: >
        Called on sign-out. A shared handset that kept its previous driver's
        token would deliver another person's job offers to whoever holds it.


        204 whether or not a row went: unregistering something already gone is
        the outcome the caller wanted, and a 404 would make sign-out fail on a
        retry. A token belonging to somebody else is simply not found — and
        answers the same, because "that exists but is not yours" is not worth
        confirming.
      responses:
        '204':
          description: Unregistered. No content.
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Job offers (Modules/Dispatch) — ADR-0024 §3
  #
  # The driver's side of automatic dispatch. An offer is NOT a trip: nothing
  # is written to `trips` until a driver accepts, because a trip in
  # `assigned` occupies its vehicle and an unanswered offer must not.
  #
  # This list is the source of truth, not the push notification — ADR-0025 §3
  # makes push best-effort, so everything a push says is readable here.
  # ------------------------------------------------------------------
  /api/v1/me/offers:
    get:
      summary: Jobs currently offered to the signed-in driver.
      description: >
        Live offers only. An offer whose clock ran out while the handset was
        in a dead zone is absent rather than listed — rendering it would give
        the driver a countdown reading a negative number and a button whose
        only outcome is a 409.


        403 NOT_A_DRIVER when the account is not linked to a driver profile.
      responses:
        '200':
          description: Offers in front of this driver, soonest to expire first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DispatchOffer' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/offers/{offer}/acceptance:
    parameters:
      - { name: offer, in: path, required: true, schema: { type: integer } }
    post:
      summary: Takes the job, creating the trip.
      description: >
        Goes through the same pessimistic locks every other assignment path
        takes (`TripAssignmentGuard`), so a driver or vehicle committed
        elsewhere in the seconds the offer was out rolls the whole accept
        back — 409 VEHICLE_UNAVAILABLE or DRIVER_UNAVAILABLE.


        409 OFFER_NO_LONGER_OPEN when the clock ran out, another driver was
        faster, or the desk fulfilled the order by hand. One code for all
        three: from the driver's side they are the same event.


        409 OFFER_HAS_NO_VEHICLE when the driver is on duty without one.
        404 for another driver's offer id — not 403, which would confirm it
        exists.


        Returns the Trip rather than the offer, so the app moves straight to
        a trip screen without a second request.
      responses:
        '201':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/offers/{offer}/decline:
    parameters:
      - { name: offer, in: path, required: true, schema: { type: integer } }
    post:
      summary: Says no, and moves the search to the next driver immediately.
      description: >
        The search advances in this request rather than waiting out the
        clock — that is the whole value of a decline over a timeout.


        200 rather than 204: an empty response over a bad connection is
        indistinguishable from a request that never arrived, and a driver who
        declines is entitled to know it registered. Answering an already
        settled offer is not an error; the intent and the outcome agree.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: ['string', 'null'], maxLength: 255 }
      responses:
        '200':
          description: Declined. The envelope's `data` is null — the message is the payload.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { enum: [null] }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Driver presence (Modules/Fleet) — ADR-0024 §2
  #
  # The input automatic dispatch was missing. `/live-positions` answers
  # "where is this vehicle on this trip" and is written by the GPS pipeline
  # from Trip Started onward, so a driver waiting at a stage for work
  # reported nothing at all. These say "I am available, and I am here".
  # ------------------------------------------------------------------
  /api/v1/me/stats:
    get:
      summary: >
        The signed-in driver's own numbers, for the app's home screen.
        Counted on read from trips and dispatch offers that already exist —
        nothing is stored or estimated.
      description: >
        Rates are measured over a rolling 30-day window and are **null**
        until there is something to divide by: a driver on their first
        shift has no acceptance rate, and 0% would read as a failing grade
        for having done nothing wrong.

        `earnings_today_minor` and `wallet_balance_minor` come from the
        driver's ledger (ADR-0029). Entries are raised only for walk-in
        rides, which are the only trips carrying a fare (ADR-0026 §3) — a
        corporate trip is invoiced to the client — so a driver running only
        corporate work sees a zero balance, which is true.

        `rating` is the mean of their last 50 passenger ratings (ADR-0030),
        withheld until five exist.
      responses:
        '200':
          description: The driver's statistics.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required:
                      - trips_today
                      - earnings_today_minor
                      - wallet_balance_minor
                      - currency
                      - acceptance_rate
                      - completion_rate
                      - rating
                      - rating_count
                      - window_days
                    additionalProperties: false
                    properties:
                      trips_today: { type: integer }
                      earnings_today_minor:
                        type: integer
                        description: >
                          The driver's own share of today's fares, from the
                          ledger (ADR-0029 §5) — NOT the gross fare the
                          passenger paid. Minor units, never a float.
                      wallet_balance_minor:
                        type: integer
                        description: >
                          The whole ledger summed. Negative is legitimate and
                          means the driver is holding the platform's cash
                          until they settle (ADR-0029 §5).
                      currency: { type: string }
                      acceptance_rate:
                        type: ['number', 'null']
                        description: Percentage 0–100, one decimal. Null when no offer has been answerable yet.
                      completion_rate:
                        type: ['number', 'null']
                        description: Percentage 0–100, one decimal. Null when no trip has reached an ending yet.
                      rating:
                        type: ['number', 'null']
                        description: >
                          Mean of the last 50 ratings, one decimal. **Null
                          until five ratings exist** (ADR-0030 §3): one
                          three-star rating is not a 3.0, it is one person's
                          afternoon.
                      rating_count:
                        type: integer
                        description: How many ratings the score rests on — returned even while the score is withheld.
                      window_days: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/earnings:
    get:
      summary: >
        The signed-in driver's earnings over a day, a week or a month —
        the app's earnings screen.
      description: >
        Read from `driver_ledger_entries` (ADR-0029), which holds the
        driver's share **as it was written at completion**. Nothing is
        recomputed from `billing.driver_commission_percent`, so changing that
        rate never restates what a driver already earned (ADR-0029 §3).

        Separate from `/me/stats` rather than a fatter payload on it: stats is
        polled by the home screen, while this is opened deliberately, takes a
        period, and carries a chart series.

        **Boundaries are the driver's local day**, from
        `settings.regional.timezone` (default `Africa/Kampala`) — not UTC. The
        window is half-open `[from, to)`; an inclusive upper bound would drop
        an entry written in the period's final second.

        **`breakdown` always sums to `total_minor`.** Entries whose trip has
        no order request behind it — a walk-in a dispatcher fulfilled by hand
        — are classified `other` rather than dropped, because a breakdown that
        does not add up to the figure above it is the worst defect a money
        screen can carry.

        **There are no tips and no bonuses in this payload because neither
        exists on this platform**, and no online-hours figure because
        `driver_presence` is overwritten on every duty toggle and keeps no
        history. `on_trip_minutes` is the measured neighbour — time driving,
        not time available.
      parameters:
        - in: query
          name: period
          required: false
          description: Defaults to `day`. An unrecognised value is a 422, not a silent fallback.
          schema:
            $ref: '#/components/schemas/EarningsPeriod'
      responses:
        '200':
          description: The driver's earnings for the period.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverEarnings' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/duty:
    get:
      summary: The signed-in driver's own duty state.
      description: >
        Answers a synthesised off-duty record for a driver who has never
        reported, rather than 404 — a client forced to read "nothing" as
        "off duty" will eventually read "request failed" as "off duty" too.
        403 NOT_A_DRIVER when the account is not linked to a driver profile.
      responses:
        '200':
          $ref: '#/components/responses/DriverPresenceResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Goes on or off duty.
      description: >
        PUT rather than POST: there is exactly one duty state per driver to
        replace, and a driver whose request times out and retries must not
        start two shifts. Takes no `driver_id` — the driver is the token.


        Checked against the same availability service that refuses a
        dispatcher (ADR-0017), so a driver on approved leave gets 409
        DRIVER_UNAVAILABLE here rather than discovering it at assignment.
        Going off duty clears the stored position.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on_duty]
              additionalProperties: false
              properties:
                on_duty: { type: boolean }
                vehicle_id:
                  description: >
                    The vehicle they hold the keys to. Null or absent is
                    legitimate — a driver can be signed on before the depot
                    has issued anything, and dispatch ranks them without a
                    vehicle of their own rather than refusing them.
                  type: ['integer', 'null']
      responses:
        '200':
          $ref: '#/components/responses/DriverPresenceResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/presence:
    post:
      summary: Reports where an on-duty driver is.
      description: >
        One point, not a batch. `/trips/{trip}/locations` batches because it
        is billing evidence and none of it may be lost; this is a dispatch
        radius, where only the newest point has any use — a driver coming
        out of a dead zone should send where they are now, not replay where
        they were.


        202, not 201: nothing is created, one row is overwritten in place,
        and the store discards a ping older than the one it holds.


        409 NOT_ON_DUTY when the shift has ended. Refused rather than
        silently dropped, so an app that disagrees with the platform about
        whether a shift is running finds out. Throttled to 30 a minute,
        well above the served `heartbeat_seconds` cadence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, recorded_at]
              additionalProperties: false
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                accuracy_metres:
                  description: What the handset thinks of its own fix. A 2,000 m cell-tower fix and a 5 m GPS fix are very different inputs to a ranking.
                  type: ['number', 'null']
                recorded_at:
                  description: The device's clock, not the server's — staleness is judged against this.
                  type: string
                  format: date-time
                vehicle_id:
                  description: A driver may swap vehicles mid-shift. Absent means unchanged, not none.
                  type: ['integer', 'null']
      responses:
        '202':
          $ref: '#/components/responses/DriverPresenceResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Zones (Modules/Fleet) — the geofencing engine, ADR-0021
  # ------------------------------------------------------------------
  /api/v1/zones:
    get:
      summary: The geofences this caller may see.
      description: >
        A client sees the platform's zones plus their own and never another
        client's; a platform reader sees all. Needs zones.view, seeded on
        every system role because dispatch, billing and ordering all resolve
        points against zones.
      responses:
        '200':
          description: Zones, narrowest priority first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Zone' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Draws a zone.
      description: >
        Needs zones.manage — a boundary decides what a client is charged, so
        drawing one is a commercial act. A `client` zone must name its
        tenant; every other kind must not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneInput' }
      responses:
        '201':
          $ref: '#/components/responses/ZoneResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/zones/resolve:
    get:
      summary: Which zones contain this point.
      description: >
        What a dispatcher asks when a price or a refusal needs explaining.
        `meta.within_service_area` answers "may we take this job at all" and
        is **true when no service area has been drawn** — coverage is opt-in.
        `meta.pricing_zone_id` answers "what does it cost", and is null when
        no priced zone covers the point.
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number } }
        - { name: longitude, in: query, required: true, schema: { type: number } }
      responses:
        '200':
          description: Containing zones, narrowest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Zone' }
                  meta:
                    type: object
                    required: [within_service_area, pricing_zone_id]
                    additionalProperties: false
                    properties:
                      within_service_area: { type: boolean }
                      pricing_zone_id: { type: ['integer', 'null'] }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/zones/{zone}:
    parameters:
      - { name: zone, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Redraws a zone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneInput' }
      responses:
        '200':
          $ref: '#/components/responses/ZoneResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Retires a zone. Soft-deleted, so invoices priced in it keep their reference.
      responses:
        '204':
          description: Retired. No content.
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Vehicles (Modules/Vehicles) — the platform's fleet (ADR-0005)
  # ------------------------------------------------------------------
  /api/v1/vehicles:
    get:
      summary: The platform's fleet.
      responses:
        '200':
          description: Vehicles.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Vehicle' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Registers a vehicle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_number, make, model, year, category, seating_capacity]
              additionalProperties: false
              properties:
                registration_number: { type: string, maxLength: 50 }
                make: { type: string, maxLength: 100 }
                model: { type: string, maxLength: 100 }
                year: { type: integer, minimum: 1980 }
                category: { $ref: '#/components/schemas/VehicleCategory' }
                seating_capacity: { type: integer, minimum: 1, maximum: 100 }
                color: { type: ['string', 'null'], maxLength: 50 }
                vin: { type: ['string', 'null'], maxLength: 50 }
                status: { enum: [active, maintenance, inactive] }
      responses:
        '201':
          $ref: '#/components/responses/VehicleResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/vehicles/{vehicle}:
    parameters:
      - { name: vehicle, in: path, required: true, schema: { type: integer } }
    get:
      summary: One vehicle.
      responses:
        '200':
          $ref: '#/components/responses/VehicleResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Updates a vehicle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                registration_number: { type: string, maxLength: 50 }
                make: { type: string, maxLength: 100 }
                model: { type: string, maxLength: 100 }
                year: { type: integer, minimum: 1980 }
                category: { $ref: '#/components/schemas/VehicleCategory' }
                seating_capacity: { type: integer, minimum: 1, maximum: 100 }
                color: { type: ['string', 'null'], maxLength: 50 }
                vin: { type: ['string', 'null'], maxLength: 50 }
                status: { enum: [active, maintenance, inactive] }
      responses:
        '200':
          $ref: '#/components/responses/VehicleResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Removes a vehicle.
      responses:
        '204':
          description: Deleted. No content.
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Vehicle allocations (Modules/Fleet, ADR-0009)
  # ------------------------------------------------------------------
  /api/v1/allocations:
    get:
      summary: >
        Vehicle allocation contracts — every client's for platform staff,
        their own for a client.
      responses:
        '200':
          description: Allocations, newest contract first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VehicleAllocation' }
                  meta:
                    type: object
                    required: [filters]
                    additionalProperties: false
                    properties:
                      filters: { $ref: '#/components/schemas/ClientsFilter' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: >
        Agrees an allocation. Overlap with an exclusive contract for the
        same vehicle is refused with 409 ALLOCATION_CONFLICT — the check is
        locked, not advisory (ADR-0009 decision 4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, vehicle_id, starts_on]
              additionalProperties: false
              properties:
                tenant_id: { type: integer }
                vehicle_id: { type: integer }
                starts_on: { type: string, format: date }
                ends_on:
                  type: ['string', 'null']
                  format: date
                  description: Null for an open-ended contract. The last day counts as in force.
                exclusive: { type: boolean }
                notes: { type: ['string', 'null'], maxLength: 1000 }
      responses:
        '201':
          $ref: '#/components/responses/VehicleAllocationResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/allocations/{allocation}:
    parameters:
      - { name: allocation, in: path, required: true, schema: { type: integer } }
    get:
      summary: One allocation.
      responses:
        '200':
          $ref: '#/components/responses/VehicleAllocationResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: >
        Ends a contract — a PATCH with the final day, never a DELETE: the
        row is a commercial record and stays visible with the day it
        stopped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ends_on]
              additionalProperties: false
              properties:
                ends_on: { type: string, format: date }
      responses:
        '200':
          $ref: '#/components/responses/VehicleAllocationResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Trips (Modules/Trips)
  # ------------------------------------------------------------------
  /api/v1/trips:
    get:
      summary: Trips — one client's, or every client's for platform staff.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TripStatus' } }
        - { name: vehicle_id, in: query, schema: { type: integer } }
        - { name: driver_id, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: tenant_id, in: query, schema: { type: integer }, description: Platform staff only. }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Trips, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Trip' }
                  meta: { $ref: '#/components/schemas/CrossClientListMeta' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Raises an ad-hoc trip without a booking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, driver_id, origin, destination]
              additionalProperties: false
              properties:
                vehicle_id: { type: integer }
                driver_id: { type: integer }
                origin: { type: string, maxLength: 255 }
                destination: { type: string, maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}:
    parameters:
      - { name: trip, in: path, required: true, schema: { type: integer } }
    get:
      summary: One trip.
      responses:
        '200':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/transitions:
    post:
      summary: >
        Requests a state-machine transition (AGENTS.md Trip State Machine).
        Illegal transitions are refused with 409 INVALID_TRIP_TRANSITION.
        Sent as JSON, or as multipart/form-data when a dashboard photo
        accompanies an odometer reading.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripTransitionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TripTransitionRequest'
      responses:
        '200':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/events:
    get:
      summary: The trip's timeline — append-only, oldest first.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Timeline events.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TripEvent' }
                  meta:
                    type: object
                    required: [cursor]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/locations:
    post:
      summary: Accepts a batch of GPS pings. Queued, not yet written (ADR-0003).
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pings]
              additionalProperties: false
              properties:
                pings:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [latitude, longitude, recorded_at]
                    additionalProperties: false
                    properties:
                      latitude: { type: number, minimum: -90, maximum: 90 }
                      longitude: { type: number, minimum: -180, maximum: 180 }
                      recorded_at: { type: string }
                      speed_kph: { type: ['number', 'null'], minimum: 0, maximum: 400 }
                      heading_degrees: { type: ['integer', 'null'], minimum: 0, maximum: 359 }
                      accuracy_metres: { type: ['number', 'null'], minimum: 0, maximum: 10000 }
      responses:
        '202':
          description: Accepted for asynchronous ingestion.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [accepted]
                    additionalProperties: false
                    properties:
                      accepted: { type: integer }
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: The recorded route, for replay.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: GPS points in recorded order.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TripLocation' }
                  meta:
                    type: object
                    required: [cursor, gps_distance_km]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
                      gps_distance_km: { type: number }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/odometer-photo/{moment}:
    get:
      summary: >
        The dashboard photo behind an odometer reading. Binary — declared,
        not validated (ADR-0011 decision 6).
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
        - { name: moment, in: path, required: true, schema: { enum: [start, end] } }
      responses:
        '200':
          description: The photo, streamed inline.
          content:
            image/*: {}
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Billing (Modules/Billing)
  # ------------------------------------------------------------------
  /api/v1/invoices:
    get:
      summary: Invoices, cursor-paginated.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: trip_id, in: query, schema: { type: integer } }
        - { name: invoice_number, in: query, schema: { type: string, maxLength: 50 } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Invoices.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
                  meta:
                    type: object
                    required: [cursor]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/invoices/{invoice}:
    get:
      summary: One invoice, with lines and credit notes.
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/invoice:
    post:
      summary: >
        Issues the invoice for a completed trip. Idempotent — a replay of
        the same key returns 200 with the original invoice; a fresh issue
        returns 201.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              additionalProperties: false
              properties:
                idempotency_key: { type: string, minLength: 8, maxLength: 128 }
                rate_card_id:
                  type: ['integer', 'null']
                  description: Omit to price with the tenant's default card.
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
        '201':
          $ref: '#/components/responses/InvoiceResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/invoices/{invoice}/credit-notes:
    parameters:
      - { name: invoice, in: path, required: true, schema: { type: integer } }
    get:
      summary: Credit notes issued against an invoice.
      responses:
        '200':
          description: Credit notes, with lines.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CreditNote' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: >
        Issues a credit note — the only way an issued invoice is ever
        corrected (AGENTS.md Money & Billing). Idempotent, like invoice
        generation: replay returns 200, fresh issue 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, reason, lines]
              additionalProperties: false
              properties:
                idempotency_key: { type: string, minLength: 8, maxLength: 128 }
                reason: { type: string, minLength: 3, maxLength: 1000 }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [description, amount_minor]
                    additionalProperties: false
                    properties:
                      description: { type: string, maxLength: 255 }
                      amount_minor: { type: integer, minimum: 1 }
                      invoice_line_id: { type: ['integer', 'null'] }
      responses:
        '200':
          $ref: '#/components/responses/CreditNoteResponse'
        '201':
          $ref: '#/components/responses/CreditNoteResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/rate-cards:
    get:
      summary: Rate cards, page-paginated (admin CRUD).
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Rate cards with versions and rates.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RateCard' }
                  meta:
                    type: object
                    required: [page, per_page, total]
                    additionalProperties: false
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Creates a rate card and its first version in one call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, version]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: ['string', 'null'], maxLength: 1000 }
                is_default: { type: ['boolean', 'null'] }
                version: { $ref: '#/components/schemas/RateCardVersionRequest' }
      responses:
        '201':
          $ref: '#/components/responses/RateCardResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/rate-cards/{rate_card}:
    get:
      summary: One rate card, with versions and rates.
      parameters:
        - { name: rate_card, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/RateCardResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/rate-cards/{rateCard}/versions:
    post:
      summary: >
        Supersedes the card's prices with a new immutable version. The one
        way prices ever change — there is no update and no delete.
      parameters:
        - { name: rateCard, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateCardVersionRequest'
      responses:
        '201':
          description: The new version.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/RateCardVersion' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/rate-cards/{rateCard}/default:
    put:
      summary: >
        Makes this the card that prices trips when none is named. PUT
        because it is idempotent.
      parameters:
        - { name: rateCard, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/RateCardResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Reports (Modules/Reports, ADR-0007)
  # ------------------------------------------------------------------
  /api/v1/reports/trips:
    get:
      summary: >
        The trip report — the Bank's six acceptance criteria, row per trip,
        cursor-paginated.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: vehicle_id, in: query, schema: { type: integer } }
        - { name: driver_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TripStatus' } }
        - { name: tenant_id, in: query, schema: { type: integer }, description: 'Platform staff only; omitted, the report spans all clients.' }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Report rows plus a whole-set summary.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TripReportRow' }
                  meta:
                    type: object
                    required: [cursor, summary, scope, covers, filters]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
                      summary:
                        type: object
                        required: [trips, trips_completed, distance_km, duration_minutes, records_incomplete, completeness_percent]
                        additionalProperties: false
                        properties:
                          trips: { type: integer }
                          trips_completed: { type: integer }
                          distance_km: { type: number }
                          duration_minutes: { type: integer }
                          records_incomplete: { type: integer }
                          completeness_percent: { type: ['number', 'null'] }
                      scope: { $ref: '#/components/schemas/Scope' }
                      covers: { type: string }
                      filters: { $ref: '#/components/schemas/ClientsFilter' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/drivers:
    get:
      summary: Driver activity aggregate — one row per driver (ADR-0007 rule 3).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          $ref: '#/components/responses/FleetReportResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/vehicles:
    get:
      summary: Vehicle activity aggregate — one row per vehicle (ADR-0007 rule 3).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          $ref: '#/components/responses/FleetReportResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/financial:
    get:
      summary: >
        The financial report, grouped by period. For platform staff
        tenant_id is required — there is no cross-client revenue total
        (ADR-0007 rule 2).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: group_by, in: query, schema: { enum: [day, week, month, year] } }
        - { name: tenant_id, in: query, schema: { type: integer }, description: 'Required for platform staff, refused for client users.' }
      responses:
        '200':
          description: Period rows plus totals.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ReportRows' }
                  meta:
                    type: object
                    required: [report, title, headers, period, summary, scope, covers, filters]
                    additionalProperties: false
                    properties:
                      report: { enum: [financial] }
                      title: { type: string }
                      headers:
                        type: array
                        items: { type: string }
                      period: { type: string }
                      summary:
                        type: object
                        required: [periods, invoices, invoiced_minor, credit_notes, credited_minor, outstanding_minor, currency, payments_recorded]
                        additionalProperties: false
                        properties:
                          periods: { type: integer }
                          invoices: { type: integer }
                          invoiced_minor: { type: integer }
                          credit_notes: { type: integer }
                          credited_minor: { type: integer }
                          outstanding_minor: { type: integer }
                          currency: { type: string }
                          payments_recorded: { type: boolean }
                      scope: { $ref: '#/components/schemas/Scope' }
                      covers: { type: string }
                      filters: { $ref: '#/components/schemas/ClientsFilter' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/exports:
    get:
      summary: Recent exports of reports this reader may see.
      responses:
        '200':
          description: Export records, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReportExport' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: >
        Queues an export. 202 — the record exists, the file does not yet;
        poll the show endpoint until is_terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              additionalProperties: false
              properties:
                format: { enum: [csv, xlsx, pdf] }
                report: { enum: [trips, drivers, vehicles, financial, null] }
                from: { type: ['string', 'null'], format: date }
                to: { type: ['string', 'null'], format: date }
                vehicle_id: { type: ['integer', 'null'] }
                driver_id: { type: ['integer', 'null'] }
                status: { $ref: '#/components/schemas/NullableTripStatus' }
                group_by: { enum: [day, week, month, year, null] }
                tenant_id: { type: ['integer', 'null'], description: Platform staff only; required for a financial export. }
      responses:
        '202':
          $ref: '#/components/responses/ReportExportResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/exports/{export}:
    get:
      summary: One export record — what the client polls.
      parameters:
        - { name: export, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/ReportExportResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/exports/{export}/download:
    get:
      summary: >
        The exported file. Binary — declared, not validated (ADR-0011
        decision 6). 409 EXPORT_NOT_READY while preparing, 410
        EXPORT_EXPIRED after the seven-day retention.
      parameters:
        - { name: export, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The file, as an attachment.
          content:
            text/csv: {}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
            application/pdf: {}
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Notifications (Modules/Notifications) — a user's own inbox
  # ------------------------------------------------------------------
  /api/v1/notifications:
    get:
      summary: Your notifications, newest first, with the unread count.
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Notifications plus the unread badge count.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta:
                    type: object
                    required: [unread]
                    additionalProperties: false
                    properties:
                      unread: { type: integer }
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Marks everything read in one call.
      responses:
        '200':
          description: How many were marked.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [marked]
                    additionalProperties: false
                    properties:
                      marked: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/notifications/{notification}:
    patch:
      summary: Marks one notification read.
      parameters:
        - { name: notification, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The notification, now read.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Notification' }
        '404':
          description: >
            Not found — scoped to your own inbox, so another user's id is
            indistinguishable from a missing one. NOTE the shape: this
            endpoint answers 404 in the success envelope with null data,
            not the error envelope. Documented as built.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { enum: [null] }
        default:
          $ref: '#/components/responses/Error'

components:
  parameters:
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from meta.cursor.next.
      schema: { type: string }

  requestBodies:
    DecisionReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            additionalProperties: false
            properties:
              reason: { type: string, maxLength: 1000 }

  responses:
    Error:
      description: >
        Any failure. `code` is stable and machine-readable — clients branch
        on it, never on message text (AGENTS.md API Standards).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    Throttled:
      description: >
        Rate limited (auth endpoints, 5/min/IP). Rendered by the framework,
        not the API envelope — documented in its production shape; the
        test-suite hook does not validate 429s because debug rendering
        differs.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            additionalProperties: true
            properties:
              message: { type: string }

    MessageOnly:
      description: Success with no data payload.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { enum: [null] }

    AuthenticatedResponse:
      description: Login complete — the account and its Sanctum token.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [user, token, must_enrol_mfa]
                additionalProperties: false
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  token: { type: string }
                  must_enrol_mfa: { type: boolean }

    SettingsResponse:
      description: Every settings group, secrets replaced by configured flags.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [settings]
                additionalProperties: false
                properties:
                  settings: { $ref: '#/components/schemas/Settings' }

    CustomerAuthenticatedResponse:
      description: >
        Customer sign-up or sign-in complete (ADR-0013 §3) — the account
        and its token. No MFA fields on purpose: MFA is tied to staff
        roles that move money, and a customer cannot.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [customer, token]
                additionalProperties: false
                properties:
                  customer: { $ref: '#/components/schemas/Customer' }
                  token: { type: string }

    RecoveryCodesResponse:
      description: >
        Recovery codes, legible this once only — they are stored hashed and
        can never be shown again.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [recovery_codes]
                additionalProperties: false
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }

    UserResponse:
      description: One account.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/User' }

    RoleResponse:
