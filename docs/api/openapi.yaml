            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [order_request]
                additionalProperties: false
                properties:
                  order_request: { $ref: '#/components/schemas/OrderRequest' }

    VehicleAllocationResponse:
      description: One allocation contract.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
