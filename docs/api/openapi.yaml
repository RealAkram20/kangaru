                      trips: { type: integer }
                      trips_completed: { type: integer }
                      distance_km: { type: number }
                      duration_minutes: { type: integer }
                      variance_flagged: { type: integer }
                      average_distance_km: { type: number }
                  scope: { $ref: '#/components/schemas/Scope' }
                  covers: { type: string }
                  filters: { $ref: '#/components/schemas/ClientsFilter' }

  schemas:
    # -------------------------- primitives ---------------------------
    Timestamp:
      description: ISO-8601 UTC timestamp as Laravel serialises Carbon.
      type: string

    NullableTimestamp:
      type: ['string', 'null']

    Scope:
      description: Whether this reader sees the whole platform or one tenant (ADR-0006/0007).
      enum: [platform, tenant]

    ValueLabel:
      type: object
      required: [value, label]
      additionalProperties: false
      properties:
        value: { type: string }
        label: { type: string }

    ValueLabelInt:
      type: object
      required: [value, label]
      additionalProperties: false
      properties:
        value: { type: integer }
        label: { type: string }

    Cursor:
      type: object
      required: [next]
      additionalProperties: false
      properties:
        next:
          type: ['string', 'null']
          description: Opaque cursor for the next page; null on the last page.

    ClientsFilter:
      type: object
      required: [clients]
      additionalProperties: false
      properties:
        clients:
          description: Clients a cross-client reader may narrow to. Empty for a client's own user.
          type: array
          items: { $ref: '#/components/schemas/ValueLabelInt' }

    CrossClientListMeta:
      description: The meta block /bookings and /trips share (ADR-0006).
      type: object
      required: [cursor, scope, filters]
      additionalProperties: false
      properties:
        cursor: { $ref: '#/components/schemas/Cursor' }
        scope: { $ref: '#/components/schemas/Scope' }
        filters: { $ref: '#/components/schemas/ClientsFilter' }

    ClientRef:
      description: Which client a row belongs to — platform readers only (ADR-0006).
      type: ['object', 'null']
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }

    ReportRows:
      description: >
        Report rows as positional arrays matching meta.headers — read
        across, like the exported spreadsheet.
      type: array
      items:
        type: array
        items:
          type: ['string', 'number', 'null']

    EmptyableStringListMap:
      description: >
        Validation errors — a map of field name to messages. PHP serialises
        the empty map as [], hence the anyOf.
      anyOf:
        - type: array
          maxItems: 0
        - type: object
          additionalProperties:
            type: array
            items: { type: string }

    FreeformMap:
      description: >
        A JSON column with no fixed shape (audit diffs, notification
        context, export filters). PHP serialises the empty map as [].
      anyOf:
        - type: array
        - type: object
          additionalProperties: true
        - enum: [null]

    # ---------------------------- enums ------------------------------
    ErrorCode:
      description: Every case of App\Enums\ErrorCode. Never removed, never repurposed.
      enum:
        - VALIDATION_FAILED
        - INVALID_CREDENTIALS
        - MFA_REQUIRED
        - MFA_ENROLMENT_REQUIRED
        - MFA_CHALLENGE_INVALID
        - MFA_CODE_INVALID
        - MFA_ALREADY_ENROLLED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - SERVER_ERROR
        - INVALID_TRIP_TRANSITION
        - INVALID_BOOKING_TRANSITION
        - VEHICLE_UNAVAILABLE
        - DRIVER_UNAVAILABLE
        - REPORT_TOO_LARGE
        - EXPORT_NOT_READY
        - EXPORT_EXPIRED
        - ALLOCATION_CONFLICT
        - VEHICLE_EXCLUSIVELY_ALLOCATED
        - INVALID_ORDER_REQUEST_TRANSITION
        - RATE_CARD_NOT_CONFIGURED
        - TRIP_NOT_INVOICEABLE
        - TRIP_NOT_INVOICEABLE_WALK_IN
        - TRIP_ALREADY_INVOICED
        - IDEMPOTENCY_KEY_REUSED
        - CREDIT_NOTE_EXCEEDS_INVOICE
        - ROLE_IN_USE
        - ORDERING_PAUSED
        - MAIL_DELIVERY_FAILED
        - DRIVER_ACCOUNT_CONFLICT
        - DRIVER_APPLICATION_CLOSED
        - AUTH_METHOD_DISABLED
        - SOCIAL_TOKEN_INVALID
        - AVAILABILITY_ALREADY_ANSWERED
        - AUTOMATIC_DISPATCH_DISABLED
        - NO_DISPATCH_CANDIDATE
        - NOT_A_DRIVER
        - NOT_ON_DUTY
        - OFFER_NO_LONGER_OPEN
        - OFFER_HAS_NO_VEHICLE
        - TOKEN_SCOPE_EXCEEDED

    TripStatus:
      enum:
        - assigned
        - rejected
        - accepted
        - driver_en_route
        - driver_arrived
        - no_show
        - passenger_onboard
        - trip_started
        - waiting
        - trip_resumed
        - trip_completed
        - invoice_generated
        - disputed
        - closed
        - cancelled

    NullableTripStatus:
      enum:
        - assigned
        - rejected
        - accepted
        - driver_en_route
        - driver_arrived
        - no_show
        - passenger_onboard
        - trip_started
        - waiting
        - trip_resumed
        - trip_completed
        - invoice_generated
        - disputed
        - closed
        - cancelled
        - null

    BookingStatus:
      enum: [pending, approved, rejected, assigned, cancelled]

    VehicleCategory:
      enum: [sedan, suv, van, minibus, bus, pickup, truck]

    # -------------------------- envelopes ----------------------------
    ErrorEnvelope:
      type: object
      required: [success, code, message, errors]
      additionalProperties: false
      properties:
        success: { enum: [false] }
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        errors: { $ref: '#/components/schemas/EmptyableStringListMap' }

    # -------------------------- resources ----------------------------
    User:
      type: object
      required:
        - id
        - tenant_id
        - name
        - email
        - role
        - role_label
        - status
        - status_label
        - is_active
        - deactivated_at
        - created_at
        - mfa_enabled
        - must_enrol_mfa
        - mfa_recovery_codes_low
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: ['integer', 'null'] }
        name: { type: string }
        email: { type: string }
        role: { type: string, description: Role slug — the external reference. }
        role_label: { type: string }
        status: { enum: [active, suspended] }
        status_label: { type: string }
        is_active: { type: boolean }
        deactivated_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        mfa_enabled: { type: boolean }
        must_enrol_mfa: { type: boolean }
        mfa_recovery_codes_remaining:
          type: integer
          description: Present only when a factor is enrolled (ADR-0010).
        mfa_recovery_codes_low: { type: boolean }

    Role:
      type: object
      required: [slug, name, description, is_system, permissions, created_at]
      additionalProperties: false
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: ['string', 'null'] }
        is_system: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        users_count:
          type: integer
          description: Present on the listing only.
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    AuditLog:
      type: object
      required:
        - id
        - tenant_id
        - user_id
        - auditable_type
        - auditable_id
        - action
        - changes
        - ip_address
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: ['integer', 'null'] }
        user_id: { type: ['integer', 'null'] }
        user:
          anyOf:
            - { $ref: '#/components/schemas/User' }
            - { enum: [null] }
        auditable_type: { type: string }
        auditable_id: { type: ['integer', 'null'] }
        action: { enum: [created, updated, deleted] }
        changes: { $ref: '#/components/schemas/FreeformMap' }
        ip_address: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    Company:
      type: object
      required:
        - id
        - tenant_id
        - legal_name
        - trading_name
        - registration_number
        - industry
        - billing_email
        - phone
        - address_line1
        - address_line2
        - city
        - country
        - credit_limit_minor
        - status
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        legal_name: { type: string }
        trading_name: { type: ['string', 'null'] }
        registration_number: { type: ['string', 'null'] }
        industry: { type: ['string', 'null'] }
        billing_email: { type: string }
        phone: { type: ['string', 'null'] }
        address_line1: { type: ['string', 'null'] }
        address_line2: { type: ['string', 'null'] }
        city: { type: ['string', 'null'] }
        country: { type: ['string', 'null'] }
        credit_limit_minor: { type: ['integer', 'null'] }
        status: { enum: [active, suspended] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    ContactDetails:
      description: >
        A number to dial and who answers it. `label` is not decoration —
        under a future masking channel it would read "Passenger (via
        KangaruRide)", and a driver dialling a proxy needs to know that is
        what they are doing, or they will save it as the passenger's real
        number and call it next week.
      type: object
      required: [name, phone, label]
      additionalProperties: false
      properties:
        name: { type: string }
        phone: { type: string }
        label: { type: string }

    CustomerRide:
      description: >
        A ride as the person waiting for it sees it (ADR-0024 §7). Phase
        names are `RidePhase`'s own in the web client, so the mapping is an
        identity function rather than a translation table.
      type: object
      required: [reference, service_type, phase, pickup, dropoff, trip_id, captain, created_at]
      additionalProperties: false
      properties:
        reference: { type: string }
        service_type: { type: string }
        phase:
          description: >
            The search state before a trip exists, the trip's own status
            after. One field, because the screen renders one timeline and
            should not have to decide which of two is authoritative.
          enum:
            - searching
            - offered
            - unmatched
            - assigned
            - accepted
            - rejected
            - driver_en_route
            - driver_arrived
            - no_show
            - passenger_onboard
            - trip_started
            - waiting
            - trip_resumed
            - trip_completed
            - invoice_generated
            - disputed
            - closed
            - cancelled
        pickup: { $ref: '#/components/schemas/OfferPlace' }
        dropoff: { $ref: '#/components/schemas/OfferPlace' }
        trip_id: { type: ['integer', 'null'] }
        captain:
          anyOf:
            - { $ref: '#/components/schemas/RideCaptain' }
            - { enum: [null] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    RideCaptain:
      description: >
        No rating and no ETA: neither exists (driver rating is unbuilt, and
        ranking is straight-line, not a road-distance arrival time). Omitted
        rather than faked — a number the screen invents is worse than a
        screen that does not show one.
      type: object
      required: [name, phone, phone_label, vehicle, plate, vehicle_colour]
      additionalProperties: false
      properties:
        name: { type: string }
        phone:
          description: Null once the trip is over (ADR-0024 §7).
          type: ['string', 'null']
        phone_label: { type: ['string', 'null'] }
        vehicle: { type: ['string', 'null'] }
        plate: { type: ['string', 'null'] }
        vehicle_colour: { type: ['string', 'null'] }

    DispatchOffer:
      description: >
        A job put in front of one driver, with a clock on it (ADR-0024 §3).


        Deliberately carries **no passenger name or phone number**. Those are
        released only after the driver accepts (ADR-0024 §7): a number handed
        to a driver who then declines is given away for nothing, and this
        payload is what a push notification is built from — which puts it on
        a lock screen readable by whoever is holding the phone.


        `order_requests.details` is never emitted wholesale for the same
        reason — on a delivery it holds `sender_phone` and `recipient_phone`.
        Only the keys in `package` and `payment` cross this boundary.
      type: object
      required:
        - id
        - status
        - expires_at
        - expires_in_seconds
        - pickup
        - dropoff
        - service_type
        - reference
        - pickup_distance_km
        - trip_distance_km
        - reasons
        - package
        - payment
        - estimated_fare
        - vehicle_id
      additionalProperties: false
      properties:
        id: { type: integer }
        status: { enum: [offered, accepted, declined, expired, superseded] }
        expires_at: { type: string, format: date-time }
        expires_in_seconds:
          description: >
            Served alongside the timestamp so the first render is right even
            on a handset whose clock is minutes out — common enough on cheap
            Android hardware to matter, and it would otherwise show a driver
            40 seconds left on a 15-second offer.
          type: integer
          minimum: 0
        pickup: { $ref: '#/components/schemas/OfferPlace' }
        dropoff: { $ref: '#/components/schemas/OfferPlace' }
        service_type: { type: ['string', 'null'] }
        reference: { type: ['string', 'null'] }
        pickup_distance_km:
          description: >
            How far the driver is from the pickup. Straight-line, not road
            distance — a ranking, not a promised ETA (ADR-0020 §3).
          type: ['number', 'null']
        trip_distance_km:
          description: >
            How far the job itself is, pickup to drop-off. The other half of
            the same question: 0.4 km away is a good offer if the ride is
            9 km and a poor one if it is 700 m.


            Straight-line, like `pickup_distance_km`, and under the same
            prohibition — **a client must not divide this by an assumed speed
            to show an ETA.** ADR-0020 §3 declined to derive minutes from a
            straight line by name, because real roads are longer than the
            crow's flight and the invented number is the one that would need
            defending.


            Null whenever either end lacks coordinates, as an order taken
            over the phone does.
          type: ['number', 'null']
        reasons:
          description: One sentence per scoring component, so a ranking stays auditable (ADR-0020 §4).
          type: array
          items: { type: string }
        package:
          description: >
            What is being sent, on a delivery — null on any other service.


            These two keys are an allow-list over `order_requests.details`,
            not a projection of it. That column also holds `sender_phone` and
            `recipient_phone`, which ADR-0024 §7 withholds until after the
            accept; a new key added to the public order form must default to
            not being here.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OfferPackage'
        payment: { $ref: '#/components/schemas/OfferPayment' }
        estimated_fare:
          description: >
            What the ride is estimated to fetch (ADR-0026 §2).


            A **fare**, not driver earnings: there is no commission model on
            this platform and settlement is deferred (ADR-0026 §3), so a
            field named for the driver's take would become false in every
            shipped build the day a platform cut is introduced.


            Null when the offer carries no vehicle (so no category, so no
            rate), when either end has no coordinates, when no public tariff
            has been published, or when this category is not priced on it.
            Null renders as no figure; a zero would read as a free ride.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WalkInFareEstimate'
        vehicle_id: { type: ['integer', 'null'] }
        vehicle_registration: { type: ['string', 'null'] }

    OfferPackage:
      type: object
      required: [item_type, package_size]
      additionalProperties: false
      properties:
        item_type:
          enum: [documents, food, parcel, electronics, furniture, appliances, other, null]
        package_size:
          enum: [small, medium, large, heavy, null]

    OfferPayment:
      description: >
        How the job settles, and which end settles it.


        Allow-listed out of `order_requests.details` on the same terms as
        `OfferPackage`: a decision input that identifies nobody. A driver
        carrying no float declines a cash job, and on a parcel the person
        ordering is often not the person paying — which is why `payer`
        travels with the method rather than being assumed.


        Unlike `package` this object is present on every service, because
        every job is paid for. Both members are null whenever the person
        ordering did not say, which is the common case: the public order form
        marks both optional. **Null must render as no figure — never as
        `cash`.** A driver who arrives expecting notes and is offered a
        mobile-money transfer they cannot take has been told something the
        platform never knew.
      type: object
      required: [payment_method, payer]
      additionalProperties: false
      properties:
        payment_method:
          enum: [cash, mobile_money, card, null]
        payer:
          description: Which end of a delivery settles the bill. Null on a ride, where there is only one end.
          enum: [sender, receiver, null]

    WalkInFareEstimate:
      description: >
        A price before anybody has driven anywhere (ADR-0026 §2).


        Carries the distance it was computed from, not just the total: a
        figure with no basis is one a passenger cannot sanity-check and a
        dispatcher cannot explain, and the distance is the part that is
        estimated.
      type: object
      required: [vehicle_category, distance_km, total_minor, currency, is_estimate, basis]
      additionalProperties: false
      properties:
        vehicle_category: { type: string }
        distance_km:
          description: Great-circle kilometres. Under-reads against real roads, on purpose.
          type: number
        total_minor:
          description: Minor units. UGX is zero-decimal, so this is whole shillings.
          type: integer
        currency: { type: string }
        is_estimate:
          description: >
            Always true, and said in the payload rather than only in the UI —
            a client rendering this has to be able to tell a quote from a
            bill, and a flag beats every client remembering to add the word.
          const: true
        basis: { type: string }

    OfferPlace:
      type: object
      required: [label, latitude, longitude]
      additionalProperties: false
      properties:
        label: { type: ['string', 'null'] }
        latitude: { type: ['number', 'null'] }
        longitude: { type: ['number', 'null'] }

    DriverPresence:
      description: >
        Whether a driver is waiting for work, and where (ADR-0024 §2).
      type: object
      required:
        - driver_id
        - on_duty
        - vehicle_id
        - latitude
        - longitude
        - recorded_at
        - dispatchable
        - position_age_seconds
        - heartbeat_seconds
      additionalProperties: false
      properties:
        driver_id: { type: integer }
        on_duty: { type: boolean }
        vehicle_id: { type: ['integer', 'null'] }
        latitude: { type: ['number', 'null'] }
        longitude: { type: ['number', 'null'] }
        recorded_at: { $ref: '#/components/schemas/NullableTimestamp' }
        dispatchable:
          description: >
            Whether the matcher would offer this driver work right now — on
            duty, and either heard from within the TTL or never able to
            report a position at all. Served rather than left for a client
            to re-derive: three conditions and a configured number would
            drift, and the symptom is an app telling a driver they are
            online while the platform offers them nothing. Same reasoning as
            `allowed_transitions` on a trip.
          type: boolean
        position_age_seconds:
          description: Null when they have never reported. Lets an app say "last seen 4 minutes ago" instead of showing a green dot it has no evidence for.
          type: ['integer', 'null']
        heartbeat_seconds:
          description: How often to report in. Served from config so the cadence can be tuned against real battery data without shipping a new build to every handset.
          type: integer

    AvailabilityBlock:
      type: object
      required:
        - id
        - resource_type
        - resource_id
        - kind
        - status
        - answered_at
        - answer_note
        - starts_at
        - ends_at
        - reason
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        resource_type: { enum: [driver, vehicle] }
        resource_id: { type: integer }
        kind: { enum: [leave, sick, rest, training, maintenance, inspection, repair, other] }
        status: { enum: [requested, approved, declined] }
        answered_at: { $ref: '#/components/schemas/NullableTimestamp' }
        answer_note: { type: ['string', 'null'] }
        starts_at: { $ref: '#/components/schemas/NullableTimestamp' }
        ends_at: { $ref: '#/components/schemas/NullableTimestamp' }
        reason: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    DispatchSuggestion:
      description: A (vehicle, driver) pair the matcher would choose (ADR-0020).
      type: object
      required: [vehicle, driver, score, pickup_distance_km, reasons]
      additionalProperties: false
      properties:
        vehicle: { $ref: '#/components/schemas/Vehicle' }
        driver: { $ref: '#/components/schemas/Driver' }
        score:
          description: Higher is better. Contracts dominate; distance decays with range.
          type: number
        pickup_distance_km:
          description: >
            Great-circle km from the vehicle's live position to the pickup.
            Null when the booking has no coordinates or the vehicle has not
            reported — absent rather than guessed.
          type: ['number', 'null']
        reasons:
          description: Plain sentences a dispatcher can audit the ranking against.
          type: array
          items: { type: string }

    ZoneBoundaryPoint:
      description: >
        Named keys, not GeoJSON's positional [lng, lat]. That ordering is the
        most common coordinate bug there is, and ADR-0020 records this
        codebase hitting a swap no range check could catch.
      type: object
      required: [lat, lng]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    ZoneInput:
      type: object
      required: [name, kind, boundary]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 255 }
        kind: { enum: [service_area, pricing, client, branch, depot] }
        tenant_id:
          description: Required for a client zone, forbidden for every other kind.
          type: ['integer', 'null']
        boundary:
          description: A closed ring. Three points is the fewest that enclose an area.
          type: array
          minItems: 3
          items: { $ref: '#/components/schemas/ZoneBoundaryPoint' }
        priority:
          description: Lower wins where zones overlap. Defaults from the kind.
          type: integer
        active: { type: boolean }
        notes: { type: ['string', 'null'], maxLength: 255 }

    Zone:
      type: object
      required: [id, tenant_id, name, kind, boundary, priority, active, notes, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: ['integer', 'null'] }
        name: { type: string }
        kind: { enum: [service_area, pricing, client, branch, depot] }
        boundary:
          type: array
          items: { $ref: '#/components/schemas/ZoneBoundaryPoint' }
        priority: { type: integer }
        active: { type: boolean }
        notes: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    LivePosition:
      description: One vehicle's current position (ADR-0019).
      type: object
      required:
        - vehicle_id
        - trip_id
        - driver_id
        - latitude
        - longitude
        - speed_kph
        - heading_degrees
        - recorded_at
        - age_seconds
        - stale
      additionalProperties: false
      properties:
        vehicle_id: { type: integer }
        trip_id: { type: integer }
        driver_id: { type: ['integer', 'null'] }
        latitude: { type: number }
        longitude: { type: number }
        speed_kph: { type: ['number', 'null'] }
        heading_degrees: { type: ['integer', 'null'] }
        recorded_at:
          description: The device's clock, not the server's.
          $ref: '#/components/schemas/NullableTimestamp'
        age_seconds:
          description: Seconds since the device recorded it — the freshness figure.
          type: integer
        stale:
          description: >
            Older than tracking.live_stale_after_seconds. A still marker is
            ambiguous until you know whether it is a parked vehicle or a
            dead phone.
          type: boolean

    CustomerProfile:
      description: >
        A customer as staff see them (ADR-0018) — distinct from the account
        the customer sees. Never carries a credential of any kind.
      type: object
      required:
        - id
        - first_name
        - last_name
        - name
        - gender
        - phone
        - email
        - status
        - has_password
        - has_google
        - suspended_at
        - suspension_reason
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        name: { type: string }
        gender: { type: ['string', 'null'] }
        phone: { type: string }
        email: { type: ['string', 'null'] }
        status: { enum: [active, suspended] }
        has_password:
          description: Whether they can sign in with a password, not what it is.
          type: boolean
        has_google: { type: boolean }
        suspended_at: { $ref: '#/components/schemas/NullableTimestamp' }
        suspension_reason: { type: ['string', 'null'] }
        orders_count: { type: integer }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    CandidateDriver:
      description: >
        A driver plus whether they can take this booking (ADR-0017). The
        driver fields are DriverResource's, restated for the same reason
        CandidateVehicle restates the vehicle's — additionalProperties:
        false rules out allOf composition, and the guarantee is worth the
        duplication.
      type: object
      required:
        - id
        - name
        - phone
        - email
        - license_number
        - license_expiry
        - status
        - vehicle_id
        - account
        - created_at
        - updated_at
        - dispatchable
        - note
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: ['string', 'null'] }
        license_number: { type: string }
        license_expiry: { $ref: '#/components/schemas/NullableTimestamp' }
        status: { enum: [active, suspended, inactive] }
        vehicle_id:
          description: >
            The vehicle this driver drives, or null when the depot allocates
            one per shift instead. Restated from Driver for the reason given
            above.
          type: ['integer', 'null']
        account:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, email, role, status]
              additionalProperties: false
              properties:
                id: { type: integer }
                email: { type: string, format: email }
                role: { type: string }
                status: { enum: [active, suspended] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }
        dispatchable:
          description: False means the assignment endpoint will refuse them with 409.
          type: boolean
        note:
          description: >
            Short sentence, or null when there is nothing to say. Never names
            the kind of absence.
          type: ['string', 'null']

    DriverApplication:
      description: >
        A rider asking to drive (ADR-0027). Console-side only — the
        applicant has no way to read their own row (§6). Never carries the
        password hash: the model hides it, and once the application is
        decided the column is cleared entirely.
      type: object
      required:
        - id
        - name
        - phone
        - email
        - status
        - status_label
        - terms_accepted_at
        - reviewed_at
        - reviewed_by_user_id
        - rejection_reason
        - driver_id
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        status: { enum: [pending, approved, rejected] }
        status_label: { type: string }
        terms_accepted_at:
          description: >
            When the applicant agreed to the /public/legal notices — a
            server-stamped time, not a client boolean, because the DPPA 2019
            wants consent recorded and "true" records nothing.
          $ref: '#/components/schemas/Timestamp'
        reviewed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        reviewed_by_user_id: { type: ['integer', 'null'] }
        rejection_reason: { type: ['string', 'null'] }
        driver_id:
          description: The profile approval produced, once it has.
          type: ['integer', 'null']
        created_at: { $ref: '#/components/schemas/Timestamp' }

    Driver:
      type: object
      required:
        - id
        - name
        - phone
        - email
        - license_number
        - license_expiry
        - status
        - vehicle_id
        - account
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: ['string', 'null'] }
        license_number: { type: string }
        license_expiry: { $ref: '#/components/schemas/NullableTimestamp' }
        status: { enum: [active, suspended, inactive] }
        vehicle_id:
          description: >
            The vehicle this driver drives, or null when the depot allocates
            one per shift instead. A fact about the person rather than about
            the shift: most drivers here own their vehicle, and for a boda
            rider the rider and the motorcycle are not separable.
            `driver_presence.vehicle_id` remains the per-shift answer and
            still wins when it is set.
          type: ['integer', 'null']
        account:
          description: >
            The account this driver signs in with, or null if they cannot sign
            in yet (ADR-0016). Always present so a client can tell "no account"
            apart from "not requested". Never carries password material.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, email, role, status]
              additionalProperties: false
              properties:
                id: { type: integer }
                email: { type: string, format: email }
                role: { type: string }
                status: { enum: [active, suspended] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    Vehicle:
      type: object
      required:
        - id
        - registration_number
        - make
        - model
        - year
        - category
        - seating_capacity
        - color
        - vin
        - status
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        registration_number: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        category: { $ref: '#/components/schemas/VehicleCategory' }
        seating_capacity: { type: integer }
        color: { type: ['string', 'null'] }
        vin: { type: ['string', 'null'] }
        status: { enum: [active, maintenance, inactive] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    Settings:
      description: >
        The full settings map (ADR-0014), every catalogue key resolved:
        stored value where one exists, default where none does. Secret
        keys (none in phase 1) appear as {configured: bool}, never as
        values.
      type: object
      required: [branding, legal, auth, regional, ordering, billing, booking, mail, sms, payments]
      additionalProperties: false
      properties:
        branding: { $ref: '#/components/schemas/BrandingSettings' }
        legal:
          description: >
            The Terms and Privacy notices the Driver App asks consent to.
            Plain text, newline-separated, edited here and read publicly at
            GET /public/legal — deliberately absent from PublicSettings,
            which every page load fetches.
          type: object
          required: [terms, privacy]
          additionalProperties: false
          properties:
            terms: { type: ['string', 'null'] }
            privacy: { type: ['string', 'null'] }
        auth:
          description: >
            Which ways into the Driver App are on (ADR-0028), and the
            credentials they run on. The booleans are mirrored into
            PublicSettings; the credentials never are, and the Facebook
            secret is write-only.
          type: object
          required:
            - password_reset_enabled
            - google_enabled
            - facebook_enabled
            - google_client_ids
            - facebook_app_id
            - facebook_app_secret
          additionalProperties: false
          properties:
            password_reset_enabled: { type: boolean }
            google_enabled: { type: boolean }
            facebook_enabled: { type: boolean }
            google_client_ids: { type: ['string', 'null'] }
            facebook_app_id: { type: ['string', 'null'] }
            facebook_app_secret: { $ref: '#/components/schemas/SecretValue' }
        regional:
          type: object
          required: [currency, timezone, date_format]
          additionalProperties: false
          properties:
            currency: { type: string }
            timezone: { type: string }
            date_format: { type: string }
        ordering:
          type: object
          required: [walk_in_enabled, rate_limit_per_minute]
          additionalProperties: false
          properties:
            walk_in_enabled: { type: boolean }
            rate_limit_per_minute: { type: integer }
        billing:
          description: >
            What the platform keeps from a walk-in fare (ADR-0029 §3). A
            setting rather than a constant, because the rate is a commercial
            decision the Super Admin makes and argues about — not one that
            needs a deploy.


            **Changing it never restates what a driver already earned.** The
            rate in force at completion is written into the ledger entry's
            description, so history is priced at the rate it happened under.
          type: object
          required: [driver_commission_percent]
          additionalProperties: false
          properties:
            driver_commission_percent: { type: integer, minimum: 0, maximum: 100 }
        booking:
          type: object
          required: [approval_required, max_advance_days]
          additionalProperties: false
          properties:
            approval_required: { type: boolean }
            max_advance_days: { type: integer }
        maps:
          description: >
            Road routing for the driver app's maps (ADR-0031 pending). The
            maps themselves are MapLibre against CARTO's free tiles and need
            no key; this group is only about the route line, the road distance
            and the arrival estimate.


            `api_key` is a **secret**: encrypted at rest, never returned by
            this endpoint, and masked in audit (ADR-0014 §3). It is
            deliberately not in the public subset — Directions bills per
            request, so a key in a browser bundle or a handset is somebody
            else's traffic on this operator's invoice. Routing is served by
            the backend for that reason.


            `routing_enabled` defaults to **false** so that configuring a key
            never silently starts a bill, and is a separate switch so the
            spend can be stopped without destroying the credential.
          type: object
          required: [routing_enabled, routing_provider, api_key]
          additionalProperties: false
          properties:
            routing_enabled: { type: boolean }
            routing_provider: { enum: [google] }
            api_key: { $ref: '#/components/schemas/SecretValue' }
        mail:
          type: object
          required: [enabled, host, port, username, password, encryption, from_address, from_name]
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            host: { type: ['string', 'null'] }
            port: { type: integer }
            username: { type: ['string', 'null'] }
            password: { $ref: '#/components/schemas/SecretValue' }
            encryption: { enum: [tls, none] }
            from_address: { type: ['string', 'null'] }
            from_name: { type: ['string', 'null'] }
        sms:
          type: object
          required: [provider, sender_id, api_key, api_secret]
          additionalProperties: false
          properties:
            provider: { enum: ['', africastalking, twilio, null] }
            sender_id: { type: ['string', 'null'] }
            api_key: { $ref: '#/components/schemas/SecretValue' }
            api_secret: { $ref: '#/components/schemas/SecretValue' }
        payments:
          type: object
          required: [mtn_momo_api_user, mtn_momo_api_key, airtel_money_client_id, airtel_money_client_secret]
          additionalProperties: false
          properties:
            mtn_momo_api_user: { type: ['string', 'null'] }
            mtn_momo_api_key: { $ref: '#/components/schemas/SecretValue' }
            airtel_money_client_id: { type: ['string', 'null'] }
            airtel_money_client_secret: { $ref: '#/components/schemas/SecretValue' }

    SecretValue:
      description: >
        A write-only credential (ADR-0014 §3). The value never appears in
        any response — only whether one is stored. Write a new value via
        PATCH like any other key; there is no way to read one back.
      type: object
      required: [configured]
      additionalProperties: false
      properties:
        configured: { type: boolean }

    BrandingSettings:
      type: object
      required: [app_name, tagline, meta_description, contact_email, contact_phone, logo_path, favicon_path]
      additionalProperties: false
      properties:
        app_name: { type: string }
        tagline: { type: ['string', 'null'] }
        meta_description: { type: ['string', 'null'] }
        contact_email: { type: string }
        contact_phone: { type: ['string', 'null'] }
        logo_path: { type: ['string', 'null'] }
        favicon_path: { type: ['string', 'null'] }

    PublicSettings:
      description: >
        The unauthenticated branding subset: catalogue keys flagged
        public only, asset paths as absolute URLs.
      type: object
      required: [branding, auth, regional, ordering]
      additionalProperties: false
      properties:
        branding: { $ref: '#/components/schemas/BrandingSettings' }
        auth:
          description: >
            Which sign-in methods the Driver App should offer (ADR-0028),
            and the public identifiers it needs to start the native flows.
            Client and app ids are public by design — they ship inside
            every app binary; the Facebook app SECRET never crosses this
            endpoint.
          type: object
          required:
            - password_reset_enabled
            - google_enabled
            - facebook_enabled
            - google_client_ids
            - facebook_app_id
          additionalProperties: false
          properties:
            password_reset_enabled: { type: boolean }
            google_enabled: { type: boolean }
            facebook_enabled: { type: boolean }
            google_client_ids: { type: ['string', 'null'] }
            facebook_app_id: { type: ['string', 'null'] }
        regional:
          type: object
          required: [currency]
          additionalProperties: false
          properties:
            currency: { type: string }
        ordering:
          type: object
          required: [walk_in_enabled]
          additionalProperties: false
          properties:
            walk_in_enabled:
              type: boolean
              description: False while the owner has paused online intake — the order form explains instead of failing at submit.

    Customer:
      description: >
        A customer's own account, as shown to them (ADR-0013, ADR-0015).
        `name` is composed from first_name and last_name rather than
        stored, and is returned so clients need not re-implement the join.
        `gender` is null when never asked, which is a different answer
        from "prefer_not_to_say" (ADR-0015 §2).
      type: object
      required: [id, first_name, last_name, name, gender, phone, email, created_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        name: { type: string }
        gender:
          type: string
          nullable: true
          enum: [female, male, other, prefer_not_to_say]
        phone: { type: string }
        email: { type: string }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    CustomerOrderRequest:
      description: >
        An order request as its own customer sees it (ADR-0013 §4).
        Deliberately narrower than OrderRequest: no dispatcher_notes (the
        desk's working notes are the desk's), no handled_by (staff
        assignment is internal), no allowed_transitions (a customer moves
        nothing), and no contact echo.
      type: object
      required:
        - id
        - reference
        - service_type
        - status
        - pickup_location
        - dropoff_location
        - scheduled_for
        - details
        - notes
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        reference: { type: string }
        service_type: { enum: [ride, delivery, self_drive] }
        status: { enum: [new, contacted, converted, closed] }
        pickup_location: { type: ['string', 'null'] }
        dropoff_location: { type: ['string', 'null'] }
        scheduled_for: { $ref: '#/components/schemas/NullableTimestamp' }
        details: { $ref: '#/components/schemas/FreeformMap' }
        notes: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    OrderRequest:
      description: >
        A walk-in request from the public landing page (ADR-0012). The
        dispatcher-queue shape — the public endpoint returns only a
        reference, never this.
      type: object
      required:
        - id
        - reference
        - service_type
        - status
        - allowed_transitions
        - contact_name
        - contact_phone
        - contact_email
        - pickup_location
        - pickup_latitude
        - pickup_longitude
        - dropoff_location
        - dropoff_latitude
        - dropoff_longitude
        - scheduled_for
        - details
        - notes
        - dispatcher_notes
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        reference:
          type: string
          description: KR- plus six characters readable down a phone line.
        service_type: { enum: [ride, delivery, self_drive] }
        status: { enum: [new, contacted, converted, closed] }
        allowed_transitions:
          type: array
          items: { enum: [new, contacted, converted, closed] }
        contact_name: { type: string }
        contact_phone: { type: string }
        contact_email: { type: ['string', 'null'] }
        pickup_location: { type: ['string', 'null'] }
        pickup_latitude:
          description: Where the pickup is, when the caller's geocoder knew (ADR-0020).
          type: ['number', 'null']
        pickup_longitude: { type: ['number', 'null'] }
        dropoff_location: { type: ['string', 'null'] }
        dropoff_latitude: { type: ['number', 'null'] }
        dropoff_longitude: { type: ['number', 'null'] }
        scheduled_for: { $ref: '#/components/schemas/NullableTimestamp' }
        details: { $ref: '#/components/schemas/FreeformMap' }
        notes: { type: ['string', 'null'] }
        dispatcher_notes: { type: ['string', 'null'] }
        handled_by:
          anyOf:
            - { $ref: '#/components/schemas/ValueName' }
            - { enum: [null] }
        customer:
          description: >
            The linked account holder (ADR-0013 §5); null for an anonymous
            walk-in. Id and name only — the customer's contact details on
            this row are already the ones they typed into the form.
          anyOf:
            - { $ref: '#/components/schemas/ValueName' }
            - { enum: [null] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    ValueName:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }

    VehicleAllocation:
      description: A period for which a vehicle is contracted to a client (ADR-0005/0009).
      type: object
      required:
        - id
        - tenant_id
        - vehicle_id
        - starts_on
        - ends_on
        - exclusive
        - in_force
        - notes
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        client: { $ref: '#/components/schemas/ClientRef' }
        vehicle_id: { type: integer }
        vehicle:
          anyOf:
            - { $ref: '#/components/schemas/Vehicle' }
            - { enum: [null] }
        starts_on: { type: string, format: date }
        ends_on:
          type: ['string', 'null']
          description: Null for an open-ended contract. The last day counts as in force.
        exclusive:
          type: boolean
          description: >
            False — the default, and the Bank's case — ranks the vehicle
            first for this client's work while leaving it in the pool. True
            refuses every other client's dispatch with 409, no override.
        in_force: { type: boolean }
        notes: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    CandidateVehicle:
      description: >
        A vehicle plus what this booking's contracts say about it
        (ADR-0009). The vehicle fields are VehicleResource's, restated
        because additionalProperties: false rules out allOf composition —
        the census-style guarantee is worth the duplication.
      type: object
      required:
        - id
        - registration_number
        - make
        - model
        - year
        - category
        - seating_capacity
        - color
        - vin
        - status
        - created_at
        - updated_at
        - allocated
        - dispatchable
        - requires_override_reason
        - note
      additionalProperties: false
      properties:
        id: { type: integer }
        registration_number: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        category: { $ref: '#/components/schemas/VehicleCategory' }
        seating_capacity: { type: integer }
        color: { type: ['string', 'null'] }
        vin: { type: ['string', 'null'] }
        status: { enum: [active, maintenance, inactive] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }
        allocated:
          type: boolean
          description: Ranks first for this client on this date.
        dispatchable:
          type: boolean
          description: False means dispatch will refuse it with 409, whatever is sent.
        requires_override_reason:
          type: boolean
          description: True means assignment without a reason gets a 422 naming allocation_override_reason.
        note:
          type: ['string', 'null']
          description: Short human sentence. Never names the other client.

    Booking:
      type: object
      required:
        - id
        - tenant_id
        - requested_by_user_id
        - passenger_name
        - passenger_phone
        - passenger_count
        - origin
        - destination
        - scheduled_for
        - is_immediate
        - status
        - approved_by_user_id
        - approved_at
        - decision_reason
        - notes
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        client: { $ref: '#/components/schemas/ClientRef' }
        requested_by_user_id: { type: integer }
        requested_by:
          anyOf:
            - { $ref: '#/components/schemas/User' }
            - { enum: [null] }
        passenger_name: { type: string }
        passenger_phone: { type: string }
        passenger_count: { type: ['integer', 'null'] }
        origin: { type: string }
        destination: { type: string }
        scheduled_for: { $ref: '#/components/schemas/NullableTimestamp' }
        is_immediate: { type: boolean }
        status: { $ref: '#/components/schemas/BookingStatus' }
        approved_by_user_id: { type: ['integer', 'null'] }
        approved_by:
          anyOf:
            - { $ref: '#/components/schemas/User' }
            - { enum: [null] }
        approved_at: { $ref: '#/components/schemas/NullableTimestamp' }
        decision_reason: { type: ['string', 'null'] }
        notes: { type: ['string', 'null'] }
        trip:
          anyOf:
            - { $ref: '#/components/schemas/Trip' }
            - { enum: [null] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    TripPlace:
      description: >
        One end of a journey, in prose and — where the platform has it — in
        coordinates. See `Trip.pickup` for why the pair is all-or-nothing.
      type: object
      required: [label, latitude, longitude]
      additionalProperties: false
      properties:
        label:
          description: Always present; `trips.origin` and `trips.destination` are not nullable.
          type: string
        latitude: { type: ['number', 'null'] }
        longitude: { type: ['number', 'null'] }

    SettledFare:
      description: >
        A fare that has been charged, as against `WalkInFareEstimate`, which
        is a quote (ADR-0026 §2).
      type: object
      required: [total_minor, currency, rate_card_version_id, computed_at, is_estimate]
      additionalProperties: false
      properties:
        total_minor:
          description: Minor units. UGX is zero-decimal, so this is whole shillings.
          type: integer
        currency: { type: ['string', 'null'] }
        rate_card_version_id:
          description: What priced it, so the figure can be re-derived years later.
          type: ['integer', 'null']
        computed_at: { type: ['string', 'null'], format: date-time }
        is_estimate:
          description: Always false. The counterpart of the always-true flag on WalkInFareEstimate.
          enum: [false]

    EarningsPeriod:
      description: >
        The span a driver reads their earnings over. No `year`: a driver does
        not read an annual chart on a phone, and the trend would be unreadable.
      type: string
      enum: [day, week, month]

    EarningsBreakdownRow:
      description: >
        Earnings grouped by the kind of job that produced them.

        `service_type` is `ride`, `delivery` or `self_drive` from the order
        request behind the trip — or **`other`**, which means the trip has no
        order request and cannot be classified: a walk-in a dispatcher
        fulfilled by hand. It is a row rather than an omission so the
        breakdown always reconciles with `total_minor`.

        Rows are ordered by `earned_minor` descending, and only kinds with
        earnings appear — a driver who took no deliveries gets no delivery row
        rather than a zero one.
      type: object
      required: [service_type, trips, earned_minor]
      additionalProperties: false
      properties:
        service_type:
          type: string
          description: '`ride` | `delivery` | `self_drive` | `other`. Not an enum — see above.'
        trips: { type: integer }
        earned_minor:
          type: integer
          description: The driver's share, in minor units. UGX is zero-decimal, so whole shillings.

    EarningsTrendPoint:
      description: >
        One bar of the trend chart.

        **Zero-filled and continuous** — every bucket in `[from, to)` is
        present, including the empty ones. That is not the banned "zero
        standing in for unknown": the ledger is written at completion, so no
        entry in an hour is positive evidence that nothing was completed in
        it. Omitting empty buckets would compress the axis and draw 3 AM
        beside 7 PM as though the hours between had not happened.

        `bucket` is a local-time key that sorts chronologically —
        `YYYY-MM-DD HH:00` for a day, `YYYY-MM-DD` for a week or month.
      type: object
      required: [bucket, earned_minor]
      additionalProperties: false
      properties:
        bucket: { type: string }
        earned_minor: { type: integer }

    DriverEarnings:
      description: >
        A driver's earnings for one period. See `GET /api/v1/me/earnings` for
        what is deliberately absent and why.
      type: object
      required:
        - period
        - timezone
        - from
        - to
        - currency
        - total_minor
        - trips
        - on_trip_minutes
        - breakdown
        - trend
      additionalProperties: false
      properties:
        period: { $ref: '#/components/schemas/EarningsPeriod' }
        timezone:
          type: string
          description: >
            The zone the boundaries and bucket keys are expressed in, from
            `settings.regional.timezone`. Served rather than assumed so a
            client labels the axis in the fleet's day, not the handset's.
        from:
          type: string
          format: date-time
          description: Inclusive start of the period, in the timezone above.
        to:
          type: string
          format: date-time
          description: '**Exclusive** end. The window is half-open `[from, to)`.'
        currency:
          type: string
          description: >
            ISO 4217, read off the entries rather than assumed. Falls back to
            `settings.regional.currency` when the period is empty — a zero
            still has to say what it is denominated in.
        total_minor:
          type: integer
          description: >
            The sum of the driver's `fare_earned` entries in the window. Their
            own share, never the gross fare the passenger paid.
        trips:
          type: integer
          description: Distinct trips that produced earnings in the window.
        on_trip_minutes:
          type: ['integer', 'null']
          description: >
            Minutes spent **on trips** — summed `completed_at − started_at`
            over the period's completed trips.

            **This is not "online hours" and must not be labelled as such.**
            Time spent waiting for an offer is not counted, and the platform
            cannot count it: `driver_presence` holds one overwritten row per
            driver and keeps no duty history.

            Null, not zero, when no trip in the window carries both
            timestamps — `0m` beside a non-zero earnings total is a
            contradiction.
        breakdown:
          type: array
          items: { $ref: '#/components/schemas/EarningsBreakdownRow' }
        trend:
          type: array
          items: { $ref: '#/components/schemas/EarningsTrendPoint' }

    TripEarnings:
      description: >
        What the driver made on one completed trip, read back from the
        ADR-0029 ledger that recorded it — never recomputed from the
        commission rate.

        `SettledFare` above is what the *passenger* paid. This is what is left
        of it for the driver, and the two differ by the platform's cut.

        **Served to the trip's own driver and to nobody else.** A dispatcher
        holding `trips.view.all` sees the board but not what a driver takes
        home, and a corporate client must never see the platform's margin on
        their work. It is also absent from every list endpoint, where the
        ledger relation is deliberately not loaded.

        **Null is a real answer.** Null on every corporate trip, which carries
        no per-trip fare and so raises no ledger pair (ADR-0029 §4), and null
        in the window between a completion arriving and the listener crediting
        it. A client renders that as "not confirmed yet" — never as a zero.
      type: object
      required: [earned_minor, commission_minor, total_minor, currency, recorded_at]
      additionalProperties: false
      properties:
        earned_minor:
          description: >
            The driver's share, in minor units — the `fare_earned` entry
            exactly as it was written. UGX is zero-decimal, so whole
            shillings.
          type: integer
        commission_minor:
          description: >
            The platform's cut, derived as `total_minor - earned_minor`.

            Derived rather than stored, because ADR-0029 §2 deliberately
            writes no `commission` entry — pairing one with the credit
            double-counts the money. Deriving it from the two figures actually
            recorded means this reports the rate in force *at completion*,
            whatever `billing.driver_commission_percent` says today.

            The percent itself is deliberately not served. A client that
            displayed it would be stating a rule it does not own, and would go
            on stating the old one after the office changed it.
          type: integer
        total_minor:
          description: >
            The gross fare, repeated from `Trip.fare.total_minor` so the three
            figures a driver reconciles arrive as one object rather than as
            two independently-nullable blocks.
          type: integer
        currency: { type: string }
        recorded_at:
          description: When the ledger credited it, which is not the same instant the trip completed.
          type: ['string', 'null']
          format: date-time

    Trip:
      type: object
      required:
        - id
        - tenant_id
        - customer_id
        - booking_id
        - vehicle_id
        - driver_id
        - origin
        - destination
        - pickup
        - dropoff
        - status
        - allowed_transitions
        - pickup_wait_target_seconds
        - fare
        - estimated_fare
        - payment
        - earnings
        - odometer_start
        - odometer_start_photo_path
        - odometer_end
        - odometer_end_photo_path
        - odometer_start_photo_url
        - odometer_end_photo_url
        - distance_km
        - gps_distance_km
        - distance_variance_flagged
        - cancellation_charge_applicable
        - started_at
        - completed_at
        - duration_minutes
        - passenger_contact
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id:
          description: >
            Null on a walk-in trip (ADR-0024 §1), which is owned by a
            customer instead. Exactly one of this and `customer_id` is
            ever set, so a client may branch on either without asking
            both.
          type: ['integer', 'null']
        customer_id:
          description: Null on every corporate trip, which is owned by a tenant.
          type: ['integer', 'null']
        client: { $ref: '#/components/schemas/ClientRef' }
        booking_id:
          type: ['integer', 'null']
          description: Null on an ad-hoc trip raised without a booking.
        vehicle_id: { type: ['integer', 'null'] }
        vehicle:
          anyOf:
            - { $ref: '#/components/schemas/Vehicle' }
            - { enum: [null] }
        driver_id: { type: ['integer', 'null'] }
        driver:
          anyOf:
            - { $ref: '#/components/schemas/Driver' }
            - { enum: [null] }
        origin: { type: string }
        destination: { type: string }
        pickup:
          description: >
            The same place as `origin`, with coordinates where the platform
            has them. `origin` and `destination` are unchanged and stay —
            every existing client reads them.


            The coordinates come from the walk-in order behind the trip and
            are null on every corporate trip, on any order a dispatcher keyed
            in over the phone, and on any endpoint that did not eager-load
            that relation. **Latitude and longitude are both present or both
            null**; a half-resolved position is not a place, and defaulting
            the missing half to zero puts a Kampala vehicle in the Atlantic
            off Ghana — the swap ADR-0020 records this codebase hitting.
          $ref: '#/components/schemas/TripPlace'
        dropoff: { $ref: '#/components/schemas/TripPlace' }
        status: { $ref: '#/components/schemas/TripStatus' }
        allowed_transitions:
          description: What is legal from this state — not what this user may do.
          type: array
          items: { $ref: '#/components/schemas/TripStatus' }
        pickup_wait_target_seconds:
          type: integer
          description: >
            What the driver app's waiting ring fills against while a trip
            sits at driver_arrived, from `dispatch.pickup_wait_target_seconds`.

            **A display target, not a deadline.** Nothing on this platform
            charges, bounds or ends a wait at the kerb: the rate card's
            free_waiting_minutes bills the *in-trip* Waiting status only,
            and a driver may not post no_show. Passing it changes no state,
            so a client must not treat it as an expiry — the driver app
            fills its ring to full and holds it there while the elapsed
            figure keeps counting.
          example: 300
        payment:
          description: >
            How this job settles, for the driver carrying it — the same fact
            `DispatchOffer.payment` puts on the offer card, served again
            because an offer is answered in fifteen seconds and the drop-off
            can be an hour later.

            Read through an allow-list over `order_requests.details`; that
            column also holds sender_phone and recipient_phone, which
            ADR-0024 §7 withholds, so it is never emitted wholesale.

            **Null is a real answer**, not an omission: a corporate trip is
            invoiced to the client and has no per-trip settlement to collect.
            Null too on any endpoint that did not load the order — every list
            view. Members are individually nullable because both keys are
            optional on the public order form; `cash` is never assumed.
          oneOf:
            - type: 'null'
            # `$ref`, not a second inline copy of the same object. The copy
            # was missing `additionalProperties: false`, which the spec lint
            # refuses (ADR-0011: an undeclared response field would validate
            # silently), and had `payer` as a bare string where the offer's
            # version enumerates it. One shape, one definition.
            - $ref: '#/components/schemas/OfferPayment'
        earnings:
          description: >
            The driver's own share of this trip. Served to that driver alone,
            only where the ledger relation was loaded (`GET /trips/{trip}`,
            never a list), and null until the completion has been credited.
            See `TripEarnings`.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TripEarnings'
        odometer_start: { type: ['integer', 'null'] }
        odometer_start_photo_path: { type: ['string', 'null'] }
        odometer_end: { type: ['integer', 'null'] }
        odometer_end_photo_path: { type: ['string', 'null'] }
        odometer_start_photo_url: { type: ['string', 'null'] }
        odometer_end_photo_url: { type: ['string', 'null'] }
        distance_km:
          type: ['string', 'null']
          description: Decimal serialised as a string ("12.34") — a billing input, not a float.
        gps_distance_km: { type: ['string', 'null'] }
        distance_variance_flagged: { type: ['boolean', 'null'] }
        cancellation_charge_applicable: { type: ['boolean', 'null'] }
        started_at: { $ref: '#/components/schemas/NullableTimestamp' }
        completed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        passenger_contact:
          description: >
            Who to ring, for the driver on this trip and nobody else
            (ADR-0024 §7). Null unless the caller is the assigned driver,
            the trip is a walk-in, and it is live — accepted through
            trip_completed. A completed trip is not a directory.
          anyOf:
            - { $ref: '#/components/schemas/ContactDetails' }
            - { enum: [null] }
        duration_minutes: { type: ['integer', 'null'] }
        fare:
          description: >
            What was actually charged, once somebody drove it (ADR-0026 §2).


            Null until `WalkInFareService::settle()` prices the completed
            trip, and null forever on a corporate trip — a client's work is
            invoiced, and there is no per-trip cash fare to show. Carries the
            rate card version that priced it, because a total with no version
            behind it is a figure nobody can defend in a dispute.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SettledFare'
        estimated_fare:
          description: >
            What the trip is *expected* to fetch, before it is settled — the
            same quote the driver accepted the job on.


            A quote and a settlement are different things, which is why they
            are different fields: `is_estimate` is `true` here and `false` on
            `fare`, so no client has to infer which it holds from the key it
            arrived under.


            Null once `fare` is set, so no screen shows an estimate beside a
            bill. **Also null wherever the trip's originating order request
            was not eager-loaded** — a quote costs queries through Billing,
            and `GET /trips` renders up to a page of trips that nobody is
            reading a fare on. `GET /trips/{id}` loads it; the list does not.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WalkInFareEstimate'
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    TripEvent:
      type: object
      required: [id, trip_id, from_status, to_status, user_id, notes, created_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        trip_id: { type: integer }
        from_status: { $ref: '#/components/schemas/NullableTripStatus' }
        to_status: { $ref: '#/components/schemas/TripStatus' }
        user_id: { type: ['integer', 'null'] }
        user:
          anyOf:
            - { $ref: '#/components/schemas/User' }
            - { enum: [null] }
        notes: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    TripLocation:
      type: object
      required: [latitude, longitude, speed_kph, heading_degrees, accuracy_metres, recorded_at]
      additionalProperties: false
      properties:
        latitude: { type: number }
        longitude: { type: number }
        speed_kph: { type: ['number', 'null'] }
        heading_degrees: { type: ['integer', 'null'] }
        accuracy_metres: { type: ['number', 'null'] }
        recorded_at: { $ref: '#/components/schemas/NullableTimestamp' }

    TripTransitionRequest:
      type: object
      required: [to]
      additionalProperties: false
      properties:
        to:
          description: Every status except invoice_generated, which only invoicing may apply.
          enum:
            - assigned
            - rejected
            - accepted
            - driver_en_route
            - driver_arrived
            - no_show
            - passenger_onboard
            - trip_started
            - waiting
            - trip_resumed
            - trip_completed
            - disputed
            - closed
            - cancelled
        notes:
          type: ['string', 'null']
          maxLength: 1000
          description: Required for cancelled, rejected, no_show and disputed.
        odometer_start:
          type: integer
          minimum: 0
          description: Required for trip_started.
        odometer_end:
          type: integer
          minimum: 0
          description: Required for trip_completed.
        odometer_photo:
          description: Dashboard photo (multipart only). Optional — the reading is an acceptance criterion, the photo is not.
        cancellation_charge_applicable: { type: ['boolean', 'null'] }
        vehicle_id:
          type: ['integer', 'null']
          description: Rejected → Assigned reassignment only.
        driver_id:
          type: ['integer', 'null']
          description: Rejected → Assigned reassignment only.

    Invoice:
      type: object
      required:
        - uuid
        - invoice_number
        - trip_id
        - rate_card_version_id
        - currency
        - total_minor
        - credited_minor
        - balance_minor
        - issued_at
        - issued_by_user_id
        - notes
      additionalProperties: false
      properties:
        uuid: { type: string }
        invoice_number: { type: string }
        trip_id: { type: integer }
        rate_card_version_id: { type: integer }
        currency: { type: string }
        total_minor: { type: integer }
        credited_minor: { type: integer }
        balance_minor: { type: integer }
        issued_at: { $ref: '#/components/schemas/NullableTimestamp' }
        issued_by_user_id: { type: ['integer', 'null'] }
        notes: { type: ['string', 'null'] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/InvoiceLine' }
        credit_notes:
          type: array
          items: { $ref: '#/components/schemas/CreditNote' }

    InvoiceLine:
      type: object
      required:
        - id
        - line_number
        - type
        - type_label
        - description
        - quantity
        - unit_amount_minor
        - amount_minor
        - currency
        - inputs
      additionalProperties: false
      properties:
        id: { type: integer }
        line_number: { type: integer }
        type:
          enum: [base_fare, distance, waiting, minimum_charge_adjustment, maximum_charge_adjustment]
        type_label: { type: string }
        description: { type: string }
        quantity:
          type: ['string', 'null']
          description: Decimal serialised as a string.
        unit_amount_minor: { type: integer }
        amount_minor: { type: integer }
        currency: { type: string }
        inputs:
          description: Every value that went into amount_minor — the reproducibility contract (AGENTS.md).
          type: object
          required:
            - rate_card_version_id
            - vehicle_category
            - zone
            - zone_id
            - distance_km
            - waiting_minutes
            - multiplier_bp
            - rounding_mode
          additionalProperties: false
          properties:
            rate_card_version_id: { type: integer }
            vehicle_category: { type: ['string', 'null'] }
            zone:
              type: ['string', 'null']
              description: >-
                Name of the zone whose rate priced this line, as it read when the
                invoice was issued. Null means the vehicle category's default rate
                priced it — the meaning this field has carried since before zone
                pricing existed, so invoices issued earlier still read correctly.
            zone_id:
              type: ['integer', 'null']
              description: >-
                Identifies the rate row that supplied the unit amount. Zones can be
                renamed, so the name alone cannot reproduce the line.
            distance_km: { type: ['string', 'null'] }
            waiting_minutes: { type: ['integer', 'null'] }
            multiplier_bp: { type: ['integer', 'null'] }
            rounding_mode: { enum: [half_up, half_down, up, down] }

    CreditNote:
      type: object
      required:
        - uuid
        - credit_note_number
        - invoice_id
        - currency
        - total_minor
        - reason
        - issued_at
        - issued_by_user_id
      additionalProperties: false
      properties:
        uuid: { type: string }
        credit_note_number: { type: string }
        invoice_id: { type: integer }
        currency: { type: string }
        total_minor:
          type: integer
          description: Positive — the amount taken off the invoice.
        reason: { type: string }
        issued_at: { $ref: '#/components/schemas/NullableTimestamp' }
        issued_by_user_id: { type: ['integer', 'null'] }
        lines:
          type: array
          items:
            type: object
            required: [line_number, description, amount_minor, invoice_line_id]
            additionalProperties: false
            properties:
              line_number: { type: integer }
              description: { type: string }
              amount_minor: { type: integer }
              invoice_line_id:
                type: ['integer', 'null']
                description: Null on a goodwill or settlement credit correcting no single line.

    RateCard:
      type: object
      required: [id, name, description, status, is_default, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ['string', 'null'] }
        status: { enum: [active, archived] }
        is_default: { type: boolean }
        versions:
          type: array
          items: { $ref: '#/components/schemas/RateCardVersion' }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    RateCardVersion:
      type: object
      required:
        - id
        - version
        - effective_from
        - currency
        - rounding_mode
        - rounding_mode_label
        - free_waiting_minutes
        - night_starts_at
        - night_ends_at
        - night_multiplier_bp
        - is_locked
        - locked_at
        - notes
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        version: { type: integer }
        effective_from: { type: string, format: date }
        currency: { type: string }
        rounding_mode: { enum: [half_up, half_down, up, down] }
        rounding_mode_label: { type: string }
        free_waiting_minutes: { type: ['integer', 'null'] }
        night_starts_at: { type: ['string', 'null'] }
        night_ends_at: { type: ['string', 'null'] }
        night_multiplier_bp: { type: ['integer', 'null'] }
        is_locked:
          type: boolean
          description: A locked version has priced a real invoice and can never change.
        locked_at: { $ref: '#/components/schemas/NullableTimestamp' }
        notes: { type: ['string', 'null'] }
        rates:
          type: array
          items:
            type: object
            required:
              - vehicle_category
              - base_fare_minor
              - per_km_minor
              - per_waiting_minute_minor
              - minimum_charge_minor
              - maximum_charge_minor
              - zone_rates
            additionalProperties: false
            properties:
              vehicle_category: { $ref: '#/components/schemas/VehicleCategory' }
              base_fare_minor: { type: integer }
              per_km_minor: { type: integer }
              per_waiting_minute_minor: { type: integer }
              minimum_charge_minor: { type: integer }
              maximum_charge_minor:
                type: ['integer', 'null']
                description: Null means uncapped, never "capped at zero".
              zone_rates:
                type: array
                description: >-
                  Complete prices that replace the ones above for a trip picked up
                  inside the named zone (ADR-0021). Nested under the category they
                  override, because a zone price cannot exist without one.
                items:
                  type: object
                  required:
                    - zone_id
                    - zone_name
                    - base_fare_minor
                    - per_km_minor
                    - per_waiting_minute_minor
                    - minimum_charge_minor
                    - maximum_charge_minor
                  additionalProperties: false
                  properties:
                    zone_id: { type: integer }
                    zone_name:
                      type: string
                      description: Served even for a retired zone, which soft-deletes rather than vanishing.
                    base_fare_minor: { type: integer }
                    per_km_minor: { type: integer }
                    per_waiting_minute_minor: { type: integer }
                    minimum_charge_minor: { type: integer }
                    maximum_charge_minor:
                      type: ['integer', 'null']
                      description: Null means uncapped, never "capped at zero".
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    RateCardVersionRequest:
      type: object
      required: [effective_from, rates]
      additionalProperties: false
      properties:
        effective_from: { type: string, format: date }
        rounding_mode: { enum: [half_up, half_down, up, down, null] }
        free_waiting_minutes: { type: ['integer', 'null'], minimum: 0, maximum: 1440 }
        night_starts_at:
          type: ['string', 'null']
          description: H:i. Both night times or neither.
        night_ends_at: { type: ['string', 'null'] }
        night_multiplier_bp:
          type: ['integer', 'null']
          minimum: 10000
          maximum: 50000
          description: Basis points; 10000 = 1.0x. A "night rate" below 1.0x is a discount, and discounts are deferred.
        notes: { type: ['string', 'null'], maxLength: 1000 }
        rates:
          type: array
          minItems: 1
          items:
            type: object
            required: [vehicle_category]
            additionalProperties: false
            properties:
              vehicle_category: { $ref: '#/components/schemas/VehicleCategory' }
              base_fare_minor: { type: ['integer', 'null'], minimum: 0 }
              per_km_minor: { type: ['integer', 'null'], minimum: 0 }
              per_waiting_minute_minor: { type: ['integer', 'null'], minimum: 0 }
              minimum_charge_minor: { type: ['integer', 'null'], minimum: 0 }
              maximum_charge_minor: { type: ['integer', 'null'], minimum: 0 }
              zone_rates:
                type: ['array', 'null']
                description: >-
                  Zone prices for this vehicle category (ADR-0021). Each is a
                  complete price, not a partial override. `zone_id` must name an
                  active pricing or client zone visible to the caller's tenant;
                  anything else is a 422 on `rates.N.zone_rates.M.zone_id`, with one
                  message for "does not exist", "belongs to another client" and
                  "switched off" so the endpoint cannot confirm another client's map.
                items:
                  type: object
                  required: [zone_id]
                  additionalProperties: false
                  properties:
                    zone_id: { type: integer }
                    base_fare_minor: { type: ['integer', 'null'], minimum: 0 }
                    per_km_minor: { type: ['integer', 'null'], minimum: 0 }
                    per_waiting_minute_minor: { type: ['integer', 'null'], minimum: 0 }
                    minimum_charge_minor: { type: ['integer', 'null'], minimum: 0 }
                    maximum_charge_minor: { type: ['integer', 'null'], minimum: 0 }

    Notification:
      type: object
      required: [id, type, type_label, subject, body, url, context, is_read, read_at, created_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        type: { enum: [booking.approved, booking.rejected, report.export.ready, order_request.received, trip.offered] }
        type_label: { type: string }
        subject: { type: string }
        body: { type: string }
        url:
          type: ['string', 'null']
          description: Relative, SPA-local route.
        context: { $ref: '#/components/schemas/FreeformMap' }
        is_read: { type: boolean }
        read_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    ReportExport:
      type: object
      required:
        - id
        - report
        - report_label
        - format
        - format_label
        - status
        - filters
        - row_count
        - row_noun
        - file_size
        - is_downloadable
        - is_terminal
        - error
        - expires_at
        - created_at
        - finished_at
      additionalProperties: false
      properties:
        id: { type: integer }
        report: { enum: [trips, drivers, vehicles, financial] }
        report_label: { type: string }
        format: { enum: [csv, xlsx, pdf] }
        format_label: { type: string }
        status: { enum: [queued, processing, completed, failed] }
        filters: { $ref: '#/components/schemas/FreeformMap' }
        row_count: { type: ['integer', 'null'] }
        row_noun: { type: string }
        file_size: { type: ['integer', 'null'] }
        is_downloadable: { type: boolean }
        is_terminal: { type: boolean }
        error: { type: ['string', 'null'] }
        requested_by:
