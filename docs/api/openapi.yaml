# KangaruRide API contract (ADR-0011).
#
# HAND-WRITTEN, and the source of truth: the code is checked against this
# document, never the reverse. A new endpoint's entry here is part of its
# PR (Definition of Done). Every JSON response the backend test suite
# produces is validated against this file, and a route census asserts every
# api/v1 route is documented — see backend/tests/Feature/Ci/.
#
# House rules, enforced by backend/tests/Feature/Ci/OpenApiSpecLintTest.php:
# - Every object schema declares `additionalProperties` — `false` unless it
#   is genuinely a map. Without it a response can grow undeclared fields
#   and still validate, which is the exact failure mode (role_label,
#   TripResource) this contract exists to prevent.
# - Failure responses reuse ErrorEnvelope; its `code` enumerates every
#   ErrorCode case. Clients branch on `code`, never on message text.
# - Binary responses (exports, odometer photos) are declared, not
#   validated.
#
# Dialect notes (proved against the installed validator, see ADR-0011):
# - Nullable is `type: [x, 'null']` (OpenAPI 3.1), not `nullable: true`.
# - `[]`-vs-`{}` unions (PHP serialises an empty map as `[]`) use `anyOf`,
#   not `oneOf` — an empty value matches both branches, and oneOf would
#   reject exactly-one on it.
# - 204 responses are declared explicitly with no content; undeclared
#   statuses fall through to `default`, which expects a JSON error body.
openapi: 3.1.0
info:
  title: KangaruRide API
  version: 1.0.0
  description: >
    Enterprise transport management platform API (v1). All responses use the
    envelope defined in AGENTS.md API Standards: successes carry
    `{success: true, message, data}` (plus `meta` where documented), and
    failures carry `{success: false, code, message, errors}` with a stable
    machine-readable `code`.

paths:
  # ------------------------------------------------------------------
  # Authentication and MFA (Modules/Administration, ADR-0008 / ADR-0010)
  # ------------------------------------------------------------------
  /api/v1/auth/login:
    post:
      summary: First step of login. Returns a token, or an MFA challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string }
                client:
                  type: string
                  enum: [console, driver]
                  description: >
                    Which app is asking (ADR-0022). Omitted means the staff
                    console, which is how every client that predates this
                    behaves. A `driver` token may reach only the Driver's
                    Application surface; anything else answers 403
                    TOKEN_SCOPE_EXCEEDED. Self-declared, and honest about it:
                    it does not restrict the *person* signing in — they may
                    always ask for a console token — it bounds what a token
                    sitting on a phone can be used for.
      responses:
        '200':
          $ref: '#/components/responses/AuthenticatedResponse'
        '202':
          description: >
            Password accepted, login not finished — the account requires a
            second factor (ADR-0008). No token is issued.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [challenge_id, method]
                    additionalProperties: false
                    properties:
                      challenge_id: { type: string }
                      method: { enum: [totp] }
        '429':
          $ref: '#/components/responses/Throttled'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa/verify:
    post:
      summary: Second step of login — spends a challenge against a TOTP or recovery code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              additionalProperties: false
              properties:
                challenge_id: { type: string }
                code: { type: string, maxLength: 64 }
                client:
                  type: string
                  enum: [console, driver]
                  description: >
                    Which app is asking (ADR-0022). Omitted means the staff
                    console, which is how every client that predates this
                    behaves. A `driver` token may reach only the Driver's
                    Application surface; anything else answers 403
                    TOKEN_SCOPE_EXCEEDED. Self-declared, and honest about it:
                    it does not restrict the *person* signing in — they may
                    always ask for a console token — it bounds what a token
                    sitting on a phone can be used for.
      responses:
        '200':
          $ref: '#/components/responses/AuthenticatedResponse'
        '429':
          $ref: '#/components/responses/Throttled'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/logout:
    post:
      summary: Revokes the current token.
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/me:
    get:
      summary: The authenticated account.
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/password:
    patch:
      summary: Changes your own password and revokes every token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              additionalProperties: false
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  # Acting as somebody else, for support (ADR-0056)
  /api/v1/support/act-as:
    get:
      summary: >
        Whether this request is being made by somebody acting as the account,
        and until when. Null for everybody who is simply themselves.
      responses:
        '200':
          description: The live session, or null.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string, nullable: true }
                  data:
                    nullable: true
                    type: object
                    required: [subject_name, expires_at]
                    additionalProperties: false
                    properties:
                      subject_name: { type: string }
                      expires_at: { $ref: '#/components/schemas/Timestamp' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: >
        Begins a support session: the caller acts as another user for thirty
        minutes. Every action taken is recorded against both names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id, reason]
              additionalProperties: false
              properties:
                subject_id: { type: integer }
                reason: { type: string, minLength: 8, maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/ImpersonationSessionResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: >
        Ends the caller's support session. Idempotent — ending one that has
        already lapsed is a success, because stopping must never fail.
      responses:
        '204':
          description: No content.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/password/forgot:
    post:
      summary: >
        Asks for an emailed reset code (ADR-0028 §2). Unauthenticated,
        throttled 3/min/IP — below even auth's rate, because each hit can
        send an email. Answers an identical 202 whether or not the address
        belongs to anybody; 409 AUTH_METHOD_DISABLED while the owner has
        the method off or SMTP unconfigured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 190 }
      responses:
        '202':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/password/reset:
    post:
      summary: >
        Exchanges the emailed code for a new password (ADR-0028 §2).
        Throttled 5/min/IP; the code is single-use, expires in 15 minutes,
        and five wrong guesses burn it. A wrong code and an unknown email
        fail with the same sentence. Success revokes every token the
        account holds — the caller signs in fresh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password, password_confirmation]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 190 }
                code: { type: string, minLength: 6, maxLength: 6 }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/social:
    post:
      summary: >
        "Continue with Google / Facebook" (ADR-0028 §3). Unauthenticated,
        throttled 5/min/IP. The server verifies the provider proof itself
        against the admin-stored credentials — audience included — and
        resolves who the identity is here.
      description: >
        200 signed_in with a driver-scoped token for a linked identity or a
        provider-verified email match on an account that can drive.
        202 sign_up with the verified name and email for a stranger — no
        principal is created; the app takes the two fields to the
        application form (ADR-0027). 409 MFA_REQUIRED for accounts with a
        second factor (social must not bypass it), 403 NOT_A_DRIVER for
        staff accounts, 409 AUTH_METHOD_DISABLED while the owner has the
        provider off, 401 SOCIAL_TOKEN_INVALID when the proof does not
        verify — which check failed goes to the log, never the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, token, client]
              additionalProperties: false
              properties:
                provider: { enum: [google, facebook] }
                token:
                  type: string
                  maxLength: 8192
                  description: Google ID token, or Facebook access token.
                client: { enum: [driver] }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [status, user, token]
                    additionalProperties: false
                    properties:
                      status: { enum: [signed_in] }
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string }
        '202':
          description: No account — apply. Nothing was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [status, name, email]
                    additionalProperties: false
                    properties:
                      status: { enum: [sign_up] }
                      name: { type: string }
                      email: { type: string, format: email }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa/enrol:
    post:
      summary: Begins TOTP enrolment — a fresh secret and its QR code.
      responses:
        '200':
          description: Secret issued, unconfirmed until the confirm step.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [secret, otpauth_uri, qr_svg]
                    additionalProperties: false
                    properties:
                      secret: { type: string }
                      otpauth_uri: { type: string }
                      qr_svg: { type: string }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa/enrol/confirm:
    post:
      summary: Confirms enrolment against a first code; returns the recovery codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, maxLength: 16 }
      responses:
        '200':
          $ref: '#/components/responses/RecoveryCodesResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa/recovery-codes:
    post:
      summary: Regenerates recovery codes, invalidating the previous set.
      responses:
        '200':
          $ref: '#/components/responses/RecoveryCodesResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/mfa:
    delete:
      summary: >
        Removes your own second factor (ADR-0010). Only for a role that does
        not require one — a privileged role gets 403. Proven with a current
        code, like every other MFA mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, maxLength: 16 }
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Staff administration and roles (Modules/Administration, ADR-0004)
  # ------------------------------------------------------------------
  /api/v1/users:
    get:
      summary: Accounts this actor may administer.
      parameters:
        - { name: status, in: query, schema: { enum: [active, suspended] } }
        - { name: role, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        '200':
          description: Accounts, plus the roles this actor may assign.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta:
                    type: object
                    required: [assignable_roles, capabilities, routes]
                    additionalProperties: false
                    properties:
                      routes:
                        type: array
                        description: >
                          The client's active routes this administrator may put a
                          colleague on (ADR-0045 §8). Empty for a platform account,
                          which belongs to no tenant and so has no routes of its own.
                        items:
                          type: object
                          required: [id, name]
                          additionalProperties: false
                          properties:
                            id: { type: integer }
                            name: { type: string }
                      assignable_roles:
                        type: array
                        items:
                          type: object
                          required: [value, label, description]
                          additionalProperties: false
                          properties:
                            value: { type: string }
                            label: { type: string }
                            description: { type: ['string', 'null'] }
                      capabilities:
                        type: array
                        description: The per-person switches a client's administrator may set (ClientCapability), with labels.
                        items:
                          type: object
                          required: [slug, label, description]
                          additionalProperties: false
                          properties:
                            slug: { $ref: '#/components/schemas/ClientCapability' }
                            label: { type: string }
                            description: { type: string }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Creates an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone, role, password]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 32 }
                role: { type: string }
                password: { type: string, minLength: 12 }
                tenant_id: { type: integer, description: Super Admin only. }
                capabilities:
                  type: array
                  items: { $ref: '#/components/schemas/ClientCapability' }
                books_without_approval: { type: boolean }
                route_ids:
                  type: array
                  maxItems: 50
                  description: >
                    The client's routes this colleague rides (ADR-0045 §8). The full
                    list, replacing what was there. Refused for a platform account,
                    which has no routes, and for a route belonging to another client.
                  items: { type: integer }
      responses:
        '201':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/users/{user}:
    parameters:
      - { name: user, in: path, required: true, schema: { type: integer } }
    get:
      summary: One account.
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Updates an account. Suspension revokes its tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 32 }
                role: { type: string }
                status: { enum: [active, suspended] }
                capabilities:
                  type: array
                  description: The full list, replacing what was there — a switch panel is saved whole.
                  items: { $ref: '#/components/schemas/ClientCapability' }
                books_without_approval: { type: boolean }
                route_ids:
                  type: array
                  maxItems: 50
                  description: The full list, replacing what was there — a roster is saved whole (ADR-0045 §8).
                  items: { type: integer }
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/colleagues:
    get:
      summary: >
        The people you may raise a booking for — your own organisation's
        staff, by name or email. Deliberately not a filter on /users: that
        one is gated on `staff.view` and answers with roles, capabilities
        and MFA state, and the Corporate Employee naming a passenger holds
        none of it. Gated on `bookings.create` instead — you may look up a
        colleague if you may book a car for one. `q` is required and the
        result is capped, so this is a lookup and never a directory dump.
        Empty for platform staff, who belong to no tenant and so have no
        colleagues; they book walk-ins by name.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
      responses:
        '200':
          description: At most fifteen matching colleagues.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Colleague' }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Platform settings (Modules/Administration, ADR-0014)
  # ------------------------------------------------------------------
  /api/v1/public/settings:
    get:
      summary: >
        The branding subset, unauthenticated (ADR-0014 §5). Only
        catalogue keys flagged public; asset paths arrive as absolute
        URLs. Throttled 30/min/IP.
      responses:
        '200':
          description: The public branding subset.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [settings]
                    additionalProperties: false
                    properties:
                      settings: { $ref: '#/components/schemas/PublicSettings' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/public/fare-quotes:
    get:
      summary: >
        What a ride would cost, per class, before it is ordered — the public
        tariff (ADR-0026) answering the order form. Unauthenticated: read on
        the form before anybody has an account (ADR-0015 §1 requires one to
        order, not to look), and it reveals only the public tariff's
        arithmetic. Every class is priced through the same
        `WalkInFareService::quote()` the driver's estimate uses, mapped
        through `RideVehicleClass`, so passenger and driver are told one
        number. A class the tariff does not price, or no tariff at all, is
        `null` for that class and 200 — the form falls back to its "from"
        figure. Throttled 30/min/IP.
      parameters:
        - { name: pickup_latitude, in: query, required: true, schema: { type: number } }
        - { name: pickup_longitude, in: query, required: true, schema: { type: number } }
        - { name: dropoff_latitude, in: query, required: true, schema: { type: number } }
        - { name: dropoff_longitude, in: query, required: true, schema: { type: number } }
      responses:
        '200':
          description: One quote per ride class, or null where the tariff is silent.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [quotes]
                    additionalProperties: false
                    properties:
                      quotes:
                        type: object
                        required: [economy, standard, xl, boda, electric_boda]
                        additionalProperties: false
                        properties:
                          economy: { $ref: '#/components/schemas/NullableWalkInFareEstimate' }
                          standard: { $ref: '#/components/schemas/NullableWalkInFareEstimate' }
                          xl: { $ref: '#/components/schemas/NullableWalkInFareEstimate' }
                          boda: { $ref: '#/components/schemas/NullableWalkInFareEstimate' }
                          electric_boda: { $ref: '#/components/schemas/NullableWalkInFareEstimate' }
        '429':
          $ref: '#/components/responses/Throttled'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/public/legal:
    get:
      summary: >
        The Terms, Privacy and Safety notices, unauthenticated (ADR-0014,
        `legal` group). Read by the Driver App's sign-up form, which asks for
        consent to the first two before an account exists — so it cannot sit
        behind one. Kept off /public/settings because these are long and
        rarely wanted, and that endpoint is fetched on every page load.
        Editable by Super Admin through PATCH /settings/legal.
        Throttled 30/min/IP.
      responses:
        '200':
          description: The three documents, as plain text.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [terms, privacy, safety]
                    additionalProperties: false
                    properties:
                      safety:
                        type: string
                        description: >
                          Office-authored safety guidance for the driver app's
                          Safety screen (ADR-0040). Plain text. Not a consent
                          document — nobody agrees to it — but it lives with
                          the other two because it is the same kind of thing:
                          office-authored prose, editable without a deploy,
                          fetched only when somebody opens it.
                      terms:
                        type: string
                        description: >
                          Plain text, newline-separated. Empty only if an
                          administrator has deliberately cleared it — the
                          catalogue ships a short-form notice as its default.
                      privacy: { type: string }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings:
    get:
      summary: >
        Every settings group, resolved against catalogue defaults
        (ADR-0014). Requires settings.manage — the read shows
        operational levers, so it is gated like the write.
      responses:
        '200':
          $ref: '#/components/responses/SettingsResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings/{group}:
    patch:
      summary: >
        Saves one group. Only submitted keys are validated and written;
        unknown keys are refused rather than skipped. Every write is
        audited.
      parameters:
        - { name: group, in: path, required: true, schema: { enum: [branding, regional, ordering, booking, mail, sms, payments] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any subset of the group's keys.
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SettingsResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings/mail/test:
    post:
      summary: >
        Sends a test email through the stored SMTP settings (ADR-0014
        phase 3). Fails 422 until mail is enabled with a host and from
        address; a transport refusal answers 502 MAIL_DELIVERY_FAILED
        carrying the server's own words. Throttled 5/min.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                to:
                  type: ['string', 'null']
                  format: email
                  description: Defaults to the branding contact email.
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settings/assets/{asset}:
    post:
      summary: >
        Logo or favicon upload (ADR-0014 §6). Multipart; the stored path
        is written through the same audited path as any other setting.
      parameters:
        - { name: asset, in: path, required: true, schema: { enum: [logo, favicon] } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: png/jpg/svg/webp up to 2MB for the logo; png/ico/svg up to 512KB for the favicon.
      responses:
        '200':
          $ref: '#/components/responses/SettingsResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/roles:
    get:
      summary: The role catalogue (ADR-0004).
      responses:
        '200':
          description: Roles, the permission catalogue, and what this actor may grant.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
                  meta:
                    type: object
                    required: [catalogue, grantable, can_manage]
                    additionalProperties: false
                    properties:
                      catalogue:
                        description: Permission catalogue grouped for display, keyed by group name.
                        type: object
                        additionalProperties:
                          type: array
                          items: { $ref: '#/components/schemas/ValueLabel' }
                      grantable:
                        type: array
                        items: { type: string }
                      can_manage: { type: boolean }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Creates a custom role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 120 }
                slug: { type: string, maxLength: 120, pattern: '^[a-z][a-z0-9_]*$' }
                description: { type: ['string', 'null'], maxLength: 255 }
                permissions:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '201':
          $ref: '#/components/responses/RoleResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/roles/{role}:
    parameters:
      - { name: role, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Updates a role's name, description or permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: ['string', 'null'], maxLength: 255 }
                permissions:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/RoleResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Deletes a role nobody holds. Refused with ROLE_IN_USE otherwise.
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/audit-logs:
    get:
      summary: The audit trail this reader may see (platform-wide or one tenant's).
      parameters:
        - { name: auditable_type, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { enum: [created, updated, deleted] } }
        - { name: user_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Audit entries, newest first, with the filter vocabulary.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  meta:
                    type: object
                    required: [cursor, filters, scope]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
                      filters:
                        type: object
                        required: [auditable_types, actions, actors]
                        additionalProperties: false
                        properties:
                          auditable_types:
                            type: array
                            items: { type: string }
                          actions:
                            type: array
                            items: { type: string }
                          actors:
                            type: array
                            items: { $ref: '#/components/schemas/ValueLabelInt' }
                      scope: { $ref: '#/components/schemas/Scope' }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Bookings and dispatch (Modules/Bookings, Modules/Dispatch)
  # ------------------------------------------------------------------
  /api/v1/bookings:
    get:
      summary: The booking queue — one client's, or every client's for platform staff.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/BookingStatus' } }
        - { name: dispatchable, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: tenant_id, in: query, schema: { type: integer }, description: Platform staff only. }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Bookings, soonest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Booking' }
                  meta: { $ref: '#/components/schemas/CrossClientListMeta' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Raises a booking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passenger_name, passenger_phone, origin, destination]
              additionalProperties: false
              properties:
                passenger_user_id:
                  type: ['integer', 'null']
                  description: >
                    The colleague travelling. **Required** when a client's own
                    staff raise the booking — their bookings are for their own
                    people — and `passenger_name` is then taken from that
                    account rather than from this request, so one employee
                    cannot arrive spelled three ways. Optional for Shanitah's
                    own staff, who book walk-ins and callers with no account.
                passenger_name: { type: string, maxLength: 255 }
                passenger_phone: { type: string, maxLength: 32 }
                passenger_count: { type: ['integer', 'null'], minimum: 1, maximum: 60 }
                vehicle_category:
                  description: >
                    ADR-0051. Optional; omit or send null for no preference.
                    Validated against the **active** categories — a client
                    may not request one the fleet has stopped running.
                  anyOf:
                    - { $ref: '#/components/schemas/VehicleCategoryKey' }
                    - { enum: [null] }
                origin: { type: string, maxLength: 255 }
                destination: { type: string, maxLength: 255 }
                scheduled_for:
                  type: ['string', 'null']
                  description: Omit or null for an immediate booking. Must be in the future.
                notes: { type: ['string', 'null'], maxLength: 1000 }
      responses:
        '201':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}:
    parameters:
      - { name: booking, in: path, required: true, schema: { type: integer } }
    get:
      summary: One booking, with its trip when dispatched.
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/approval:
    post:
      summary: Approves a pending booking.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/rejection:
    post:
      summary: Rejects a booking, with a reason.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      requestBody:
        $ref: '#/components/requestBodies/DecisionReason'
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/cancellation:
    post:
      summary: Cancels a booking, with a reason.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      requestBody:
        $ref: '#/components/requestBodies/DecisionReason'
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/candidate-vehicles:
    get:
      summary: >
        Every vehicle plus what this booking's contracts say about it
        (ADR-0009) — allocated vehicles rank first, exclusive ones
        elsewhere are marked undispatchable, and requires_override_reason
        tells a form to collect a reason before POSTing the assignment.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Candidate vehicles, allocated first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CandidateVehicle' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/candidate-drivers:
    get:
      summary: >
        Every active driver plus whether they can take this booking
        (ADR-0017) — available first, and the rest listed with a short note
        rather than dropped, because a dispatcher who knows the roster will
        ask where somebody went.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Candidate drivers, available first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CandidateDriver' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/recommendation:
    parameters:
      - { name: booking, in: path, required: true, schema: { type: integer } }
    get:
      summary: What the matcher would choose, ranked, with its reasons (ADR-0020).
      description: >
        Always available, flag or no flag — reading a suggestion can do no
        harm, and it is how an operator builds confidence in the matcher
        before it acts alone. Anything the assignment endpoint would refuse
        is dropped rather than ranked low. Empty when nothing is free.
      responses:
        '200':
          description: Suggestions, best first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DispatchSuggestion' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/auto-assignment:
    parameters:
      - { name: booking, in: path, required: true, schema: { type: integer } }
    post:
      summary: Commits the top suggestion (ADR-0020).
      description: >
        Behind the `dispatch.automatic_enabled` flag, off by default —
        AGENTS.md requires dispatch algorithm changes to ship behind one.
        Commits through the same locked path a human dispatcher uses, so the
        pessimistic locks, allocation rules and availability refusals all
        apply. 409 AUTOMATIC_DISPATCH_DISABLED when the flag is off,
        409 NO_DISPATCH_CANDIDATE when nothing is free.
      responses:
        '201':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/bookings/{booking}/assignment:
    post:
      summary: >
        Assigns a vehicle and driver to a booking, producing its trip.
        Every failure is a 409 with a code the client branches on —
        VEHICLE_UNAVAILABLE, DRIVER_UNAVAILABLE or INVALID_BOOKING_TRANSITION.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, driver_id]
              additionalProperties: false
              properties:
                vehicle_id: { type: integer }
                driver_id: { type: integer }
                allocation_override_reason:
                  type: ['string', 'null']
                  maxLength: 500
                  description: >
                    Required (422) when the vehicle bypasses another client's
                    non-exclusive allocation — recorded on the trip and
                    audited (ADR-0009).
      responses:
        '201':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Walk-in order requests (Modules/Bookings, ADR-0012)
  # ------------------------------------------------------------------
  /api/v1/public/order-requests:
    post:
      summary: >
        The public landing page's request form — the platform's one
        unauthenticated write (ADR-0012). Throttled 3/min/IP. Returns only
        a human-readable reference; no id, no echo of the stored row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_type, contact_name, contact_phone]
              additionalProperties: false
              properties:
                service_type: { enum: [ride, delivery, self_drive] }
                contact_name: { type: string, maxLength: 120 }
                contact_phone:
                  type: string
                  minLength: 9
                  maxLength: 32
                  description: Loose on purpose — 07…, +2567… and 2567… all arrive; the dispatcher dials it either way.
                contact_email: { type: ['string', 'null'], format: email }
                pickup_location:
                  type: ['string', 'null']
                  maxLength: 255
                  description: Required for ride and delivery.
                dropoff_location:
                  type: ['string', 'null']
                  maxLength: 255
                  description: Required for ride and delivery.
                scheduled_for: { type: ['string', 'null'], description: Must be in the future. }
                notes: { type: ['string', 'null'], maxLength: 1000 }
                details:
                  description: Service-specific fields; see the per-service required rules in StorePublicOrderRequest.
                  type: ['object', 'null']
                  additionalProperties: false
                  properties:
                    passengers: { type: ['integer', 'null'], minimum: 1, maximum: 14 }
                    vehicle_class: { enum: [economy, standard, xl, boda, electric_boda, null] }
                    item_type: { enum: [documents, food, parcel, electronics, furniture, appliances, other, null] }
                    package_size: { enum: [small, medium, large, heavy, null] }
                    payer: { enum: [sender, receiver, null], description: Delivery only — which end settles the bill. }
                    payment_method: { enum: [cash, mobile_money, card, null], description: Delivery only. }
                    sender_name: { type: ['string', 'null'], maxLength: 120, description: Delivery only — absent when the account holder is the sender. }
                    sender_phone: { type: ['string', 'null'], maxLength: 32 }
                    recipient_name: { type: ['string', 'null'], maxLength: 120 }
                    recipient_phone: { type: ['string', 'null'], maxLength: 32 }
                    confirm_with_pin: { type: ['boolean', 'null'], description: Delivery only — handover confirmed with a four-digit code. }
                    vehicle_category: { enum: [sedan, suv, van, pickup, null] }
                    start_date: { type: ['string', 'null'], format: date, description: Required for self_drive. }
                    end_date: { type: ['string', 'null'], format: date, description: Required for self_drive. }
                    kyc_documents: { type: ['string', 'null'], maxLength: 255, description: 'Self drive only — comma-separated ids of the identity documents the renter has to hand (national_id, selfie, drivers_license, …). The files are not uploaded; the desk checks originals at collection.' }
                website:
                  type: string
                  description: Anti-spam field. Must be left empty.
      responses:
        '201':
          description: Received. A dispatcher calls back to confirm.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [reference]
                    additionalProperties: false
                    properties:
                      reference: { type: string }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Customer accounts (Modules/Customers, ADR-0013)
  #
  # The second principal's surface. Everything under /customer answers
  # to the `customer` guard, never `auth:sanctum` — a staff token here
  # is a 401, and a customer token anywhere else is a 401 (ADR-0013 §2).
  # ------------------------------------------------------------------
  /api/v1/customer/auth/register:
    post:
      summary: >
        Creates a customer account and returns its token (ADR-0013 §3).
        Unauthenticated write, throttled 5/min/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, phone, email, password]
              additionalProperties: false
              properties:
                first_name: { type: string, maxLength: 60 }
                last_name: { type: string, maxLength: 60 }
                gender:
                  type: string
                  nullable: true
                  enum: [female, male, other, prefer_not_to_say]
                  description: >
                    Optional (ADR-0015 §2). Held to support a same-gender
                    captain preference; Uganda's Data Protection and
                    Privacy Act, 2019 wants a stated purpose for it, which
                    is a reason to offer the question rather than compel it.
                phone:
                  type: string
                  minLength: 9
                  maxLength: 32
                  description: A contact field the dispatcher dials — never a verification channel (no SMS).
                email: { type: string, format: email, maxLength: 190 }
                password: { type: string, minLength: 8, maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/CustomerAuthenticatedResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/auth/login:
    post:
      summary: >
        Customer login (ADR-0013 §3). One 401 message for wrong password
        and unknown email alike; a Google-only account's absent password
        reads the same way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/CustomerAuthenticatedResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/auth/logout:
    post:
      summary: Revokes the current customer token.
      responses:
        '200':
          $ref: '#/components/responses/MessageOnly'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/auth/me:
    get:
      summary: The signed-in customer's own account.
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Customer' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/order-requests:
    get:
      summary: >
        The signed-in customer's own order requests, newest first
        (ADR-0013 §4) — the status checker ADR-0012 deferred, scoped by
        the token so no reference or id is enumerable.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The customer's order requests, page-paginated.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [order_requests]
                    additionalProperties: false
                    properties:
                      order_requests:
                        type: array
                        items: { $ref: '#/components/schemas/CustomerOrderRequest' }
                  meta:
                    type: object
                    required: [page, per_page, total]
                    additionalProperties: false
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/order-requests/{orderRequest}:
    get:
      summary: >
        One of the customer's own order requests. An id outside their own
        rows answers 404, not 403 — that a row exists is itself
        information.
      parameters:
        - { name: orderRequest, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The order request.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [order_request]
                    additionalProperties: false
                    properties:
                      order_request: { $ref: '#/components/schemas/CustomerOrderRequest' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/trips/{trip}/rating:
    post:
      summary: >
        The customer's verdict on a finished ride (ADR-0030 §1). One to five
        stars, optional comment, written once and never editable.
      description: >
        Three conditions, all necessary: the trip's `customer_id` is the
        caller, the trip is `trip_completed`, and no rating exists for it
        yet. Rating before the end rates a journey that has not happened, and
        rating a cancelled trip punishes a driver for a decision that may
        have been the passenger's.


        **Immutable** (§2). An editable rating is a lever over a driver, and
        a mistaken one is corrected by an administrator with an audit trail
        rather than by the passenger. There is deliberately no staff route to
        write one: an office that can score its own drivers has a rating that
        measures the office.


        A trip belonging to another customer answers 404, not 403 — that a
        row exists is itself information.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              additionalProperties: false
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: ['string', 'null'], maxLength: 500 }
      responses:
        '201':
          description: The rating, as recorded.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [stars]
                    additionalProperties: false
                    properties:
                      stars: { type: integer, minimum: 1, maximum: 5 }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/order-requests:
    get:
      summary: The dispatch desk's walk-in queue, oldest first (ADR-0012).
      parameters:
        - { name: status, in: query, schema: { enum: [new, contacted, converted, closed] } }
        - { name: service_type, in: query, schema: { enum: [ride, delivery, self_drive] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Order requests, page-paginated.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [order_requests]
                    additionalProperties: false
                    properties:
                      order_requests:
                        type: array
                        items: { $ref: '#/components/schemas/OrderRequest' }
                  meta:
                    type: object
                    required: [page, per_page, total]
                    additionalProperties: false
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/order-requests/{orderRequest}:
    parameters:
      - { name: orderRequest, in: path, required: true, schema: { type: integer } }
    get:
      summary: One order request.
      responses:
        '200':
          $ref: '#/components/responses/OrderRequestResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: >
        Moves a request through its queue lifecycle. Illegal moves are 409
        INVALID_ORDER_REQUEST_TRANSITION.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { enum: [new, contacted, converted, closed] }
                dispatcher_notes: { type: ['string', 'null'], maxLength: 2000 }
      responses:
        '200':
          $ref: '#/components/responses/OrderRequestResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Companies (Modules/Clients)
  # ------------------------------------------------------------------
  /api/v1/companies:
    get:
      summary: Corporate client companies this actor may see.
      responses:
        '200':
          description: Companies.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Company' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Creates a company under a tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, legal_name, billing_email, city, country]
              additionalProperties: false
              properties:
                tenant_id: { type: integer }
                legal_name: { type: string, maxLength: 255 }
                trading_name: { type: ['string', 'null'], maxLength: 255 }
                registration_number: { type: ['string', 'null'], maxLength: 255 }
                industry: { type: ['string', 'null'], maxLength: 255 }
                billing_email: { type: string, format: email }
                phone: { type: ['string', 'null'], maxLength: 50 }
                address_line1: { type: ['string', 'null'], maxLength: 255 }
                address_line2: { type: ['string', 'null'], maxLength: 255 }
                city: { type: string, maxLength: 255 }
                country: { type: string, maxLength: 255 }
                credit_limit_minor: { type: ['integer', 'null'], minimum: 0 }
      responses:
        '201':
          $ref: '#/components/responses/CompanyResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/companies/{company}:
    parameters:
      - { name: company, in: path, required: true, schema: { type: integer } }
    get:
      summary: One company.
      responses:
        '200':
          $ref: '#/components/responses/CompanyResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Updates a company.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                legal_name: { type: string, maxLength: 255 }
                trading_name: { type: ['string', 'null'], maxLength: 255 }
                registration_number: { type: ['string', 'null'], maxLength: 255 }
                industry: { type: ['string', 'null'], maxLength: 255 }
                billing_email: { type: string, format: email }
                phone: { type: ['string', 'null'], maxLength: 50 }
                address_line1: { type: ['string', 'null'], maxLength: 255 }
                address_line2: { type: ['string', 'null'], maxLength: 255 }
                city: { type: string, maxLength: 255 }
                country: { type: string, maxLength: 255 }
                credit_limit_minor: { type: integer, minimum: 0 }
                status: { enum: [active, suspended] }
      responses:
        '200':
          $ref: '#/components/responses/CompanyResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Deletes a company.
      responses:
        '204':
          description: Deleted. No content.
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Client places and routes (Modules/Clients) - ADR-0045
  # The plan half: what a corporate client pins, and the circuits built
  # from them. Trip stops (the evidence half) are a later pass.
  # ------------------------------------------------------------------
  /api/v1/places:
    get:
      summary: The client's saved places, by name.
      responses:
        '200':
          description: Saved places.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClientPlace' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Pins a location for this client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, latitude, longitude]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                address: { type: ['string', 'null'], maxLength: 255 }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                arrival_radius_m: { type: ['integer', 'null'], minimum: 25, maximum: 5000 }
                notes: { type: ['string', 'null'], maxLength: 2000 }
                is_active: { type: boolean }
      responses:
        '201':
          $ref: '#/components/responses/ClientPlaceResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/places/{place}:
    parameters:
      - { name: place, in: path, required: true, schema: { type: integer } }
    get:
      summary: One saved place.
      responses:
        '200':
          $ref: '#/components/responses/ClientPlaceResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Moves, renames or retires a saved place.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                address: { type: ['string', 'null'], maxLength: 255 }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                arrival_radius_m: { type: ['integer', 'null'], minimum: 25, maximum: 5000 }
                notes: { type: ['string', 'null'], maxLength: 2000 }
                is_active: { type: boolean }
      responses:
        '200':
          $ref: '#/components/responses/ClientPlaceResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: >
        Deletes a saved place. Refused 409 CLIENT_PLACE_IN_USE while any
        route still visits it - the message names those routes.
      responses:
        '204':
          description: Deleted. No content.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/routes:
    get:
      summary: The client's routes, by name, with their stops in order.
      responses:
        '200':
          description: Routes.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClientRoute' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: >
        Builds a route. Stop order is the array's order - a `sequence` sent
        by a caller is ignored. Refused 422 UNKNOWN_CLIENT_PLACE or
        UNKNOWN_ROUTE_MEMBER if any id is not this client's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                reference: { type: ['string', 'null'], maxLength: 40 }
                notes: { type: ['string', 'null'], maxLength: 2000 }
                is_active: { type: boolean }
                stops:
                  type: array
                  maxItems: 25
                  items: { $ref: '#/components/schemas/ClientRouteStopInput' }
                member_ids:
                  type: array
                  maxItems: 50
                  items: { type: integer }
      responses:
        '201':
          $ref: '#/components/responses/ClientRouteResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/routes/preview:
    post:
      summary: >
        The road through an ordered list of the client's places, for a
        circuit that is still being dragged into shape and has no id yet.
        A POST for a read, because 25 ids in a query string is a URL long
        enough for a proxy to truncate - and a truncated list draws a
        shorter circuit rather than failing.

        `data` is null when routing is switched off or the provider
        declined (ADR-0031 §2). That means no line and no distance, never a
        straight line between the stops and never a crow's-flight figure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [place_ids]
              additionalProperties: false
              properties:
                place_ids:
                  description: >
                    Ordered, origin first. A place may legitimately appear
                    twice - head office at both ends is the ordinary shape
                    of a cash run.
                  type: array
                  minItems: 2
                  maxItems: 25
                  items: { type: integer }
      responses:
        '200':
          description: The circuit's shape, or null if none could be drawn.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    oneOf:
                      - { $ref: '#/components/schemas/DrawnRoute' }
                      - { type: 'null' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/routes/{route}:
    parameters:
      - { name: route, in: path, required: true, schema: { type: integer } }
    get:
      summary: One route, with its stops in order and the team who ride it.
      responses:
        '200':
          $ref: '#/components/responses/ClientRouteResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: >
        Edits a route. Omitting `stops` or `member_ids` leaves them
        untouched; sending an empty array empties them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                reference: { type: ['string', 'null'], maxLength: 40 }
                notes: { type: ['string', 'null'], maxLength: 2000 }
                is_active: { type: boolean }
                stops:
                  type: array
                  maxItems: 25
                  items: { $ref: '#/components/schemas/ClientRouteStopInput' }
                member_ids:
                  type: array
                  maxItems: 50
                  items: { type: integer }
      responses:
        '200':
          $ref: '#/components/responses/ClientRouteResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Retires a route (soft delete).
      responses:
        '204':
          description: Deleted. No content.
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Drivers (Modules/Drivers) — the platform's, not a tenant's (ADR-0005)
  # ------------------------------------------------------------------
  /api/v1/drivers:
    get:
      summary: The platform's drivers.
      responses:
        '200':
          description: Drivers.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Driver' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Registers a driver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, license_number, license_expiry]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                phone: { type: string, maxLength: 50 }
                email: { type: ['string', 'null'], format: email }
                license_number: { type: string, maxLength: 100 }
                license_expiry: { type: string, format: date }
                status: { enum: [active, suspended, inactive] }
      responses:
        '201':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/drivers/{driver}:
    parameters:
      - { name: driver, in: path, required: true, schema: { type: integer } }
    get:
      summary: One driver.
      responses:
        '200':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Updates a driver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                phone: { type: string, maxLength: 50 }
                email: { type: ['string', 'null'], format: email }
                license_number: { type: string, maxLength: 100 }
                license_expiry: { type: string, format: date }
                status: { enum: [active, suspended, inactive] }
      responses:
        '200':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Removes a driver.
      responses:
        '204':
          description: Deleted. No content.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/drivers/{driver}/account:
    parameters:
      - { name: driver, in: path, required: true, schema: { type: integer } }
    post:
      summary: Gives a driver the account they sign in with (ADR-0016).
      description: >
        Either mints a new account (email + password) or adopts an existing
        unlinked one (user_id); the two shapes are mutually exclusive. Needs
        drivers.manage AND staff.manage, and the role being granted is checked
        against the caller's own permissions (ADR-0004 escalation rule).
        409 DRIVER_ACCOUNT_CONFLICT if either the profile or the account is
        already linked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: New account
                  required: [email, password]
                  additionalProperties: false
                  properties:
                    email: { type: string, format: email, maxLength: 255 }
                    password: { type: string, minLength: 12 }
                    role: { type: string, description: 'Role slug. Defaults to driver.' }
                    name: { type: string, maxLength: 255, description: "Defaults to the driver profile's name." }
                - type: object
                  title: Existing account
                  required: [user_id]
                  additionalProperties: false
                  properties:
                    user_id: { type: integer }
      responses:
        '201':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Takes the driver's sign-in away and closes their sessions.
      description: >
        Idempotent — a driver with no account is already the requested state.
        Revokes every token the account holds; the account itself survives.
      responses:
        '200':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Driver applications (Modules/Drivers, ADR-0027)
  # ------------------------------------------------------------------
  /api/v1/driver-applications:
    post:
      summary: >
        A rider applying to drive (ADR-0027 §5). Unauthenticated write,
        throttled 5/min/IP — the Driver App's sign-up form posts here.
      description: >
        Writes an application and nothing else: no account, no driver
        profile, no credential that can sign in. Deliberately answers
        identically whether or not the email is already known — a duplicate
        is refused at approval, in front of a human, not at submission in
        front of a script.

        202 on success. **The id is still not returned** — it would be a
        handle for guessing at other people's applications, and there is no
        status checker to use it on (§6). What comes back is the claim ticket
        (ADR-0048 §4): an opaque secret that resolves to this row and nothing
        else on the platform, so the KYC screen can send photographs one at a
        time instead of staking the whole form on a single 48 MB request.
        Returned exactly once — the column holds a SHA-256 of it, and an
        endpoint that would send it again is the oracle §5 refuses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, email, password, password_confirmation, terms_accepted]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                phone:
                  type: string
                  minLength: 9
                  maxLength: 32
                  description: >
                    The number the office calls with the outcome — the only
                    notification channel until ADR-0014 phase 3 lands SMTP.
                email: { type: string, format: email, maxLength: 190 }
                password:
                  type: string
                  minLength: 8
                  description: >
                    The applicant's own choice, hashed at submission and
                    carried to the account at approval — never re-typed,
                    never emailed, never known to the approver (§3).
                    Eight, matching `PATCH /auth/password` and
                    `POST /auth/password/reset` — the doors this password
                    walks through next. Accounts the office mints
                    (`POST /users`, `POST /drivers/{driver}/account`) still
                    hold twelve: those are typed by staff at a desk.
                password_confirmation: { type: string }
                terms_accepted:
                  description: >
                    Consent to the two /public/legal notices. Must be
                    affirmatively true; the accepted-at time is stamped
                    server-side (DPPA 2019 wants consent recorded, and a
                    client-supplied timestamp records nothing).
                  enum: [true, 'true', 1, '1', 'yes', 'on']
      responses:
        '202':
          description: Accepted for review, with a claim ticket for the documents.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [upload_token, upload_expires_at]
                    additionalProperties: false
                    properties:
                      upload_token:
                        type: string
                        minLength: 64
                        maxLength: 64
                        description: >
                          64 opaque random characters. Not the application id,
                          not derived from it, and cannot be walked to a
                          neighbouring row.
                      upload_expires_at:
                        type: string
                        format: date-time
                        description: 24 hours (ADR-0048 §4).
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: The applications queue, oldest first (ADR-0027). drivers.view.
      parameters:
        - { name: status, in: query, schema: { enum: [pending, approved, rejected] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Driver applications, page-paginated.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [driver_applications]
                    additionalProperties: false
                    properties:
                      driver_applications:
                        type: array
                        items: { $ref: '#/components/schemas/DriverApplication' }
                  meta:
                    type: object
                    required: [page, per_page, total]
                    additionalProperties: false
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/driver-applications/documents:
    get:
      summary: >
        The six KYC slots an applicant has filled, by claim ticket
        (ADR-0048 §4). Unauthenticated, throttled 5/min/IP.
      description: >
        **Not the status checker ADR-0027 §6 refuses.** It takes an opaque
        secret minted at submission, never an email address, and answers with
        which document slots the holder has filled — not with a decision, and
        never with file bytes. Unknown, expired and already-decided tickets all
        get the same 404, so the status code cannot be used as an oracle.

        There is deliberately no `{application}` segment: the row is whichever
        one the ticket resolves to, so there is no id in the URL to change.
      parameters:
        - name: upload_token
          in: query
          required: true
          schema: { type: string, minLength: 64, maxLength: 64 }
          description: >
            Accepted here for the GET only. Writes take it in the body or the
            `X-Upload-Token` header — a query string is written to access
            logs, proxy logs and browser history as a matter of course.
      responses:
        '200':
          description: The six slots, grouped and ordered.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverDocumentSlot' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: >
        An applicant sending one of their papers before approval
        (ADR-0048 §4). Unauthenticated, throttled 5/min/IP.
      description: >
        Same mime list and same 8 MB ceiling as the driver's own upload, by
        extension rather than by copy: the file lands on the same private disk
        and becomes the same row on the same driver, so a looser limit here
        would be a way past the fleet's limits by applying instead of being
        hired.

        One request per file rather than the whole set with the application —
        six photographs at 8 MB is a 48 MB request from a handset on a Ugandan
        mobile connection, and when it fails at 80% the applicant loses the
        form as well as the files.

        Re-sending a type **replaces** it (ADR-0033 §2). Optional in every
        sense: approval requires no documents at all (ADR-0048 §6).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [upload_token, type, file]
              additionalProperties: false
              properties:
                upload_token: { type: string, minLength: 64, maxLength: 64 }
                type: { $ref: '#/components/schemas/DriverDocumentType' }
                file:
                  type: string
                  format: binary
                  description: Image or PDF, 8 MB.
                expires_at:
                  type: ['string', 'null']
                  format: date
                  description: >
                    Required for driving_licence and vehicle_insurance, whose
                    entire meaning is a date. Must not be in the past.
      responses:
        '201':
          description: Received. `file_url` is null — metadata, never bytes.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverDocument' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/driver-applications/documents/{type}:
    parameters:
      - name: type
        in: path
        required: true
        schema: { $ref: '#/components/schemas/DriverDocumentType' }
    delete:
      summary: >
        Withdraws one document before anybody has decided (ADR-0048 §4).
        Unauthenticated, throttled 5/min/IP.
      description: >
        For the applicant who realises they sent a document they did not mean
        to send at all — uploading over it fixes a bad photograph, and does
        not help with that. The file is destroyed, not merely unlinked.

        204 whether or not anything was held of that type: nothing held is the
        state the caller asked for, and a 404 would make a retried withdrawal
        look broken.

        **Deliberately not offered to a driver.** ADR-0033 §2 makes
        re-uploading the way a driver corrects a document, and it resets the
        review; a driver who could delete instead could remove a document the
        office had already rejected, taking the objection with it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upload_token]
              additionalProperties: false
              properties:
                upload_token: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '204':
          description: Withdrawn, or nothing was held.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/driver-applications/{driverApplication}:
    parameters:
      - { name: driverApplication, in: path, required: true, schema: { type: integer } }
    get:
      summary: One application (ADR-0027). drivers.view.
      responses:
        '200':
          $ref: '#/components/responses/DriverApplicationResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/driver-applications/{driverApplication}/documents:
    parameters:
      - { name: driverApplication, in: path, required: true, schema: { type: integer } }
    get:
      summary: What the applicant sent, for the office.
      description: >
        The papers uploaded against the applicant's claim ticket (ADR-0048 s4),
        read back by the people deciding. Gated on the **application's** own
        policy rather than a document permission: whoever may read the
        application may read what was attached to it, and a second gate would
        let the queue list an application whose papers it then refused to show.


        The same `DriverDocumentSlot` shape the driver-facing endpoints serve,
        empty slots included — a reviewer asking "can I decide this yet" is
        asking what is missing.
      responses:
        '200':
          description: Every document type, with what is held against it.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverDocumentSlot' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/driver-applications/{driverApplication}/documents/{document}/file:
    parameters:
      - { name: driverApplication, in: path, required: true, schema: { type: integer } }
      - { name: document, in: path, required: true, schema: { type: integer } }
    get:
      summary: The applicant's document file, for the office.
      description: >
        Decrypted on the way out (ADR-0053). A document that does not belong to
        the application in the path is a **404, not a 403** — the same rule and
        the same reason as the driver route: the reviewer's permission covers
        every application, so the policy alone would let a mismatched pair
        address a stranger's national ID, and a 403 would confirm the document
        id exists.
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/driver-applications/{driverApplication}/documents/{document}/verify:
    parameters:
      - { name: driverApplication, in: path, required: true, schema: { type: integer } }
      - { name: document, in: path, required: true, schema: { type: integer } }
    post:
      summary: Accept one of an applicant's documents (ADR-0057).
      description: >
        `drivers.manage` + `staff.manage`, the same pair that decides the
        application. Writes through the one service that records a review, so
        there is no second notion of an accepted document.


        A document that does not belong to the application in the path is a
        **404, not a 403** — the reviewer's permission covers every
        application, so the policy alone would let a mismatched pair address a
        stranger's national ID.
      responses:
        '200':
          description: The document, now accepted.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverDocument' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/driver-applications/{driverApplication}/documents/{document}/reject:
    parameters:
      - { name: driverApplication, in: path, required: true, schema: { type: integer } }
      - { name: document, in: path, required: true, schema: { type: integer } }
    post:
      summary: Ask the applicant to send one document again (ADR-0057).
      description: >
        **Does not close the application.** The other verdicts stand, the files
        survive, and the applicant is emailed a fresh claim ticket so they can
        send a replacement — a refusal they cannot answer costs them the job
        while they wait. Refusing the *person* is
        `/driver-applications/{driverApplication}/reject`, which is a different
        act and still available.


        The reason is required, for the reason ADR-0033 gives about a driver's
        document: a refusal with no reason is how somebody stops using a
        feature, because they cannot tell whether the photograph was blurred
        or the document was wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200':
          description: The document, now refused. The applicant has been emailed.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverDocument' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/driver-applications/{driverApplication}/approve:
    parameters:
      - { name: driverApplication, in: path, required: true, schema: { type: integer } }
    post:
      summary: >
        Approves an application (ADR-0027 §4): creates the driver, mints the
        account with the applicant's own password, links them — one
        transaction. Needs drivers.manage AND staff.manage, and the role
        granted is checked against the caller's own (ADR-0004).
      description: >
        The reviewer supplies what the applicant could not be trusted to:
        the licence they verified in person, and optionally the vehicle and
        role. 409 DRIVER_APPLICATION_DOCUMENTS_PENDING while any document sent
        has not been accepted (ADR-0057 §2) — a document nobody sent does not
        block, because every document is optional at submission.
        409 DRIVER_APPLICATION_CLOSED if somebody decided it already;
        409 DRIVER_ACCOUNT_CONFLICT if the email turned out to be an
        account after all — the duplicate §5 deliberately let through,
        surfacing in front of a human.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_number, license_expiry]
              additionalProperties: false
              properties:
                license_number: { type: string, maxLength: 64 }
                license_expiry: { type: string, format: date, description: Must be in the future. }
                vehicle_id: { type: [integer, 'null'] }
                owns_vehicle:
                  type: boolean
                  description: >
                    Whether the machine is theirs (ADR-0048 §7). A rider
                    recruited at a stage almost always owns the boda they
                    applied on, and the reviewer is the first person on the
                    platform in a position to say so.
                vehicle:
                  description: >
                    Registers the driver's own vehicle in the same transaction
                    as the approval (ADR-0048 §8), for the very common case
                    where the fleet has never seen it. Mutually exclusive with
                    `vehicle_id` — a request carrying both is refused rather
                    than resolved. Needs `vehicles.manage` on top of the
                    approval permissions.
                  oneOf:
                    - type: 'null'
                    - { $ref: '#/components/schemas/InlineVehicle' }
                role: { type: string, description: 'Role slug. Defaults to driver.' }
      responses:
        '201':
          $ref: '#/components/responses/DriverResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/driver-applications/{driverApplication}/reject:
    parameters:
      - { name: driverApplication, in: path, required: true, schema: { type: integer } }
    post:
      summary: >
        Rejects an application, with a reason for the office (ADR-0027 §4).
        Same permission as approving — turning applicants away is not a
        lesser act. 409 DRIVER_APPLICATION_CLOSED if already decided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 5
                  maxLength: 500
                  description: >
                    For the record, not the applicant — nothing sends it to
                    them (§6 gives them no way to read it).
      responses:
        '200':
          $ref: '#/components/responses/DriverApplicationResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Availability (Modules/Fleet) — who and what is off the road (ADR-0017)
  # ------------------------------------------------------------------
  /api/v1/availability-blocks:
    get:
      summary: Periods drivers and vehicles are unavailable.
      description: >
        Filters are whitelisted; an unknown one answers 422 rather than being
        ignored. `from` and `to` must be given together — a window with one
        end is not a window.
      parameters:
        - { name: resource_type, in: query, schema: { enum: [driver, vehicle] } }
        - { name: resource_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { enum: [requested, approved, declined] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Blocks.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AvailabilityBlock' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Takes a driver or vehicle off the road for a period.
      description: >
        Needs drivers.manage for a driver and vehicles.manage for a vehicle —
        the permission follows the resource rather than being one of its own.
        `ends_at` null is open-ended. Recorded as `approved`; the Driver's
        Application records `requested` instead and waits for an answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, resource_id, kind, starts_at]
              additionalProperties: false
              properties:
                resource_type: { enum: [driver, vehicle] }
                resource_id: { type: integer }
                kind: { enum: [leave, sick, rest, training, maintenance, inspection, repair, other] }
                starts_at: { type: string, format: date-time }
                ends_at: { type: ['string', 'null'], format: date-time }
                reason: { type: ['string', 'null'], maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/AvailabilityBlockResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/availability-blocks/{availabilityBlock}:
    parameters:
      - { name: availabilityBlock, in: path, required: true, schema: { type: integer } }
    delete:
      summary: Ends the block, putting the resource back on the road.
      responses:
        '204':
          description: Removed. No content.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/availability-blocks/{availabilityBlock}/answer:
    parameters:
      - { name: availabilityBlock, in: path, required: true, schema: { type: integer } }
    post:
      summary: Approves or declines a request for time off (ADR-0017 section 6).
      description: >
        The far end of the Driver's Application. Only `approved` withholds the
        driver from dispatch. Answering twice is 409
        AVAILABILITY_ALREADY_ANSWERED; answering your own request is 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { enum: [approved, declined] }
                note: { type: ['string', 'null'], maxLength: 255 }
      responses:
        '200':
          $ref: '#/components/responses/AvailabilityBlockResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Customer register (Modules/Customers) — staff side, ADR-0018
  # ------------------------------------------------------------------
  /api/v1/customers:
    get:
      summary: The customer register — the platform's own retail account holders.
      description: >
        Needs customers.view (Dispatcher, Operations Manager, Super Admin).
        Deliberately closed to a corporate client's administrators: these are
        Shanitah's customers, not theirs. `q` searches name, email and phone,
        with punctuation stripped from both sides of the phone comparison.
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: status, in: query, schema: { enum: [active, suspended] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Customers, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerProfile' }
                  meta:
                    type: object
                    required: [cursor, tally]
                    additionalProperties: false
                    properties:
                      cursor:
                        type: object
                        required: [next]
                        additionalProperties: false
                        properties:
                          next: { type: ['string', 'null'] }
                      tally:
                        type: object
                        required: [total, active, suspended]
                        additionalProperties: false
                        properties:
                          total: { type: integer }
                          active: { type: integer }
                          suspended: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customers/{customer}:
    parameters:
      - { name: customer, in: path, required: true, schema: { type: integer } }
    get:
      summary: One customer, as staff see them.
      responses:
        '200':
          $ref: '#/components/responses/CustomerProfileResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customers/{customer}/activity:
    parameters:
      - { name: customer, in: path, required: true, schema: { type: integer } }
    get:
      summary: What this customer has asked for (most recent 50).
      responses:
        '200':
          description: Their order requests, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrderRequest' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customers/{customer}/suspension:
    parameters:
      - { name: customer, in: path, required: true, schema: { type: integer } }
    post:
      summary: Suspends the account and closes every session it holds.
      description: >
        Needs customers.manage. The reason is required — it is the sentence a
        support agent reads back to the customer. Suspension also refuses the
        next sign-in, with the ordinary wrong-credentials answer so the login
        form cannot be used to enumerate accounts in trouble.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 10, maxLength: 255 }
      responses:
        '200':
          $ref: '#/components/responses/CustomerProfileResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Restores the account. Tokens are not restored — they sign in again.
      responses:
        '200':
          $ref: '#/components/responses/CustomerProfileResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Live positions (Modules/Trips) — ADR-0019
  # ------------------------------------------------------------------
  /api/v1/live-positions:
    get:
      summary: Where the fleet is right now.
      description: >
        One entry per vehicle on a trip that has not finished. Visibility is
        resolved through the trips query — a client sees only their own, a
        driver only the trip they are on — so it can never diverge from the
        trips listing. `age_seconds` is measured from the device clock, not
        from storage time, so ingestion lag is visible rather than hidden.
      parameters:
        - name: tenant_id
          in: query
          description: Platform readers only; narrows to one client (ADR-0006).
          schema: { type: integer }
      responses:
        '200':
          description: Vehicles currently moving.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LivePosition' }
                  meta:
                    description: >
                      Same contract as /trips — whether this list spans
                      clients, and the clients a platform reader may narrow
                      to with `tenant_id`.
                    type: object
                    required: [scope, filters]
                    additionalProperties: false
                    properties:
                      scope: { $ref: '#/components/schemas/Scope' }
                      filters: { $ref: '#/components/schemas/ClientsFilter' }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # A driver's own time off (Modules/Fleet) — ADR-0017 section 6
  # The Driver's Application asks here; the office answers at
  # /availability-blocks/{id}/answer.
  # ------------------------------------------------------------------
  /api/v1/me/availability-requests:
    get:
      summary: The signed-in driver's own requests for time off, and their answers.
      description: >
        403 NOT_A_DRIVER when the account is not linked to a driver profile —
        the feature exists, this account simply is not a driver.
      responses:
        '200':
          description: Their requests, most recent first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AvailabilityBlock' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Asks the office for time off.
      description: >
        Takes no `resource_id` and no `status`: the request is pinned to the
        caller's own driver profile in the `requested` state by the server, so
        a driver cannot ask on somebody else's behalf or grant themselves
        leave. **Asking does not withhold them from dispatch** — only an
        `approved` answer does. Throttled to 10 a minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, starts_at, reason]
              additionalProperties: false
              properties:
                kind:
                  description: Only reasons a person is away; a driver cannot book maintenance.
                  enum: [leave, sick, rest, training, other]
                starts_at: { type: string, format: date-time }
                ends_at:
                  description: Null is open-ended; the office pins the end when it answers.
                  type: ['string', 'null']
                  format: date-time
                reason: { type: string, minLength: 5, maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/AvailabilityBlockResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/availability-requests/{availabilityBlock}:
    parameters:
      - { name: availabilityBlock, in: path, required: true, schema: { type: integer } }
    delete:
      summary: Withdraws a request the office has not answered yet.
      description: >
        409 AVAILABILITY_ALREADY_ANSWERED once answered — deleting an approval
        would put the driver back on the roster with nobody knowing. Another
        driver's request answers 404, not 403.
      responses:
        '204':
          description: Withdrawn. No content.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/rides/active:
    get:
      summary: The signed-in customer's current ride.
      description: >
        What replaces the simulated ride source in the public order flow
        (ADR-0024 §7). **Takes no identifier at all** — the customer asks for
        their own ride, so there is nothing in the request to tamper with.


        Keying this by the `KR-` reference was rejected: ADR-0012 gave the
        public order endpoint nothing enumerable to return precisely because
        a six-character code is guessable, and a lookup by it — even behind a
        token — would reintroduce that.


        200 with a null `data` when there is no ride in progress, not 404:
        "no ride" is a state the screen renders, and a 404 would make a
        genuinely broken request render as that same state.


        The captain's phone number appears only while the trip is live and
        disappears at a terminal status.
      responses:
        '200':
          description: The ride, or null.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    anyOf:
                      - { $ref: '#/components/schemas/CustomerRide' }
                      - { enum: [null] }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/customer/rides/active/cancellation:
    post:
      summary: The passenger calls their current ride off.
      description: >
        ADR-0024 §7. No identifier, for the same reason the read above takes
        none: the ride is whichever one is active for this token.


        One button, two acts. Before a captain is assigned there is no trip —
        the order is closed and any offer still out is superseded, so a driver
        cannot accept a ride that has just been called off. After one is
        assigned the trip is cancelled through `TripStateMachine`, releasing
        the driver and vehicle back into the pool.


        **409 once the journey has started.** `TripStatus` has no edge from
        `trip_started` to `cancelled`: a journey under way ends by being
        finished, and the opening odometer is evidence that cannot be
        un-booked. A passenger who needs out mid-journey speaks to their
        Captain.


        Whether anybody is charged is deliberately not decided here.
        ADR-0024 defers walk-in cancellation charges by name, so
        `cancellation_charge_applicable` is left null — the column's own way
        of saying undecided.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  description: >
                    The customer's own words. Free text rather than an enum:
                    the screen's closed list ends in "Something else", which
                    exists precisely to carry a sentence.
                  type: ['string', 'null']
                  maxLength: 500
      responses:
        '200':
          description: The ride was cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { enum: [null] }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Device registration (Modules/Notifications) — ADR-0025 §4
  # ------------------------------------------------------------------
  /api/v1/me/devices:
    post:
      summary: Registers this app install for push notifications.
      description: >
        Idempotent by the token's unique index, so the app may call it on
        every sign-in and every OS token rotation without accumulating rows.


        The token is **globally** unique, not unique per user: a shared depot
        handset signed in as one driver and then another must not be
        reachable as both, or the first driver's job offers — pickup address
        included — land on whoever is holding it now. The newer registration
        takes the row.


        Takes no `user_id`; the account is the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token:
                  description: >
                    Opaque, and deliberately not pattern-matched. ADR-0025 §2
                    keeps FCM and APNs available behind the same channel, and
                    those tokens look nothing like Expo's.
                  type: string
                  maxLength: 255
                provider: { enum: [expo] }
                platform: { type: ['string', 'null'], maxLength: 20 }
                app_version: { type: ['string', 'null'], maxLength: 40 }
      responses:
        '204':
          description: Registered. No content.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/devices/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    delete:
      summary: Unregisters this app install.
      description: >
        Called on sign-out. A shared handset that kept its previous driver's
        token would deliver another person's job offers to whoever holds it.


        204 whether or not a row went: unregistering something already gone is
        the outcome the caller wanted, and a 404 would make sign-out fail on a
        retry. A token belonging to somebody else is simply not found — and
        answers the same, because "that exists but is not yours" is not worth
        confirming.
      responses:
        '204':
          description: Unregistered. No content.
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Job offers (Modules/Dispatch) — ADR-0024 §3
  #
  # The driver's side of automatic dispatch. An offer is NOT a trip: nothing
  # is written to `trips` until a driver accepts, because a trip in
  # `assigned` occupies its vehicle and an unanswered offer must not.
  #
  # This list is the source of truth, not the push notification — ADR-0025 §3
  # makes push best-effort, so everything a push says is readable here.
  # ------------------------------------------------------------------
  /api/v1/me/offers:
    get:
      summary: Jobs currently offered to the signed-in driver.
      description: >
        Live offers only. An offer whose clock ran out while the handset was
        in a dead zone is absent rather than listed — rendering it would give
        the driver a countdown reading a negative number and a button whose
        only outcome is a 409.


        403 NOT_A_DRIVER when the account is not linked to a driver profile.
      responses:
        '200':
          description: Offers in front of this driver, soonest to expire first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DispatchOffer' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/offers/{offer}/acceptance:
    parameters:
      - { name: offer, in: path, required: true, schema: { type: integer } }
    post:
      summary: Takes the job, creating the trip.
      description: >
        Goes through the same pessimistic locks every other assignment path
        takes (`TripAssignmentGuard`), so a driver or vehicle committed
        elsewhere in the seconds the offer was out rolls the whole accept
        back — 409 VEHICLE_UNAVAILABLE or DRIVER_UNAVAILABLE.


        409 OFFER_NO_LONGER_OPEN when the clock ran out, another driver was
        faster, or the desk fulfilled the order by hand. One code for all
        three: from the driver's side they are the same event.


        409 OFFER_HAS_NO_VEHICLE when the driver is on duty without one.
        404 for another driver's offer id — not 403, which would confirm it
        exists.


        Returns the Trip rather than the offer, so the app moves straight to
        a trip screen without a second request.
      responses:
        '201':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/offers/{offer}/decline:
    parameters:
      - { name: offer, in: path, required: true, schema: { type: integer } }
    post:
      summary: Says no, and moves the search to the next driver immediately.
      description: >
        The search advances in this request rather than waiting out the
        clock — that is the whole value of a decline over a timeout.


        200 rather than 204: an empty response over a bad connection is
        indistinguishable from a request that never arrived, and a driver who
        declines is entitled to know it registered. Answering an already
        settled offer is not an error; the intent and the outcome agree.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: ['string', 'null'], maxLength: 255 }
      responses:
        '200':
          description: Declined. The envelope's `data` is null — the message is the payload.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { enum: [null] }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Driver presence (Modules/Fleet) — ADR-0024 §2
  #
  # The input automatic dispatch was missing. `/live-positions` answers
  # "where is this vehicle on this trip" and is written by the GPS pipeline
  # from Trip Started onward, so a driver waiting at a stage for work
  # reported nothing at all. These say "I am available, and I am here".
  # ------------------------------------------------------------------
  /api/v1/me/profile:
    get:
      summary: >
        Who the signed-in driver is on the platform — the app's Profile
        screen.
      description: >
        Separate from `/me/stats` rather than a fatter payload on it: stats is
        polled by the home screen every sixty seconds, and a lifetime `COUNT`,
        a vehicle join and a documents summary should not ride along on every
        poll. Same argument that kept `/me/earnings` off `/me/stats`.

        **The rating is deliberately not here.** `/me/stats` already produces
        it under ADR-0030's withholding rule, and a second reading of a figure
        that is suppressed below five ratings is a second chance to publish it
        by mistake.

        `vehicle` is **null for a driver who has none**, which is not an edge
        case: a corporate driver takes whatever the depot hands them that
        morning, and `driver_presence.vehicle_id` is the per-shift answer.
        `make` and `model` are individually nullable — a plate typed in a hurry
        with no make is a real row.
      responses:
        '200':
          description: The driver's profile.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverProfile' }
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: A driver correcting their own name or phone number.
      description: >
        **Two fields, and the omissions are the design.** The office's
        `PATCH /drivers/{driver}` accepts seven; the five withheld here are
        withheld for reasons that are not about trust.

        `license_number` and `license_expiry` are the compliance facts the
        office verifies (ADR-0033) — a driver who can edit their own expiry
        self-certifies their own compliance, and the review queue stops meaning
        anything. `status` is a dispatch control, so a suspended driver who
        could set it has undone the suspension. `vehicle_id` is a Fleet
        allocation. `email` is the login credential (ADR-0016): changing it
        needs re-authentication and a notice to the old address, and a mistyped
        one locks somebody out of their own account — a feature of its own, not
        a field on this form.

        Either field may be sent alone, so correcting a phone number cannot
        blank a name. The profile screen shows all five withheld fields and says
        who manages them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 255 }
                phone:
                  type: string
                  maxLength: 50
                  description: >
                    Deliberately unconstrained in shape, matching the office's
                    own rule. PRODUCT.md is East Africa first and international
                    after: a pattern tuned to `+256` silently refuses `+254`,
                    and the platform must not accept a number it then refuses to
                    let its owner correct.
      responses:
        '200':
          description: The updated profile, in full.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverProfile' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/closure-request:
    get:
      summary: The driver's current or most recent account-closure request.
      description: >
        ADR-0043. Returns the **latest** request rather than only an open one,
        so the screen can show a declined answer and its reason - a driver who
        was refused needs to read why more than they need the row to vanish.

        Null where they have never asked.
      responses:
        '200':
          description: The request, or null.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [closure_request]
                    additionalProperties: false
                    properties:
                      closure_request:
                        oneOf:
                          - { $ref: '#/components/schemas/DriverClosureRequest' }
                          - { type: 'null' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Ask the office to close the account.
      description: >
        **Asking closes nothing.** The office's confirmation deactivates the
        driver and detaches their sign-in; until then they can still work.

        Closing is **not deleting**: trips, pay records, invoices and the audit
        trail survive, because `master-plan.md` section 6 stakes the product on
        their staying reproducible. Personal details are removed on the
        retention schedule, measured from the closure.

        The reason is optional - requiring somebody to justify leaving is a dark
        pattern, and a mandatory box produces a full stop more often than a
        reason.

        Answers **409 `CLOSURE_REQUEST_ALREADY_OPEN`** where one is already
        waiting; withdraw it first.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: ['string', 'null'], maxLength: 500 }
      responses:
        '200':
          description: The request, waiting for the office.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [closure_request]
                    additionalProperties: false
                    properties:
                      closure_request: { $ref: '#/components/schemas/DriverClosureRequest' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Withdraw a pending request.
      description: >
        The driver changing their mind. ADR-0032 left this out of settlement
        requests and recorded that its absence was more annoying than it looked;
        without it the one-open-per-driver rule makes the decision unfixable
        without ringing the office.

        Answers **404** where nothing is waiting.
      responses:
        '200':
          description: Withdrawn; the account stays open.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [closure_request]
                    additionalProperties: false
                    properties:
                      closure_request: { $ref: '#/components/schemas/DriverClosureRequest' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/closure-requests:
    get:
      summary: The office queue of drivers asking to leave.
      description: >
        ADR-0043. `drivers.manage`. Pending first, then newest - a queue sorted
        only by date buries the rows needing an answer under the ones already
        answered.
      responses:
        '200':
          description: Up to 100 requests.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverClosureRequest' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/closure-requests/{closureRequest}/confirm:
    post:
      summary: Close the account.
      description: >
        Deactivates the driver, detaches their sign-in through ADR-0016's own
        service, and stamps the closure - **the clock the retention sweep runs
        on**. Emails the driver, because by now they cannot sign in to be told
        any other way.

        **Deletes nothing**: no trip, no ledger entry, no invoice, no audit row,
        and not the payout destination - the office may still owe a final
        payment.

        Answers **409 `CLOSURE_REQUEST_ALREADY_DECIDED`** where a colleague got
        there first; a second confirm would move the retention clock.
      parameters:
        - name: closureRequest
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [closure_request]
                    additionalProperties: false
                    properties:
                      closure_request: { $ref: '#/components/schemas/DriverClosureRequest' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/closure-requests/{closureRequest}/decline:
    post:
      summary: Refuse to close the account, with a reason.
      description: >
        The reason is **required**, unlike the driver's. A driver leaving owes
        nobody an explanation; an office refusing to let them leave does -
        "settle your balance first" is an answer they can act on, and it is
        emailed to them.
      parameters:
        - name: closureRequest
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Declined, and the driver emailed.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [closure_request]
                    additionalProperties: false
                    properties:
                      closure_request: { $ref: '#/components/schemas/DriverClosureRequest' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/payout-account:
    get:
      summary: Where the signed-in driver's money is sent.
      description: >
        ADR-0042. **Nothing on this path moves money.** ADR-0029 §6's boundary
        is unchanged — the platform records a destination so the office knows
        where to send what ADR-0032's confirm flow says is owed.

        `payout_account` is **null for a driver who has not given any details**,
        which is a normal first-visit state rather than an error, and the screen
        renders it as an empty form.

        **The account number is masked to its last four characters and the whole
        number is never in this payload** (ADR-0042 §4). A driver confirming
        "yes, that is my account" needs the tail; they do not need a full
        account number echoed to a handset that may be shared or shoulder-read.
        The office reads the whole number from
        `/api/v1/drivers/{driver}/payout-account`.
      responses:
        '200':
          description: The destination, or null.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [payout_account]
                    additionalProperties: false
                    properties:
                      payout_account:
                        oneOf:
                          - { $ref: '#/components/schemas/DriverPayoutAccount' }
                          - { type: 'null' }
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Set or replace it.
      description: >
        **Every field is required on every save.** A destination is one fact
        made of four parts, and a partial update would let a driver change the
        bank while leaving last month's account number — a working destination
        pointing at the wrong place, which is the worst state this record can
        hold.

        Idempotent: saving twice leaves one destination, so a driver on a bad
        connection who taps Save again does not get a conflict.

        `account_number` has **no shape rule**, deliberately. Ugandan bank
        account numbers vary in length by bank, a mobile-money number may be
        typed `+256700123456` or `0700123456`, and PRODUCT.md is East Africa
        first and international after — a pattern here would refuse a real
        account and leave its owner unable to be paid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, institution, account_holder, account_number]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [bank, mobile_money] }
                institution:
                  type: string
                  maxLength: 120
                  description: The bank or mobile-money provider — "Stanbic", "MTN MoMo".
                account_holder: { type: string, maxLength: 255 }
                account_number: { type: string, minLength: 4, maxLength: 64 }
      responses:
        '200':
          description: The destination as saved, masked.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [payout_account]
                    additionalProperties: false
                    properties:
                      payout_account: { $ref: '#/components/schemas/DriverPayoutAccount' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove it.
      description: >
        Answers the same shape whether or not one was held, so a second tap is
        not an error.
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [payout_account]
                    additionalProperties: false
                    properties:
                      payout_account:
                        type: ['object', 'null']
                        additionalProperties: false
                        description: Always null here — the destination is gone.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/drivers/{driver}/payout-account:
    get:
      summary: The office reading where a driver's money is sent.
      description: >
        ADR-0042 §4. **Returns the whole account number**, because a clerk
        cannot wire money to a mask — which is why this is a separate path and
        a separate resource from the driver's own masked one.

        Gated on `drivers.manage` through `DriverPolicy@view`, and audited: a
        read here is a staff member looking at somebody's bank account.

        Answers **404 with `NOT_FOUND`** where the driver exists but has given
        no details, which the office must be able to tell apart from a missing
        driver — the first is a phone call, the second is a bug.
      parameters:
        - name: driver
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The destination, in full.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [payout_account]
                    additionalProperties: false
                    properties:
                      payout_account: { $ref: '#/components/schemas/OfficePayoutAccount' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/photo:
    get:
      summary: The signed-in driver's photograph, streamed.
      description: >
        Never a storage URL, on ADR-0033 §5's argument — and it applies more
        strongly here than to a licence scan, not less. A signed link is
        addressable by anyone who ever saw it; a licence is fetched once by a
        reviewer, while this image is loaded every time a driver opens the
        drawer, travelling through proxies, caches and crash reports dozens of
        times a day.

        No id in the path, so no policy question: the driver **is** the token
        and this route cannot name anybody else. `404` where nothing is held —
        the app falls back to the driver's initials rather than a broken image.
      responses:
        '200':
          description: >
            The photograph, under **the stored file's own content type** —
            verified against a running server, which answers `image/png` for a
            PNG rather than the `application/octet-stream` its sibling
            `/me/documents/{document}/file` declares.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Sets or replaces the photograph.
      description: >
        `multipart/form-data`. A driver has **one** photograph: the previous
        file is deleted in the same act that records the new path, because the
        alternative is a private disk that accumulates a portrait every time
        somebody dislikes their haircut — and photographs of people are the
        last thing that should accumulate untracked.

        The delete runs **after** the new path is committed, never before. The
        other order leaves a row pointing at a file that no longer exists,
        which renders as a broken image instead of falling back to initials.

        `photo_url` carries a **cache-busting query derived from the stored
        path**. Without it the app's image cache goes on showing the previous
        portrait, on the one screen whose whole job is telling a driver this
        account is theirs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    `jpg`, `jpeg`, `png` or `webp`, up to 4 MB — **half the
                    document ceiling, and no PDF**. A licence has to be legible
                    enough to read a number off; a portrait is rendered at 64
                    points and never read, and the uploader pays for their own
                    data. A PDF in this slot would be a file the app cannot
                    render in the one place whose whole job is being rendered.
      responses:
        '200':
          description: The photograph was stored.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [photo_url]
                    additionalProperties: false
                    properties:
                      photo_url: { type: ['string', 'null'] }
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Removes the photograph, file and row together.
      description: >
        A thing a driver is entitled to do, and the file goes with the row. A
        photograph of somebody kept after they asked for it to be removed is
        exactly what the privacy notice promises not to do — *"ask us to delete
        it when it is no longer needed"*.

        Answers `200` with `photo_url: null` whether or not one was held:
        removing something already absent is the state the caller asked for.
      responses:
        '200':
          description: Nothing is held.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [photo_url]
                    additionalProperties: false
                    properties:
                      photo_url: { enum: [null] }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/application/documents:
    get:
      summary: The signed-in applicant's own application documents (ADR-0057).
      description: >
        For somebody who has applied and not yet been approved. Since
        ADR-0057 s5 an account is minted at submission, so an applicant can
        sign in and see what the office said about each document — including
        the reason a refused one was refused, which is what makes "send it
        again" actionable.


        **The subject is the token.** There is no id in the path or the body,
        so a caller cannot ask for somebody else's application by changing a
        number. A decided application answers 404 like an absent one:
        distinguishing them would report a rejection through an HTTP status.


        Distinct from `/me/documents`, which resolves a driver through
        `drivers.user_id` and answers "not a driver" for an applicant.
      responses:
        '200':
          description: Every document type, with what is held against it.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverDocumentSlot' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Send one application document again (ADR-0057).
      description: >
        Replaces whatever was held of that type, which is what makes answering
        a refusal a single photograph rather than a fresh application. Same
        rules as the driver's own upload: the same types, the same mime list,
        and an expiry required on the types whose meaning is a date.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              additionalProperties: false
              properties:
                type: { $ref: '#/components/schemas/DriverDocumentType' }
                file: { type: string, format: binary }
                expires_at: { type: string, format: date, nullable: true }
      responses:
        '201':
          description: Received. It goes back to the office as pending.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverDocument' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/documents:
    get:
      summary: The signed-in driver's papers — every type, held or not.
      description: >
        **The un-uploaded types are the point** (ADR-0033). A list of what has
        been sent answers "what have I sent"; a driver opening this screen is
        asking "what do I still owe you", and only the full set answers that.
        An absent type comes back as a real type with `document: null`.

        `compliance_state` on a document is **not** always its stored `status`.
        A `verified` document whose `expires_at` has passed reports `expired`:
        expiry outranks verification, because a licence that lapsed last month
        is not a verified licence. The comparison is made in the operator's
        timezone (`settings.regional.timezone`) and is never stored — a stored
        expiry state needs a nightly job and is wrong between runs.
      responses:
        '200':
          description: Every document type, with what is held against it.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverDocumentSlot' }
                  meta:
                    type: object
                    required: [compliance]
                    additionalProperties: false
                    properties:
                      compliance: { $ref: '#/components/schemas/DriverDocumentCompliance' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Uploads a document, replacing anything already held of that type.
      description: >
        `multipart/form-data`. **A replacement resets the review** — status
        goes back to `pending` and the reviewer, review time and rejection
        reason are cleared, because a document the office verified is not
        evidence for a different file that arrived afterwards (ADR-0033 §2).
        The superseded file is deleted.

        **Not routed through the offline outbox** (ADR-0023), unlike every
        other mutation the driver app makes: that queue carries small JSON
        transitions, and an eight-megabyte photograph is a different problem.
        This needs a connection.

        `expires_at` is **required** for `driving_licence` and
        `vehicle_insurance`, whose entire meaning is a date, and optional for
        the other two. A date of today is accepted — a licence expiring today
        is valid today.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              additionalProperties: false
              properties:
                type: { $ref: '#/components/schemas/DriverDocumentType' }
                file:
                  type: string
                  format: binary
                  description: >
                    `jpg`, `jpeg`, `png`, `webp` or `pdf`, up to 8 MB. The list
                    is closed rather than open: this is an upload from an
                    unprivileged client straight onto the operator's disk.
                expires_at:
                  type: ['string', 'null']
                  format: date
                  description: A date, not an instant. Must not already have passed.
      responses:
        '201':
          description: The document was filed and is waiting for the office.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverDocument' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/documents/{document}/file:
    get:
      summary: The document file itself, streamed.
      description: >
        Never a storage URL (ADR-0033 §5): a signed link to somebody's identity
        document is addressable by anyone who ever saw it, for as long as it
        lives. `OdometerPhotoController` makes the same argument about a
        dashboard photograph, and it applies here more strongly.

        The one `/me` route that takes an id, and therefore the one with a
        policy check — a driver may read their own row only.
      parameters:
        - in: path
          name: document
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/drivers/{driver}/documents:
    get:
      summary: One driver's papers, for the office.
      description: >
        `drivers.manage`. The same shape `/me/documents` serves, so the console
        and the app render one vocabulary — an office asked "what is missing"
        needs the empty slots as much as the driver does.
      parameters:
        - in: path
          name: driver
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Every document type, with what is held against it.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverDocumentSlot' }
                  meta:
                    type: object
                    required: [compliance]
                    additionalProperties: false
                    properties:
                      compliance: { $ref: '#/components/schemas/DriverDocumentCompliance' }
        default:
          $ref: '#/components/responses/Error'

    post:
      summary: The office filing a document on a driver's behalf (ADR-0052 §5).
      description: >
        `drivers.manage`. A driver hands their licence across the counter, or
        emails a scan, or photographs it badly six times and gives up. Until
        this endpoint the only way a document reached the platform was the
        handset in that driver's pocket.

        **Filing is not verifying.** The row lands `pending` with every review
        field cleared, exactly as the driver's own upload does — ADR-0033 §4's
        "nothing is auto-verified, ever" applies to the office as much as to a
        machine, and accepting it is a second act with its own audit entry.

        Same request shape, mime list, 8 MB ceiling and per-type expiry rule as
        `/me/documents`, by sharing the form request rather than restating it.
        Re-sending a type **replaces** what is held (ADR-0033 §2).
      parameters:
        - in: path
          name: driver
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              additionalProperties: false
              properties:
                type: { $ref: '#/components/schemas/DriverDocumentType' }
                file:
                  type: string
                  format: binary
                  description: Image or PDF, 8 MB.
                expires_at:
                  type: ['string', 'null']
                  format: date
                  description: >
                    Required for driving_licence and vehicle_insurance, whose
                    entire meaning is a date. Must not be in the past.
      responses:
        '201':
          description: Filed, and waiting for somebody to check it.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverDocument' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/drivers/{driver}/documents/{document}/file:
    get:
      summary: The document file, for the office.
      description: >
        `drivers.manage`. A document that does not belong to the driver in the
        path is a **404, not a 403**: the reviewer holds the permission over
        every driver, so the policy alone would allow a mismatched pair to
        address somebody else's licence.
      parameters:
        - in: path
          name: driver
          required: true
          schema: { type: integer }
        - in: path
          name: document
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/drivers/{driver}/documents/{document}/verify:
    post:
      summary: The office accepts a document.
      description: >
        `drivers.manage`. A POST to a sub-path rather than a PATCH on a status
        field, for the reason the application and settlement decisions are:
        this is a decision with its own audit meaning, and a status field would
        make accepting somebody's licence look like an edit.

        **Nothing else can reach this state.** There is no OCR, no third-party
        check, and no rule that verifies a document because its expiry is in
        the future (ADR-0033 §4).
      parameters:
        - in: path
          name: driver
          required: true
          schema: { type: integer }
        - in: path
          name: document
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The document is verified.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverDocument' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/drivers/{driver}/documents/{document}/reject:
    post:
      summary: The office turns a document down, and says why.
      description: >
        `drivers.manage`. **`reason` is required.** A rejection with no reason
        is how a driver stops using a feature: they are told no, cannot tell
        whether the photograph was blurred or the document was wrong, and
        re-upload the same file.
      parameters:
        - in: path
          name: driver
          required: true
          schema: { type: integer }
        - in: path
          name: document
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200':
          description: The document is rejected.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverDocument' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/stats:
    get:
      summary: >
        The signed-in driver's own numbers, for the app's home screen.
        Counted on read from trips and dispatch offers that already exist —
        nothing is stored or estimated.
      description: >
        Rates are measured over a rolling 30-day window and are **null**
        until there is something to divide by: a driver on their first
        shift has no acceptance rate, and 0% would read as a failing grade
        for having done nothing wrong.

        `earnings_today_minor` and `wallet_balance_minor` come from the
        driver's ledger (ADR-0029). Entries are raised only for walk-in
        rides, which are the only trips carrying a fare (ADR-0026 §3) — a
        corporate trip is invoiced to the client — so a driver running only
        corporate work sees a zero balance, which is true.

        `rating` is the mean of their last 50 passenger ratings (ADR-0030),
        withheld until five exist.
      responses:
        '200':
          description: The driver's statistics.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required:
                      - trips_today
                      - earnings_today_minor
                      - wallet_balance_minor
                      - currency
                      - acceptance_rate
                      - completion_rate
                      - rating
                      - rating_count
                      - window_days
                    additionalProperties: false
                    properties:
                      trips_today: { type: integer }
                      earnings_today_minor:
                        type: integer
                        description: >
                          The driver's own share of today's fares, from the
                          ledger (ADR-0029 §5) — NOT the gross fare the
                          passenger paid. Minor units, never a float.
                      wallet_balance_minor:
                        type: integer
                        description: >
                          The whole ledger summed. Negative is legitimate and
                          means the driver is holding the platform's cash
                          until they settle (ADR-0029 §5).
                      currency: { type: string }
                      acceptance_rate:
                        type: ['number', 'null']
                        description: Percentage 0–100, one decimal. Null when no offer has been answerable yet.
                      completion_rate:
                        type: ['number', 'null']
                        description: Percentage 0–100, one decimal. Null when no trip has reached an ending yet.
                      rating:
                        type: ['number', 'null']
                        description: >
                          Mean of the last 50 ratings, one decimal. **Null
                          until five ratings exist** (ADR-0030 §3): one
                          three-star rating is not a 3.0, it is one person's
                          afternoon.
                      rating_count:
                        type: integer
                        description: How many ratings the score rests on — returned even while the score is withheld.
                      window_days: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/performance:
    get:
      summary: >
        How the signed-in driver is doing — the app's Performance screen:
        six dials and progress towards the weekly bonus.
      description: >
        Separate from `/me/stats` rather than a fatter payload on it, for the
        reason `/me/profile` is: stats is polled every sixty seconds by the
        home screen, and a roster walk, a duty-session sum and a week of trips
        must not ride along on every poll of a screen rendering none of them.
        The 30-day rates the two share are computed once, in
        `DriverStatsService::qualityFor()`, so they cannot disagree.

        **Every ratio on this screen has a real denominator or none at all.**
        `rostered_seconds_this_week` and `bonus` are both nullable, and null is
        served rather than zero — a driver with no shift windows is available
        at any hour (ADR-0017 §3), and the bonus scheme is off by default
        (ADR-0034). The app draws no arc in either case, because a ring against
        an invented ceiling is the fabricated figure `docs/screen-rules.md` §1
        forbids, drawn as a shape.

        `online_seconds_this_week` is measured from duty sessions (ADR-0038)
        and is **conservative by design**: it counts time the platform could
        actually reach the driver, so a spell in a dead zone is lost. That is
        the right direction for the error to run in a figure that will be
        quoted at somebody in a conversation about their hours.
      responses:
        '200':
          description: The driver's performance.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required:
                      - acceptance_rate
                      - completion_rate
                      - cancellation_rate
                      - rating
                      - rating_count
                      - window_days
                      - trips_total
                      - week_start
                      - timezone
                      - trips_this_week
                      - online_seconds_this_week
                      - rostered_seconds_this_week
                      - bonus
                    additionalProperties: false
                    properties:
                      acceptance_rate:
                        type: ['number', 'null']
                        description: Percentage 0–100, one decimal, over `window_days`. Null when no offer has been answerable yet.
                      completion_rate:
                        type: ['number', 'null']
                        description: Percentage 0–100, one decimal. Null when no trip has reached an ending yet.
                      cancellation_rate:
                        type: ['number', 'null']
                        description: >
                          Percentage 0–100, one decimal, over the same
                          terminal-status window as `completion_rate`.
                          **Not the complement of it** — `no_show` is the third
                          ending, so the two sum to 100 only for a driver who
                          has never had one. A no-show is the passenger's act
                          and has no dial of its own.
                      rating:
                        type: ['number', 'null']
                        description: Mean of the last 50 ratings, one decimal. Null until five exist (ADR-0030 §3).
                      rating_count: { type: integer }
                      window_days:
                        type: integer
                        description: The rolling window the three rates are measured over.
                      trips_total:
                        type: integer
                        description: >
                          Completed trips, ever. Cancellations excluded — the
                          figure sits beside a rating and must not read flatter
                          than the driver's work. The same count `/me/profile`
                          serves, from the same query.
                      week_start:
                        type: string
                        format: date
                        description: >
                          Monday of the week in progress, in `timezone`.
                          Served rather than derived on the handset: the week
                          is the fleet's, and a driver near a border must not
                          draw their own.
                      timezone:
                        type: string
                        description: The fleet's zone, from `settings.regional.timezone`.
                      trips_this_week:
                        type: integer
                        description: >
                          Completed trips since `week_start`, counted by the
                          same rule that decides the bonus — a screen counting
                          differently from the command that pays out would
                          eventually promise a target and not honour it.
                      online_seconds_this_week:
                        type: integer
                        description: Duty-session seconds since `week_start` (ADR-0038).
                      rostered_seconds_this_week:
                        type: ['integer', 'null']
                        description: >
                          Rostered seconds for the **whole** week, from
                          `driver_shift_windows` — the denominator the online
                          hours dial draws against. Null for a driver with no
                          roster, which ADR-0017 §3 makes mean "available at
                          any hour"; that is not a number, and a zero here
                          would be a division waiting to happen.
                      bonus:
                        type: ['object', 'null']
                        description: >
                          Progress towards the weekly target bonus, or **null**
                          when `billing.bonus_enabled` is false — in which case
                          the app renders no card and no arc. The open week is
                          reported; nothing has been earned until it closes and
                          the award command runs (ADR-0034 §4).
                        required: [trips, trip_target, amount_minor, currency, week_start, ends_at, achieved]
                        additionalProperties: false
                        properties:
                          trips: { type: integer }
                          trip_target: { type: integer }
                          amount_minor: { type: integer }
                          currency: { type: string }
                          week_start: { type: string }
                          ends_at: { type: string }
                          achieved:
                            type: boolean
                            description: >
                              Server-computed, rather than left to the app to
                              derive from `trips >= trip_target`. Two
                              implementations of one comparison is one that
                              gains a `>` and one that does not.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/earnings:
    get:
      summary: >
        The signed-in driver's earnings over a day, a week or a month —
        the app's earnings screen.
      description: >
        Read from `driver_ledger_entries` (ADR-0029), which holds the
        driver's share **as it was written at completion**. Nothing is
        recomputed from `billing.driver_commission_percent`, so changing that
        rate never restates what a driver already earned (ADR-0029 §3).

        Separate from `/me/stats` rather than a fatter payload on it: stats is
        polled by the home screen, while this is opened deliberately, takes a
        period, and carries a chart series.

        **Boundaries are the driver's local day**, from
        `settings.regional.timezone` (default `Africa/Kampala`) — not UTC. The
        window is half-open `[from, to)`; an inclusive upper bound would drop
        an entry written in the period's final second.

        **`breakdown` always sums to `total_minor`.** Entries whose trip has
        no order request behind it — a walk-in a dispatcher fulfilled by hand
        — are classified `other` rather than dropped, because a breakdown that
        does not add up to the figure above it is the worst defect a money
        screen can carry.

        **There are no tips and no bonuses in this payload because neither
        exists on this platform**, and no online-hours figure because
        `driver_presence` is overwritten on every duty toggle and keeps no
        history. `on_trip_minutes` is the measured neighbour — time driving,
        not time available.
      parameters:
        - in: query
          name: period
          required: false
          description: Defaults to `day`. An unrecognised value is a 422, not a silent fallback.
          schema:
            $ref: '#/components/schemas/EarningsPeriod'
      responses:
        '200':
          description: The driver's earnings for the period.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverEarnings' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/ledger-entries:
    get:
      summary: >
        The signed-in driver's wallet statement — their ledger, row by row,
        newest first.
      description: >
        The rows behind `wallet_balance_minor` on `/me/stats`. That field says
        *what* the balance is; this says **why**.

        **Every entry is served, `cash_collected` included.** A completed cash
        trip writes a pair — `fare_earned` positive and `cash_collected`
        negative — and the pairing is what makes the balance mean anything
        (ADR-0029 §2). Serving only the credits would produce a prettier list
        that does not sum to the balance it sits under.

        **Read-only, and there is no counterpart write.** ADR-0029 §6 keeps
        the platform recording money rather than moving it: no gateway, no
        payout, no top-up. `settlement` rows are the office's to write.

        Cursor-paginated at 25, ordered by `id` descending — not by
        `created_at`, because the pair written at completion shares a
        timestamp to the second and a cursor over a non-unique ordering can
        skip or repeat a row across pages.

        403 `NOT_A_DRIVER` when the account has no driver profile.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - in: query
          name: from
          required: false
          description: >
            Inclusive start, `YYYY-MM-DD`, in the **driver's local day**
            (`settings.regional.timezone`) — not UTC.
          schema: { type: string, format: date }
        - in: query
          name: to
          required: false
          description: >
            **Inclusive** end, `YYYY-MM-DD`, local. The whole of the day named
            is returned; an exclusive bound would make picking a single day
            return nothing.
          schema: { type: string, format: date }
      responses:
        '200':
          description: A page of ledger entries.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverLedgerEntry' }
                  meta:
                    type: object
                    required: [cursor]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/trips:
    get:
      summary: >
        The signed-in driver's own trip history — the work that is over,
        newest first.
      description: >
        The third `/me` read a driver has: `/me/earnings` answers *how much*,
        `/me/ledger-entries` answers *why is my balance that*, and this
        answers **what did I actually do**.

        Separate from `GET /trips`, which is the dispatch board. That
        endpoint's resource cannot serve `service_type` (this screen's filter,
        which lives on `order_requests`) and deliberately returns no driver
        earnings on any list, because reading the ledger relation is unbounded
        per row. Both are answered here in one extra query each, keyed by trip.

        **Only finished work.** `trip_completed`, `invoice_generated`,
        `disputed`, `closed`, `no_show`, `cancelled` and `rejected`. The live
        statuses are absent because each has a screen that owns it, and
        `assigned` is absent because an unanswered offer has not happened yet.
        Cancelled and no-show rows **are** included, with `earned_minor` null —
        a driver who drove to a pickup and was cancelled on has spent the time,
        and nothing else in the platform lists that trip.

        **The money is the driver's own share, never the gross fare.** Read
        back from the `fare_earned` ledger entry written at completion
        (ADR-0029 §3), so it reconciles exactly with `/me/earnings` and is
        never recomputed from the current commission rate.

        **No passenger contact appears here at all.** ADR-0024 §7 releases a
        name and number only while a trip is live; a scrollable history of
        everyone a driver has carried is the directory that rule exists to
        prevent.

        Cursor-paginated at 25, ordered by `id` descending — not by a
        timestamp, because `completed_at` is null on every cancelled trip and
        is shared to the second by trips completed together, and a cursor over
        a non-unique ordering can skip or repeat a row across pages.

        403 `NOT_A_DRIVER` when the account has no driver profile.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - in: query
          name: service_type
          required: false
          description: >
            Narrows to one kind of job — `ride` or `delivery` for the screen's
            chips. Filtered in SQL rather than over the loaded page, so the
            count is of the whole history and not of twenty-five rows.

            Deliberately not an enum: `order_requests.service_type` is a
            `string(20)` fed partly by a public form, so a hard enum here
            would 422 on a service the platform had started offering.
          schema: { type: string, maxLength: 20 }
      responses:
        '200':
          description: A page of finished trips.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverHistoryTrip' }
                  meta:
                    type: object
                    required: [cursor, timezone, today, yesterday]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
                      timezone:
                        type: string
                        description: >
                          The fleet's zone, from `settings.regional.timezone`.
                          Served so the app labels a section "Today" against
                          the fleet's day rather than the handset's.
                      today:
                        type: string
                        format: date
                        description: Today in that zone, `YYYY-MM-DD`, to match against `local_day`.
                      yesterday:
                        type: string
                        format: date
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/promotions:
    get:
      summary: >
        What the platform is currently offering this driver — the Promotions
        screen.
      description: >
        The one `/me` read that looks **forward**. Earnings, the ledger and the
        trip history are all records of what has happened; this is the weekly
        target still open, tonight's peak window, and what a referral would pay
        (ADR-0036 §6, ADR-0037 §6).

        **Every scheme is nullable, and a switched-off scheme is `null` rather
        than a zeroed card.** `docs/screen-rules.md` §1 refuses a zero standing
        in for a figure that does not exist — a Weekly Challenge card reading
        "0 of 40 trips" on a fleet running no bonus scheme is exactly that,
        dressed as a measurement. A driver on a fleet running one scheme sees
        one card, and that is correct rather than broken.

        **The app is never told the rules.** Not `peak_starts_at`, not the trip
        target as a policy to apply — it receives values *resolved on the
        server for this driver at this moment*, and re-pulls to learn that the
        office changed something. A threshold shipped inside a handset goes on
        asserting the old number after the office changes it, on devices nobody
        can reach.

        Deliberately **not** folded into `GET /me/stats`, which the home screen
        polls every sixty seconds: three settings reads, a weekly trip count
        and a referral scan must not ride along on a poll of a screen that
        renders none of them.

        Reading this endpoint **mints the driver's referral code** if they do
        not have one, which is the first moment anybody could use it.

        403 `NOT_A_DRIVER` when the account has no driver profile.
      responses:
        '200':
          description: The schemes currently running, as they apply to this driver.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverPromotions' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/settlement-requests:
    get:
      summary: The signed-in driver's own settlement requests, newest first.
      description: >
        Not paginated: a driver holds at most one open request per kind
        (ADR-0032 §4) and the history behind them is short — settlements
        happen weekly, not per trip. Capped at 20.
      responses:
        '200':
          description: The driver's requests.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverSettlementRequest' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Asks the office to settle — cash handed over, or a payout wanted.
      description: >
        **This moves no money** (ADR-0032). Cash changes hands at the depot
        exactly as before; this records that the driver says it did, or would
        like it to. The ledger learns about it only when somebody at the
        office confirms.

        A pending request **never affects the wallet balance**, which comes
        from `driver_ledger_entries` alone. If it did, a driver could request
        their way out of what they owe.

        `409 SETTLEMENT_REQUEST_ALREADY_OPEN` when one of that kind is already
        waiting: two pending payout requests are one driver asking twice. For
        `tip` the rule is **per trip** rather than per kind (ADR-0034 §1) — a
        driver who took three tips in a day has three real declarations, and
        each names the trip it happened on.

        `404` when a `tip` names a trip that is not the declaring driver's
        own. Not 403: a refusal must not confirm that a row exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, amount_minor]
              additionalProperties: false
              properties:
                kind: { $ref: '#/components/schemas/SettlementRequestKind' }
                amount_minor:
                  type: integer
                  minimum: 1
                  description: >
                    **Positive whatever the kind** — a person typing an amount
                    does not type a sign, and the direction is `kind`'s job.
                    Minor units; UGX is zero-decimal, so whole shillings.
                note:
                  type: ['string', 'null']
                  maxLength: 255
                  description: >
                    The driver's own words about the handover — "paid Musoke
                    at Nakawa depot". Carried into the ledger entry's
                    description on confirmation, where it is what makes the
                    row recognisable months later.
                trip_id:
                  type: integer
                  description: >
                    **Required when `kind` is `tip`, and refused otherwise**
                    (ADR-0034 §1). The trip the passenger tipped on. The
                    server checks it is the declaring driver's own — without
                    that, a driver could declare a tip against somebody else's
                    job, and a confirmed tip writes a credit.
      responses:
        '201':
          description: The request was recorded.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/DriverSettlementRequest' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settlement-requests:
    get:
      summary: The office queue of settlement requests.
      description: >
        `drivers.manage`. **Oldest first**, unlike every other list here: a
        driver who has waited three days for their money belongs at the top,
        and a newest-first queue starves exactly the person it matters to.

        Defaults to open requests only; pass `status` for the others.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - in: query
          name: status
          required: false
          schema: { $ref: '#/components/schemas/SettlementRequestStatus' }
      responses:
        '200':
          description: A page of requests.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverSettlementRequest' }
                  meta:
                    type: object
                    required: [cursor]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settlement-requests/{settlementRequest}/confirm:
    post:
      summary: Confirms that the cash moved — and writes the ledger entry.
      description: >
        `drivers.manage`. **This is the only thing that writes a `settlement`
        entry**, through `DriverLedgerService::recordSettlement()` rather than
        by inserting a row, so the sign convention stays in one place. The
        sign is derived from the request's `kind`.

        **Idempotent.** The row is locked and re-read inside the transaction;
        a request that was already answered comes back unchanged rather than
        paying twice, and `ledger_entry_id` records which entry it produced.
        The message says which happened.
      parameters:
        - { name: settlementRequest, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/SettlementRequestResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/settlement-requests/{settlementRequest}/decline:
    post:
      summary: Declines a request, with a reason.
      description: >
        `drivers.manage`. The reason is **required**: this is the first
        surface on the platform where staff refuse a driver something about
        their own money, and a refusal with no explanation is how a driver
        stops using a feature.
      parameters:
        - { name: settlementRequest, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200':
          $ref: '#/components/responses/SettlementRequestResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/support-requests:
    get:
      summary: The signed-in driver's own reports, newest first.
      description: >
        Driver issue reporting (ADR-0044). Not paginated and capped at 50: a
        driver's reports are counted in ones per month, and the screen reading
        this is a short list with the office's answers on it.

        An `answer` of `null` means the office still owes one — there is no
        "closed without an answer" on this feature (ADR-0044 §2), so null is
        precisely "still waiting" and never "declined in silence".
      responses:
        '200':
          description: The driver's reports.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SupportRequest' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Reports something to the office, in writing.
      description: >
        ADR-0044. **The first place on this platform a driver's own words reach
        the office as a record.** Before it, the five Help Topics rows on
        Help & Safety all opened the same contact card and nothing a driver
        wrote reached anybody.

        The body is stored verbatim and is never edited or truncated. `topic`
        is one of the five Help Topics, which decides how the report is filed
        and which office desk answers it.

        `trip_id` is optional for **every** topic. The server checks it is the
        reporting driver's own trip and answers `404` when it is not — not 403,
        because a refusal must not confirm that a row exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, body]
              additionalProperties: false
              properties:
                topic: { $ref: '#/components/schemas/SupportRequestTopic' }
                body:
                  type: string
                  minLength: 10
                  maxLength: 4000
                  description: >
                    What happened, in the driver's own words. The floor stops
                    a one-word report the office cannot answer; the ceiling is
                    a request-size bound far above anything typed on a phone.
                    **Nothing truncates** — over the ceiling the report is
                    refused with a message saying so, because storing half of
                    somebody's account of an event is worse than storing none.
                trip_id:
                  type: integer
                  description: >
                    The journey it is about, when it is about one. Optional on
                    every topic: a driver reporting a passenger who never
                    boarded has no trip to name.
      responses:
        '201':
          description: The report was sent to the office.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/SupportRequest' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/support-requests:
    get:
      summary: The office queue of driver reports.
      description: >
        `drivers.manage` (ADR-0044 §3). **Oldest first**, like the settlement
        queue and for the same reason: the driver who has waited longest has
        most earned an answer.

        Defaults to unanswered reports only. `status=answered` reads the
        archive; `topic` narrows to one of the five, because a payment dispute
        and a lost phone are answered by different desks.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - in: query
          name: status
          required: false
          schema: { $ref: '#/components/schemas/SupportRequestStatus' }
        - in: query
          name: topic
          required: false
          schema: { $ref: '#/components/schemas/SupportRequestTopic' }
      responses:
        '200':
          description: A page of reports.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SupportRequest' }
                  meta:
                    type: object
                    required: [cursor]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/support-requests/{supportRequest}:
    get:
      summary: One driver report, with the office's answer if it has one.
      description: '`drivers.manage`. Carries the driver''s name and, once answered, who answered it.'
      parameters:
        - { name: supportRequest, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/SupportRequestResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/support-requests/{supportRequest}/answer:
    post:
      summary: Answers a driver's report — and tells them.
      description: >
        `drivers.manage` (ADR-0044 §2, §4). **The answer is required**: there
        is no closing a report without one, because an office that can close in
        silence reproduces the failure this feature exists to end.

        Writing the answer sends the driver a `driver.support.answered`
        notification — the in-app row and a push, never mail. The answer text
        itself is deliberately **not** in the push: it is somebody's account of
        a dispute, and a lock screen is read over a shoulder.

        **Idempotent.** A report that is already answered comes back unchanged
        rather than overwritten, so a double-tap cannot replace a colleague's
        reply or send a second push.
      parameters:
        - { name: supportRequest, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              additionalProperties: false
              properties:
                answer: { type: string, minLength: 5, maxLength: 4000 }
      responses:
        '200':
          $ref: '#/components/responses/SupportRequestResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/duty:
    get:
      summary: The signed-in driver's own duty state.
      description: >
        Answers a synthesised off-duty record for a driver who has never
        reported, rather than 404 — a client forced to read "nothing" as
        "off duty" will eventually read "request failed" as "off duty" too.
        403 NOT_A_DRIVER when the account is not linked to a driver profile.
      responses:
        '200':
          $ref: '#/components/responses/DriverPresenceResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Goes on or off duty.
      description: >
        PUT rather than POST: there is exactly one duty state per driver to
        replace, and a driver whose request times out and retries must not
        start two shifts. Takes no `driver_id` — the driver is the token.


        Checked against the same availability service that refuses a
        dispatcher (ADR-0017), so a driver on approved leave gets 409
        DRIVER_UNAVAILABLE here rather than discovering it at assignment.
        Going off duty clears the stored position.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on_duty]
              additionalProperties: false
              properties:
                on_duty: { type: boolean }
                vehicle_id:
                  description: >
                    The vehicle they hold the keys to. Null or absent is
                    legitimate — a driver can be signed on before the depot
                    has issued anything, and dispatch ranks them without a
                    vehicle of their own rather than refusing them.
                  type: ['integer', 'null']
      responses:
        '200':
          $ref: '#/components/responses/DriverPresenceResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/presence:
    post:
      summary: Reports where an on-duty driver is.
      description: >
        One point, not a batch. `/trips/{trip}/locations` batches because it
        is billing evidence and none of it may be lost; this is a dispatch
        radius, where only the newest point has any use — a driver coming
        out of a dead zone should send where they are now, not replay where
        they were.


        202, not 201: nothing is created, one row is overwritten in place,
        and the store discards a ping older than the one it holds.


        409 NOT_ON_DUTY when the shift has ended. Refused rather than
        silently dropped, so an app that disagrees with the platform about
        whether a shift is running finds out. Throttled to 30 a minute,
        well above the served `heartbeat_seconds` cadence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, recorded_at]
              additionalProperties: false
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                accuracy_metres:
                  description: What the handset thinks of its own fix. A 2,000 m cell-tower fix and a 5 m GPS fix are very different inputs to a ranking.
                  type: ['number', 'null']
                recorded_at:
                  description: The device's clock, not the server's — staleness is judged against this.
                  type: string
                  format: date-time
                vehicle_id:
                  description: A driver may swap vehicles mid-shift. Absent means unchanged, not none.
                  type: ['integer', 'null']
      responses:
        '202':
          $ref: '#/components/responses/DriverPresenceResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Nearby vehicles (Modules/Fleet) — public by design.
  # The real fleet behind the order page's ambient vehicles and the client
  # live map's capacity view. Anonymized: positions and silhouettes only.
  # ------------------------------------------------------------------
  /api/v1/public/nearby-vehicles:
    get:
      summary: The vehicles available near a point, for anyone to see.
      description: >
        The dispatchable pool — on duty, position fresh, not on a trip —
        nearest the given point first, radius-bounded and capped so one
        call can never dump the fleet. Each entry is a position and a
        silhouette; the `key` is an hourly-rotating opaque marker id, so a
        map can move markers smoothly between polls while a day of polling
        follows nobody. No driver id, name, plate or phone, ever.
        Throttled to 30/min.
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: Up to twelve vehicles within 15km, nearest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NearbyVehicle' }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # On-duty drivers (Modules/Fleet) — ADR-0024 section 2, the office's read.
  # `/live-positions` is where the vehicles on a trip are; this is the
  # pool waiting for one. Together they are the live map.
  # ------------------------------------------------------------------
  /api/v1/driver-presence:
    get:
      summary: Who is on duty, and where.
      description: >
        Every driver currently on duty, with their last reported position,
        the vehicle they are in, and the occupying trip that has them if
        one does. Includes drivers the matcher would hide — a stale
        position, or none at all — marked `stale`, because the map's job is
        to get them phoned. `drivers.view` (DriverPolicy::viewAny): the
        roles that operate the fleet; a client's people are refused, as
        they are from the fleet register — the riders are Shanitah's.
      responses:
        '200':
          description: The pool, by driver id.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OnDutyDriver' }
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Zones (Modules/Fleet) — the geofencing engine, ADR-0021
  # ------------------------------------------------------------------
  /api/v1/zones:
    get:
      summary: The geofences this caller may see.
      description: >
        A client sees the platform's zones plus their own and never another
        client's; a platform reader sees all. Needs zones.view, seeded on
        every system role because dispatch, billing and ordering all resolve
        points against zones.
      responses:
        '200':
          description: Zones, narrowest priority first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Zone' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Draws a zone.
      description: >
        Needs zones.manage — a boundary decides what a client is charged, so
        drawing one is a commercial act. A `client` zone must name its
        tenant; every other kind must not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneInput' }
      responses:
        '201':
          $ref: '#/components/responses/ZoneResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/zones/resolve:
    get:
      summary: Which zones contain this point.
      description: >
        What a dispatcher asks when a price or a refusal needs explaining.
        `meta.within_service_area` answers "may we take this job at all" and
        is **true when no service area has been drawn** — coverage is opt-in.
        `meta.pricing_zone_id` answers "what does it cost", and is null when
        no priced zone covers the point.
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number } }
        - { name: longitude, in: query, required: true, schema: { type: number } }
      responses:
        '200':
          description: Containing zones, narrowest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Zone' }
                  meta:
                    type: object
                    required: [within_service_area, pricing_zone_id]
                    additionalProperties: false
                    properties:
                      within_service_area: { type: boolean }
                      pricing_zone_id: { type: ['integer', 'null'] }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/zones/{zone}:
    parameters:
      - { name: zone, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Redraws a zone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneInput' }
      responses:
        '200':
          $ref: '#/components/responses/ZoneResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Retires a zone. Soft-deleted, so invoices priced in it keep their reference.
      responses:
        '204':
          description: Retired. No content.
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Vehicles (Modules/Vehicles) — the platform's fleet (ADR-0005)
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # Vehicle categories (ADR-0050) — the fleet's own vocabulary.
  #
  # The list is what every category chooser renders: the vehicle form, the
  # driver form's inline vehicle, and the rate card version dialog. It
  # replaces a constant that was hand-mirrored into four files and had
  # already drifted in two of them.
  # ------------------------------------------------------------------
  /api/v1/vehicle-categories:
    get:
      summary: >
        The fleet's vehicle categories, in the office's display order, each
        with what is holding it and which tariffs do not price it.
      description: >
        Needs `vehicles.view`, which every system role holds — Finance must
        be able to render the choices on the rate card dialog.


        Unpaginated: nine rows today, and a chooser cannot page through the
        options it offers.
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VehicleCategory' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Adds a category to the fleet's vocabulary.
      description: >
        Needs `vehicles.manage`. **Creating a category never sets a price**,
        so this grants no money power — and the new category is unpriced on
        every existing tariff, because a rate card version is immutable and
        nothing can add a rate to one. The 201 message says so, and the list
        response names the cards.


        `key` is writable here and nowhere else, ever (ADR-0050 §2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              additionalProperties: false
              properties:
                key: { $ref: '#/components/schemas/VehicleCategoryKey' }
                name: { type: string, maxLength: 80 }
                description: { type: ['string', 'null'], maxLength: 255 }
                active: { type: boolean }
      responses:
        '201':
          $ref: '#/components/responses/VehicleCategoryResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/vehicle-categories/{vehicleCategory}:
    parameters:
      - { name: vehicleCategory, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Renames, redescribes, reorders or retires a category.
      description: >
        Needs `vehicles.manage`.


        **`key` is absent from this body and that absence is the decision.**
        Renaming a key would leave every historical invoice line and every
        immutable rate card rate holding a string that names nothing —
        silently, with no error, visible only as a document that no longer
        reproduces from stored data.


        `active: false` retires the category: no new vehicle and no new rate
        card version may choose it, while every vehicle and every version
        that already does carries on unchanged. Never refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: ['string', 'null'], maxLength: 255 }
                active: { type: boolean }
                position: { type: integer, minimum: 0, maximum: 9999 }
      responses:
        '200':
          $ref: '#/components/responses/VehicleCategoryResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Deletes a category that nothing has ever used.
      description: >
        Needs `vehicles.manage`.


        Answers **409 `VEHICLE_CATEGORY_IN_USE`** when any vehicle, rate card
        price or invoice line names the key, with a message giving the counts
        and pointing at retirement. No foreign key enforces this — those
        columns are deliberately plain strings so an invoice reproduces
        without joining a mutable table — so the refusal is the only thing
        standing between a delete and an immutable rate card rate naming
        nothing.
      responses:
        '204':
          description: Deleted. No content.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/vehicles:
    get:
      summary: The platform's fleet.
      responses:
        '200':
          description: Vehicles.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Vehicle' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Registers a vehicle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_number, make, model, year, category, seating_capacity]
              additionalProperties: false
              properties:
                registration_number: { type: string, maxLength: 50 }
                make: { type: string, maxLength: 100 }
                model: { type: string, maxLength: 100 }
                year: { type: integer, minimum: 1980 }
                category: { $ref: '#/components/schemas/VehicleCategoryKey' }
                seating_capacity: { type: integer, minimum: 1, maximum: 100 }
                color: { type: ['string', 'null'], maxLength: 50 }
                vin: { type: ['string', 'null'], maxLength: 50 }
                status: { enum: [active, maintenance, inactive] }
      responses:
        '201':
          $ref: '#/components/responses/VehicleResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/vehicles/{vehicle}:
    parameters:
      - { name: vehicle, in: path, required: true, schema: { type: integer } }
    get:
      summary: One vehicle.
      responses:
        '200':
          $ref: '#/components/responses/VehicleResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Updates a vehicle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                registration_number: { type: string, maxLength: 50 }
                make: { type: string, maxLength: 100 }
                model: { type: string, maxLength: 100 }
                year: { type: integer, minimum: 1980 }
                category: { $ref: '#/components/schemas/VehicleCategoryKey' }
                seating_capacity: { type: integer, minimum: 1, maximum: 100 }
                color: { type: ['string', 'null'], maxLength: 50 }
                vin: { type: ['string', 'null'], maxLength: 50 }
                status: { enum: [active, maintenance, inactive] }
      responses:
        '200':
          $ref: '#/components/responses/VehicleResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Removes a vehicle.
      responses:
        '204':
          description: Deleted. No content.
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Vehicle allocations (Modules/Fleet, ADR-0009)
  # ------------------------------------------------------------------
  /api/v1/allocations:
    get:
      summary: >
        Vehicle allocation contracts — every client's for platform staff,
        their own for a client.
      responses:
        '200':
          description: Allocations, newest contract first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VehicleAllocation' }
                  meta:
                    type: object
                    required: [filters]
                    additionalProperties: false
                    properties:
                      filters: { $ref: '#/components/schemas/ClientsFilter' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: >
        Agrees an allocation. Overlap with an exclusive contract for the
        same vehicle is refused with 409 ALLOCATION_CONFLICT — the check is
        locked, not advisory (ADR-0009 decision 4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, vehicle_id, starts_on]
              additionalProperties: false
              properties:
                tenant_id: { type: integer }
                vehicle_id: { type: integer }
                starts_on: { type: string, format: date }
                ends_on:
                  type: ['string', 'null']
                  format: date
                  description: Null for an open-ended contract. The last day counts as in force.
                exclusive: { type: boolean }
                notes: { type: ['string', 'null'], maxLength: 1000 }
      responses:
        '201':
          $ref: '#/components/responses/VehicleAllocationResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/allocations/{allocation}:
    parameters:
      - { name: allocation, in: path, required: true, schema: { type: integer } }
    get:
      summary: One allocation.
      responses:
        '200':
          $ref: '#/components/responses/VehicleAllocationResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: >
        Ends a contract — a PATCH with the final day, never a DELETE: the
        row is a commercial record and stays visible with the day it
        stopped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ends_on]
              additionalProperties: false
              properties:
                ends_on: { type: string, format: date }
      responses:
        '200':
          $ref: '#/components/responses/VehicleAllocationResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Trips (Modules/Trips)
  # ------------------------------------------------------------------
  /api/v1/trips:
    get:
      summary: Trips — one client's, or every client's for platform staff.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TripStatus' } }
        - { name: vehicle_id, in: query, schema: { type: integer } }
        - { name: driver_id, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: tenant_id, in: query, schema: { type: integer }, description: Platform staff only. }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Trips, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Trip' }
                  meta: { $ref: '#/components/schemas/CrossClientListMeta' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Raises an ad-hoc trip without a booking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, driver_id, origin, destination]
              additionalProperties: false
              properties:
                vehicle_id: { type: integer }
                driver_id: { type: integer }
                origin: { type: string, maxLength: 255 }
                destination: { type: string, maxLength: 255 }
      responses:
        '201':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}:
    parameters:
      - { name: trip, in: path, required: true, schema: { type: integer } }
    get:
      summary: One trip.
      responses:
        '200':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/transitions:
    post:
      summary: >
        Requests a state-machine transition (AGENTS.md Trip State Machine).
        Illegal transitions are refused with 409 INVALID_TRIP_TRANSITION.
        Sent as JSON, or as multipart/form-data when a dashboard photo
        accompanies an odometer reading.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripTransitionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TripTransitionRequest'
      responses:
        '200':
          $ref: '#/components/responses/TripResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/events:
    get:
      summary: The trip's timeline — append-only, oldest first.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Timeline events.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TripEvent' }
                  meta:
                    type: object
                    required: [cursor]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/route:
    get:
      summary: The road between the driver and where they are going (ADR-0031).
      description: >
        A road-following route from the driver's position to one end of the
        job — the pickup while they are on their way to the passenger, the
        drop-off once the passenger is in the car. `to` picks which.


        **The two are different roads and a client must not confuse them.**
        On a real Kampala order, the approach measured 7.3 km and the fare
        71.0 km from the same origin; a screen that draws the wrong one sends
        a driver away from the person waiting for them.


        **`route` is null far more often than not, and null is always a 200.**
        No key configured, routing switched off, no network, a provider quota
        rejection, two points with no road between them, or a trip taken over
        the phone with no coordinates at all. Clients draw the dashed direct
        line they drew before routing existed; a 4xx here would turn a missing
        polyline into a screen a driver cannot use with a passenger in the car.


        The credential never leaves the server (ADR-0031 §1), which is why this
        is an endpoint rather than a call the app makes: a Directions key bills
        per request, and one extracted from a mobile bundle is somebody else's
        traffic on this operator's invoice.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
        - name: from_latitude
          in: query
          required: false
          description: >
            Where to route from. Defaults to the pickup when absent — except
            for `to=pickup`, where routing from the pickup to the pickup is a
            zero-length line, so an absent origin answers `null` instead.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: from_longitude
          in: query
          required: false
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: to
          in: query
          required: false
          description: >
            Which end of the job to route to. `dropoff` is the fare itself and
            the default; `pickup` is the approach, the road a driver is on
            between accepting and arriving.
          schema: { type: string, enum: [pickup, dropoff], default: dropoff }
      responses:
        '200':
          description: The route, or null when none can be drawn.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [route]
                    additionalProperties: false
                    properties:
                      route:
                        oneOf:
                          - type: 'null'
                          - type: object
                            required: [polyline, distance_km, duration_seconds, provider, is_estimate]
                            additionalProperties: false
                            properties:
                              polyline:
                                type: string
                                description: >
                                  Google's encoded polyline. Passed through
                                  rather than decoded server-side — an order of
                                  magnitude smaller than a point array on a
                                  handset's connection, and the map library
                                  decodes it anyway.
                              distance_km:
                                type: number
                                description: Road distance, not the crow's flight.
                              duration_seconds:
                                type: ['integer', 'null']
                                description: >
                                  **Null unless the provider supplied one.**
                                  ADR-0031 §6 forbids deriving a duration
                                  locally, whatever distance is in hand — that
                                  is the invention ADR-0020 §3 refused, wearing
                                  a better number. A client with null shows no
                                  minutes at all.
                              provider: { enum: [google, osrm] }
                              is_estimate:
                                enum: [true]
                                description: >
                                  A forecast, never a promise of arrival. The
                                  flag travels with the figure so a client
                                  cannot forget the rule.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/stops:
    post:
      summary: Extends a live run with the next drop-off (ADR-0045 §4).
      description: >
        The driver standing at a kerb appends a stop without waiting for
        anyone to tap approve; the deviation is counted on
        `unplanned_stop_count`, shown, and never billed. An office acting
        through `trips.transition.any` may use the same endpoint and is
        stamped `added_by_dispatch`.


        Two request shapes: a saved-place pick sends `client_place_id` alone —
        the label and pin are copied from the client's register, so a handset
        cannot mislabel an ATM — or free text sends `label`, with an optional
        coordinate pair (both or neither).


        Only while the trip is running (`trip_started`, `waiting`,
        `trip_resumed`): anything else answers 409 TRIP_NOT_ACTIVE. Evidence
        does not grow after the run.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                client_place_id: { type: ['integer', 'null'] }
                label: { type: ['string', 'null'], maxLength: 160 }
                latitude: { type: ['number', 'null'], minimum: -90, maximum: 90 }
                longitude: { type: ['number', 'null'], minimum: -180, maximum: 180 }
      responses:
        '201':
          description: The stop, appended to the run.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/TripStop' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/stop-candidates:
    get:
      summary: The add-a-drop-off search over the client's place register (ADR-0045 §10).
      description: >
        Bounded exactly as §10 rules: the trip's own driver, the client whose
        trip they are currently driving, while the run is live — and none at
        all between jobs (409 TRIP_NOT_ACTIVE) or for anyone else (403,
        including dispatchers, who read the register through `/places`). A
        bank's estate in service order is a cash-logistics document
        (`docs/security-gate.md` F2); this serves name, address and pin,
        capped at twelve rows.


        A walk-in trip has no tenant and therefore no register: the ordinary
        answer is an empty list, and the app's free-text row carries the rest.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: Matching places, by name, at most twelve.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    maxItems: 12
                    items:
                      type: object
                      required: [id, name, address, latitude, longitude]
                      additionalProperties: false
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        address: { type: ['string', 'null'] }
                        latitude: { type: number }
                        longitude: { type: number }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/locations:
    post:
      summary: Accepts a batch of GPS pings. Queued, not yet written (ADR-0003).
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pings]
              additionalProperties: false
              properties:
                pings:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [latitude, longitude, recorded_at]
                    additionalProperties: false
                    properties:
                      latitude: { type: number, minimum: -90, maximum: 90 }
                      longitude: { type: number, minimum: -180, maximum: 180 }
                      recorded_at: { type: string }
                      speed_kph: { type: ['number', 'null'], minimum: 0, maximum: 400 }
                      heading_degrees: { type: ['integer', 'null'], minimum: 0, maximum: 359 }
                      accuracy_metres: { type: ['number', 'null'], minimum: 0, maximum: 10000 }
      responses:
        '202':
          description: Accepted for asynchronous ingestion.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [accepted]
                    additionalProperties: false
                    properties:
                      accepted: { type: integer }
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: The recorded route, for replay.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: GPS points in recorded order.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TripLocation' }
                  meta:
                    type: object
                    required: [cursor, gps_distance_km]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
                      gps_distance_km: { type: number }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/odometer-photo/{moment}:
    get:
      summary: >
        The dashboard photo behind an odometer reading. Binary — declared,
        not validated (ADR-0011 decision 6).
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
        - { name: moment, in: path, required: true, schema: { enum: [start, end] } }
      responses:
        '200':
          description: The photo, streamed inline.
          content:
            image/*: {}
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Billing (Modules/Billing)
  # ------------------------------------------------------------------
  /api/v1/invoices:
    get:
      summary: Invoices, cursor-paginated.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: trip_id, in: query, schema: { type: integer } }
        - { name: invoice_number, in: query, schema: { type: string, maxLength: 50 } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Invoices.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
                  meta:
                    type: object
                    required: [cursor]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/invoices/{invoice}:
    get:
      summary: One invoice, with lines and credit notes.
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/trips/{trip}/invoice:
    post:
      summary: >
        Issues the invoice for a completed trip. Idempotent — a replay of
        the same key returns 200 with the original invoice; a fresh issue
        returns 201.
      parameters:
        - { name: trip, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              additionalProperties: false
              properties:
                idempotency_key: { type: string, minLength: 8, maxLength: 128 }
                rate_card_id:
                  type: ['integer', 'null']
                  description: Omit to price with the tenant's default card.
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
        '201':
          $ref: '#/components/responses/InvoiceResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/invoices/{invoice}/credit-notes:
    parameters:
      - { name: invoice, in: path, required: true, schema: { type: integer } }
    get:
      summary: Credit notes issued against an invoice.
      responses:
        '200':
          description: Credit notes, with lines.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CreditNote' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: >
        Issues a credit note — the only way an issued invoice is ever
        corrected (AGENTS.md Money & Billing). Idempotent, like invoice
        generation: replay returns 200, fresh issue 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, reason, lines]
              additionalProperties: false
              properties:
                idempotency_key: { type: string, minLength: 8, maxLength: 128 }
                reason: { type: string, minLength: 3, maxLength: 1000 }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [description, amount_minor]
                    additionalProperties: false
                    properties:
                      description: { type: string, maxLength: 255 }
                      amount_minor: { type: integer, minimum: 1 }
                      invoice_line_id: { type: ['integer', 'null'] }
      responses:
        '200':
          $ref: '#/components/responses/CreditNoteResponse'
        '201':
          $ref: '#/components/responses/CreditNoteResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/rate-cards:
    get:
      summary: Rate cards, page-paginated (admin CRUD).
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Rate cards with versions and rates.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RateCard' }
                  meta:
                    type: object
                    required: [page, per_page, total]
                    additionalProperties: false
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Creates a rate card and its first version in one call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, version]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: ['string', 'null'], maxLength: 1000 }
                is_default: { type: ['boolean', 'null'] }
                version: { $ref: '#/components/schemas/RateCardVersionRequest' }
      responses:
        '201':
          $ref: '#/components/responses/RateCardResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/rate-cards/{rate_card}:
    get:
      summary: One rate card, with versions and rates.
      parameters:
        - { name: rate_card, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/RateCardResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/rate-cards/{rateCard}:
    patch:
      summary: >
        Renames a rate card, redescribes it, or archives it — never its
        prices.
      description: >
        The labels **on** a pricing document, not the terms **of** one. No
        field here reaches a version, and `PricedRate` throws
        `FinancialRecordImmutableException` on update regardless: an invoice
        already issued must stay reproducible from the version that priced it.
        Changing what a client is charged is `POST /rate-cards/{id}/versions`.

        `is_default` is deliberately absent. Promoting a card must demote
        whichever card currently holds the flag in the same transaction, and
        `PUT /rate-cards/{id}/default` owns that.

        A PATCH: omit a field and it is left alone rather than cleared. There
        is no DELETE — a card that priced an invoice is evidence, and
        `status: archived` is how one is taken out of the way.
      parameters:
        - { name: rateCard, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Unique within the card's own tenant, ignoring itself.
                description: { type: ['string', 'null'], maxLength: 1000 }
                status: { type: string, enum: [active, archived] }
      responses:
        '200':
          $ref: '#/components/responses/RateCardResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/rate-cards/{rateCard}/versions:
    post:
      summary: >
        Supersedes the card's prices with a new immutable version. The one
        way prices ever change — there is no update and no delete.
      parameters:
        - { name: rateCard, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateCardVersionRequest'
      responses:
        '201':
          description: The new version.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/RateCardVersion' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/rate-cards/{rateCard}/default:
    put:
      summary: >
        Makes this the card that prices trips when none is named. PUT
        because it is idempotent.
      parameters:
        - { name: rateCard, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/RateCardResponse'
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Reports (Modules/Reports, ADR-0007)
  # ------------------------------------------------------------------
  /api/v1/reports/trips:
    get:
      summary: >
        The trip report — the Bank's six acceptance criteria, row per trip,
        cursor-paginated.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: vehicle_id, in: query, schema: { type: integer } }
        - { name: driver_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TripStatus' } }
        - { name: tenant_id, in: query, schema: { type: integer }, description: 'Platform staff only; omitted, the report spans all clients.' }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: Report rows plus a whole-set summary.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TripReportRow' }
                  meta:
                    type: object
                    required: [cursor, summary, scope, covers, filters]
                    additionalProperties: false
                    properties:
                      cursor: { $ref: '#/components/schemas/Cursor' }
                      summary:
                        type: object
                        required: [trips, trips_completed, distance_km, duration_minutes, records_incomplete, completeness_percent]
                        additionalProperties: false
                        properties:
                          trips: { type: integer }
                          trips_completed: { type: integer }
                          distance_km: { type: number }
                          duration_minutes: { type: integer }
                          records_incomplete: { type: integer }
                          completeness_percent: { type: ['number', 'null'] }
                      scope: { $ref: '#/components/schemas/Scope' }
                      covers: { type: string }
                      filters: { $ref: '#/components/schemas/ClientsFilter' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/drivers:
    get:
      summary: Driver activity aggregate — one row per driver (ADR-0007 rule 3).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          $ref: '#/components/responses/FleetReportResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/vehicles:
    get:
      summary: Vehicle activity aggregate — one row per vehicle (ADR-0007 rule 3).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          $ref: '#/components/responses/FleetReportResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/financial:
    get:
      summary: >
        The financial report, grouped by period. For platform staff
        tenant_id is required — there is no cross-client revenue total
        (ADR-0007 rule 2).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: group_by, in: query, schema: { enum: [day, week, month, year] } }
        - { name: tenant_id, in: query, schema: { type: integer }, description: 'Required for platform staff, refused for client users.' }
      responses:
        '200':
          description: Period rows plus totals.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ReportRows' }
                  meta:
                    type: object
                    required: [report, title, headers, period, summary, scope, covers, filters]
                    additionalProperties: false
                    properties:
                      report: { enum: [financial] }
                      title: { type: string }
                      headers:
                        type: array
                        items: { type: string }
                      period: { type: string }
                      summary:
                        type: object
                        required: [periods, invoices, invoiced_minor, credit_notes, credited_minor, outstanding_minor, currency, payments_recorded]
                        additionalProperties: false
                        properties:
                          periods: { type: integer }
                          invoices: { type: integer }
                          invoiced_minor: { type: integer }
                          credit_notes: { type: integer }
                          credited_minor: { type: integer }
                          outstanding_minor: { type: integer }
                          currency: { type: string }
                          payments_recorded: { type: boolean }
                      scope: { $ref: '#/components/schemas/Scope' }
                      covers: { type: string }
                      filters: { $ref: '#/components/schemas/ClientsFilter' }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/exports:
    get:
      summary: Recent exports of reports this reader may see.
      responses:
        '200':
          description: Export records, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReportExport' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: >
        Queues an export. 202 — the record exists, the file does not yet;
        poll the show endpoint until is_terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              additionalProperties: false
              properties:
                format: { enum: [csv, xlsx, pdf] }
                report: { enum: [trips, drivers, vehicles, financial, null] }
                from: { type: ['string', 'null'], format: date }
                to: { type: ['string', 'null'], format: date }
                vehicle_id: { type: ['integer', 'null'] }
                driver_id: { type: ['integer', 'null'] }
                status: { $ref: '#/components/schemas/NullableTripStatus' }
                group_by: { enum: [day, week, month, year, null] }
                tenant_id: { type: ['integer', 'null'], description: Platform staff only; required for a financial export. }
      responses:
        '202':
          $ref: '#/components/responses/ReportExportResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/exports/{export}:
    get:
      summary: One export record — what the client polls.
      parameters:
        - { name: export, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/ReportExportResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/reports/exports/{export}/download:
    get:
      summary: >
        The exported file. Binary — declared, not validated (ADR-0011
        decision 6). 409 EXPORT_NOT_READY while preparing, 410
        EXPORT_EXPIRED after the seven-day retention.
      parameters:
        - { name: export, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The file, as an attachment.
          content:
            text/csv: {}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
            application/pdf: {}
        default:
          $ref: '#/components/responses/Error'

  # ------------------------------------------------------------------
  # Notifications (Modules/Notifications) — a user's own inbox
  # ------------------------------------------------------------------
  /api/v1/notifications:
    get:
      summary: Your notifications, newest first, with the unread count.
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Notifications plus the unread badge count.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta:
                    type: object
                    required: [unread]
                    additionalProperties: false
                    properties:
                      unread: { type: integer }
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Marks everything read in one call.
      responses:
        '200':
          description: How many were marked.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data:
                    type: object
                    required: [marked]
                    additionalProperties: false
                    properties:
                      marked: { type: integer }
        default:
          $ref: '#/components/responses/Error'

  /api/v1/notifications/{notification}:
    patch:
      summary: Marks one notification read.
      parameters:
        - { name: notification, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The notification, now read.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Notification' }
        '404':
          description: >
            Not found — scoped to your own inbox, so another user's id is
            indistinguishable from a missing one. NOTE the shape: this
            endpoint answers 404 in the success envelope with null data,
            not the error envelope. Documented as built.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                additionalProperties: false
                properties:
                  success: { enum: [true] }
                  message: { type: string }
                  data: { enum: [null] }
        default:
          $ref: '#/components/responses/Error'

components:
  parameters:
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from meta.cursor.next.
      schema: { type: string }

  requestBodies:
    DecisionReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            additionalProperties: false
            properties:
              reason: { type: string, maxLength: 1000 }

  responses:
    SupportRequestResponse:
      description: One driver report, with the office's answer if it has one.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/SupportRequest' }

    SettlementRequestResponse:
      description: The request, after the office answered it.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/DriverSettlementRequest' }

    Error:
      description: >
        Any failure. `code` is stable and machine-readable — clients branch
        on it, never on message text (AGENTS.md API Standards).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    Throttled:
      description: >
        Rate limited (auth endpoints, 5/min/IP). Rendered by the framework,
        not the API envelope — documented in its production shape; the
        test-suite hook does not validate 429s because debug rendering
        differs.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            additionalProperties: true
            properties:
              message: { type: string }

    MessageOnly:
      description: Success with no data payload.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { enum: [null] }

    AuthenticatedResponse:
      description: Login complete — the account and its Sanctum token.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [user, token, must_enrol_mfa]
                additionalProperties: false
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  token: { type: string }
                  must_enrol_mfa: { type: boolean }

    SettingsResponse:
      description: Every settings group, secrets replaced by configured flags.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [settings]
                additionalProperties: false
                properties:
                  settings: { $ref: '#/components/schemas/Settings' }

    CustomerAuthenticatedResponse:
      description: >
        Customer sign-up or sign-in complete (ADR-0013 §3) — the account
        and its token. No MFA fields on purpose: MFA is tied to staff
        roles that move money, and a customer cannot.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [customer, token]
                additionalProperties: false
                properties:
                  customer: { $ref: '#/components/schemas/Customer' }
                  token: { type: string }

    RecoveryCodesResponse:
      description: >
        Recovery codes, legible this once only — they are stored hashed and
        can never be shown again.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [recovery_codes]
                additionalProperties: false
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }

    UserResponse:
      description: One account.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/User' }

    ImpersonationSessionResponse:
      description: A support session, and when it lapses on its own.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data:
                type: object
                required: [id, subject_id, subject_name, expires_at]
                additionalProperties: false
                properties:
                  id: { type: integer }
                  subject_id: { type: integer }
                  subject_name: { type: string }
                  expires_at: { $ref: '#/components/schemas/Timestamp' }

    RoleResponse:
      description: One role.
      content:
        application/json:
          schema:
            type: object
