    ReportExportResponse:
      description: One export record.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/ReportExport' }

    FleetReportResponse:
      description: Aggregate rows plus totals (driver/vehicle reports).
      content:
        application/json:
          schema:
            type: object
            required: [success, message, data, meta]
            additionalProperties: false
            properties:
              success: { enum: [true] }
              message: { type: string }
              data: { $ref: '#/components/schemas/ReportRows' }
              meta:
                type: object
                required: [report, title, headers, period, summary, scope, covers, filters]
                additionalProperties: false
                properties:
                  report: { enum: [drivers, vehicles] }
                  title: { type: string }
                  headers:
                    type: array
                    items: { type: string }
                  period: { type: string }
                  summary:
                    type: object
                    required: [entities_active, trips, trips_completed, distance_km, duration_minutes, variance_flagged, average_distance_km]
                    additionalProperties: false
                    properties:
                      entities_active: { type: integer }
                      trips: { type: integer }
                      trips_completed: { type: integer }
                      distance_km: { type: number }
                      duration_minutes: { type: integer }
                      variance_flagged: { type: integer }
                      average_distance_km: { type: number }
                  scope: { $ref: '#/components/schemas/Scope' }
                  covers: { type: string }
                  filters: { $ref: '#/components/schemas/ClientsFilter' }

  schemas:
    # -------------------------- primitives ---------------------------
    Timestamp:
      description: ISO-8601 UTC timestamp as Laravel serialises Carbon.
      type: string

    NullableTimestamp:
      type: ['string', 'null']

    Scope:
      description: Whether this reader sees the whole platform or one tenant (ADR-0006/0007).
      enum: [platform, tenant]

    ValueLabel:
      type: object
      required: [value, label]
      additionalProperties: false
      properties:
        value: { type: string }
        label: { type: string }

    ValueLabelInt:
      type: object
      required: [value, label]
      additionalProperties: false
      properties:
        value: { type: integer }
        label: { type: string }

    Cursor:
      type: object
      required: [next]
      additionalProperties: false
      properties:
        next:
          type: ['string', 'null']
          description: Opaque cursor for the next page; null on the last page.

    ClientsFilter:
      type: object
      required: [clients]
      additionalProperties: false
      properties:
        clients:
          description: Clients a cross-client reader may narrow to. Empty for a client's own user.
          type: array
          items: { $ref: '#/components/schemas/ValueLabelInt' }

    CrossClientListMeta:
      description: The meta block /bookings and /trips share (ADR-0006).
      type: object
      required: [cursor, scope, filters]
      additionalProperties: false
      properties:
        cursor: { $ref: '#/components/schemas/Cursor' }
        scope: { $ref: '#/components/schemas/Scope' }
        filters: { $ref: '#/components/schemas/ClientsFilter' }

    ClientRef:
      description: Which client a row belongs to — platform readers only (ADR-0006).
      type: ['object', 'null']
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }

    ReportRows:
      description: >
        Report rows as positional arrays matching meta.headers — read
        across, like the exported spreadsheet.
      type: array
      items:
        type: array
        items:
          type: ['string', 'number', 'null']

    EmptyableStringListMap:
      description: >
        Validation errors — a map of field name to messages. PHP serialises
        the empty map as [], hence the anyOf.
      anyOf:
        - type: array
          maxItems: 0
        - type: object
          additionalProperties:
            type: array
            items: { type: string }

    FreeformMap:
      description: >
        A JSON column with no fixed shape (audit diffs, notification
        context, export filters). PHP serialises the empty map as [].
      anyOf:
        - type: array
        - type: object
          additionalProperties: true
        - enum: [null]

    # ---------------------------- enums ------------------------------
    ErrorCode:
      description: Every case of App\Enums\ErrorCode. Never removed, never repurposed.
      enum:
        - VALIDATION_FAILED
        - INVALID_CREDENTIALS
        - MFA_REQUIRED
        - MFA_ENROLMENT_REQUIRED
        - MFA_CHALLENGE_INVALID
        - MFA_CODE_INVALID
        - MFA_ALREADY_ENROLLED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - SERVER_ERROR
        - INVALID_TRIP_TRANSITION
        - INVALID_BOOKING_TRANSITION
        - VEHICLE_UNAVAILABLE
        - DRIVER_UNAVAILABLE
        - REPORT_TOO_LARGE
        - EXPORT_NOT_READY
        - EXPORT_EXPIRED
        - ALLOCATION_CONFLICT
        - VEHICLE_EXCLUSIVELY_ALLOCATED
        - INVALID_ORDER_REQUEST_TRANSITION
        - RATE_CARD_NOT_CONFIGURED
        - TRIP_NOT_INVOICEABLE
        - TRIP_NOT_INVOICEABLE_WALK_IN
        - TRIP_ALREADY_INVOICED
        - IDEMPOTENCY_KEY_REUSED
        - CREDIT_NOTE_EXCEEDS_INVOICE
        - ROLE_IN_USE
        - ORDERING_PAUSED
        - MAIL_DELIVERY_FAILED
        - UNKNOWN_CLIENT_PLACE
        - UNKNOWN_ROUTE_MEMBER
        - CLIENT_PLACE_IN_USE
        - VEHICLE_CATEGORY_IN_USE
        - DRIVER_ACCOUNT_CONFLICT
        - DRIVER_APPLICATION_CLOSED
        - DRIVER_APPLICATION_DOCUMENTS_PENDING
        - AUTH_METHOD_DISABLED
        - SOCIAL_TOKEN_INVALID
        - AVAILABILITY_ALREADY_ANSWERED
        - AUTOMATIC_DISPATCH_DISABLED
        - NO_DISPATCH_CANDIDATE
        - NOT_A_DRIVER
        - NOT_ON_DUTY
        - OFFER_NO_LONGER_OPEN
        - OFFER_HAS_NO_VEHICLE
        - TOKEN_SCOPE_EXCEEDED
        - SETTLEMENT_REQUEST_ALREADY_OPEN
        # ADR-0045. The itinerary only grows while the trip is running, and
        # the place search is open exactly as long (§10: "currently driving").
        - TRIP_NOT_ACTIVE
        # ADR-0043. One open closure request per driver; withdraw it to change it.
        - CLOSURE_REQUEST_ALREADY_OPEN
        # ADR-0043. A second reviewer answering a row a colleague just answered —
        # worth losing safely, because a second confirm would move the retention
        # clock the closure is measured from.
        - CLOSURE_REQUEST_ALREADY_DECIDED

    TripStatus:
      enum:
        - assigned
        - rejected
        - accepted
        - driver_en_route
        - driver_arrived
        - no_show
        - passenger_onboard
        - trip_started
        - waiting
        - trip_resumed
        - trip_completed
        - invoice_generated
        - disputed
        - closed
        - cancelled

    NullableTripStatus:
      enum:
        - assigned
        - rejected
        - accepted
        - driver_en_route
        - driver_arrived
        - no_show
        - passenger_onboard
        - trip_started
        - waiting
        - trip_resumed
        - trip_completed
        - invoice_generated
        - disputed
        - closed
        - cancelled
        - null

    BookingStatus:
      enum: [pending, approved, rejected, assigned, cancelled]

    VehicleCategoryKey:
      description: >
        The stored category key — the string that lives on
        `vehicles.category`, `rate_card_rates.vehicle_category` and
        `invoice_lines.vehicle_category`.


        **Not an enum, since ADR-0050.** It was
        `[boda, tricycle, sedan, suv, van, minibus, bus, pickup, truck]`,
        which was the same frozen list as `Vehicle::CATEGORIES` held in a
        third file — and pinning it here would defeat the whole point of the
        `vehicle_categories` table, which is that the office adds a category
        without a deploy. A client that hard-codes these nine will break on
        the tenth. Fetch `GET /api/v1/vehicle-categories` for the live list
        and render `name`, never the key.


        Immutable once created: a key is never renamed, because an issued
        invoice line stores it and must keep reproducing (ADR-0050 §2). The
        self-drive subset on the public order endpoint is deliberately
        narrower than the fleet's own list.
      type: string
      maxLength: 40
      pattern: '^[a-z0-9]+(_[a-z0-9]+)*$'

    VehicleCategory:
      description: >
        One row of the fleet's category vocabulary (ADR-0050).


        `vehicles_count`, `rate_cards_total` and `unpriced_rate_cards` are
        present on the list response only, and are **absent** rather than
        zero on a create or an update — an empty `unpriced_rate_cards` reads
        as "priced on every tariff", which is precisely the claim the list
        exists to make honestly.
      type: object
      required: [id, key, name, description, active, position, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        key: { $ref: '#/components/schemas/VehicleCategoryKey' }
        name: { type: string, maxLength: 80 }
        description: { type: ['string', 'null'], maxLength: 255 }
        active:
          description: >
            Whether a new vehicle or a new rate card version may choose it.
            Retiring (`false`) is the only "delete" available once anything
            uses the key; it changes no price and voids no record.
          type: boolean
        position: { type: integer }
        vehicles_count:
          description: Live fleet vehicles carrying this key; soft-deleted ones excluded.
          type: integer
        rate_cards_total:
          description: Active rate cards visible to this actor.
          type: integer
        unpriced_rate_cards:
          description: >
            The active rate cards whose **newest** version does not price
            this category. A vehicle of this kind cannot be quoted or
            invoiced on any card listed here until a new version prices it —
            and a version is immutable, so nothing can add the price to the
            one that exists.
          type: array
          items:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
              id: { type: integer }
              name: { type: string }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    # -------------------------- envelopes ----------------------------
    ErrorEnvelope:
      type: object
      required: [success, code, message, errors]
      additionalProperties: false
      properties:
        success: { enum: [false] }
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        errors: { $ref: '#/components/schemas/EmptyableStringListMap' }

    # -------------------------- resources ----------------------------
    Colleague:
      type: object
      description: >
        A colleague as a booking's passenger picker needs them. Three fields,
        and the shortness is the point — the full User carries roles,
        capabilities and MFA state, none of which belongs behind
        `bookings.create`.
      required: [id, name, phone]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: ['string', 'null'] }

    User:
      type: object
      required:
        - id
        - tenant_id
        - name
        - email
        - phone
        - role
        - role_label
        - capabilities
        - books_without_approval
        - status
        - status_label
        - is_active
        - deactivated_at
        - created_at
        - mfa_enabled
        - must_enrol_mfa
        - mfa_recovery_codes_low
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: ['integer', 'null'] }
        tenant_name:
          type: ['string', 'null']
          description: The client's display name ("Centenary Bank"); null for platform staff, who have none (ADR-0006). Present on /auth/* and /users* responses; a nested actor (a booking's requester, an audit row's user) omits it.
        name: { type: string }
        email: { type: string }
        phone:
          type: ['string', 'null']
          description: The work number a booking raised for this person is dispatched against. Null on accounts created before the column existed.
        role: { type: string, description: Role slug — the external reference. }
        role_label: { type: string }
        capabilities:
          type: array
          description: Per-person switches a client's administrator set, unioned onto the role's permissions (ClientCapability).
          items: { $ref: '#/components/schemas/ClientCapability' }
        books_without_approval:
          type: boolean
          description: A booking this person creates is approved on their behalf.
        route_ids:
          type: array
          description: >
            The client's routes this person rides (ADR-0045 §8) — a roster,
            never a permission; nothing authorises off it. Present only on
            /users* responses, which load the relation; a nested actor (a
            booking's requester, an audit row's user) omits the key.
          items: { type: integer }
        status: { enum: [active, suspended] }
        status_label: { type: string }
        is_active: { type: boolean }
        deactivated_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        mfa_enabled: { type: boolean }
        must_enrol_mfa: { type: boolean }
        mfa_recovery_codes_remaining:
          type: integer
          description: Present only when a factor is enrolled (ADR-0010).
        mfa_recovery_codes_low: { type: boolean }

    ClientCapability:
      type: string
      description: A named bundle of permissions a corporate client's administrator may switch on for one of their own people (App\Enums\ClientCapability).
      enum: [approves_bookings, sees_finance, manages_staff, manages_routes]

    Role:
      type: object
      required: [slug, name, description, is_system, permissions, created_at]
      additionalProperties: false
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: ['string', 'null'] }
        is_system: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        users_count:
          type: integer
          description: Present on the listing only.
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    AuditLog:
      type: object
      required:
        - id
        - tenant_id
        - user_id
        - auditable_type
        - auditable_id
        - action
        - changes
        - ip_address
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: ['integer', 'null'] }
        user_id: { type: ['integer', 'null'] }
        user:
          anyOf:
            - { $ref: '#/components/schemas/User' }
            - { enum: [null] }
        auditable_type: { type: string }
        auditable_id: { type: ['integer', 'null'] }
        action: { enum: [created, updated, deleted] }
        changes: { $ref: '#/components/schemas/FreeformMap' }
        ip_address: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    Company:
      type: object
      required:
        - id
        - tenant_id
        - legal_name
        - trading_name
        - registration_number
        - industry
        - billing_email
        - phone
        - address_line1
        - address_line2
        - city
        - country
        - credit_limit_minor
        - status
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        legal_name: { type: string }
        trading_name: { type: ['string', 'null'] }
        registration_number: { type: ['string', 'null'] }
        industry: { type: ['string', 'null'] }
        billing_email: { type: string }
        phone: { type: ['string', 'null'] }
        address_line1: { type: ['string', 'null'] }
        address_line2: { type: ['string', 'null'] }
        city: { type: ['string', 'null'] }
        country: { type: ['string', 'null'] }
        credit_limit_minor: { type: ['integer', 'null'] }
        status: { enum: [active, suspended] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    ClientPlace:
      description: >
        A location the client has pinned (ADR-0045). Both coordinates are
        always present - the column is NOT NULL, so there is no
        partially-located state for a client to handle.
      type: object
      required: [id, name, address, latitude, longitude, arrival_radius_m, notes, is_active, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: ['string', 'null'] }
        latitude: { type: number }
        longitude: { type: number }
        arrival_radius_m: { type: ['integer', 'null'] }
        notes: { type: ['string', 'null'] }
        is_active: { type: boolean }
        route_count:
          description: Only on the single-place read, where the delete path loads it.
          type: integer
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    DrawnRoute:
      description: >
        A road drawn by the configured provider (ADR-0031). `is_estimate` is
        always true and travels with the payload rather than being a rule in
        a docblock - a client that renders these must label them estimates.
        `duration_seconds` is null unless the provider supplied one for
        every leg; nothing derives it.
      type: object
      required: [polyline, distance_km, duration_seconds, provider, is_estimate]
      additionalProperties: false
      properties:
        polyline:
          description: Precision-5 encoded polyline, the encoding both providers emit.
          type: string
        distance_km: { type: number }
        duration_seconds: { type: ['integer', 'null'] }
        provider: { enum: [google, osrm] }
        is_estimate: { enum: [true] }

    ClientRouteStopInput:
      type: object
      required: [client_place_id]
      additionalProperties: false
      properties:
        client_place_id: { type: integer }
        expected_dwell_minutes: { type: ['integer', 'null'], minimum: 0, maximum: 1440 }
        driver_notes: { type: ['string', 'null'], maxLength: 1000 }

    ClientRouteStop:
      description: >
        A place's position in a route. The place is nested rather than
        flattened, because it is a live reference and not a snapshot -
        moving a pin moves it on every route at once.
      type: object
      required: [id, sequence, expected_dwell_minutes, driver_notes]
      additionalProperties: false
      properties:
        id: { type: integer }
        sequence: { type: integer }
        expected_dwell_minutes: { type: ['integer', 'null'] }
        driver_notes: { type: ['string', 'null'] }
        place: { $ref: '#/components/schemas/ClientPlace' }

    ClientRoute:
      description: >
        A circuit the client built (ADR-0045). Carries no distance or
        duration: those are the routing provider's to state per draw
        (ADR-0031), and a stored one would describe the route as it was
        drawn rather than as it is.
      type: object
      required: [id, name, reference, notes, is_active, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        reference: { type: ['string', 'null'] }
        notes: { type: ['string', 'null'] }
        is_active: { type: boolean }
        stop_count: { type: integer }
        stops:
          type: array
          items: { $ref: '#/components/schemas/ClientRouteStop' }
        members:
          description: >
            Who rides this route. Allow-listed to an id and a name - these
            are User rows and a route needs nothing else from them.
          type: array
          items:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
              id: { type: integer }
              name: { type: string }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    ContactDetails:
      description: >
        A number to dial and who answers it. `label` is not decoration —
        under a future masking channel it would read "Passenger (via
        KangaruRide)", and a driver dialling a proxy needs to know that is
        what they are doing, or they will save it as the passenger's real
        number and call it next week.
      type: object
      required: [name, phone, label]
      additionalProperties: false
      properties:
        name: { type: string }
        phone: { type: string }
        label: { type: string }

    CustomerRide:
      description: >
        A ride as the person waiting for it sees it (ADR-0024 §7). Phase
        names are `RidePhase`'s own in the web client, so the mapping is an
        identity function rather than a translation table.
      type: object
      required: [reference, service_type, phase, pickup, dropoff, trip_id, captain, estimated_fare, fare, created_at]
      additionalProperties: false
      properties:
        reference: { type: string }
        service_type: { type: string }
        phase:
          description: >
            The search state before a trip exists, the trip's own status
            after. One field, because the screen renders one timeline and
            should not have to decide which of two is authoritative.
          enum:
            - searching
            - offered
            - unmatched
            - assigned
            - accepted
            - rejected
            - driver_en_route
            - driver_arrived
            - no_show
            - passenger_onboard
            - trip_started
            - waiting
            - trip_resumed
            - trip_completed
            - invoice_generated
            - disputed
            - closed
            - cancelled
        pickup: { $ref: '#/components/schemas/OfferPlace' }
        dropoff: { $ref: '#/components/schemas/OfferPlace' }
        trip_id: { type: ['integer', 'null'] }
        captain:
          anyOf:
            - { $ref: '#/components/schemas/RideCaptain' }
            - { enum: [null] }
        estimated_fare:
          description: >
            What the ride is expected to cost, priced from the captain's own
            vehicle — the same quote the driver sees (ADR-0026 §2). Null before
            a captain is assigned, once a settled fare exists, when either end
            has no pin, or when no public tariff prices the category.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WalkInFareEstimate'
        fare:
          description: >
            What the ride cost, once settled at Trip Completed. The passenger's
            screen renders its fare-pay-rate card from this; without it the
            card could never appear. `distance_km` is the measured trip
            distance the fare was priced from.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CustomerSettledFare'
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    CustomerSettledFare:
      type: object
      required: [total_minor, currency, distance_km, is_estimate]
      additionalProperties: false
      properties:
        total_minor: { type: integer, minimum: 0 }
        currency: { type: ['string', 'null'] }
        distance_km: { type: ['number', 'null'] }
        is_estimate: { type: boolean, enum: [false] }

    RideCaptain:
      description: >
        No rating and no ETA: neither exists (driver rating is unbuilt, and
        ranking is straight-line, not a road-distance arrival time). Omitted
        rather than faked — a number the screen invents is worse than a
        screen that does not show one.
      type: object
      required: [name, phone, phone_label, vehicle, plate, vehicle_colour]
      additionalProperties: false
      properties:
        name: { type: string }
        phone:
          description: Null once the trip is over (ADR-0024 §7).
          type: ['string', 'null']
        phone_label: { type: ['string', 'null'] }
        vehicle: { type: ['string', 'null'] }
        plate: { type: ['string', 'null'] }
        vehicle_colour: { type: ['string', 'null'] }

    DispatchOffer:
      description: >
        A job put in front of one driver, with a clock on it (ADR-0024 §3).


        Deliberately carries **no passenger name or phone number**. Those are
        released only after the driver accepts (ADR-0024 §7): a number handed
        to a driver who then declines is given away for nothing, and this
        payload is what a push notification is built from — which puts it on
        a lock screen readable by whoever is holding the phone.


        `order_requests.details` is never emitted wholesale for the same
        reason — on a delivery it holds `sender_phone` and `recipient_phone`.
        Only the keys in `package` and `payment` cross this boundary.
      type: object
      required:
        - id
        - status
        - expires_at
        - expires_in_seconds
        - pickup
        - dropoff
        - service_type
        - reference
        - pickup_distance_km
        - trip_distance_km
        - reasons
        - package
        - payment
        - estimated_fare
        - vehicle_id
      additionalProperties: false
      properties:
        id: { type: integer }
        status: { enum: [offered, accepted, declined, expired, superseded] }
        expires_at: { type: string, format: date-time }
        expires_in_seconds:
          description: >
            Served alongside the timestamp so the first render is right even
            on a handset whose clock is minutes out — common enough on cheap
            Android hardware to matter, and it would otherwise show a driver
            40 seconds left on a 15-second offer.
          type: integer
          minimum: 0
        pickup: { $ref: '#/components/schemas/OfferPlace' }
        dropoff: { $ref: '#/components/schemas/OfferPlace' }
        service_type: { type: ['string', 'null'] }
        reference: { type: ['string', 'null'] }
        pickup_distance_km:
          description: >
            How far the driver is from the pickup. Straight-line, not road
            distance — a ranking, not a promised ETA (ADR-0020 §3).
          type: ['number', 'null']
        trip_distance_km:
          description: >
            How far the job itself is, pickup to drop-off. The other half of
            the same question: 0.4 km away is a good offer if the ride is
            9 km and a poor one if it is 700 m.


            Straight-line, like `pickup_distance_km`, and under the same
            prohibition — **a client must not divide this by an assumed speed
            to show an ETA.** ADR-0020 §3 declined to derive minutes from a
            straight line by name, because real roads are longer than the
            crow's flight and the invented number is the one that would need
            defending.


            Null whenever either end lacks coordinates, as an order taken
            over the phone does.
          type: ['number', 'null']
        reasons:
          description: One sentence per scoring component, so a ranking stays auditable (ADR-0020 §4).
          type: array
          items: { type: string }
        package:
          description: >
            What is being sent, on a delivery — null on any other service.


            These two keys are an allow-list over `order_requests.details`,
            not a projection of it. That column also holds `sender_phone` and
            `recipient_phone`, which ADR-0024 §7 withholds until after the
            accept; a new key added to the public order form must default to
            not being here.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OfferPackage'
        payment: { $ref: '#/components/schemas/OfferPayment' }
        estimated_fare:
          description: >
            What the ride is estimated to fetch (ADR-0026 §2).


            A **fare**, not driver earnings: there is no commission model on
            this platform and settlement is deferred (ADR-0026 §3), so a
            field named for the driver's take would become false in every
            shipped build the day a platform cut is introduced.


            Null when the offer carries no vehicle (so no category, so no
            rate), when either end has no coordinates, when no public tariff
            has been published, or when this category is not priced on it.
            Null renders as no figure; a zero would read as a free ride.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WalkInFareEstimate'
        vehicle_id: { type: ['integer', 'null'] }
        vehicle_registration: { type: ['string', 'null'] }

    OfferPackage:
      type: object
      required: [item_type, package_size]
      additionalProperties: false
      properties:
        item_type:
          enum: [documents, food, parcel, electronics, furniture, appliances, other, null]
        package_size:
          enum: [small, medium, large, heavy, null]

    OfferPayment:
      description: >
        How the job settles, and which end settles it.


        Allow-listed out of `order_requests.details` on the same terms as
        `OfferPackage`: a decision input that identifies nobody. A driver
        carrying no float declines a cash job, and on a parcel the person
        ordering is often not the person paying — which is why `payer`
        travels with the method rather than being assumed.


        Unlike `package` this object is present on every service, because
        every job is paid for. Both members are null whenever the person
        ordering did not say, which is the common case: the public order form
        marks both optional. **Null must render as no figure — never as
        `cash`.** A driver who arrives expecting notes and is offered a
        mobile-money transfer they cannot take has been told something the
        platform never knew.
      type: object
      required: [payment_method, payer]
      additionalProperties: false
      properties:
        payment_method:
          enum: [cash, mobile_money, card, null]
        payer:
          description: Which end of a delivery settles the bill. Null on a ride, where there is only one end.
          enum: [sender, receiver, null]

    NullableWalkInFareEstimate:
      oneOf:
        - type: 'null'
        - $ref: '#/components/schemas/WalkInFareEstimate'

    WalkInFareEstimate:
      description: >
        A price before anybody has driven anywhere (ADR-0026 §2).


        Carries the distance it was computed from, not just the total: a
        figure with no basis is one a passenger cannot sanity-check and a
        dispatcher cannot explain, and the distance is the part that is
        estimated.
      type: object
      required: [vehicle_category, distance_km, total_minor, currency, is_estimate, basis]
      additionalProperties: false
      properties:
        vehicle_category: { type: string }
        distance_km:
          description: Great-circle kilometres. Under-reads against real roads, on purpose.
          type: number
        total_minor:
          description: Minor units. UGX is zero-decimal, so this is whole shillings.
          type: integer
        currency: { type: string }
        is_estimate:
          description: >
            Always true, and said in the payload rather than only in the UI —
            a client rendering this has to be able to tell a quote from a
            bill, and a flag beats every client remembering to add the word.
          const: true
        basis: { type: string }

    OfferPlace:
      type: object
      required: [label, latitude, longitude]
      additionalProperties: false
      properties:
        label: { type: ['string', 'null'] }
        latitude: { type: ['number', 'null'] }
        longitude: { type: ['number', 'null'] }

    DriverPresence:
      description: >
        Whether a driver is waiting for work, and where (ADR-0024 §2).
      type: object
      required:
        - driver_id
        - on_duty
        - vehicle_id
        - latitude
        - longitude
        - recorded_at
        - dispatchable
        - position_age_seconds
        - heartbeat_seconds
      additionalProperties: false
      properties:
        driver_id: { type: integer }
        on_duty: { type: boolean }
        vehicle_id: { type: ['integer', 'null'] }
        latitude: { type: ['number', 'null'] }
        longitude: { type: ['number', 'null'] }
        recorded_at: { $ref: '#/components/schemas/NullableTimestamp' }
        dispatchable:
          description: >
            Whether the matcher would offer this driver work right now — on
            duty, and either heard from within the TTL or never able to
            report a position at all. Served rather than left for a client
            to re-derive: three conditions and a configured number would
            drift, and the symptom is an app telling a driver they are
            online while the platform offers them nothing. Same reasoning as
            `allowed_transitions` on a trip.
          type: boolean
        position_age_seconds:
          description: Null when they have never reported. Lets an app say "last seen 4 minutes ago" instead of showing a green dot it has no evidence for.
          type: ['integer', 'null']
        heartbeat_seconds:
          description: How often to report in. Served from config so the cadence can be tuned against real battery data without shipping a new build to every handset.
          type: integer

    AvailabilityBlock:
      type: object
      required:
        - id
        - resource_type
        - resource_id
        - kind
        - status
        - answered_at
        - answer_note
        - starts_at
        - ends_at
        - reason
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        resource_type: { enum: [driver, vehicle] }
        resource_id: { type: integer }
        kind: { enum: [leave, sick, rest, training, maintenance, inspection, repair, other] }
        status: { enum: [requested, approved, declined] }
        answered_at: { $ref: '#/components/schemas/NullableTimestamp' }
        answer_note: { type: ['string', 'null'] }
        starts_at: { $ref: '#/components/schemas/NullableTimestamp' }
        ends_at: { $ref: '#/components/schemas/NullableTimestamp' }
        reason: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    DispatchSuggestion:
      description: A (vehicle, driver) pair the matcher would choose (ADR-0020).
      type: object
      required: [vehicle, driver, score, pickup_distance_km, reasons]
      additionalProperties: false
      properties:
        vehicle: { $ref: '#/components/schemas/Vehicle' }
        driver: { $ref: '#/components/schemas/Driver' }
        score:
          description: Higher is better. Contracts dominate; distance decays with range.
          type: number
        pickup_distance_km:
          description: >
            Great-circle km from the vehicle's live position to the pickup.
            Null when the booking has no coordinates or the vehicle has not
            reported — absent rather than guessed.
          type: ['number', 'null']
        reasons:
          description: Plain sentences a dispatcher can audit the ranking against.
          type: array
          items: { type: string }

    ZoneBoundaryPoint:
      description: >
        Named keys, not GeoJSON's positional [lng, lat]. That ordering is the
        most common coordinate bug there is, and ADR-0020 records this
        codebase hitting a swap no range check could catch.
      type: object
      required: [lat, lng]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    ZoneInput:
      type: object
      required: [name, kind, boundary]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 255 }
        kind: { enum: [service_area, pricing, client, branch, depot] }
        tenant_id:
          description: Required for a client zone, forbidden for every other kind.
          type: ['integer', 'null']
        boundary:
          description: A closed ring. Three points is the fewest that enclose an area.
          type: array
          minItems: 3
          items: { $ref: '#/components/schemas/ZoneBoundaryPoint' }
        priority:
          description: Lower wins where zones overlap. Defaults from the kind.
          type: integer
        active: { type: boolean }
        notes: { type: ['string', 'null'], maxLength: 255 }

    Zone:
      type: object
      required: [id, tenant_id, name, kind, boundary, priority, active, notes, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: ['integer', 'null'] }
        name: { type: string }
        kind: { enum: [service_area, pricing, client, branch, depot] }
        boundary:
          type: array
          items: { $ref: '#/components/schemas/ZoneBoundaryPoint' }
        priority: { type: integer }
        active: { type: boolean }
        notes: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    LivePosition:
      description: One vehicle's current position (ADR-0019).
      type: object
      required:
        - vehicle_id
        - trip_id
        - driver_id
        - latitude
        - longitude
        - speed_kph
        - heading_degrees
        - recorded_at
        - age_seconds
        - stale
      additionalProperties: false
      properties:
        vehicle_id: { type: integer }
        trip_id: { type: integer }
        driver_id: { type: ['integer', 'null'] }
        latitude: { type: number }
        longitude: { type: number }
        speed_kph: { type: ['number', 'null'] }
        heading_degrees: { type: ['integer', 'null'] }
        recorded_at:
          description: The device's clock, not the server's.
          $ref: '#/components/schemas/NullableTimestamp'
        age_seconds:
          description: Seconds since the device recorded it — the freshness figure.
          type: integer
        stale:
          description: >
            Older than tracking.live_stale_after_seconds. A still marker is
            ambiguous until you know whether it is a parked vehicle or a
            dead phone.
          type: boolean
        vehicle:
          description: >
            Who this marker is, so the map can name it. Allow-listed — no
            VIN; the fleet register serves that behind its own policy. Null
            only if the trip's vehicle row is gone.
          $ref: '#/components/schemas/LiveMapVehicle'
        driver:
          description: Allow-listed — name only, no phone or licence number.
          $ref: '#/components/schemas/LiveMapDriver'
        trip:
          description: >
            The occupying trip the position was read through. Deliberately
            carries no passenger: ADR-0024 §7 governs who sees a rider's
            name, and the trip record behind "Open trip" is where it lives.
          type: ['object', 'null']
          required: [id, status, origin, destination, client]
          additionalProperties: false
          properties:
            id: { type: integer }
            status: { $ref: '#/components/schemas/TripStatus' }
            origin: { type: ['string', 'null'] }
            destination: { type: ['string', 'null'] }
            client:
              description: Null on a walk-in (ADR-0024 §1) — Shanitah's own ride.
              type: ['object', 'null']
              required: [id, name]
              additionalProperties: false
              properties:
                id: { type: integer }
                name: { type: string }

    LiveMapVehicle:
      description: >
        A vehicle as the live map names it — plate, make, model, category;
        nothing a register would hold. The category is what picks the
        silhouette the map draws, the same source the public nearby read
        maps to `kind`.
      type: ['object', 'null']
      required: [id, registration_number, make, model, category]
      additionalProperties: false
      properties:
        id: { type: integer }
        registration_number: { type: string }
        make: { type: ['string', 'null'] }
        model: { type: ['string', 'null'] }
        category: { type: ['string', 'null'] }

    LiveMapDriver:
      description: A driver as the live map names them — id and name only.
      type: ['object', 'null']
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }

    NearbyVehicle:
      description: >
        One available vehicle near a point, anonymized for the public
        surfaces. A position and a silhouette — deliberately nothing that
        joins back to the fleet register.
      type: object
      required: [key, category, kind, latitude, longitude, age_seconds]
      additionalProperties: false
      properties:
        key:
          description: Opaque marker id, stable within the hour, rotating across hours.
          type: string
        category:
          description: The vehicle's platform category; null when the driver has no vehicle on record.
          type: ['string', 'null']
        kind:
          description: Which sprite family a map should draw.
          enum: [sedan, suv, pickup, boda]
        latitude: { type: number }
        longitude: { type: number }
        age_seconds:
          description: Seconds since the position was reported, device clock.
          type: ['integer', 'null']
      # `age_seconds` is null only in the degenerate case of a store row
      # with no timestamp; dispatchable() should never serve one.

    OnDutyDriver:
      description: >
        One on-duty driver, for the live map (ADR-0024 §2, the office's
        read). Shaped like LivePosition on purpose — `age_seconds` and
        `stale` mean the same in both — so a page can merge the two lists
        and sort them by who needs attention.
      type: object
      required:
        - driver_id
        - driver
        - vehicle_id
        - vehicle
        - latitude
        - longitude
        - accuracy_metres
        - recorded_at
        - age_seconds
        - stale
        - trip
      additionalProperties: false
      properties:
        driver_id: { type: integer }
        driver: { $ref: '#/components/schemas/LiveMapDriver' }
        vehicle_id:
          description: The shift's vehicle, else the one on the driver's profile; null when neither.
          type: ['integer', 'null']
        vehicle: { $ref: '#/components/schemas/LiveMapVehicle' }
        latitude:
          description: Null, not zero, when the handset has never reported.
          type: ['number', 'null']
        longitude: { type: ['number', 'null'] }
        accuracy_metres: { type: ['number', 'null'] }
        recorded_at: { $ref: '#/components/schemas/NullableTimestamp' }
        age_seconds:
          description: Null when never reported, like recorded_at.
          type: ['integer', 'null']
        stale:
          description: >
            Older than dispatch.presence_ttl_seconds, or never reported.
            The matcher hides such a driver; the map shows them greyed, so
            that somebody phones them.
          type: boolean
        trip:
          description: The occupying trip that has them, or null when they are waiting for work.
          type: ['object', 'null']
          required: [id, status]
          additionalProperties: false
          properties:
            id: { type: integer }
            status: { $ref: '#/components/schemas/TripStatus' }

    CustomerProfile:
      description: >
        A customer as staff see them (ADR-0018) — distinct from the account
        the customer sees. Never carries a credential of any kind.
      type: object
      required:
        - id
        - first_name
        - last_name
        - name
        - gender
        - phone
        - email
        - status
        - has_password
        - has_google
        - suspended_at
        - suspension_reason
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        name: { type: string }
        gender: { type: ['string', 'null'] }
        phone: { type: string }
        email: { type: ['string', 'null'] }
        status: { enum: [active, suspended] }
        has_password:
          description: Whether they can sign in with a password, not what it is.
          type: boolean
        has_google: { type: boolean }
        suspended_at: { $ref: '#/components/schemas/NullableTimestamp' }
        suspension_reason: { type: ['string', 'null'] }
        orders_count: { type: integer }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    CandidateDriver:
      description: >
        A driver plus whether they can take this booking (ADR-0017). The
        driver fields are DriverResource's, restated for the same reason
        CandidateVehicle restates the vehicle's — additionalProperties:
        false rules out allOf composition, and the guarantee is worth the
        duplication.
      type: object
      required:
        - id
        - name
        - phone
        - email
        - license_number
        - license_expiry
        - status
        - vehicle_id
        - owns_vehicle
        - account
        - created_at
        - updated_at
        - dispatchable
        - note
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: ['string', 'null'] }
        license_number: { type: string }
        license_expiry: { $ref: '#/components/schemas/NullableTimestamp' }
        owns_vehicle:
          description: >
            Whether `vehicle_id` names the driver's **own** vehicle
            (ADR-0048 §7) rather than one the depot handed them. Not derivable
            from `vehicle_id`, which is why it is stored and sent.
          type: boolean
        vehicle:
          description: >
            Flat vehicle summary, present only when the relation was
            eager-loaded. Absent (not null) when it was not, so a list that
            stopped eager-loading is visible in development rather than quietly
            slow in production.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, registration_number, make, model]
              additionalProperties: false
              properties:
                id: { type: integer }
                registration_number: { type: string }
                make: { type: string }
                model: { type: string }
        status: { enum: [active, suspended, inactive] }
        vehicle_id:
          description: >
            The vehicle this driver drives, or null when the depot allocates
            one per shift instead. Restated from Driver for the reason given
            above.
          type: ['integer', 'null']
        account:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, email, role, status]
              additionalProperties: false
              properties:
                id: { type: integer }
                email: { type: string, format: email }
                role: { type: string }
                status: { enum: [active, suspended] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }
        dispatchable:
          description: False means the assignment endpoint will refuse them with 409.
          type: boolean
        note:
          description: >
            Short sentence, or null when there is nothing to say. Never names
            the kind of absence.
          type: ['string', 'null']

    DriverApplication:
      description: >
        A rider asking to drive (ADR-0027). Console-side only — the
        applicant has no way to read their own row (§6). Never carries the
        password hash: the model hides it, and once the application is
        decided the column is cleared entirely.
      type: object
      required:
        - id
        - name
        - phone
        - email
        - status
        - status_label
        - terms_accepted_at
        - reviewed_at
        - reviewed_by_user_id
        - rejection_reason
        - driver_id
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        status: { enum: [pending, approved, rejected] }
        status_label: { type: string }
        terms_accepted_at:
          description: >
            When the applicant agreed to the /public/legal notices — a
            server-stamped time, not a client boolean, because the DPPA 2019
            wants consent recorded and "true" records nothing.
          $ref: '#/components/schemas/Timestamp'
        reviewed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        reviewed_by_user_id: { type: ['integer', 'null'] }
        rejection_reason: { type: ['string', 'null'] }
        driver_id:
          description: The profile approval produced, once it has.
          type: ['integer', 'null']
        created_at: { $ref: '#/components/schemas/Timestamp' }

    Driver:
      type: object
      required:
        - id
        - name
        - phone
        - email
        - license_number
        - license_expiry
        - status
        - vehicle_id
        - owns_vehicle
        - account
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: ['string', 'null'] }
        license_number: { type: string }
        license_expiry: { $ref: '#/components/schemas/NullableTimestamp' }
        status: { enum: [active, suspended, inactive] }
        vehicle_id:
          description: >
            The vehicle this driver drives, or null when the depot allocates
            one per shift instead. A fact about the person rather than about
            the shift: most drivers here own their vehicle, and for a boda
            rider the rider and the motorcycle are not separable.
            `driver_presence.vehicle_id` remains the per-shift answer and
            still wins when it is set.
          type: ['integer', 'null']
        owns_vehicle:
          description: >
            Whether `vehicle_id` names the driver's **own** vehicle
            (ADR-0048 §7), rather than one the depot handed them.

            Not derivable from `vehicle_id`, which is why it is stored: a boda
            rider whose machine is their livelihood and a driver holding the
            keys to a depot car this week set the same column to the same kind
            of value, and the two differ in who insures it, who repairs it,
            and whether the vehicle papers on file are the driver's or the
            platform's.

            `owns_vehicle: true` with `vehicle_id: null` is a real and
            meaningful state: a driver the office recorded as owning a machine
            the fleet has not registered yet.
          type: boolean
        vehicle:
          description: >
            Enough of the vehicle to name it on a row, and no more — a driver
            list is read to answer "who is out in what", and the answer is a
            number plate. Present only when the relation was eager-loaded;
            absent rather than null when it was not, so a slow list is visible
            in development instead of quiet in production.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, registration_number, make, model]
              additionalProperties: false
              properties:
                id: { type: integer }
                registration_number: { type: string }
                make: { type: string }
                model: { type: string }
        account:
          description: >
            The account this driver signs in with, or null if they cannot sign
            in yet (ADR-0016). Always present so a client can tell "no account"
            apart from "not requested". Never carries password material.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, email, role, status]
              additionalProperties: false
              properties:
                id: { type: integer }
                email: { type: string, format: email }
                role: { type: string }
                status: { enum: [active, suspended] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    InlineVehicle:
      description: >
        A vehicle registered from the driver form (ADR-0048 §8), so a clerk
        onboarding a boda rider does not have to abandon a half-typed form to
        register the machine on another screen.

        **Every rule is the fleet screen's own**, deliberately: the same plate
        uniqueness, the same year window, the same category list. A vehicle
        created this way is an ordinary fleet vehicle — it appears on the
        vehicles list, it dispatches, and nothing marks it as having arrived
        by a side door. If it were validated more loosely than one typed on
        the fleet screen, the side door is exactly what it would be.

        `status` is deliberately absent: a vehicle registered alongside its
        driver is active, and a form with no way to say what is being
        maintained should not be able to create one that cannot work.
      type: object
      required: [registration_number, make, model, year, category, seating_capacity]
      additionalProperties: false
      properties:
        registration_number: { type: string, maxLength: 50 }
        make: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 100 }
        year: { type: integer, minimum: 1980 }
        category: { enum: [sedan, suv, van, minibus, bus, pickup, truck] }
        seating_capacity: { type: integer, minimum: 1, maximum: 100 }
        color: { type: ['string', 'null'], maxLength: 50 }
        vin: { type: ['string', 'null'], maxLength: 50 }

    Vehicle:
      type: object
      required:
        - id
        - registration_number
        - make
        - model
        - year
        - category
        - seating_capacity
        - color
        - vin
        - status
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        registration_number: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        category: { $ref: '#/components/schemas/VehicleCategoryKey' }
        seating_capacity: { type: integer }
        color: { type: ['string', 'null'] }
        vin: { type: ['string', 'null'] }
        status: { enum: [active, maintenance, inactive] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    Settings:
      description: >
        The full settings map (ADR-0014), every catalogue key resolved:
        stored value where one exists, default where none does. Secret
        keys (none in phase 1) appear as {configured: bool}, never as
        values.
      type: object
      required: [branding, legal, auth, regional, ordering, billing, booking, mail, sms, payments]
      additionalProperties: false
      properties:
        branding: { $ref: '#/components/schemas/BrandingSettings' }
        legal:
          description: >
            The Terms and Privacy notices the Driver App asks consent to.
            Plain text, newline-separated, edited here and read publicly at
            GET /public/legal — deliberately absent from PublicSettings,
            which every page load fetches.
          type: object
          required: [terms, privacy, safety]
          additionalProperties: false
          properties:
            terms: { type: ['string', 'null'] }
            privacy: { type: ['string', 'null'] }
            safety:
              description: >
                Office-authored safety guidance, shown on the driver app's
                Safety screen (ADR-0040). In this group rather than in
                `safety` below for the reason the group docblock gives: it is
                a document, read only when somebody opens that screen, and
                riding it along with every cold start would be a cost paid by
                people who never opened it.
              type: ['string', 'null']
        safety:
          description: >
            Getting help when something goes wrong (ADR-0040).
          type: object
          required: [emergency_number]
          additionalProperties: false
          properties:
            emergency_number:
              description: >
                **Public and short**, so the Safety screen can offer it on a
                cold start with no token — a driver in trouble is the worst
                moment to discover the app needed a round trip first.

                A setting rather than a constant: 999 is Uganda's, and
                PRODUCT.md's international readiness means no emergency number
                is ever hardcoded. **Empty by default** — an operator who has
                published none gets a screen that says so, where a plausible
                default would be a driver dialling a number that does not
                answer in their country.
              type: ['string', 'null']
        auth:
          description: >
            Which ways into the Driver App are on (ADR-0028), and the
            credentials they run on. The booleans are mirrored into
            PublicSettings; the credentials never are, and the Facebook
            secret is write-only.
          type: object
          required:
            - password_reset_enabled
            - google_enabled
            - facebook_enabled
            - google_client_ids
            - facebook_app_id
            - facebook_app_secret
          additionalProperties: false
          properties:
            password_reset_enabled: { type: boolean }
            google_enabled: { type: boolean }
            facebook_enabled: { type: boolean }
            google_client_ids: { type: ['string', 'null'] }
            facebook_app_id: { type: ['string', 'null'] }
            facebook_app_secret: { $ref: '#/components/schemas/SecretValue' }
        regional:
          type: object
          required: [currency, timezone, date_format]
          additionalProperties: false
          properties:
            currency: { type: string }
            timezone: { type: string }
            date_format: { type: string }
        ordering:
          type: object
          required: [walk_in_enabled, rate_limit_per_minute]
          additionalProperties: false
          properties:
            walk_in_enabled: { type: boolean }
            rate_limit_per_minute: { type: integer }
        billing:
          description: >
            What the platform keeps from a walk-in fare (ADR-0029 §3). A
            setting rather than a constant, because the rate is a commercial
            decision the Super Admin makes and argues about — not one that
            needs a deploy.


            **Changing it never restates what a driver already earned.** The
            rate in force at completion is written into the ledger entry's
            description, so history is priced at the rate it happened under.
          type: object
          required:
            - driver_commission_percent
            - bonus_enabled
            - bonus_weekly_trip_target
            - bonus_weekly_amount_minor
            - peak_enabled
            - peak_starts_at
            - peak_ends_at
            - peak_uplift_percent
            - referral_enabled
            - referral_trip_target
            - referral_reward_amount_minor
          additionalProperties: false
          properties:
            driver_commission_percent: { type: integer, minimum: 0, maximum: 100 }
            bonus_enabled:
              type: boolean
              description: >
                The weekly target bonus (ADR-0034 §4). **Defaults to false**,
                and not because the feature is risky: it creates a liability
                against every driver on the platform, and a scheme that
                switches itself on at deploy is an unbudgeted bill. Same
                argument that defaults `maps.routing_enabled` off, where the
                cost was a metered API rather than payroll.
            bonus_weekly_trip_target:
              type: integer
              minimum: 1
              maximum: 1000
              description: >
                Completed trips in one **local** week that earn the bonus.
                Weeks are the fleet's, from `regional.timezone` — a Kampala
                week measured in UTC starts on Sunday at 03:00.
            bonus_weekly_amount_minor:
              type: integer
              minimum: 0
              description: >
                What clearing the target pays, in minor units.

                **Never served to the driver app as a rule.** It is settable
                here, so a handset that *held* it would go on asserting the old
                figure. ADR-0036 §6 added `GET /me/promotions`, which does
                include this amount — but as a value the server resolved for
                one driver at one moment, re-read on every pull, never as a
                policy the app stores and applies. The distinction is the whole
                of the rule: the app is told what *is*, not what to compute.
            peak_enabled:
              type: boolean
              description: >
                The peak-hour earnings uplift (ADR-0036). **Defaults to
                false**, for `bonus_enabled`'s reason and more urgently: a
                weekly bonus bills once a week, an uplift bills on **every
                trip** inside the window.
            peak_starts_at:
              type: string
              pattern: '^[0-9]{2}:[0-9]{2}$'
              description: >
                `HH:MM` in the fleet's zone (`regional.timezone`). Modelled on
                `rate_card_versions.night_starts_at` deliberately — a second
                way of writing "a window of the day" is a second way of getting
                the midnight wrap wrong.
            peak_ends_at:
              type: string
              pattern: '^[0-9]{2}:[0-9]{2}$'
              description: >
                `HH:MM`. **Half open** — a trip completing at exactly this time
                is outside. A window that wraps past midnight (22:00 to 02:00)
                is the normal case, not a misconfiguration. Setting this equal
                to `peak_starts_at` is an **empty** window, not a whole day;
                reading a typo as "always" would pay the uplift on every trip
                on the platform.
            peak_uplift_percent:
              type: integer
              minimum: 1
              maximum: 100
              description: >
                A percentage of the driver's **share** of the fare, never of
                the gross — a percentage of the gross would pay more for one
                expensive corporate journey than for three short rides taking
                the same three hours, rewarding the dispatch board rather than
                the driver's evening.

                Nothing here changes what a passenger is charged; the uplift is
                the platform's own money. Capped at 100 because a driver
                earning more than double their share is far likelier to be a
                typed extra zero than a policy, and this setting spends real
                money on every trip until somebody notices.
            referral_enabled:
              type: boolean
              description: >
                Driver referrals (ADR-0037). **Defaults to false**, with a
                second reason beyond cost: the office's approval of every
                application is the fraud control, so switching this on also
                takes on the job of reading the applications it attracts.
            referral_trip_target:
              type: integer
              minimum: 1
              maximum: 1000
              description: >
                Completed trips the **referred** driver must do before the
                referrer is paid. Not a hurdle in front of the reward — it *is*
                the verification: a sign-up costs nothing to manufacture, and
                ten real trips means real work dispatched and real fares
                priced.
            referral_reward_amount_minor:
              type: integer
              minimum: 0
              description: >
                What one qualified referral pays, in minor units, uncommissioned
                — taking a cut of an advertised reward would mean the figure a
                driver was shown and the figure they were paid differ.

                Frozen onto each `driver_referrals` row when the referral is
                attached, so changing it here never restates what somebody was
                already promised.
        booking:
          type: object
          required: [approval_required, max_advance_days]
          additionalProperties: false
          properties:
            approval_required: { type: boolean }
            max_advance_days: { type: integer }
        tracking:
          description: >
            Whether an odometer reading is believed (ADR-0035).


            Both numbers were unreachable before this group existed: the
            threshold lived in `config/tracking.php` behind an env var, so
            changing it needed a deploy and left no audit trail, and the
            ceiling did not exist at all. A driver typed one digit too many and
            the platform recorded a 90,004 km journey and priced it at
            UGX 198,013,800 without objecting.


            The rest of `config/tracking.php` — retention, partition headroom,
            the live-position TTL and the GPS noise floor — deliberately stays
            in config. Those are properties of the measuring apparatus rather
            than business rules.
          type: object
          required:
            [
              odometer_enabled,
              trace_route_ceiling_percent,
              variance_threshold_percent,
              odometer_max_km_per_trip,
            ]
          additionalProperties: false
          properties:
            odometer_enabled:
              type: boolean
              description: >
                Whether drivers record opening and closing odometer readings
                at all (ADR-0047). On by default.


                Turning it off has a contractual cost: PROJECT.md lists
                "opening and closing odometer (mileage) readings" as the
                Bank's acceptance criterion #4 for the Phase 1 MVP, and this
                switch is platform-wide — corporate trips included.


                With it off, the billable distance comes from the recorded GPS
                trace, bounded by what the road between the trip's start and
                end allows. A trip with no usable trace completes with a null
                distance and a review flag rather than an invented figure.


                Public: the Driver's Application renders from it, dropping the
                odometer screens out of the trip flow entirely so that Start
                Trip and Complete Trip become single taps.
            trace_route_ceiling_percent:
              type: number
              minimum: 0
              maximum: 200
              description: >
                How far past the road route a measured GPS trace may run
                before it stops being believable, as a percentage. Only
                consulted when `odometer_enabled` is false.


                Real drives run longer than the route — diversions, one-way
                systems, a passenger asking for a stop — so the margin is
                generous. It exists to catch the failure that matters once the
                trace prices the fare rather than merely checking it: jitter or
                a spoofed location inflating a distance with nothing to check
                it against.


                A trace over the ceiling is billed at the ceiling and flagged,
                never refused. The passenger is at the kerb and the driver did
                drive somewhere.
            variance_threshold_percent:
              type: number
              minimum: 1
              maximum: 100
              description: >
                How far the odometer distance may differ from the GPS trace
                before the trip is flagged for review, as a percentage of the
                odometer distance. A trip with no GPS trace is never flagged:
                that is missing evidence, not a discrepancy.


                Flagging only. A flagged trip is still invoiced and still pays
                the driver.
            odometer_max_km_per_trip:
              type: integer
              minimum: 1
              maximum: 100000
              description: >
                The longest journey one closing odometer reading may describe,
                in kilometres. Beyond it the transition to Trip Completed is
                refused with 422, so the reading never becomes a trip and
                therefore never becomes a fare — the driver corrects it while
                still at the vehicle.


                This is the ceiling to the floor that already refuses a closing
                reading below the opening one.
        maps:
          description: >
            Road routing for the driver app's maps (ADR-0031 pending). The
            maps themselves are MapLibre against CARTO's free tiles and need
            no key; this group is only about the route line, the road distance
            and the arrival estimate.


            `api_key` is a **secret**: encrypted at rest, never returned by
            this endpoint, and masked in audit (ADR-0014 §3). It is
            deliberately not in the public subset — Directions bills per
            request, so a key in a browser bundle or a handset is somebody
            else's traffic on this operator's invoice. Routing is served by
            the backend for that reason.


            `routing_enabled` defaults to **false** so that configuring a key
            never silently starts a bill, and is a separate switch so the
            spend can be stopped without destroying the credential.
          type: object
          required: [routing_enabled, routing_provider, osrm_base_url, api_key]
          additionalProperties: false
          properties:
            routing_enabled: { type: boolean }
            routing_provider:
              enum: [google, osrm]
              description: >
                **OSRM by default**, because it needs no key and costs
                nothing — routing works the moment the switch is on rather
                than after a billing account exists. Google is the upgrade:
                better traffic data, and a meter.
            osrm_base_url:
              type: string
              format: uri
              description: >
                Where OSRM lives. Defaults to the project's public demo
                server, which is rate-limited and **not for production** under
                OSRM's own usage policy. Point it at a self-hosted instance
                before a real fleet depends on it.
            api_key:
              allOf: [{ $ref: '#/components/schemas/SecretValue' }]
              description: Google only. OSRM is an open server and needs none.
        mail:
          type: object
          required: [enabled, host, port, username, password, encryption, from_address, from_name]
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            host: { type: ['string', 'null'] }
            port: { type: integer }
            username: { type: ['string', 'null'] }
            password: { $ref: '#/components/schemas/SecretValue' }
            encryption: { enum: [tls, none] }
            from_address: { type: ['string', 'null'] }
            from_name: { type: ['string', 'null'] }
        sms:
          type: object
          required: [provider, sender_id, api_key, api_secret]
          additionalProperties: false
          properties:
            provider: { enum: ['', africastalking, twilio, null] }
            sender_id: { type: ['string', 'null'] }
            api_key: { $ref: '#/components/schemas/SecretValue' }
            api_secret: { $ref: '#/components/schemas/SecretValue' }
        payments:
          type: object
          required: [mtn_momo_api_user, mtn_momo_api_key, airtel_money_client_id, airtel_money_client_secret]
          additionalProperties: false
          properties:
            mtn_momo_api_user: { type: ['string', 'null'] }
            mtn_momo_api_key: { $ref: '#/components/schemas/SecretValue' }
            airtel_money_client_id: { type: ['string', 'null'] }
            airtel_money_client_secret: { $ref: '#/components/schemas/SecretValue' }

    SecretValue:
      description: >
        A write-only credential (ADR-0014 §3). The value never appears in
        any response — only whether one is stored. Write a new value via
        PATCH like any other key; there is no way to read one back.
      type: object
      required: [configured]
      additionalProperties: false
      properties:
        configured: { type: boolean }

    BrandingSettings:
      type: object
      required: [app_name, tagline, meta_description, contact_email, contact_phone, logo_path, favicon_path]
      additionalProperties: false
      properties:
        app_name: { type: string }
        tagline: { type: ['string', 'null'] }
        meta_description: { type: ['string', 'null'] }
        contact_email: { type: string }
        contact_phone: { type: ['string', 'null'] }
        logo_path: { type: ['string', 'null'] }
        favicon_path: { type: ['string', 'null'] }

    PublicSettings:
      description: >
        The unauthenticated branding subset: catalogue keys flagged
        public only, asset paths as absolute URLs.
      type: object
      required: [branding, auth, regional, ordering, safety, tracking]
      additionalProperties: false
      properties:
        branding: { $ref: '#/components/schemas/BrandingSettings' }
        tracking:
          description: >
            Whether the Driver's Application should ask for odometer readings
            (ADR-0047), and nothing else from that group — the variance
            threshold and the per-trip ceiling are operator business the app
            has no use for.


            Public because the app renders its trip flow from it: with the
            odometer off, the odometer screens leave the flow and Start Trip
            and Complete Trip become single taps.
          type: object
          required: [odometer_enabled]
          additionalProperties: false
          properties:
            odometer_enabled: { type: boolean }
        safety:
          description: >
            The emergency number, and nothing else from that group (ADR-0040).
          type: object
          required: [emergency_number]
          additionalProperties: false
          properties:
            emergency_number: { type: ['string', 'null'] }
        auth:
          description: >
            Which sign-in methods the Driver App should offer (ADR-0028),
            and the public identifiers it needs to start the native flows.
            Client and app ids are public by design — they ship inside
            every app binary; the Facebook app SECRET never crosses this
            endpoint.
          type: object
          required:
            - password_reset_enabled
            - google_enabled
            - facebook_enabled
            - google_client_ids
            - facebook_app_id
          additionalProperties: false
          properties:
            password_reset_enabled: { type: boolean }
            google_enabled: { type: boolean }
            facebook_enabled: { type: boolean }
            google_client_ids: { type: ['string', 'null'] }
            facebook_app_id: { type: ['string', 'null'] }
        regional:
          type: object
          required: [currency]
          additionalProperties: false
          properties:
            currency: { type: string }
        ordering:
          type: object
          required: [walk_in_enabled]
          additionalProperties: false
          properties:
            walk_in_enabled:
              type: boolean
              description: False while the owner has paused online intake — the order form explains instead of failing at submit.

    Customer:
      description: >
        A customer's own account, as shown to them (ADR-0013, ADR-0015).
        `name` is composed from first_name and last_name rather than
        stored, and is returned so clients need not re-implement the join.
        `gender` is null when never asked, which is a different answer
        from "prefer_not_to_say" (ADR-0015 §2).
      type: object
      required: [id, first_name, last_name, name, gender, phone, email, created_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        name: { type: string }
        gender:
          type: string
          nullable: true
          enum: [female, male, other, prefer_not_to_say]
        phone: { type: string }
        email: { type: string }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    CustomerOrderRequest:
      description: >
        An order request as its own customer sees it (ADR-0013 §4).
        Deliberately narrower than OrderRequest: no dispatcher_notes (the
        desk's working notes are the desk's), no handled_by (staff
        assignment is internal), no allowed_transitions (a customer moves
        nothing), and no contact echo.
      type: object
      required:
        - id
        - reference
        - service_type
        - status
        - pickup_location
        - dropoff_location
        - scheduled_for
        - details
        - notes
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        reference: { type: string }
        service_type: { enum: [ride, delivery, self_drive] }
        status: { enum: [new, contacted, converted, closed] }
        pickup_location: { type: ['string', 'null'] }
        dropoff_location: { type: ['string', 'null'] }
        scheduled_for: { $ref: '#/components/schemas/NullableTimestamp' }
        details: { $ref: '#/components/schemas/FreeformMap' }
        notes: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    OrderRequest:
      description: >
        A walk-in request from the public landing page (ADR-0012). The
        dispatcher-queue shape — the public endpoint returns only a
        reference, never this.
      type: object
      required:
        - id
        - reference
        - service_type
        - status
        - allowed_transitions
        - contact_name
        - contact_phone
        - contact_email
        - pickup_location
        - pickup_latitude
        - pickup_longitude
        - dropoff_location
        - dropoff_latitude
        - dropoff_longitude
        - scheduled_for
        - details
        - notes
        - dispatcher_notes
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        reference:
          type: string
          description: KR- plus six characters readable down a phone line.
        service_type: { enum: [ride, delivery, self_drive] }
        status: { enum: [new, contacted, converted, closed] }
        allowed_transitions:
          type: array
          items: { enum: [new, contacted, converted, closed] }
        contact_name: { type: string }
        contact_phone: { type: string }
        contact_email: { type: ['string', 'null'] }
        pickup_location: { type: ['string', 'null'] }
        pickup_latitude:
          description: Where the pickup is, when the caller's geocoder knew (ADR-0020).
          type: ['number', 'null']
        pickup_longitude: { type: ['number', 'null'] }
        dropoff_location: { type: ['string', 'null'] }
        dropoff_latitude: { type: ['number', 'null'] }
        dropoff_longitude: { type: ['number', 'null'] }
        scheduled_for: { $ref: '#/components/schemas/NullableTimestamp' }
        details: { $ref: '#/components/schemas/FreeformMap' }
        notes: { type: ['string', 'null'] }
        dispatcher_notes: { type: ['string', 'null'] }
        handled_by:
          anyOf:
            - { $ref: '#/components/schemas/ValueName' }
            - { enum: [null] }
        customer:
          description: >
            The linked account holder (ADR-0013 §5); null for an anonymous
            walk-in. Id and name only — the customer's contact details on
            this row are already the ones they typed into the form.
          anyOf:
            - { $ref: '#/components/schemas/ValueName' }
            - { enum: [null] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    ValueName:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }

    VehicleAllocation:
      description: A period for which a vehicle is contracted to a client (ADR-0005/0009).
      type: object
      required:
        - id
        - tenant_id
        - vehicle_id
        - starts_on
        - ends_on
        - exclusive
        - in_force
        - notes
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        client: { $ref: '#/components/schemas/ClientRef' }
        vehicle_id: { type: integer }
        vehicle:
          anyOf:
            - { $ref: '#/components/schemas/Vehicle' }
            - { enum: [null] }
        starts_on: { type: string, format: date }
        ends_on:
          type: ['string', 'null']
          description: Null for an open-ended contract. The last day counts as in force.
        exclusive:
          type: boolean
          description: >
            False — the default, and the Bank's case — ranks the vehicle
            first for this client's work while leaving it in the pool. True
            refuses every other client's dispatch with 409, no override.
        in_force: { type: boolean }
        notes: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    CandidateVehicle:
      description: >
        A vehicle plus what this booking's contracts say about it
        (ADR-0009). The vehicle fields are VehicleResource's, restated
        because additionalProperties: false rules out allOf composition —
        the census-style guarantee is worth the duplication.
      type: object
      required:
        - id
        - registration_number
        - make
        - model
        - year
        - category
        - seating_capacity
        - color
        - vin
        - status
        - created_at
        - updated_at
        - allocated
        - dispatchable
        - requires_override_reason
        - note
      additionalProperties: false
      properties:
        id: { type: integer }
        registration_number: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        category: { $ref: '#/components/schemas/VehicleCategoryKey' }
        seating_capacity: { type: integer }
        color: { type: ['string', 'null'] }
        vin: { type: ['string', 'null'] }
        status: { enum: [active, maintenance, inactive] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }
        allocated:
          type: boolean
          description: Ranks first for this client on this date.
        dispatchable:
          type: boolean
          description: False means dispatch will refuse it with 409, whatever is sent.
        requires_override_reason:
          type: boolean
          description: True means assignment without a reason gets a 422 naming allocation_override_reason.
        note:
          type: ['string', 'null']
          description: Short human sentence. Never names the other client.

    Booking:
      type: object
      required:
        - id
        - tenant_id
        - requested_by_user_id
        - passenger_user_id
        - passenger_name
        - passenger_phone
        - passenger_count
        - vehicle_category
        - origin
        - destination
        - scheduled_for
        - is_immediate
        - status
        - approved_by_user_id
        - approved_at
        - decision_reason
        - notes
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        client: { $ref: '#/components/schemas/ClientRef' }
        requested_by_user_id: { type: integer }
        requested_by:
          anyOf:
            - { $ref: '#/components/schemas/User' }
            - { enum: [null] }
        passenger_user_id:
          type: ['integer', 'null']
          description: >
            The colleague this was raised for, when a client raised it; null
            for the walk-ins and callers Shanitah's own desk books. The link,
            not the source — `passenger_name` and `passenger_phone` below stay
            authoritative, because they are the snapshot the driver was
            dispatched against.
        passenger_name: { type: string }
        passenger_phone: { type: string }
        passenger_count: { type: ['integer', 'null'] }
        vehicle_category:
          description: >
            The kind of vehicle the client asked for (ADR-0051), or null
            when they stated no preference.


            **A preference, not a constraint.** `DispatchRecommender` ranks a
            matching vehicle above everything except one contracted to this
            client, and still offers the others with a reason line saying
            which is which. Nothing refuses a mismatch.


            Null is a real answer and is never defaulted: "did not mind" and
            "asked for a van and was sent a sedan" are different facts, and a
            client's auditor is entitled to tell them apart.
          anyOf:
            - { $ref: '#/components/schemas/VehicleCategoryKey' }
            - { enum: [null] }
        origin: { type: string }
        destination: { type: string }
        scheduled_for: { $ref: '#/components/schemas/NullableTimestamp' }
        is_immediate: { type: boolean }
        status: { $ref: '#/components/schemas/BookingStatus' }
        approved_by_user_id: { type: ['integer', 'null'] }
        approved_by:
          anyOf:
            - { $ref: '#/components/schemas/User' }
            - { enum: [null] }
        approved_at: { $ref: '#/components/schemas/NullableTimestamp' }
        decision_reason: { type: ['string', 'null'] }
        notes: { type: ['string', 'null'] }
        trip:
          anyOf:
            - { $ref: '#/components/schemas/Trip' }
            - { enum: [null] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    TripPlace:
      description: >
        One end of a journey, in prose and — where the platform has it — in
        coordinates. See `Trip.pickup` for why the pair is all-or-nothing.
      type: object
      required: [label, latitude, longitude]
      additionalProperties: false
      properties:
        label:
          description: Always present; `trips.origin` and `trips.destination` are not nullable.
          type: string
        latitude: { type: ['number', 'null'] }
        longitude: { type: ['number', 'null'] }

    SettledFare:
      description: >
        A fare that has been charged, as against `WalkInFareEstimate`, which
        is a quote (ADR-0026 §2).
      type: object
      required: [total_minor, currency, rate_card_version_id, computed_at, is_estimate]
      additionalProperties: false
      properties:
        total_minor:
          description: Minor units. UGX is zero-decimal, so this is whole shillings.
          type: integer
        currency: { type: ['string', 'null'] }
        rate_card_version_id:
          description: What priced it, so the figure can be re-derived years later.
          type: ['integer', 'null']
        computed_at: { type: ['string', 'null'], format: date-time }
        is_estimate:
          description: Always false. The counterpart of the always-true flag on WalkInFareEstimate.
          enum: [false]

    DriverDocumentType:
      description: >
        The papers a driver has to hold (ADR-0033 §1).

        **None of these is named for one country, and the naming is the
        point.** The obvious East African list — *PSV badge*, *logbook* —
        was deliberately not used: a type enum lands in a database column,
        this schema and every shipped handset, and is then untouchable.
        `identity_document` covers a national ID in Kampala and a passport in
        Nairobi with no migration between them.
        `identity_selfie` and `vehicle_photo` were added by ADR-0048 §1 on
        the same terms: a face is a face in Kampala and in Nairobi, and a
        photograph of a car is not a jurisdiction's paperwork. The set is six
        and is closed again.
      type: string
      enum:
        - driving_licence
        - identity_document
        - vehicle_insurance
        - vehicle_registration
        - identity_selfie
        - vehicle_photo

    DriverDocumentGroup:
      description: >
        Which headed section of the KYC screen a type belongs under
        (ADR-0048 §1).

        Served rather than inferred client-side, so the driver app and the
        console group the six slots the same way without either of them
        holding a list of type names. A seventh type then reaches both screens
        correctly grouped with no client release.
      type: string
      enum: [personal, driver, vehicle]

    DriverDocumentStatus:
      description: >
        What the office made of a document. Three **stored** states; `expired`
        is not one of them — see `compliance_state`.
      type: string
      enum: [pending, verified, rejected]

    DriverDocumentComplianceState:
      description: >
        The state anything outside the module should act on: the stored status,
        plus the derived `expired`. **Expiry outranks verification** — a
        licence that lapsed last month is not a verified licence.
      type: string
      enum: [pending, verified, rejected, expired]

    DriverDocument:
      description: >
        One of a driver's papers (ADR-0033).

        **`file_path` is never in this payload.** It is hidden on the model as
        well, because a resource is the wrong place for the only guard on a
        private disk holding somebody's identity document. The file is reached
        through `file_url`, which streams behind the policy.
      type: object
      required:
        - id
        - driver_id
        - driver_application_id
        - type
        - type_label
        - group
        - group_label
        - status
        - status_label
        - compliance_state
        - expires_at
        - expired
        - original_name
        - mime_type
        - size_bytes
        - uploaded_at
        - rejection_reason
        - reviewed_at
        - file_url
      additionalProperties: false
      properties:
        id: { type: integer }
        driver_id:
          type: ['integer', 'null']
          description: >
            Null only while the document belongs to an applicant nobody has
            approved yet (ADR-0048 §3). Exactly one of this and
            `driver_application_id` is ever set.
        driver_application_id:
          type: ['integer', 'null']
          description: >
            Set only while the row is still an applicant's. A `pending`
            document against a driver is somebody the office already employs;
            the same state against an application is somebody it has not
            decided about.
        type: { $ref: '#/components/schemas/DriverDocumentType' }
        type_label: { type: string }
        group: { $ref: '#/components/schemas/DriverDocumentGroup' }
        group_label: { type: string }
        status: { $ref: '#/components/schemas/DriverDocumentStatus' }
        status_label: { type: string }
        compliance_state: { $ref: '#/components/schemas/DriverDocumentComplianceState' }
        expires_at:
          type: ['string', 'null']
          format: date
          description: A date, not an instant — a licence expires on a day.
        expired:
          type: boolean
          description: >
            Derived at read time in the operator's timezone, never stored. A
            document expiring **today** is not expired: the last day of a
            licence is a day the driver can still work.
        original_name: { type: ['string', 'null'] }
        mime_type: { type: string }
        size_bytes: { type: integer }
        uploaded_at: { type: string, format: date-time }
        rejection_reason:
          type: ['string', 'null']
          description: Present only on a rejection, and never empty when it is.
        reviewed_at: { type: ['string', 'null'], format: date-time }
        file_url:
          type: ['string', 'null']
          description: >
            A route path, not a storage URL, and **chosen by who is asking** —
            the owner gets `/me/documents/{id}/file`, the office gets the
            driver-scoped one. A handset building the office path would be
            asking for a route its token cannot reach (`ClientScope`).

            **Null while the document belongs to an application** (ADR-0048
            §4), and that is a refusal rather than a missing route: an
            applicant's claim ticket gets metadata and never file bytes, so a
            stolen ticket cannot become a way to read somebody's national ID.

    DriverDocumentSlot:
      description: >
        One document type and whatever is held against it.

        **`document` is null for a type never uploaded, and that is the whole
        reason this wrapper exists.** Omitting absent types would answer "what
        have I sent" when the question is "what do I still owe you".
      type: object
      required: [type, type_label, hint, requires_expiry, group, group_label, document]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/DriverDocumentType' }
        type_label: { type: string }
        group: { $ref: '#/components/schemas/DriverDocumentGroup' }
        group_label: { type: string }
        hint:
          type: string
          description: What to photograph, in the driver's words rather than the schema's.
        requires_expiry:
          type: boolean
          description: >
            True for the types whose entire meaning is a date. Served rather
            than hardcoded in the app, so the rule lives in one place.
        document:
          oneOf:
            - { $ref: '#/components/schemas/DriverDocument' }
            - { type: 'null' }

    DriverDocumentCompliance:
      description: >
        The one-line answer the profile screen puts beside "Documents", and
        **the seam ADR-0033 §6 names**: if dispatch is ever gated on documents,
        the rule consults this rather than inventing a second notion of
        compliance.

        `action_needed` covers rejected and expired but **not** never-uploaded,
        which is `incomplete`. One means "we looked and it is wrong", the other
        means "we are still waiting" — collapsing them makes a new driver look
        like a problem.
      type: object
      required: [state, verified, total, action_needed, pending]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [verified, pending, incomplete, action_needed]
        verified: { type: integer }
        total: { type: integer }
        action_needed: { type: integer }
        pending: { type: integer }

    DriverClosureRequest:
      type: object
      description: >
        A driver's request to close their account (ADR-0043). **One resource for
        both readers**, unlike the payout account's two: there is nothing here
        the driver may not see - it is their own request and the office's
        answer, which is the whole point of the return path.

        The reviewer is not served at all; a driver learning which clerk closed
        their account gains nothing.
      required:
        - id
        - status
        - status_label
        - reason
        - decline_reason
        - requested_at
        - reviewed_at
        - closed_at
      additionalProperties: false
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, confirmed, declined, withdrawn] }
        status_label: { type: string }
        reason: { type: ['string', 'null'] }
        decline_reason: { type: ['string', 'null'] }
        requested_at: { type: ['string', 'null'], format: date-time }
        reviewed_at: { type: ['string', 'null'], format: date-time }
        closed_at:
          type: ['string', 'null']
          format: date-time
          description: >
            When the account actually closed, and the clock the retention sweep
            runs on. Null unless confirmed - a declined or withdrawn request
            never closed anything and must not start a retention clock.
        driver_name:
          type: string
          description: Present on the office queue only, where the driver is eager-loaded.

    DriverPayoutAccount:
      type: object
      description: >
        A payout destination **as its owner is allowed to see it** (ADR-0042
        §4). The whole account number is never here; the office reads it from
        `/drivers/{driver}/payout-account`.

        `account_holder_masked` shortens "John Kamau" to "J. Kamau" for the same
        reason the number is masked: the pair *name plus account number* is what
        makes either useful to somebody who should not have it, so returning the
        whole name beside four digits gives back most of what the mask protects.
      required:
        - kind
        - kind_label
        - institution_label
        - number_label
        - institution
        - account_holder_masked
        - account_number_masked
        - last_four
        - updated_at
      additionalProperties: false
      properties:
        kind: { type: string, enum: [bank, mobile_money] }
        kind_label: { type: string }
        institution_label:
          type: string
          description: >
            What to call the institution on a form — "Bank" or "Provider".
            Served rather than spelled on the handset: nobody calls Stanbic a
            provider and nobody calls MTN a bank, and a second copy of that
            mapping in a mobile bundle is a second place for it to be wrong.
        number_label:
          type: string
          description: '"Account number" or "Mobile money number".'
        institution: { type: string }
        account_holder_masked: { type: string }
        account_number_masked:
          type: string
          description: A mask and the last four characters.
        last_four: { type: string, maxLength: 4 }
        updated_at: { type: ['string', 'null'], format: date-time }

    OfficePayoutAccount:
      type: object
      description: >
        The same destination **as the office needs it** (ADR-0042 §4) — with the
        whole account number, because a clerk cannot wire money to a mask. Only
        ever rendered by `/drivers/{driver}/payout-account`, which is gated on
        `drivers.manage` and audited.
      required: [kind, kind_label, institution, account_holder, account_number, updated_at]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [bank, mobile_money] }
        kind_label: { type: string }
        institution: { type: string }
        account_holder: { type: string }
        account_number: { type: string }
        updated_at: { type: ['string', 'null'], format: date-time }

    DriverProfile:
      description: The facts on a driver's own Profile screen (ADR-0033).
      type: object
      required:
        - name
        - photo_url
        - phone
        - email
        - member_since
        - trips_total
        - vehicle
        - documents
      additionalProperties: false
      properties:
        name: { type: string }
        photo_url:
          description: >
            Where to fetch this driver's photograph, or null (ADR-0041).

            A **route on this API**, never a storage URL: the file is on the
            private disk and is streamed, because a signed link to a
            photograph of somebody is addressable by anyone who ever saw it —
            and this one is loaded every time the app's drawer opens, so the
            link would travel through proxies, caches and crash reports dozens
            of times a day.

            Carries a short `?v=` derived from the stored path, so a client's
            image cache cannot go on showing the previous portrait after an
            upload.

            **Null is the ordinary case, not an error.** A driver who has never
            sent one gets their initials, which is what everybody had before
            this field existed.
          type: ['string', 'null']
        phone:
          type: ['string', 'null']
          description: >
            The driver's **profile** phone, not the account's. A driver signs
            in with an email (ADR-0016) and is reached on this number; the two
            belong to different records on purpose.
        email: { type: ['string', 'null'] }
        member_since:
          type: ['string', 'null']
          format: date
          description: A date, because the screen renders a month and a year.
        trips_total:
          type: integer
          description: >
            Completed trips, ever. A cancellation is not a trip a driver did.
            Measured, unlike the rating beside it on screen, which `/me/stats`
            withholds below five ratings.
        vehicle:
          oneOf:
            - type: object
              required: [make, model, registration_number, category, category_label]
              additionalProperties: false
              properties:
                make: { type: ['string', 'null'] }
                model: { type: ['string', 'null'] }
                registration_number: { type: string }
                category: { type: string }
                category_label:
                  type: string
                  description: >
                    Served rather than title-cased on the handset: Billing
                    prices against `Vehicle::CATEGORIES`, and a second spelling
                    of that list in a mobile bundle is a second place to be
                    wrong when a category is added.
            - type: 'null'
        documents: { $ref: '#/components/schemas/DriverDocumentCompliance' }

    SettlementRequestKind:
      description: >
        Which way the driver is asking money to move (ADR-0032 §1).

        Deliberately **not** "deposit" and "withdrawal": a driver is not
        depositing into an account this platform holds, and there is nothing
        to withdraw from. `remittance` is the common case — cash work runs
        towards the office.

        `tip` (ADR-0034 §1) is the third and is not a settlement at all: it
        declares that a passenger handed the driver cash on a particular trip.
        It reuses this pipeline because the mechanism is identical — a driver
        says money changed hands and the office's answer is what writes the
        ledger — and it is the only kind that carries `trip_id`. Confirming it
        writes a **pair** rather than one signed `settlement`, because a tip is
        commissionable.
      type: string
      enum: [remittance, payout, tip]

    SettlementRequestStatus:
      type: string
      enum: [pending, confirmed, declined]

    SupportRequestTopic:
      description: >
        What a driver's report is about (ADR-0044 §1) — **the five Help Topics
        rows**, which is why this is an enum and not a free-text subject. The
        same value names the row in the office queue and decides which desk
        answers it.
      type: string
      enum: [report, passenger, vehicle, payment, lost_item]

    SupportRequestStatus:
      description: >
        Two states, and the missing third is the decision (ADR-0044 §2). There
        is no "closed" without an answer, so the only way out of `open` is a
        reply somebody wrote.
      type: string
      enum: [open, answered]

    SupportRequest:
      description: >
        A driver's written report and the office's answer to it (ADR-0044).

        One schema for both readers. `driver_name` and `answered_by` are
        present **only on the office queue**: a driver is told the office
        replied, not which clerk — naming one employee to the person whose
        report was refused puts an individual's name on the organisation's
        decision.
      type: object
      required:
        - id
        - driver_id
        - topic
        - topic_label
        - status
        - status_label
        - trip_id
        - body
        - answer
        - answered_at
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        driver_id: { type: integer }
        driver_name:
          type: ['string', 'null']
          description: Office queue only, so a clerk knows whose afternoon this was.
        topic: { $ref: '#/components/schemas/SupportRequestTopic' }
        topic_label: { type: string }
        status: { $ref: '#/components/schemas/SupportRequestStatus' }
        status_label: { type: string }
        trip_id:
          type: ['integer', 'null']
          description: >
            The journey it is about, or null. Optional on every topic, and the
            server checks it belongs to the reporting driver.
        body:
          type: string
          description: >
            The driver's own account, **verbatim**. Never truncated here — a
            list that shortens somebody's description of an assault to fit a
            row is a decision for the screen, not for the API.
        answer:
          type: ['string', 'null']
          description: >
            The office's reply, or null while it is still owed. An answered
            report always carries text, so null means precisely "not yet".
        answered_by:
          type: ['string', 'null']
          description: Office queue only — see the schema description.
        answered_at: { type: ['string', 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    DriverSettlementRequest:
      description: >
        A driver asking the office to settle (ADR-0032).

        **Never a balance.** The wallet total comes from
        `driver_ledger_entries` alone, and a pending request changes nothing
        until a human confirms it.
      type: object
      required:
        - id
        - driver_id
        - trip_id
        - kind
        - kind_label
        - status
        - status_label
        - amount_minor
        - currency
        - note
        - decline_reason
        - reviewed_at
        - ledger_entry_id
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        driver_id: { type: integer }
        trip_id:
          type: ['integer', 'null']
          description: >
            The trip a tip was taken on (ADR-0034 §1). **Required on `tip` and
            refused on the other two kinds** — a remittance covers a day's
            takings and a payout is a request against a balance, so neither
            belongs to one journey. The server also checks the trip is the
            declaring driver's own.
        kind: { $ref: '#/components/schemas/SettlementRequestKind' }
        kind_label: { type: string }
        status: { $ref: '#/components/schemas/SettlementRequestStatus' }
        status_label: { type: string }
        amount_minor:
          type: integer
          description: '**Always positive.** The direction is `kind`; only the ledger entry is signed.'
        currency: { type: string }
        note: { type: ['string', 'null'] }
        decline_reason:
          type: ['string', 'null']
          description: Present only on a decline, and never empty when it is.
        reviewed_at: { type: ['string', 'null'], format: date-time }
        ledger_entry_id:
          type: ['integer', 'null']
          description: >
            The entry a confirmation produced, or null. Set once — it is what
            makes confirmation idempotent.
        created_at: { type: ['string', 'null'], format: date-time }

    DriverLedgerEntry:
      description: >
        One movement in a driver's account (ADR-0029 §2). Append-only: nothing
        is updated and nothing is deleted, and a correction is a new
        `adjustment` that reverses an old row.
      type: object
      required:
        - id
        - kind
        - kind_label
        - amount_minor
        - currency
        - description
        - trip_id
        - service_type
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        kind:
          type: string
          enum:
            - fare_earned
            - cash_collected
            - settlement
            - adjustment
            - tip_earned
            - tip_cash_collected
            - bonus
          description: >
            `fare_earned` — the driver's share of a completed fare.
            `cash_collected` — the gross fare they took in hand, negative
            because they are holding the platform's money until they settle.
            `settlement` — money that actually moved, in either direction.
            `adjustment` — a correction.

            `tip_earned` / `tip_cash_collected` (ADR-0034 §3) are the same
            pair for a tip: the driver's share after commission, and the gross
            in their hand. Two kinds rather than a second `cash_collected` row
            because `(trip_id, kind)` is unique — the index that stops a
            retried completion paying twice.

            `bonus` (ADR-0034 §4) is a weekly target award and is
            **unpaired**: it is not cash in anybody's hand, so the balance
            moves by the whole amount.

            Sums of *earnings* take `fare_earned`, `tip_earned` and `bonus`
            and never the two cash kinds, which are the negative halves that
            make the balance work.
        kind_label:
          type: string
          description: The kind in words, from `LedgerEntryKind::label()`, so no client re-spells them.
        amount_minor:
          type: integer
          description: >
            **Signed, from the driver's point of view**: positive means the
            platform owes them, negative means they owe the platform. Minor
            units — UGX is zero-decimal, so whole shillings.

            The sign is the meaning and must not be inferred from `kind`:
            `settlement` legitimately runs both ways.
        currency: { type: string }
        description:
          type: string
          description: >
            Server-written prose, and load-bearing rather than decorative —
            ADR-0029 §3 records the commission rate in force at completion in
            this string, which is what lets an old row show the rate that
            actually applied to it.
        trip_id:
          type: ['integer', 'null']
          description: Null on anything not raised by a trip — a settlement, for instance.
        service_type:
          type: ['string', 'null']
          description: >
            `ride`, `delivery` or `self_drive`, from the order request behind
            the trip, so a statement can say "Ride earnings" rather than the
            generic "Fare earned". Null when there is no trip, or no order
            request behind it (a walk-in a dispatcher fulfilled by hand) — the
            client falls back to `kind_label`, which is always true.
        created_at: { type: ['string', 'null'], format: date-time }

    DriverPromotions:
      description: >
        The three schemes, as they apply to one driver right now (ADR-0036,
        ADR-0037).

        **Each scheme is nullable and a null means "not running".** Never a
        zeroed card: `docs/screen-rules.md` §1 refuses a zero standing in for a
        figure that does not exist. The app draws only the cards that are
        present.
      type: object
      required: [currency, timezone, weekly_challenge, peak_hours, referral]
      additionalProperties: false
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: >
            ISO 4217, from `settings.regional.currency`. Every minor-unit
            amount below is in it. Served rather than assumed, because
            hardcoding `UGX` is the first thing that breaks in a second market.
        timezone:
          type: string
          description: >
            The fleet's zone, from `settings.regional.timezone`. Every instant
            below is meant to be rendered against it — a driver crossing a
            border does not want their peak hours to move.
        weekly_challenge:
          nullable: true
          description: >
            Progress against the weekly trip target, in the week **now
            running** (ADR-0034 §4).

            **Nothing here has been earned yet.** The bonus is awarded by a
            scheduled command over a *closed* week, so a driver at 18 of 30 is
            being shown where they are, not what they are owed. `ends_at` is
            when the week closes and the question gets answered.

            Null when `billing.bonus_enabled` is false, which is the default.
          type: object
          required: [trips, trip_target, amount_minor, currency, week_start, ends_at, achieved]
          additionalProperties: false
          properties:
            trips:
              type: integer
              description: >
                Completed trips so far this week, counted by the same rule the
                awarding command uses. A screen that counted differently from
                the command that pays would eventually tell somebody they had
                hit the target and then not pay them.
            trip_target: { type: integer }
            amount_minor: { type: integer }
            currency: { type: string, minLength: 3, maxLength: 3 }
            week_start:
              type: string
              format: date-time
              description: The Monday, in the fleet's zone.
            ends_at:
              type: string
              format: date-time
              description: >
                When the week closes — **not** when the money arrives.
            achieved:
              type: boolean
              description: >
                Whether the target is cleared. Served rather than left to the
                app to derive from `trips >= trip_target`, because two
                implementations of one comparison is one that gains a `>` and
                one that does not.
        peak_hours:
          nullable: true
          description: >
            Today's peak window, resolved to instants, and what it pays
            (ADR-0036).

            The uplift is a percentage of the driver's **share** of a fare, not
            of the gross, and it is the platform's own money — nothing here
            changes what a passenger is charged.

            Null when `billing.peak_enabled` is false, which is the default.
          type: object
          required: [starts_at, ends_at, active, uplift_percent]
          additionalProperties: false
          properties:
            starts_at: { type: string, format: date-time }
            ends_at:
              type: string
              format: date-time
              description: >
                On the **following day** for a window that wraps past midnight
                (22:00–02:00 is a plausible peak, not a misconfiguration).
            active:
              type: boolean
              description: Whether the window is open at the moment of the request.
            uplift_percent:
              type: integer
              description: >
                A number, not a sentence. "Earn 20% more" is English and the
                app owns the wording — PRODUCT.md's i18n-ready constraint.
        referral:
          nullable: true
          description: >
            This driver's referral code and how their introductions are getting
            on (ADR-0037).

            **Reading this mints the code** if they have none. `trip_target`
            and `reward_amount_minor` describe what a *new* referral would
            promise; `earned_minor` sums what past ones actually promised, and
            the two legitimately disagree after the office changes the reward.

            Null when `billing.referral_enabled` is false, which is the default.
          type: object
          required: [code, trip_target, reward_amount_minor, introduced, qualified, earned_minor]
          additionalProperties: false
          properties:
            code:
              type: string
              maxLength: 16
              description: >
                Eight characters, with no `O`, `0`, `I`, `1` or `L` — it is
                read aloud across a table and typed by somebody who has never
                seen it written down.
            trip_target:
              type: integer
              description: Completed trips the referred driver must do before the reward is paid.
            reward_amount_minor: { type: integer }
            introduced:
              type: integer
              description: How many people this driver has introduced, qualified or not.
            qualified:
              type: integer
              description: How many of those have cleared the target and been paid for.
            earned_minor:
              type: integer
              description: >
                Summed from the **frozen** amount on each qualified referral,
                never the count times the current setting — a driver who earned
                two rewards at 10,000 is owed 20,000 after the office moves the
                figure to 15,000.

    DriverHistoryTrip:
      description: >
        One row of a driver's own trip history. Deliberately narrower than
        `Trip`: six facts a scrollable list needs, for the one person whose
        token it is.

        Carries **no passenger contact** (ADR-0024 §7 — a history is not a
        directory) and **no fare quote** (quoting costs Billing queries per
        row, which is why `Trip.estimated_fare` is bounded to a single trip).
      type: object
      required:
        - id
        - status
        - service_type
        - origin
        - destination
        - happened_at
        - local_day
        - local_time
        - earned_minor
        - currency
      additionalProperties: false
      properties:
        id: { type: integer }
        status:
          type: string
          description: >
            The raw lifecycle value, not a label. The driver app's
            `statusLabel()` is the one place a status is put into words for a
            driver; a second wording here would give it two vocabularies.
        service_type:
          type: ['string', 'null']
          description: >
            `ride`, `delivery` or `self_drive`, from the order request behind
            the trip. Null when there is none — a walk-in a dispatcher
            fulfilled by hand — and the row then reads as a plain trip rather
            than as a guess.
        origin: { type: string }
        destination: { type: string }
        happened_at:
          type: string
          format: date-time
          description: >
            `completed_at` where there is one, `created_at` otherwise — which
            is the cancelled and no-show case. **Never `updated_at`**: that
            column moves whenever anything touches the row, so a trip could
            migrate between day headings months later, and a history that
            reorders itself is not a history.
        local_day:
          type: string
          format: date
          description: >
            The day this row files under, resolved in the fleet's timezone.
            Computed server-side because `config/app.php` is UTC, so a day
            derived from a raw instant rolls over at 03:00 in Kampala — which
            on a screen headed "Today" and "Yesterday" files an evening's work
            under the wrong one, plausibly enough that nobody reports it.
        local_time:
          type: string
          description: '`HH:MM`, 24-hour, in the same zone. The app renders it for display.'
        earned_minor:
          type: ['integer', 'null']
          description: >
            **The driver's own share, not the gross fare.** Read back from the
            `fare_earned` ledger entry written at completion, so the
            commission rate in force *then* is what shows, and so this list
            adds up to what `/me/earnings` reports.

            **Null, never zero**, on a cancelled or no-show trip, on a
            corporate trip (invoiced to the client — there is no per-trip
            driver share), and between completion and the ledger listener
            running. `0` would read as a job done for nothing.
        currency:
          type: ['string', 'null']
          description: Null exactly when `earned_minor` is.

    EarningsPeriod:
      description: >
        The span a driver reads their earnings over. No `year`: a driver does
        not read an annual chart on a phone, and the trend would be unreadable.
      type: string
      enum: [day, week, month]

    EarningsBreakdownRow:
      description: >
        Earnings grouped by the kind of job that produced them.

        `service_type` is `ride`, `delivery` or `self_drive` from the order
        request behind the trip — or **`other`**, which means the trip has no
        order request and cannot be classified: a walk-in a dispatcher
        fulfilled by hand. It is a row rather than an omission so the
        breakdown always reconciles with `total_minor`.

        Rows are ordered by `earned_minor` descending, and only kinds with
        earnings appear — a driver who took no deliveries gets no delivery row
        rather than a zero one.
      type: object
      required: [service_type, trips, earned_minor]
      additionalProperties: false
      properties:
        service_type:
          type: string
          description: '`ride` | `delivery` | `self_drive` | `other`. Not an enum — see above.'
        trips: { type: integer }
        earned_minor:
          type: integer
          description: The driver's share, in minor units. UGX is zero-decimal, so whole shillings.

    EarningsTrendPoint:
      description: >
        One bar of the trend chart.

        **Zero-filled and continuous** — every bucket in `[from, to)` is
        present, including the empty ones. That is not the banned "zero
        standing in for unknown": the ledger is written at completion, so no
        entry in an hour is positive evidence that nothing was completed in
        it. Omitting empty buckets would compress the axis and draw 3 AM
        beside 7 PM as though the hours between had not happened.

        `bucket` is a local-time key that sorts chronologically —
        `YYYY-MM-DD HH:00` for a day, `YYYY-MM-DD` for a week or month.
      type: object
      required: [bucket, earned_minor]
      additionalProperties: false
      properties:
        bucket: { type: string }
        earned_minor: { type: integer }

    DriverEarnings:
      description: >
        A driver's earnings for one period. See `GET /api/v1/me/earnings` for
        what is deliberately absent and why.
      type: object
      required:
        - period
        - timezone
        - from
        - to
        - currency
        - total_minor
        - trips
        - on_trip_minutes
        - breakdown
        - trend
      additionalProperties: false
      properties:
        period: { $ref: '#/components/schemas/EarningsPeriod' }
        timezone:
          type: string
          description: >
            The zone the boundaries and bucket keys are expressed in, from
            `settings.regional.timezone`. Served rather than assumed so a
            client labels the axis in the fleet's day, not the handset's.
        from:
          type: string
          format: date-time
          description: Inclusive start of the period, in the timezone above.
        to:
          type: string
          format: date-time
          description: '**Exclusive** end. The window is half-open `[from, to)`.'
        currency:
          type: string
          description: >
            ISO 4217, read off the entries rather than assumed. Falls back to
            `settings.regional.currency` when the period is empty — a zero
            still has to say what it is denominated in.
        total_minor:
          type: integer
          description: >
            The sum of the driver's `fare_earned` entries in the window. Their
            own share, never the gross fare the passenger paid.
        trips:
          type: integer
          description: Distinct trips that produced earnings in the window.
        on_trip_minutes:
          type: ['integer', 'null']
          description: >
            Minutes spent **on trips** — summed `completed_at − started_at`
            over the period's completed trips.

            **This is not "online hours" and must not be labelled as such.**
            Time spent waiting for an offer is not counted, and the platform
            cannot count it: `driver_presence` holds one overwritten row per
            driver and keeps no duty history.

            Null, not zero, when no trip in the window carries both
            timestamps — `0m` beside a non-zero earnings total is a
            contradiction.
        breakdown:
          type: array
          items: { $ref: '#/components/schemas/EarningsBreakdownRow' }
        trend:
          type: array
          items: { $ref: '#/components/schemas/EarningsTrendPoint' }

    TripEarnings:
      description: >
        What the driver made on one completed trip, read back from the
        ADR-0029 ledger that recorded it — never recomputed from the
        commission rate.

        `SettledFare` above is what the *passenger* paid. This is what is left
        of it for the driver, and the two differ by the platform's cut.

        **Served to the trip's own driver and to nobody else.** A dispatcher
        holding `trips.view.all` sees the board but not what a driver takes
        home, and a corporate client must never see the platform's margin on
        their work. It is also absent from every list endpoint, where the
        ledger relation is deliberately not loaded.

        **Null is a real answer.** Null on every corporate trip, which carries
        no per-trip fare and so raises no ledger pair (ADR-0029 §4), and null
        in the window between a completion arriving and the listener crediting
        it. A client renders that as "not confirmed yet" — never as a zero.
      type: object
      required: [lines, earned_minor, commission_minor, total_minor, currency, recorded_at]
      additionalProperties: false
      properties:
        lines:
          description: >
            Every movement this one trip made in the driver's wallet, oldest
            first — the fare share, a tip the office confirmed (ADR-0034), a
            peak uplift (ADR-0036), a bonus, and the cash counterpart on a cash
            job.

            **The identical shape `GET /me/ledger` serves**, deliberately: the
            driver app renders these with the component it already uses for the
            wallet statement, so a tip on the trip record is worded exactly as
            the same tip is worded in the wallet. Two shapes for one fact about
            somebody's pay is two vocabularies to keep in step.

            `description` is the load-bearing member. ADR-0029 §3 freezes the
            commission rate that applied *in that string*, which is what lets a
            driver open a trip from March and read the rate that governed it.

            This is why the fare *components* — base fare, distance, waiting —
            are not here: `TripPricingEngine` is pure and writes nothing, so on
            a walk-in only the single total survives. These are the rows that
            were actually stored.
          type: array
          items: { $ref: '#/components/schemas/DriverLedgerEntry' }
        earned_minor:
          description: >
            The driver's share, in minor units — the `fare_earned` entry
            exactly as it was written. UGX is zero-decimal, so whole
            shillings.
          type: integer
        commission_minor:
          description: >
            The platform's cut, derived as `total_minor - earned_minor`.

            Derived rather than stored, because ADR-0029 §2 deliberately
            writes no `commission` entry — pairing one with the credit
            double-counts the money. Deriving it from the two figures actually
            recorded means this reports the rate in force *at completion*,
            whatever `billing.driver_commission_percent` says today.

            The percent itself is deliberately not served. A client that
            displayed it would be stating a rule it does not own, and would go
            on stating the old one after the office changed it.
          type: integer
        total_minor:
          description: >
            The gross fare, repeated from `Trip.fare.total_minor` so the three
            figures a driver reconciles arrive as one object rather than as
            two independently-nullable blocks.
          type: integer
        currency: { type: string }
        recorded_at:
          description: When the ledger credited it, which is not the same instant the trip completed.
          type: ['string', 'null']
          format: date-time

    Trip:
      type: object
      required:
        - id
        - tenant_id
        - customer_id
        - booking_id
        - vehicle_id
        - driver_id
        - origin
        - destination
        - pickup
        - dropoff
        - service_type
        - reference
        - package
        - status
        - allowed_transitions
        - pickup_wait_target_seconds
        - odometer_max_km_per_trip
        - fare
        - estimated_fare
        - payment
        - earnings
        - odometer_start
        - odometer_start_photo_path
        - odometer_end
        - odometer_end_photo_path
        - odometer_start_photo_url
        - odometer_end_photo_url
        - distance_km
        - gps_distance_km
        - distance_variance_flagged
        - unplanned_stop_count
        - cancellation_charge_applicable
        - started_at
        - completed_at
        - duration_minutes
        - passenger_contact
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id: { type: integer }
        tenant_id:
          description: >
            Null on a walk-in trip (ADR-0024 §1), which is owned by a
            customer instead. Exactly one of this and `customer_id` is
            ever set, so a client may branch on either without asking
            both.
          type: ['integer', 'null']
        customer_id:
          description: Null on every corporate trip, which is owned by a tenant.
          type: ['integer', 'null']
        client: { $ref: '#/components/schemas/ClientRef' }
        booking_id:
          type: ['integer', 'null']
          description: Null on an ad-hoc trip raised without a booking.
        vehicle_id: { type: ['integer', 'null'] }
        vehicle:
          anyOf:
            - { $ref: '#/components/schemas/Vehicle' }
            - { enum: [null] }
        driver_id: { type: ['integer', 'null'] }
        driver:
          anyOf:
            - { $ref: '#/components/schemas/Driver' }
            - { enum: [null] }
        origin: { type: string }
        destination: { type: string }
        pickup:
          description: >
            The same place as `origin`, with coordinates where the platform
            has them. `origin` and `destination` are unchanged and stay —
            every existing client reads them.


            The coordinates come from the walk-in order behind the trip and
            are null on every corporate trip, on any order a dispatcher keyed
            in over the phone, and on any endpoint that did not eager-load
            that relation. **Latitude and longitude are both present or both
            null**; a half-resolved position is not a place, and defaulting
            the missing half to zero puts a Kampala vehicle in the Atlantic
            off Ghana — the swap ADR-0020 records this codebase hitting.
          $ref: '#/components/schemas/TripPlace'
        dropoff: { $ref: '#/components/schemas/TripPlace' }
        stops:
          description: >
            The run's itinerary in order (ADR-0045) — an empty array on every
            point-to-point trip, so no client needs a null branch. Present on
            `GET /trips/{trip}` and absent on lists, the same bound
            `estimated_fare` and `earnings` carry: a dispatch board must not
            pay fifty itinerary queries for a column nobody renders there.
          type: array
          items: { $ref: '#/components/schemas/TripStop' }
        unplanned_stop_count:
          type: integer
          description: >
            How many stops were added mid-run rather than planned (ADR-0045
            §4). A note, not a charge — the client sees that the run deviated
            and where; nobody bills for the deviation.
        service_type:
          description: >
            What kind of job this was — `ride`, `delivery` or `self_drive`, from
            the walk-in order behind the trip.

            A real column beside `order_requests.details`, never a key inside
            it, so reading it goes nowhere near the JSON that carries the two
            phone numbers ADR-0024 §7 withholds.

            **Null on every corporate booking**, which has a contract rather
            than an order request, and on any endpoint that did not eager-load
            the relation. A client that defaulted null to `ride` would label a
            parcel run a taxi fare.
          type: ['string', 'null']
        reference:
          description: >
            The reference the customer was given and the one they quote —
            `order_requests.reference`, unique, twelve characters.

            Served so the driver, the customer and the office are all reading
            the same identifier when somebody rings about a job: the trip's `id`
            is the platform's, this is theirs.

            Null on a corporate trip, and null wherever the order relation was
            not loaded. A client showing the trip id instead must say which of
            the two it is showing.
          type: ['string', 'null']
        package:
          description: >
            What is in the parcel and how big it is, **on a delivery only** —
            null on a ride, rather than an object full of nulls, because the
            absence is the fact.

            Allow-listed through `Bookings\Support\OrderDetails::packageFor()`,
            the single reader of `order_requests.details`. The same two keys the
            offer card carries, from the same guard, so nothing new escapes that
            column.
          anyOf:
            - { $ref: '#/components/schemas/OfferPackage' }
            - { enum: [null] }
        status: { $ref: '#/components/schemas/TripStatus' }
        allowed_transitions:
          description: What is legal from this state — not what this user may do.
          type: array
          items: { $ref: '#/components/schemas/TripStatus' }
        pickup_wait_target_seconds:
          type: integer
          description: >
            What the driver app's waiting ring fills against while a trip
            sits at driver_arrived, from `dispatch.pickup_wait_target_seconds`.

            **A display target, not a deadline.** Nothing on this platform
            charges, bounds or ends a wait at the kerb: the rate card's
            free_waiting_minutes bills the *in-trip* Waiting status only,
            and a driver may not post no_show. Passing it changes no state,
            so a client must not treat it as an expiry — the driver app
            fills its ring to full and holds it there while the elapsed
            figure keeps counting.
          example: 300
        odometer_max_km_per_trip:
          type: integer
          description: >
            The longest journey one closing odometer reading may describe, from
            `tracking.odometer_max_km_per_trip` (ADR-0035). Beyond it the
            transition to Trip Completed is refused with 422.


            Served on the trip so the driver app can refuse an impossible
            reading before it queues one, and **served rather than hardcoded**
            because the office changes it in the console: a handset holding its
            own copy would go on enforcing the old number on devices nobody can
            reach. It rides on the trip rather than a config endpoint because
            the trip is already cached offline, which is where readings get
            typed.


            **The server remains the control.** A client that ignores this
            still cannot save an impossible reading.
          example: 2000
        payment:
          description: >
            How this job settles, for the driver carrying it — the same fact
            `DispatchOffer.payment` puts on the offer card, served again
            because an offer is answered in fifteen seconds and the drop-off
            can be an hour later.

            Read through an allow-list over `order_requests.details`; that
            column also holds sender_phone and recipient_phone, which
            ADR-0024 §7 withholds, so it is never emitted wholesale.

            **Null is a real answer**, not an omission: a corporate trip is
            invoiced to the client and has no per-trip settlement to collect.
            Null too on any endpoint that did not load the order — every list
            view. Members are individually nullable because both keys are
            optional on the public order form; `cash` is never assumed.
          oneOf:
            - type: 'null'
            # `$ref`, not a second inline copy of the same object. The copy
            # was missing `additionalProperties: false`, which the spec lint
            # refuses (ADR-0011: an undeclared response field would validate
            # silently), and had `payer` as a bare string where the offer's
            # version enumerates it. One shape, one definition.
            - $ref: '#/components/schemas/OfferPayment'
        earnings:
          description: >
            The driver's own share of this trip. Served to that driver alone,
            only where the ledger relation was loaded (`GET /trips/{trip}`,
            never a list), and null until the completion has been credited.
            See `TripEarnings`.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TripEarnings'
        odometer_start: { type: ['integer', 'null'] }
        odometer_start_photo_path: { type: ['string', 'null'] }
        odometer_end: { type: ['integer', 'null'] }
        odometer_end_photo_path: { type: ['string', 'null'] }
        odometer_start_photo_url: { type: ['string', 'null'] }
        odometer_end_photo_url: { type: ['string', 'null'] }
        distance_km:
          type: ['string', 'null']
          description: Decimal serialised as a string ("12.34") — a billing input, not a float.
        gps_distance_km: { type: ['string', 'null'] }
        distance_variance_flagged: { type: ['boolean', 'null'] }
        cancellation_charge_applicable: { type: ['boolean', 'null'] }
        started_at: { $ref: '#/components/schemas/NullableTimestamp' }
        completed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        passenger_contact:
          description: >
            Who to ring, for the driver on this trip and nobody else
            (ADR-0024 §7). Null unless the caller is the assigned driver,
            the trip is a walk-in, and it is live — accepted through
            trip_completed. A completed trip is not a directory.
          anyOf:
            - { $ref: '#/components/schemas/ContactDetails' }
            - { enum: [null] }
        duration_minutes: { type: ['integer', 'null'] }
        fare:
          description: >
            What was actually charged, once somebody drove it (ADR-0026 §2).


            Null until `WalkInFareService::settle()` prices the completed
            trip, and null forever on a corporate trip — a client's work is
            invoiced, and there is no per-trip cash fare to show. Carries the
            rate card version that priced it, because a total with no version
            behind it is a figure nobody can defend in a dispute.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SettledFare'
        estimated_fare:
          description: >
            What the trip is *expected* to fetch, before it is settled — the
            same quote the driver accepted the job on.


            A quote and a settlement are different things, which is why they
            are different fields: `is_estimate` is `true` here and `false` on
            `fare`, so no client has to infer which it holds from the key it
            arrived under.


            Null once `fare` is set, so no screen shows an estimate beside a
            bill. **Also null wherever the trip's originating order request
            was not eager-loaded** — a quote costs queries through Billing,
            and `GET /trips` renders up to a page of trips that nobody is
            reading a fare on. `GET /trips/{id}` loads it; the list does not.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WalkInFareEstimate'
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    TripEvent:
      type: object
      required: [id, trip_id, from_status, to_status, user_id, notes, created_at, local_day, local_time]
      additionalProperties: false
      properties:
        id: { type: integer }
        trip_id: { type: integer }
        from_status: { $ref: '#/components/schemas/NullableTripStatus' }
        to_status: { $ref: '#/components/schemas/TripStatus' }
        user_id: { type: ['integer', 'null'] }
        user:
          anyOf:
            - { $ref: '#/components/schemas/User' }
            - { enum: [null] }
        notes: { type: ['string', 'null'] }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        local_day:
          description: >
            `created_at` in `settings.regional.timezone`, as `YYYY-MM-DD`.

            **`created_at` is UTC** (`config/app.php`), so a client deriving a
            day or a clock reading from it locally is wrong twice over: by the
            server's offset, and again on a handset that has picked up a
            neighbouring country's zone. The driver app puts these times on a
            route rail beside a pickup address, where an hour's error reads as a
            record of a different journey.

            Same two keys and same reasoning as `DriverTrip.local_day` /
            `local_time`. Null only when the row has no timestamp at all.
          type: ['string', 'null']
        local_time:
          description: The same instant as `HH:MM` in the fleet's zone. See `local_day`.
          type: ['string', 'null']

    TripLocation:
      type: object
      required: [latitude, longitude, speed_kph, heading_degrees, accuracy_metres, recorded_at]
      additionalProperties: false
      properties:
        latitude: { type: number }
        longitude: { type: number }
        speed_kph: { type: ['number', 'null'] }
        heading_degrees: { type: ['integer', 'null'] }
        accuracy_metres: { type: ['number', 'null'] }
        recorded_at: { $ref: '#/components/schemas/NullableTimestamp' }

    TripStop:
      description: >
        One stop on one journey — evidence, never a plan (ADR-0045 §1). The
        label is frozen at creation and stays right when the register's place
        is later renamed; `client_place_id` rides along for report grouping
        only and is never read back to re-derive what the trip did.
      type: object
      required:
        - id
        - sequence
        - label
        - latitude
        - longitude
        - source
        - status
        - arrived_at
        - departed_at
        - skip_reason
        - client_place_id
      additionalProperties: false
      properties:
        id: { type: integer }
        sequence:
          type: integer
          description: 1-based position on the run. Appended, never reordered (§7).
        label: { type: string }
        latitude:
          type: ['number', 'null']
          description: >
            Both coordinates present or both null — a label-only stop (typed
            in a dead zone, or free text with no pin) renders as prose, never
            as a pin at 0°,0°.
        longitude: { type: ['number', 'null'] }
        source:
          enum: [planned, added_by_driver, added_by_dispatch, added_by_client]
          description: Who put this stop on the run (§4). Only added_by_driver counts toward unplanned_stop_count.
        status:
          enum: [pending, arrived, done, skipped]
          description: >
            Moved only by the transitions §2 reuses — a `waiting` carrying
            `stop_id` marks the arrival, the resume marks the departure.
            `skipped` is §6's first-class case; no surface writes it yet.
        arrived_at: { $ref: '#/components/schemas/NullableTimestamp' }
        departed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        skip_reason: { type: ['string', 'null'] }
        client_place_id: { type: ['integer', 'null'] }

    TripTransitionRequest:
      type: object
      required: [to]
      additionalProperties: false
      properties:
        to:
          description: Every status except invoice_generated, which only invoicing may apply.
          enum:
            - assigned
            - rejected
            - accepted
            - driver_en_route
            - driver_arrived
            - no_show
            - passenger_onboard
            - trip_started
            - waiting
            - trip_resumed
            - trip_completed
            - disputed
            - closed
            - cancelled
        notes:
          type: ['string', 'null']
          maxLength: 1000
          description: Required for cancelled, rejected, no_show and disputed.
        odometer_start:
          type: integer
          minimum: 0
          description: Required for trip_started.
        odometer_end:
          type: integer
          minimum: 0
          description: Required for trip_completed.
        odometer_photo:
          description: Dashboard photo (multipart only). Optional — the reading is an acceptance criterion, the photo is not.
        stop_id:
          type: ['integer', 'null']
          description: >
            ADR-0045 §2 — which stop this pause is an arrival at. Only
            meaningful with `to=waiting`; the resume pairs itself with
            whichever stop is open and carries none. Refused (422) on any
            other transition, and when the stop is not this trip's or not
            pending.
        cancellation_charge_applicable: { type: ['boolean', 'null'] }
        vehicle_id:
          type: ['integer', 'null']
          description: Rejected → Assigned reassignment only.
        driver_id:
          type: ['integer', 'null']
          description: Rejected → Assigned reassignment only.

    Invoice:
      type: object
      required:
        - uuid
        - invoice_number
        - trip_id
        - rate_card_version_id
        - currency
        - total_minor
        - credited_minor
        - balance_minor
        - issued_at
        - issued_by_user_id
        - notes
      additionalProperties: false
      properties:
        uuid: { type: string }
        invoice_number: { type: string }
        trip_id: { type: integer }
        rate_card_version_id: { type: integer }
        currency: { type: string }
        total_minor: { type: integer }
        credited_minor: { type: integer }
        balance_minor: { type: integer }
        issued_at: { $ref: '#/components/schemas/NullableTimestamp' }
        issued_by_user_id: { type: ['integer', 'null'] }
        notes: { type: ['string', 'null'] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/InvoiceLine' }
        credit_notes:
          type: array
          items: { $ref: '#/components/schemas/CreditNote' }

    InvoiceLine:
      type: object
      required:
        - id
        - line_number
        - type
        - type_label
        - description
        - quantity
        - unit_amount_minor
        - amount_minor
        - currency
        - inputs
      additionalProperties: false
      properties:
        id: { type: integer }
        line_number: { type: integer }
        type:
          enum: [base_fare, distance, waiting, minimum_charge_adjustment, maximum_charge_adjustment]
        type_label: { type: string }
        description: { type: string }
        quantity:
          type: ['string', 'null']
          description: Decimal serialised as a string.
        unit_amount_minor: { type: integer }
        amount_minor: { type: integer }
        currency: { type: string }
        inputs:
          description: Every value that went into amount_minor — the reproducibility contract (AGENTS.md).
          type: object
          required:
            - rate_card_version_id
            - vehicle_category
            - zone
            - zone_id
            - distance_km
            - waiting_minutes
            - multiplier_bp
            - rounding_mode
          additionalProperties: false
          properties:
            rate_card_version_id: { type: integer }
            vehicle_category: { type: ['string', 'null'] }
            zone:
              type: ['string', 'null']
              description: >-
                Name of the zone whose rate priced this line, as it read when the
                invoice was issued. Null means the vehicle category's default rate
                priced it — the meaning this field has carried since before zone
                pricing existed, so invoices issued earlier still read correctly.
            zone_id:
              type: ['integer', 'null']
              description: >-
                Identifies the rate row that supplied the unit amount. Zones can be
                renamed, so the name alone cannot reproduce the line.
            distance_km: { type: ['string', 'null'] }
            waiting_minutes: { type: ['integer', 'null'] }
            multiplier_bp: { type: ['integer', 'null'] }
            rounding_mode: { enum: [half_up, half_down, up, down] }

    CreditNote:
      type: object
      required:
        - uuid
        - credit_note_number
        - invoice_id
        - currency
        - total_minor
        - reason
        - issued_at
        - issued_by_user_id
      additionalProperties: false
      properties:
        uuid: { type: string }
        credit_note_number: { type: string }
        invoice_id: { type: integer }
        currency: { type: string }
        total_minor:
          type: integer
          description: Positive — the amount taken off the invoice.
        reason: { type: string }
        issued_at: { $ref: '#/components/schemas/NullableTimestamp' }
        issued_by_user_id: { type: ['integer', 'null'] }
        lines:
          type: array
          items:
            type: object
            required: [line_number, description, amount_minor, invoice_line_id]
            additionalProperties: false
            properties:
              line_number: { type: integer }
              description: { type: string }
              amount_minor: { type: integer }
              invoice_line_id:
                type: ['integer', 'null']
                description: Null on a goodwill or settlement credit correcting no single line.

    RateCard:
      type: object
      required: [id, name, description, status, is_default, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ['string', 'null'] }
        status: { enum: [active, archived] }
        is_default: { type: boolean }
        versions:
          type: array
          items: { $ref: '#/components/schemas/RateCardVersion' }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/NullableTimestamp' }

    RateCardVersion:
      type: object
      required:
        - id
        - version
        - effective_from
        - currency
        - rounding_mode
        - rounding_mode_label
        - free_waiting_minutes
        - night_starts_at
        - night_ends_at
        - night_multiplier_bp
        - is_locked
        - locked_at
        - notes
        - created_at
      additionalProperties: false
      properties:
        id: { type: integer }
        version: { type: integer }
        effective_from: { type: string, format: date }
        currency: { type: string }
        rounding_mode: { enum: [half_up, half_down, up, down] }
        rounding_mode_label: { type: string }
        free_waiting_minutes: { type: ['integer', 'null'] }
        night_starts_at: { type: ['string', 'null'] }
        night_ends_at: { type: ['string', 'null'] }
        night_multiplier_bp: { type: ['integer', 'null'] }
        is_locked:
          type: boolean
          description: A locked version has priced a real invoice and can never change.
        locked_at: { $ref: '#/components/schemas/NullableTimestamp' }
        notes: { type: ['string', 'null'] }
        rates:
          type: array
          items:
            type: object
            required:
              - vehicle_category
              - base_fare_minor
              - per_km_minor
              - per_waiting_minute_minor
              - minimum_charge_minor
              - maximum_charge_minor
              - zone_rates
            additionalProperties: false
            properties:
              vehicle_category: { $ref: '#/components/schemas/VehicleCategoryKey' }
              base_fare_minor: { type: integer }
              per_km_minor: { type: integer }
              per_waiting_minute_minor: { type: integer }
              minimum_charge_minor: { type: integer }
              maximum_charge_minor:
                type: ['integer', 'null']
                description: Null means uncapped, never "capped at zero".
              zone_rates:
                type: array
                description: >-
                  Complete prices that replace the ones above for a trip picked up
                  inside the named zone (ADR-0021). Nested under the category they
                  override, because a zone price cannot exist without one.
                items:
                  type: object
                  required:
                    - zone_id
                    - zone_name
                    - base_fare_minor
                    - per_km_minor
                    - per_waiting_minute_minor
                    - minimum_charge_minor
                    - maximum_charge_minor
                  additionalProperties: false
                  properties:
                    zone_id: { type: integer }
                    zone_name:
                      type: string
                      description: Served even for a retired zone, which soft-deletes rather than vanishing.
                    base_fare_minor: { type: integer }
                    per_km_minor: { type: integer }
                    per_waiting_minute_minor: { type: integer }
                    minimum_charge_minor: { type: integer }
                    maximum_charge_minor:
                      type: ['integer', 'null']
                      description: Null means uncapped, never "capped at zero".
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    RateCardVersionRequest:
      type: object
      required: [effective_from, rates]
      additionalProperties: false
      properties:
        effective_from: { type: string, format: date }
        rounding_mode: { enum: [half_up, half_down, up, down, null] }
        free_waiting_minutes: { type: ['integer', 'null'], minimum: 0, maximum: 1440 }
        night_starts_at:
          type: ['string', 'null']
          description: H:i. Both night times or neither.
        night_ends_at: { type: ['string', 'null'] }
        night_multiplier_bp:
          type: ['integer', 'null']
          minimum: 10000
          maximum: 50000
          description: Basis points; 10000 = 1.0x. A "night rate" below 1.0x is a discount, and discounts are deferred.
        notes: { type: ['string', 'null'], maxLength: 1000 }
        rates:
          type: array
          minItems: 1
          items:
            type: object
            required: [vehicle_category]
            additionalProperties: false
            properties:
              vehicle_category: { $ref: '#/components/schemas/VehicleCategoryKey' }
              base_fare_minor: { type: ['integer', 'null'], minimum: 0 }
              per_km_minor: { type: ['integer', 'null'], minimum: 0 }
              per_waiting_minute_minor: { type: ['integer', 'null'], minimum: 0 }
              minimum_charge_minor: { type: ['integer', 'null'], minimum: 0 }
              maximum_charge_minor: { type: ['integer', 'null'], minimum: 0 }
              zone_rates:
                type: ['array', 'null']
                description: >-
                  Zone prices for this vehicle category (ADR-0021). Each is a
                  complete price, not a partial override. `zone_id` must name an
                  active pricing or client zone visible to the caller's tenant;
                  anything else is a 422 on `rates.N.zone_rates.M.zone_id`, with one
                  message for "does not exist", "belongs to another client" and
                  "switched off" so the endpoint cannot confirm another client's map.
                items:
                  type: object
                  required: [zone_id]
                  additionalProperties: false
                  properties:
                    zone_id: { type: integer }
                    base_fare_minor: { type: ['integer', 'null'], minimum: 0 }
                    per_km_minor: { type: ['integer', 'null'], minimum: 0 }
                    per_waiting_minute_minor: { type: ['integer', 'null'], minimum: 0 }
                    minimum_charge_minor: { type: ['integer', 'null'], minimum: 0 }
                    maximum_charge_minor: { type: ['integer', 'null'], minimum: 0 }

    Notification:
      type: object
      required: [id, type, type_label, subject, body, url, context, is_read, read_at, created_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        type: { enum: [booking.approved, booking.rejected, report.export.ready, order_request.received, trip.offered, trip.assigned, trip.driver_arrived, trip.completed] }
        type_label: { type: string }
        subject: { type: string }
        body: { type: string }
        url:
          type: ['string', 'null']
          description: Relative, SPA-local route.
        context: { $ref: '#/components/schemas/FreeformMap' }
        is_read: { type: boolean }
        read_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }

    ReportExport:
      type: object
      required:
        - id
        - report
        - report_label
        - format
        - format_label
        - status
        - filters
        - row_count
        - row_noun
        - file_size
        - is_downloadable
        - is_terminal
        - error
        - expires_at
        - created_at
        - finished_at
      additionalProperties: false
      properties:
        id: { type: integer }
        report: { enum: [trips, drivers, vehicles, financial] }
        report_label: { type: string }
        format: { enum: [csv, xlsx, pdf] }
        format_label: { type: string }
        status: { enum: [queued, processing, completed, failed] }
        filters: { $ref: '#/components/schemas/FreeformMap' }
        row_count: { type: ['integer', 'null'] }
        row_noun: { type: string }
        file_size: { type: ['integer', 'null'] }
        is_downloadable: { type: boolean }
        is_terminal: { type: boolean }
        error: { type: ['string', 'null'] }
        requested_by:
          type: ['string', 'null']
          description: The requester's name. Present when the relation is loaded.
        expires_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/NullableTimestamp' }
        finished_at: { $ref: '#/components/schemas/NullableTimestamp' }

    TripReportRow:
      description: One row of the trip report — the Bank's six criteria plus identifiers.
      type: object
      required:
        - trip_id
        - booking_id
        - status
        - commenced_at
        - completed_at
        - vehicle_registration
        - vehicle_description
        - driver_name
        - origin
        - destination
        - odometer_start
        - odometer_end
        - distance_km
        - duration_minutes
        - is_complete
      additionalProperties: false
      properties:
        trip_id: { type: integer }
        booking_id: { type: ['integer', 'null'] }
        status: { $ref: '#/components/schemas/TripStatus' }
        commenced_at: { $ref: '#/components/schemas/NullableTimestamp' }
        completed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        vehicle_registration: { type: ['string', 'null'] }
        vehicle_description: { type: ['string', 'null'] }
        driver_name: { type: ['string', 'null'] }
        origin: { type: string }
        destination: { type: string }
        odometer_start: { type: ['integer', 'null'] }
        odometer_end: { type: ['integer', 'null'] }
        distance_km: { type: ['string', 'null'] }
        duration_minutes: { type: ['integer', 'null'] }
        is_complete: { type: boolean }
