# nginx for the KangaruRide SPA (W1-a).
#
# One server block, HTTP only: TLS is terminated by Coolify's proxy in front
# of this container, which is also where HSTS belongs.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing here is secret, but the headers cost nothing.
    include /etc/nginx/kangaruride/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Liveness for the container healthcheck and for Coolify.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite hashes every asset filename, so these can be cached forever.
    location /assets/ {
        include /etc/nginx/kangaruride/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell must never be cached: a stale index.html would reference
    # asset hashes that no longer exist after a redeploy.
    location = /index.html {
        include /etc/nginx/kangaruride/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # SPA fallback — the router owns every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
