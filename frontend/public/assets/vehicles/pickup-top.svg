<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- KangaruRide fleet · double-cabin pickup · true top-down · unified scale with sedan-top.svg -->
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B1220" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#0B1220" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7DCE2"/>
      <stop offset="0.16" stop-color="#F4F6F8"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="0.84" stop-color="#F4F6F8"/>
      <stop offset="1" stop-color="#D7DCE2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#33383F"/>
      <stop offset="0.5" stop-color="#1D2025"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1CB964"/>
      <stop offset="1" stop-color="#118A48"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33383E"/>
      <stop offset="1" stop-color="#262A2F"/>
    </linearGradient>
  </defs>

  <ellipse cx="256" cy="256" rx="124" ry="228" fill="url(#shadow)"/>

  <!-- tires: rear pair set wide for the workhorse stance -->
  <g>
    <rect x="145" y="104" width="24" height="68" rx="11" fill="#17191C"/>
    <rect x="343" y="104" width="24" height="68" rx="11" fill="#17191C"/>
    <rect x="143" y="330" width="26" height="72" rx="12" fill="#17191C"/>
    <rect x="343" y="330" width="26" height="72" rx="12" fill="#17191C"/>
    <g fill="#8E969E">
      <rect x="150" y="126" width="5" height="26" rx="2.5"/>
      <rect x="356" y="126" width="5" height="26" rx="2.5"/>
      <rect x="148" y="354" width="5" height="26" rx="2.5"/>
      <rect x="358" y="354" width="5" height="26" rx="2.5"/>
    </g>
  </g>

  <!-- mirrors: larger, truck-style -->
  <rect x="132" y="140" width="34" height="17" rx="8" transform="rotate(-16 149 148)" fill="#EEF1F4"/>
  <rect x="346" y="140" width="34" height="17" rx="8" transform="rotate(16 363 148)" fill="#EEF1F4"/>

  <!-- body shell: long, slab-sided, square tail -->
  <path fill="url(#body)" d="M256 46 C304 46 340 58 344 108 L348 190 L348 400 C348 442 322 466 256 466 C190 466 164 442 164 400 L164 190 L168 108 C172 58 208 46 256 46 Z"/>

  <!-- panel seams -->
  <g stroke="#DDE2E7" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M170 196 L196 193"/>
    <path d="M342 196 L316 193"/>
    <path d="M168 268 L194 266"/>
    <path d="M344 268 L318 266"/>
    <path d="M186 86 C212 72 300 72 326 86"/>
  </g>

  <!-- windshield -->
  <path fill="url(#glass)" d="M190 128 C190 116 212 109 256 109 C300 109 322 116 322 128 L316 164 C314 174 292 179 256 179 C220 179 198 174 196 164 Z"/>

  <!-- double-cab roof -->
  <rect x="190" y="168" width="132" height="124" rx="26" fill="url(#glass)"/>

  <!-- roof gloss streak -->
  <path fill="#FFFFFF" opacity="0.07" d="M202 176 L238 172 L214 286 L198 268 Z"/>

  <!-- brand panel -->
  <rect x="224" y="192" width="64" height="76" rx="16" fill="url(#green)"/>
  <rect x="230" y="198" width="52" height="30" rx="11" fill="#FFFFFF" opacity="0.14"/>

  <!-- rear cab glass -->
  <path fill="url(#glass)" d="M198 288 L314 288 C317 296 317 302 314 308 C296 314 216 314 198 308 C195 302 195 296 198 288 Z"/>

  <!-- cargo bed -->
  <rect x="186" y="322" width="140" height="122" rx="14" fill="url(#bed)"/>
  <!-- bed ribs -->
  <g stroke="#3B4046" stroke-width="4" stroke-linecap="round">
    <line x1="196" y1="342" x2="316" y2="342"/>
    <line x1="196" y1="362" x2="316" y2="362"/>
    <line x1="196" y1="382" x2="316" y2="382"/>
    <line x1="196" y1="402" x2="316" y2="402"/>
    <line x1="196" y1="422" x2="316" y2="422"/>
  </g>
  <!-- tailgate seam -->
  <path d="M186 448 C216 456 296 456 326 448" stroke="#DDE2E7" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
