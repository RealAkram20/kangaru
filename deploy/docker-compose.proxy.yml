# =============================================================================
# Proxy overlay — routing and TLS when the stack is deployed WITHOUT Coolify.
#
# `docker-compose.yml` publishes no host ports on purpose: it expects something
# in front to terminate TLS and reach `app` and `web` by container name. In a
# Coolify deployment that something is Coolify, which writes these labels
# itself from the domains set in its UI (deploy/README.md §2.3).
#
# This file is the same wiring, written down, for a plain `docker compose`
# host — the path `deploy/rollback.sh` already anticipates in its header. It is
# used on the owner's server, where Coolify runs but manages a different
# project, and its Traefik is shared:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.proxy.yml up -d
#
# It changes nothing about the stack itself. It adds two things and no more:
# membership of the proxy's network, and the labels that make the proxy notice.
#
# CI never loads this file — the deploy-stack job pins
# COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.ci.yml — so the smoke
# test keeps talking to containers directly, which is what makes it a test of
# the stack rather than a test of somebody's DNS.
# =============================================================================

# The network Coolify's Traefik is attached to. External: this file joins an
# existing network, and must never create or own it. If it is missing, the
# proxy is not running and a deploy should fail here rather than come up
# unreachable and look healthy.
networks:
  coolify:
    external: true

services:

  # ---------------------------------------------------------------------------
  # app — the API, on api.kangaruride.com, port 8080.
  # ---------------------------------------------------------------------------
  app:
    # Both, and in this order. `default` is where mysql and redis live; losing
    # it would leave the API unable to reach its own database while answering
    # the proxy perfectly. Listing networks in an override REPLACES the list
    # rather than adding to it, which is exactly how that mistake gets made.
    networks:
      - default
      - coolify
    labels:
      traefik.enable: "true"
      # Which network the proxy should dial the container on. Without this
      # Traefik picks one and may pick `default`, which it cannot reach.
      traefik.docker.network: coolify

      # http -> https. The redirect is a middleware rather than a global
      # entrypoint setting because this Traefik is shared with another
      # project, and this file may not change that project's behaviour.
      traefik.http.routers.kangaru-api-http.entryPoints: http
      traefik.http.routers.kangaru-api-http.rule: Host(`api.kangaruride.com`)
      traefik.http.routers.kangaru-api-http.middlewares: kangaru-to-https

      traefik.http.routers.kangaru-api-https.entryPoints: https
      traefik.http.routers.kangaru-api-https.rule: Host(`api.kangaruride.com`)
      traefik.http.routers.kangaru-api-https.tls: "true"
      # The HTTP-01 resolver the neighbouring project already uses. The DNS-01
      # resolver on this server is bound to a different domain's credentials.
      traefik.http.routers.kangaru-api-https.tls.certresolver: letsencrypt
      traefik.http.routers.kangaru-api-https.service: kangaru-api
      traefik.http.routers.kangaru-api-https.middlewares: kangaru-gzip

      # Named explicitly. `app` exposes 8080 and nothing else, but a service
      # that guesses its own port is a service that guesses wrong the day a
      # second port is exposed.
      traefik.http.services.kangaru-api.loadbalancer.server.port: "8080"

      # Middleware definitions. Namespaced with a `kangaru-` prefix rather than
      # reusing the neighbour's `gzip` and `redirect-to-https`: those are
      # defined by labels on THEIR container, so borrowing them would mean this
      # project's routes break when that project is redeployed.
      traefik.http.middlewares.kangaru-to-https.redirectscheme.scheme: https
      traefik.http.middlewares.kangaru-gzip.compress: "true"

  # ---------------------------------------------------------------------------
  # web — the SPA, on the apex and www, port 80.
  # ---------------------------------------------------------------------------
  web:
    networks:
      - default
      - coolify
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify

      traefik.http.routers.kangaru-web-http.entryPoints: http
      traefik.http.routers.kangaru-web-http.rule: Host(`kangaruride.com`) || Host(`www.kangaruride.com`)
      traefik.http.routers.kangaru-web-http.middlewares: kangaru-to-https

      traefik.http.routers.kangaru-web-https.entryPoints: https
      traefik.http.routers.kangaru-web-https.rule: Host(`kangaruride.com`) || Host(`www.kangaruride.com`)
      traefik.http.routers.kangaru-web-https.tls: "true"
      traefik.http.routers.kangaru-web-https.tls.certresolver: letsencrypt
      traefik.http.routers.kangaru-web-https.service: kangaru-web
      traefik.http.routers.kangaru-web-https.middlewares: kangaru-gzip

      traefik.http.services.kangaru-web.loadbalancer.server.port: "80"
